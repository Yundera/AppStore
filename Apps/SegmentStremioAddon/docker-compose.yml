name: ssa

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # AppShield gates the setup page only. The app's own router (ssa-router, below)
  # splits the single public hostname by path: /api/ - the addon protocol Stremio
  # fetches, protected by the addon's own API key - straight to the backend, everything
  # else (the setup page, plus AppShield's own /nhl-auth endpoints) through the SSO
  # sidecar. See rationale.md.
  ssa-proxy:
    image: ghcr.io/nsl-sh/appshield:4.1.0
    container_name: ssa
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: ssa
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    environment:
      BACKEND_HOST: "ssa-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # No ALLOWED_PATHS: the router never sends /api/ to this sidecar, so everything it
      # sees is gated.
      # SSO comes from the platform (Maison's system env): the registrar on a
      # Yundera box, or a provider the user configured. Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      # Without a value (a platform that ignores x-compose-app) the gate generates
      # one and prints it in its log.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    depends_on:
      - ssa-backend
    networks:
      - ssa-internal
      - pcs
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

  ssa-backend:
    image: ghcr.io/worph/segment-stremio-addon:1.3.1
    container_name: ssa-backend
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ${DATA_ROOT:-/DATA}/Downloads:/data/media/Downloads:ro
      - ${DATA_ROOT:-/DATA}/Media:/data/media/Media:ro
    environment:
      - PORT=80
      - SCHEME=https
      - HASH_API_SEED=${SSA_HASH_API_SEED}
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    # Runs as root - see rationale.md. Both user-directory mounts are read-only and this
    # service is not reachable from the pcs network.
    user: 0:0
    networks:
      - ssa-internal

  ssa-router:
    image: nginx:1.31.8-alpine
    container_name: ssa-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - "80"
    configs:
      - source: ssa-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - ssa-internal
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ssa-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  ssa-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;

        # Direct play and HLS segments stream through here: no buffering, long reads.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate ssa:80;
        set $$addon ssa-backend:80;

        location = /_router/health { access_log off; return 204; }

        # The app ships no favicon; answer it here rather than send a browser's
        # automatic request into the SSO gate.
        location = /favicon.ico { access_log off; return 204; }

        # The addon protocol Stremio fetches (manifest, catalog, meta, stream, direct,
        # transcode). Stremio cannot do OIDC; the backend rejects any request without
        # the per-install API key in the path.
        location /api/ { proxy_pass http://$$addon; }

        # The setup page and the gate's own login endpoints: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  index: /
  webui_port: 80
  # The app's router - the routed service. Never the backend.
  main: ssa-router

  architectures:
    - amd64
    - arm64
  author: Worph
  category: Media
  tags: ["media", "personal"]
  description:
    en_us: |
      Stremio Addon - Browse and stream your local media library directly in Stremio with on-the-fly HLS transcoding.

      Features:
      - Browse your media files in Stremio's catalog
      - Search and filter your library
      - Multiple stream options per video:
        - Direct Play (original codec)
        - HLS Original (source resolution, transcoded)
        - HLS Auto (adaptive bitrate)
        - Quality-specific streams (720p, 480p, 360p)
      - Adaptive quality encoding based on CPU performance
      - Series detection (S##E## pattern)
      - Multi-audio track support
      - Embedded subtitle extraction (WebVTT)
      - API key protection via URL prefix
      - Live transcoding metrics dashboard

      Install in Stremio or at https://web.strem.io/ using the manifest URL shown on the addon page.
    fr_fr: |
      Addon Stremio - Parcourez et diffusez votre bibliothèque multimédia locale directement dans Stremio avec transcodage HLS à la volée.

      Fonctionnalités:
      - Parcourez vos fichiers multimédia dans le catalogue Stremio
      - Recherche et filtrage de votre bibliothèque
      - Plusieurs options de stream par vidéo:
        - Lecture directe (codec original)
        - HLS Original (résolution source, transcodé)
        - HLS Auto (débit adaptatif)
        - Streams par qualité (720p, 480p, 360p)
      - Qualité d'encodage adaptative selon les performances CPU
      - Détection de séries (motif S##E##)
      - Support multi-pistes audio
      - Extraction des sous-titres embarqués (WebVTT)
      - Protection par clé API via préfixe URL
      - Tableau de bord des métriques de transcodage en direct

      Installez dans Stremio ou sur https://web.strem.io/ en utilisant l'URL du manifest affichée sur la page de l'addon.
  developer: Worph
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  tagline:
    en_us: Stremio addon to browse and stream your local media with built-in HLS transcoding
    fr_fr: Addon Stremio pour parcourir et diffuser vos médias locaux avec transcodage HLS intégré
  tips:
    before_install:
      en_us: |
        After installation:
        1. Open the addon page at ${APP_URL:-https://ssa-${APP_DOMAIN}}/
        2. Copy the manifest URL or click "Install in Stremio"
        3. You can also install from Stremio Web at https://web.strem.io/
        4. Your media library will appear as "SSA" in Stremio's catalog

        The addon scans /DATA/Downloads and /DATA/Media for video files.
        API key protection is enabled by default with a key generated for this app.
      fr_fr: |
        Après l'installation:
        1. Ouvrez la page de l'addon à ${APP_URL:-https://ssa-${APP_DOMAIN}}/
        2. Copiez l'URL du manifest ou cliquez sur "Installer dans Stremio"
        3. Vous pouvez aussi installer depuis Stremio Web à https://web.strem.io/
        4. Votre bibliothèque multimédia apparaîtra comme "SSA" dans le catalogue Stremio

        L'addon scanne /DATA/Downloads et /DATA/Media pour les fichiers vidéo.
        La protection par clé API est activée par défaut avec une clé générée pour cette application.
  title:
    en_us: Segment Stremio Addon
    fr_fr: Addon Stremio Segment

x-compose-app:
  schema_version: 2
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in when single sign-on is unavailable. Day to day, use single sign-on.
      # Behind SSO nobody needs it on the first click: tile menu only.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  version: "1.3.1"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: ssa-router, name: ssa, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Segment Stremio Addon
    fr_fr: Addon Stremio Segment
  tagline:
    en_us: Stremio addon to browse and stream your local media with built-in HLS transcoding
    fr_fr: Addon Stremio pour parcourir et diffuser vos médias locaux avec transcodage HLS intégré
  description:
    en_us: |
      Stremio Addon - Browse and stream your local media library directly in Stremio with on-the-fly HLS transcoding.

      Features:
      - Browse your media files in Stremio's catalog
      - Search and filter your library
      - Multiple stream options per video:
        - Direct Play (original codec)
        - HLS Original (source resolution, transcoded)
        - HLS Auto (adaptive bitrate)
        - Quality-specific streams (720p, 480p, 360p)
      - Adaptive quality encoding based on CPU performance
      - Series detection (S##E## pattern)
      - Multi-audio track support
      - Embedded subtitle extraction (WebVTT)
      - API key protection via URL prefix
      - Live transcoding metrics dashboard

      Install in Stremio or at https://web.strem.io/ using the manifest URL shown on the addon page.
    fr_fr: |
      Addon Stremio - Parcourez et diffusez votre bibliothèque multimédia locale directement dans Stremio avec transcodage HLS à la volée.

      Fonctionnalités:
      - Parcourez vos fichiers multimédia dans le catalogue Stremio
      - Recherche et filtrage de votre bibliothèque
      - Plusieurs options de stream par vidéo:
        - Lecture directe (codec original)
        - HLS Original (résolution source, transcodé)
        - HLS Auto (débit adaptatif)
        - Streams par qualité (720p, 480p, 360p)
      - Qualité d'encodage adaptative selon les performances CPU
      - Détection de séries (motif S##E##)
      - Support multi-pistes audio
      - Extraction des sous-titres embarqués (WebVTT)
      - Protection par clé API via préfixe URL
      - Tableau de bord des métriques de transcodage en direct

      Installez dans Stremio ou sur https://web.strem.io/ en utilisant l'URL du manifest affichée sur la page de l'addon.
  developer: Worph
  category: Media
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      After installation:
      1. Open the addon page at ${APP_URL:-https://ssa-${APP_DOMAIN}}/
      2. Copy the manifest URL or click "Install in Stremio"
      3. You can also install from Stremio Web at https://web.strem.io/
      4. Your media library will appear as "SSA" in Stremio's catalog

      The addon scans /DATA/Downloads and /DATA/Media for video files.
      API key protection is enabled by default with a key generated for this app.
    fr_fr: |
      Après l'installation:
      1. Ouvrez la page de l'addon à ${APP_URL:-https://ssa-${APP_DOMAIN}}/
      2. Copiez l'URL du manifest ou cliquez sur "Installer dans Stremio"
      3. Vous pouvez aussi installer depuis Stremio Web à https://web.strem.io/
      4. Votre bibliothèque multimédia apparaîtra comme "SSA" dans le catalogue Stremio

      L'addon scanne /DATA/Downloads et /DATA/Media pour les fichiers vidéo.
      La protection par clé API est activée par défaut avec une clé générée pour cette application.
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
    # Seeded: the API key in every published manifest URL is sha256(seed)[:16]. An
    # installed addon keeps its old seed (the former shared password) so the Stremio
    # installs that already carry its URL keep working; a fresh install gets its own.
    SSA_HASH_API_SEED: ${APP_DEFAULT_PASSWORD}|alnum:32
