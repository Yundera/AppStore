name: ssa

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ssa-proxy:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: ssa
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: ssa
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    environment:
      BACKEND_HOST: "ssa-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # Stremio itself is the API client here: the desktop/mobile/web player fetches the
      # manifest, catalog, meta and stream URLs directly and cannot perform an OIDC or
      # OAuth 2.1 flow. /api/ is therefore exempted from the SSO gate and is protected
      # instead by the addon's own API key, embedded in the manifest URL path. This is a
      # documented deviation from the "use OAUTH_RESOURCE, not ALLOWED_PATHS" rule - see
      # rationale.md. The setup page at / stays behind the OIDC gate.
      ALLOWED_PATHS: "/api/"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io}"
    depends_on:
      - ssa-backend
    networks:
      - ssa-internal
      - pcs
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

  ssa-backend:
    image: ghcr.io/worph/segment-stremio-addon:1.3.1
    container_name: ssa-backend
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ${DATA_ROOT:-/DATA}/Downloads:/data/media/Downloads:ro
      - ${DATA_ROOT:-/DATA}/Media:/data/media/Media:ro
    environment:
      - PORT=80
      - SCHEME=https
      - HASH_API_SEED=${SSA_HASH_API_SEED}
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    # Runs as root - see rationale.md. Both user-directory mounts are read-only and this
    # service is not reachable from the pcs network.
    user: 0:0
    networks:
      - ssa-internal

networks:
  ssa-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  index: /
  webui_port: 80
  # The AppShield sidecar - the routed service and the only one on
  # the shared pcs network. Never the backend.
  main: ssa-proxy
  access_domain: ssa-username.nsl.sh

  architectures:
    - amd64
    - arm64
  author: Worph
  category: Media
  tags: ["media", "personal"]
  description:
    en_us: |
      Stremio Addon - Browse and stream your local media library directly in Stremio with on-the-fly HLS transcoding.

      Features:
      - Browse your media files in Stremio's catalog
      - Search and filter your library
      - Multiple stream options per video:
        - Direct Play (original codec)
        - HLS Original (source resolution, transcoded)
        - HLS Auto (adaptive bitrate)
        - Quality-specific streams (720p, 480p, 360p)
      - Adaptive quality encoding based on CPU performance
      - Series detection (S##E## pattern)
      - Multi-audio track support
      - Embedded subtitle extraction (WebVTT)
      - API key protection via URL prefix
      - Live transcoding metrics dashboard

      Install in Stremio or at https://web.strem.io/ using the manifest URL shown on the addon page.
    fr_fr: |
      Addon Stremio - Parcourez et diffusez votre bibliothèque multimédia locale directement dans Stremio avec transcodage HLS à la volée.

      Fonctionnalités:
      - Parcourez vos fichiers multimédia dans le catalogue Stremio
      - Recherche et filtrage de votre bibliothèque
      - Plusieurs options de stream par vidéo:
        - Lecture directe (codec original)
        - HLS Original (résolution source, transcodé)
        - HLS Auto (débit adaptatif)
        - Streams par qualité (720p, 480p, 360p)
      - Qualité d'encodage adaptative selon les performances CPU
      - Détection de séries (motif S##E##)
      - Support multi-pistes audio
      - Extraction des sous-titres embarqués (WebVTT)
      - Protection par clé API via préfixe URL
      - Tableau de bord des métriques de transcodage en direct

      Installez dans Stremio ou sur https://web.strem.io/ en utilisant l'URL du manifest affichée sur la page de l'addon.
  developer: Worph
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  tagline:
    en_us: Stremio addon to browse and stream your local media with built-in HLS transcoding
    fr_fr: Addon Stremio pour parcourir et diffuser vos médias locaux avec transcodage HLS intégré
  thumbnail: thumbnail.png
  tips:
    before_install:
      en_us: |
        After installation:
        1. Open the addon page at https://ssa-username.nsl.sh
        2. Copy the manifest URL or click "Install in Stremio"
        3. You can also install from Stremio Web at https://web.strem.io/
        4. Your media library will appear as "SSA" in Stremio's catalog

        The addon scans /DATA/Downloads and /DATA/Media for video files.
        API key protection is enabled by default with a key generated for this app.
      fr_fr: |
        Après l'installation:
        1. Ouvrez la page de l'addon à https://ssa-username.nsl.sh
        2. Copiez l'URL du manifest ou cliquez sur "Installer dans Stremio"
        3. Vous pouvez aussi installer depuis Stremio Web à https://web.strem.io/
        4. Votre bibliothèque multimédia apparaîtra comme "SSA" dans le catalogue Stremio

        L'addon scanne /DATA/Downloads et /DATA/Media pour les fichiers vidéo.
        La protection par clé API est activée par défaut avec une clé générée pour cette application.
  title:
    en_us: Segment Stremio Addon
    fr_fr: Addon Stremio Segment

x-compose-app:
  schema_version: 2
  version: "1.3.1"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: ssa-proxy, name: ssa, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Segment Stremio Addon
    fr_fr: Addon Stremio Segment
  tagline:
    en_us: Stremio addon to browse and stream your local media with built-in HLS transcoding
    fr_fr: Addon Stremio pour parcourir et diffuser vos médias locaux avec transcodage HLS intégré
  description:
    en_us: |
      Stremio Addon - Browse and stream your local media library directly in Stremio with on-the-fly HLS transcoding.

      Features:
      - Browse your media files in Stremio's catalog
      - Search and filter your library
      - Multiple stream options per video:
        - Direct Play (original codec)
        - HLS Original (source resolution, transcoded)
        - HLS Auto (adaptive bitrate)
        - Quality-specific streams (720p, 480p, 360p)
      - Adaptive quality encoding based on CPU performance
      - Series detection (S##E## pattern)
      - Multi-audio track support
      - Embedded subtitle extraction (WebVTT)
      - API key protection via URL prefix
      - Live transcoding metrics dashboard

      Install in Stremio or at https://web.strem.io/ using the manifest URL shown on the addon page.
    fr_fr: |
      Addon Stremio - Parcourez et diffusez votre bibliothèque multimédia locale directement dans Stremio avec transcodage HLS à la volée.

      Fonctionnalités:
      - Parcourez vos fichiers multimédia dans le catalogue Stremio
      - Recherche et filtrage de votre bibliothèque
      - Plusieurs options de stream par vidéo:
        - Lecture directe (codec original)
        - HLS Original (résolution source, transcodé)
        - HLS Auto (débit adaptatif)
        - Streams par qualité (720p, 480p, 360p)
      - Qualité d'encodage adaptative selon les performances CPU
      - Détection de séries (motif S##E##)
      - Support multi-pistes audio
      - Extraction des sous-titres embarqués (WebVTT)
      - Protection par clé API via préfixe URL
      - Tableau de bord des métriques de transcodage en direct

      Installez dans Stremio ou sur https://web.strem.io/ en utilisant l'URL du manifest affichée sur la page de l'addon.
  developer: Worph
  category: Media
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      After installation:
      1. Open the addon page at https://ssa-username.nsl.sh
      2. Copy the manifest URL or click "Install in Stremio"
      3. You can also install from Stremio Web at https://web.strem.io/
      4. Your media library will appear as "SSA" in Stremio's catalog

      The addon scans /DATA/Downloads and /DATA/Media for video files.
      API key protection is enabled by default with a key generated for this app.
    fr_fr: |
      Après l'installation:
      1. Ouvrez la page de l'addon à https://ssa-username.nsl.sh
      2. Copiez l'URL du manifest ou cliquez sur "Installer dans Stremio"
      3. Vous pouvez aussi installer depuis Stremio Web à https://web.strem.io/
      4. Votre bibliothèque multimédia apparaîtra comme "SSA" dans le catalogue Stremio

      L'addon scanne /DATA/Downloads et /DATA/Media pour les fichiers vidéo.
      La protection par clé API est activée par défaut avec une clé générée pour cette application.
  secrets:
    # Seeded: the API key in every published manifest URL is sha256(seed)[:16]. An
    # installed addon keeps its old seed (the former shared password) so the Stremio
    # installs that already carry its URL keep working; a fresh install gets its own.
    SSA_HASH_API_SEED: ${APP_DEFAULT_PASSWORD}|alnum:32
