    ko_kr: |
      **기본 관리자 접근**

      | 설정 | 값 |
      |------|-----|
      | 관리자 패널 | [관리자 패널](${APP_URL:-https://yacy-${APP_DOMAIN}}/) |

      앱을 열면 사용자 이름과 비밀번호가 표시됩니다 (타일 메뉴 → 자격 증명).

      **사용 방법:**
      1. 관리자 인터페이스를 방문하고 로그인
      2. 사용 사례 선택 (P2P 네트워크, 포털 또는 인트라넷)
      3. 검색 인덱스를 구축하기 위해 웹 크롤링 시작
      4. 검색 인터페이스를 사용하여 인덱싱된 콘텐츠 찾기

      **팁:** 인덱싱이 어떻게 작동하는지 보려면 좋아하는 웹사이트를 작은 규모로 크롤링하는 것부터 시작하세요!
  secrets:
    # Seeded: an installed app's yacy.conf holds the hash of the former shared
    # password, which it keeps; a fresh install gets its own.
    YACY_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${YACY_ADMIN_PASSWORD}
      # A hook, not env: YaCy keeps the hash in yacy.conf, which admin-hash only
      # renders while the file is absent — and a running YaCy holds its config in
      # memory and writes it back over any edit made underneath it. So the hook
      # submits the admin-account form (ConfigAccounts_p, the API bin/passwd.sh
      # uses on a running server) in the running container, then fetches the page
      # again with the new password to prove it took.
      #
      # The image has wget but no curl. Credentials go through a temporary
      # WGETRC and the form body through --post-file, so neither password is on
      # a command line; the body is percent-encoded byte by byte with od, since
      # wget has no --data-urlencode. Over loopback YaCy skips the
      # transaction-token check (TransactionManager.checkPostTransaction), but
      # adminAccountForLocalhost=false still requires the old password.
      change:
        apply: script
        script: |
          compose exec -e OLD_YACY_ADMIN_PASSWORD -e YACY_ADMIN_PASSWORD yacy sh -c '
            [ -n "$YACY_ADMIN_PASSWORD" ] || exit 1
            d=$(mktemp -d) || exit 1
            trap "rm -rf $d" EXIT
            url=http://127.0.0.1:8090/ConfigAccounts_p.html
            enc() { printf %s "$1" | od -An -v -tx1 | tr -d " \n" | sed "s/../%&/g"; }
            rc() { printf "http_user = admin\nhttp_password = %s\n" "$1" > "$d/rc"; }
            p=$(enc "$YACY_ADMIN_PASSWORD")
            printf "setAdmin=&adminuser=admin&adminpw1=%s&adminpw2=%s" "$p" "$p" > "$d/body"
            rc "$OLD_YACY_ADMIN_PASSWORD"
            WGETRC="$d/rc" wget -q -O /dev/null --post-file="$d/body" "$url" || exit 1
            rc "$YACY_ADMIN_PASSWORD"
            WGETRC="$d/rc" wget -q -O /dev/null "$url"'
  folders:
    - /DATA/AppData/$AppID/data
    - /DATA/AppData/$AppID/data/SETTINGS
  steps:
    # YaCy stores the admin password as MD5("admin:<adminRealm>:<password>").
    # The seeded yacy.conf pins adminRealm=YaCy; this computes the matching hash
    # for that template. Only needed while the file does not exist yet — seed/
    # never overwrites it, so a password changed in the admin UI survives.
    - name: admin-hash
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/data/SETTINGS/yacy.conf" ] && exit 0
        hash=$(printf 'admin:YaCy:%s' "$YACY_ADMIN_PASSWORD" | md5sum | cut -d' ' -f1)
        echo "YACY_ADMIN_HASH=$hash" >> "$MAISON_OUTPUT"
