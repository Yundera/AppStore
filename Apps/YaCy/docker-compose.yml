  tips:
    en_us: |
      **Default Admin Access**

      | Setting | Value |
      |---------|-------|
      | Admin Panel | [Admin Panel](${APP_URL:-https://yacy-${APP_DOMAIN}}/) |

      The username and password are shown when you open the app (tile menu → Credentials).

      **How to use:**
      1. Visit the admin interface and log in
      2. Choose your use case (P2P Network, Portal, or Intranet)
      3. Start a web crawl to build your search index
      4. Use the search interface to find indexed content

      **Use Cases:**
      - **Freeworld (P2P)**: Join the global network for web-wide search
      - **Portal**: Run your own independent search portal
      - **Intranet**: Private search for internal documents

      **Understanding Crawling & P2P:**
      - **Searching**: Works immediately - query the global index built by other peers
      - **Crawling**: Tell YaCy to download and index websites (Admin > Crawler). This builds YOUR local index
      - **Junior peer** (default): You search the network but don't share your index
      - **Senior peer**: You share your crawled content with other peers

      **Peer status:** this app does not publish port 8090 to the internet, so YaCy runs as a junior peer: it searches the network and builds your own index, but other peers cannot connect in to fetch it.

      **Public search page:** the search page at `${APP_URL:-https://yacy-${APP_DOMAIN}}/` is open to anyone with the link, like any public search portal. The admin pages (crawler, settings) require the admin login.
