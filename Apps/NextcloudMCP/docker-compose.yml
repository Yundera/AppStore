name: nextcloudmcp
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Main MCP wrapper — exposes /mcp (Nextcloud + Talk tools, one MCP server)
  # and the Web UI on 9650. Reachable at nextcloudmcp-backend:9650 inside the pcs
  # network so Beacon and other MCP clients can call it directly.
  nextcloudmcp-backend:
    image: ghcr.io/worph/nextcloud-mcp:1.0.4
    container_name: nextcloudmcp-backend
    hostname: nextcloudmcp-backend
    # supervisord is PID 1 and MUST start as root so it can drop privileges for
    # each child program. Running as a non-root uid fails with "Can't drop
    # privilege as nonroot user". Child processes drop to their own uid as
    # configured in /etc/supervisord.conf.
    user: "0:0"
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    expose:
      - 9650
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - PORT=9650
      - UPSTREAM_PORT=8000
      - DISCOVERY_PORT=9099
      - CONFIG_PATH=/app/wrapper-data/config.json
      # Pre-seed the sibling Nextcloud app's in-cluster hostname if it's
      # installed. Username + app-password stay empty — set in the Web UI
      # on first launch (Settings → Personal → Security → Devices &
      # sessions → Create new app password).
      - NEXTCLOUD_HOST=http://nextcloud:80
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/nextcloudmcp/
        target: /app/wrapper-data
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      # nextcloudmcp-internal is the app-private link that carries proxy -> backend
      # traffic. It survives the launcher's rewrite of the shared network, which
      # only re-attaches `pcs` to x-casaos.main (the sidecar).
      - nextcloudmcp-internal
      # `pcs` is what makes the "local Docker connection" of tips.before_install
      # work: a same-host MCP client on the shared network reaches this backend
      # directly at nextcloudmcp-backend:9650, bypassing the public OAuth route.
      - pcs

  # AppShield gates the Web UI behind SSO, so the Nextcloud app-password
  # you paste into it isn't reachable by anyone guessing the subdomain, and gates
  # /mcp on OAuth 2.1 for remote MCP clients (see OAUTH_RESOURCE below). MCP
  # clients talking to `nextcloudmcp-backend:9650` directly on the pcs network
  # bypass this entirely — Beacon discovery, Claude Code, etc. stay fast.
  nextcloudmcp-proxy:
    # 2.0.7+ is required: first image with the generic OAUTH_RESOURCE /
    # OAUTH_SCOPE names and a configurable protected path.
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: nextcloudmcp
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: nextcloudmcp
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    expose:
      - 80
    user: "0:0"   # numeric: scratch image has no passwd; /data/oauth is chowned $PUID
    environment:
      BACKEND_HOST: nextcloudmcp-backend
      BACKEND_PORT: "9650"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io}"
      # OAuth 2.1 broker: AppShield runs an OAuth/OIDC authorization server
      # fronting Dex and gates the path named by the resource URL (/mcp) on
      # Bearer tokens. This is the machine/API path: clients like claude.ai
      # self-register via DCR, others get a manual client
      # by POST to https://nextcloudmcp-${APP_DOMAIN}/AppShield/oauth/clients (the admin page lists and revokes).
      OAUTH_RESOURCE: "${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp"
      OAUTH_SCOPE: "mcp"
      OAUTH_DATA_DIR: "/data/oauth"
    volumes:
      # Persist DCR/manual clients, signing keys and grants across redeploys.
      - ${DATA_ROOT:-/DATA}/AppData/nextcloudmcp/oauth:/data/oauth
    depends_on:
      - nextcloudmcp-backend
    networks:
      # Shared with the backend and never rewritten by the launcher — this is the
      # link the sidecar proxies over. See the note on the backend's networks.
      - nextcloudmcp-internal
      - pcs

networks:
  # App-private link between the sidecar and the backend.
  nextcloudmcp-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  # amd64 only: the backend image ghcr.io/worph/nextcloud-mcp:1.0.4 publishes a
  # linux/amd64 manifest only. The AppShield sidecar does ship arm64, but the app
  # can only run on the intersection of all its images.
  architectures:
    - amd64
  main: nextcloudmcp-proxy
  webui_port: 80
  index: /
  developer: Worph
  category: Utilities
  tags: ["developer", "ai"]
  description:
    en_us: |
      **Your entire Nextcloud — Notes, Calendar, Contacts, Files, Deck, Talk — exposed to AI assistants via MCP.**

      Nextcloud MCP wraps the open-source `cbcoutinho/nextcloud-mcp-server` to give Claude, Cursor, and any MCP-compatible LLM direct, authenticated access to your Nextcloud. Plus, with one toggle, Claude will auto-respond to your Talk DMs and direct @mentions on your behalf — no bot registration, no `occ` commands, no public URL required.

      **What you can do:**
      - Let AI read/write your Notes, Calendar events, Contacts, Deck cards, Tables, Cookbook recipes, News feeds, Collectives pages, and files (WebDAV).
      - Auto-respond to incoming Talk DMs with Claude — replies land in the chat within seconds.
      - Reply to `@<you>` mentions in group chats automatically (presence-immune — works even when you have Talk open).
      - Send chat messages to anyone in Nextcloud from an AI prompt (`talk_send_to_user` — resolves name to 1-on-1 and posts).
      - Drive it all through the Beacon MCP aggregator (auto-detected) for unified access.

      **138 tools — 118 Nextcloud + 20 Talk — in one MCP server.** Single app-password setup. Polling-based (no admin CLI). See the built-in docs for the full rationale.

      **Think of it like:** a personal AI assistant that genuinely lives inside your Nextcloud — messages go to *you*, answers come from Claude, your team gets replies within seconds.
    fr_fr: |
      **Votre Nextcloud entier — Notes, Calendrier, Contacts, Fichiers, Deck, Talk — expose aux assistants IA via MCP.**

      Nextcloud MCP enveloppe le serveur open-source `cbcoutinho/nextcloud-mcp-server` pour donner a Claude, Cursor et a tout LLM compatible MCP un acces authentifie direct a votre Nextcloud. De plus, avec un seul interrupteur, Claude repondra automatiquement a vos messages prives Talk et aux mentions @ a votre place — sans enregistrement de bot, sans commandes `occ`, sans URL publique requise.

      **Ce que vous pouvez faire:**
      - Laisser l'IA lire/ecrire vos Notes, evenements de Calendrier, Contacts, cartes Deck, Tables, recettes Cookbook, flux News, pages Collectives et fichiers (WebDAV).
      - Reponse automatique aux messages prives Talk entrants avec Claude — les reponses arrivent dans la conversation en quelques secondes.
      - Reponse automatique aux mentions `@<vous>` dans les discussions de groupe (insensible a la presence — fonctionne meme si Talk est ouvert).
      - Envoyer des messages a n'importe qui dans Nextcloud depuis une invite IA (`talk_send_to_user` — resout le nom en conversation 1-a-1 et poste).
      - Piloter l'ensemble via l'agregateur MCP Beacon (auto-detecte) pour un acces unifie.

      **138 outils — 118 Nextcloud + 20 Talk — dans un seul serveur MCP.** Configuration par mot de passe d'application unique. Base sur le polling (pas de CLI admin). Voir la documentation integree pour la justification complete.

      **Comme si:** un assistant IA personnel qui vit vraiment dans votre Nextcloud — les messages vous arrivent, les reponses viennent de Claude, votre equipe obtient des reponses en quelques secondes.
    zh_cn: |
      **将整个 Nextcloud — 笔记、日历、通讯录、文件、Deck、Talk — 通过 MCP 暴露给 AI 助手。**

      Nextcloud MCP 封装了开源的 `cbcoutinho/nextcloud-mcp-server`，让 Claude、Cursor 和任何兼容 MCP 的 LLM 可以直接、经过身份验证地访问您的 Nextcloud。此外，通过一个开关，Claude 将代表您自动回复 Talk 私信和直接 @提及 — 无需机器人注册，无需 `occ` 命令，也不需要公共 URL。

      **功能：**
      - 让 AI 读取/写入您的笔记、日历事件、联系人、Deck 卡片、表格、食谱、新闻订阅、Collectives 页面和文件（WebDAV）。
      - 使用 Claude 自动回复 Talk 私信 — 几秒内回复到达聊天。
      - 自动回复群聊中的 `@<您>` 提及（免受在线状态影响 — 即使您打开 Talk 也能工作）。
      - 从 AI 提示向 Nextcloud 中的任何人发送聊天消息（`talk_send_to_user` — 将名称解析为 1 对 1 并发布）。
      - 通过 Beacon MCP 聚合器（自动检测）统一驱动所有功能。

      **138 个工具 — 118 个 Nextcloud + 20 个 Talk — 合并为一个 MCP 服务器。** 一次应用密码设置。基于轮询（无需管理员 CLI）。详见内置文档。
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: AI-powered Nextcloud — read, write, chat, all via MCP
    fr_fr: Nextcloud pilote par IA — lire, ecrire, discuter, le tout via MCP
    zh_cn: AI 驱动的 Nextcloud — 通过 MCP 读取、写入、聊天
  title:
    en_us: Nextcloud MCP
  chips:
    - key: mcp
      name:
        en_us: MCP
  tips:
    before_install:
      en_us: |
        **Getting Started**

        Nextcloud MCP needs access to a Nextcloud account (the sibling `Nextcloud` app works great). After installation:

        1. In Nextcloud, go to **Settings → Personal → Security → Devices & sessions** and click **Create new app password** (name it `nextcloudmcp`).
        2. Open the Nextcloud MCP Web UI (you'll sign in with your server account — the same single sign-on you already use) and paste the URL, username, and app-password.
        3. Click **Test connection**, then **Save**.
        4. (Optional) In the **LLM Target** panel, click **Rescan Beacon** — if an LLM MCP (e.g. ClaudeCode) is installed on the same server, it's auto-selected.
        5. (Optional) Enable **Auto-respond** to let Claude reply to your Talk DMs and `@<you>` mentions automatically.

        **MCP Integration (for AI/LLMs):**

        The app exposes one MCP server, `nextcloud-mcp`, with 138 tools: 118 for Nextcloud and 20 for Talk chat.

        **Option 1: Via Beacon (recommended)**
        If Beacon is installed, the server is auto-discovered and its tools namespaced:
        - `nextcloud-mcp__nc_notes_*`, `nextcloud-mcp__nc_calendar_*`, `nextcloud-mcp__deck_*`, etc.
        - `nextcloud-mcp__talk_send_to_user`, `nextcloud-mcp__talk_list_conversations`, etc.

        **Option 2: Public URL (OAuth)**

        `/mcp` is protected by OAuth 2.1. Clients that support OAuth discovery
        (claude.ai, Claude Desktop) register themselves and open a browser for
        you to approve with your server login (single sign-on). For clients needing a
        pre-created client_id/client_secret (n8n, custom scripts), create it with a `POST` of its registration (JSON with `client_name` and `redirect_uris`) to **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients**, sent from a browser signed in to this app; **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** lists the clients that exist and revokes them.
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```
        **Option 3: Local Docker connection (no auth required)**
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "http://nextcloudmcp-backend:9650/mcp"
            }
          }
        }
        ```
        *Note: Requires the AI assistant to be on the `pcs` Docker network.*

        **Available MCP Tools:**

        | Category | Prefix | Examples |
        |---|---|---|
        | Notes | `nc_notes_*` | `create_note`, `update_note`, `search_notes` |
        | Calendar & Todos | `nc_calendar_*` | `create_event`, `find_availability`, `create_todo` |
        | Contacts | `nc_contacts_*` | `list_contacts`, `create_contact`, `update_contact` |
        | Files (WebDAV) | `nc_webdav_*` | `list_directory`, `read_file`, `write_file`, `search_files` |
        | Deck (Kanban) | `deck_*` | `create_board`, `create_card`, `assign_user_to_card` |
        | Cookbook | `nc_cookbook_*` | `list_recipes`, `import_recipe`, `search_recipes` |
        | Tables | `nc_tables_*` | `list_tables`, `insert_row`, `update_row` |
        | Sharing | `nc_share_*` | `share_create`, `share_list`, `share_update` |
        | News | `nc_news_*` | `list_feeds`, `list_items`, `get_starred_items` |
        | Collectives | `collectives_*` | `create_page`, `search_pages`, `assign_tag` |
        | **Talk (chat)** | `talk_*` | `send_to_user`, `list_conversations`, `get_messages` |

        **Auto-respond Mode:**

        When enabled, the app long-polls every DM and group chat your account is in. A real user's DM or a direct `@<you>` mention in a group triggers a call to the configured LLM (Claude Code via Beacon by default). The reply is posted back to Talk — prefixed with `🤖 ` so humans can tell AI-generated answers apart.

        - Presence-immune: works even while you have Talk open in a browser.
        - Own-message-aware: never responds to its own replies or to messages you typed from another client.
        - Gapless: resumes at the right cursor after restarts (state in `data/poll-state.json`).

        **Security:**
        - Your Nextcloud app-password is stored only in `/DATA/AppData/nextcloudmcp/config.json` and is never logged or returned via the API.
        - The Web UI is protected by the server's single sign-on — you sign in once with your server account.
      fr_fr: |
        **Demarrage**

        Nextcloud MCP a besoin d'acces a un compte Nextcloud (l'app soeur `Nextcloud` fonctionne parfaitement). Apres installation:

        1. Dans Nextcloud, allez dans **Parametres → Personnel → Securite → Appareils et sessions** et cliquez sur **Creer un nouveau mot de passe d'application** (nommez-le `nextcloudmcp`).
        2. Ouvrez l'interface Web de Nextcloud MCP (vous vous connecterez avec votre compte serveur — la meme authentification unique que d'habitude) et collez l'URL, le nom d'utilisateur et le mot de passe d'application.
        3. Cliquez sur **Tester la connexion**, puis **Enregistrer**.
        4. (Optionnel) Dans le panneau **LLM Target**, cliquez sur **Rescan Beacon** — si un LLM MCP (ex. ClaudeCode) est installe sur le meme serveur, il est auto-selectionne.
        5. (Optionnel) Activez **Reponse automatique** pour laisser Claude repondre automatiquement a vos messages prives Talk et aux mentions `@<vous>`.

        **Integration MCP (pour IA/LLMs):**

        L'app expose un seul serveur MCP, `nextcloud-mcp`, avec 138 outils : 118 pour Nextcloud et 20 pour le chat Talk.

        **Option 1: Via Beacon (recommande)**
        Si Beacon est installe, le serveur est auto-decouvert et ses outils namespaces:
        - `nextcloud-mcp__nc_notes_*`, `nextcloud-mcp__nc_calendar_*`, `nextcloud-mcp__deck_*`, etc.
        - `nextcloud-mcp__talk_send_to_user`, `nextcloud-mcp__talk_list_conversations`, etc.

        **Option 2: URL publique (OAuth)**

        `/mcp` est protege par OAuth 2.1. Les clients compatibles avec la
        decouverte OAuth (claude.ai, Claude Desktop) s'enregistrent seuls et
        ouvrent un navigateur pour que vous autorisiez avec votre compte
        serveur (authentification unique). Pour les clients necessitant un client_id/client_secret
        pre-cree (n8n, scripts), creez-le par un `POST` de son enregistrement (JSON avec `client_name` et `redirect_uris`) vers **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients**, depuis un navigateur connecte a cette app ; **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** liste les clients existants et permet de les revoquer.
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```
        **Option 3: Connexion Docker locale (pas d'auth requise)**
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "http://nextcloudmcp-backend:9650/mcp"
            }
          }
        }
        ```
        *Note: Requiert que l'assistant IA soit sur le reseau Docker `pcs`.*

        **Mode Reponse automatique:**

        Lorsqu'active, l'app interroge en long-poll chaque message prive et discussion de groupe dont votre compte fait partie. Un message prive d'un vrai utilisateur ou une mention directe `@<vous>` dans un groupe declenche un appel au LLM configure (Claude Code via Beacon par defaut). La reponse est postee dans Talk — prefixee de `🤖 ` pour distinguer les reponses IA.

        - Insensible a la presence: fonctionne meme si Talk est ouvert dans un navigateur.
        - Conscient des messages propres: ne repond jamais a ses propres reponses ni aux messages que vous avez tapes depuis un autre client.
        - Sans trou: reprend au bon curseur apres redemarrage (etat dans `data/poll-state.json`).

        **Securite:**
        - Votre mot de passe d'application Nextcloud est stocke uniquement dans `/DATA/AppData/nextcloudmcp/config.json` et n'est jamais journalise ni retourne via l'API.
        - L'interface Web est protegee par l'authentification unique du serveur (SSO) — vous vous connectez avec votre compte serveur.
      zh_cn: |
        **快速开始**

        Nextcloud MCP 需要访问 Nextcloud 账户（同级 `Nextcloud` 应用即可）。安装后：

        1. 在 Nextcloud 中，转到 **设置 → 个人 → 安全 → 设备和会话**，点击 **创建新的应用密码**（命名为 `nextcloudmcp`）。
        2. 打开 Nextcloud MCP Web UI（使用您的服务器账户（单点登录）登录——与平时相同的登录方式），粘贴 URL、用户名和应用密码。
        3. 点击 **测试连接**，然后 **保存**。
        4. （可选）在 **LLM Target** 面板中，点击 **重新扫描 Beacon** — 如果同一服务器上安装了 LLM MCP（例如 ClaudeCode），它将被自动选中。
        5. （可选）启用 **自动回复**，让 Claude 自动回复您的 Talk 私信和 `@<您>` 提及。

        **MCP 集成（用于 AI/LLM）：**

        应用公开一个 MCP 服务器 `nextcloud-mcp`，共 138 个工具：118 个 Nextcloud 工具和 20 个 Talk 聊天工具。

        **选项 1：通过 Beacon（推荐）**
        如果安装了 Beacon，该服务器会自动发现，其工具会加上命名空间。

        **选项 2：公共 URL（OAuth）**

        `/mcp` 受 OAuth 2.1 保护。支持 OAuth 发现的客户端（claude.ai、Claude Desktop）
        会自动注册并打开浏览器，让您使用服务器账户（单点登录）授权。对于需要预先创建
        client_id/client_secret 的客户端（n8n、自定义脚本），请从已登录本应用的浏览器向 **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients** 发送 `POST` 注册请求（包含 `client_name` 和 `redirect_uris` 的 JSON）来创建；**${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** 页面可列出并撤销已有客户端。
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```

        **选项 3：本地 Docker 连接（无需认证）**
        ```json
        {
          "mcpServers": {
            "nextcloud-mcp": {
              "type": "http",
              "url": "http://nextcloudmcp-backend:9650/mcp"
            }
          }
        }
        ```
        *注意：需要 AI 助手在 `pcs` Docker 网络上。*

        **安全：**
        - Nextcloud 应用密码仅存储在 `/DATA/AppData/nextcloudmcp/config.json` 中，不会被记录或通过 API 返回。
        - Web UI 受服务器的单点登录 (SSO) 保护——使用您的服务器账户登录即可。

x-compose-app:
