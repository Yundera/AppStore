  tips:
    en_us: "**Getting Started**\n\nNextcloud MCP needs access to a Nextcloud account (the sibling `Nextcloud` app works great). After installation:\n\n1. In Nextcloud, go to **Settings → Personal → Security → Devices & sessions** and click **Create new app password** (name it `nextcloudmcp`).\n2. Open the Nextcloud MCP Web UI (you'll sign in with your server account — the same single sign-on you already use) and paste the URL, username, and app-password.\n3. Click **Test connection**, then **Save**.\n4. (Optional) In the **LLM Target** panel, click **Rescan Beacon** — if an LLM MCP (e.g. ClaudeCode) is installed on the same server, it's auto-selected.\n5. (Optional) Enable **Auto-respond** to let Claude reply to your Talk DMs and `@<you>` mentions automatically.\n\n**MCP Integration (for AI/LLMs):**\n\nThe app exposes one MCP server, `nextcloud-mcp`, with 138 tools: 118 for Nextcloud and 20 for Talk chat.\n\n**Option 1: Via Beacon (recommended)**\nIf Beacon is installed, the server is auto-discovered and its tools namespaced:\n- `nextcloud-mcp__nc_notes_*`, `nextcloud-mcp__nc_calendar_*`, `nextcloud-mcp__deck_*`, etc.\n- `nextcloud-mcp__talk_send_to_user`, `nextcloud-mcp__talk_list_conversations`, etc.\n\n**Option 2: Public URL (OAuth)**\n\n`/mcp` is protected by OAuth 2.1. Clients that support OAuth discovery\n(claude.ai, Claude Desktop) register themselves and open a browser for\nyou to approve with your server login (single sign-on). For clients needing a\npre-created client_id/client_secret (n8n, custom scripts), create it with a `POST` of its registration (JSON with `client_name` and `redirect_uris`) to **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients**, sent from a browser signed in to this app; **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** lists the clients that exist and revokes them.\n```json\n{\n  \"mcpServers\": {\n    \"nextcloud-mcp\": {\n      \"type\": \"http\",\n      \"url\": \"${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp\"\n    }\n  }\n}\n```\n**Option 3: Local Docker connection (no auth required)**\n```json\n{\n  \"mcpServers\": {\n    \"nextcloud-mcp\": {\n      \"type\": \"http\",\n      \"url\": \"http://nextcloudmcp-backend:9650/mcp\"\n    }\n  }\n}\n```\n*Note: Requires the AI assistant to be on the `pcs` Docker network.*\n\n**Available MCP Tools:**\n\n| Category | Prefix | Examples |\n|---|---|---|\n| Notes | `nc_notes_*` | `create_note`, `update_note`, `search_notes` |\n| Calendar & Todos | `nc_calendar_*` | `create_event`, `find_availability`, `create_todo` |\n| Contacts | `nc_contacts_*` | `list_contacts`, `create_contact`, `update_contact` |\n| Files (WebDAV) | `nc_webdav_*` | `list_directory`, `read_file`, `write_file`, `search_files` |\n| Deck (Kanban) | `deck_*` | `create_board`, `create_card`, `assign_user_to_card` |\n| Cookbook | `nc_cookbook_*` | `list_recipes`, `import_recipe`, `search_recipes` |\n| Tables | `nc_tables_*` | `list_tables`, `insert_row`, `update_row` |\n| Sharing | `nc_share_*` | `share_create`, `share_list`, `share_update` |\n| News | `nc_news_*` | `list_feeds`, `list_items`, `get_starred_items` |\n| Collectives | `collectives_*` | `create_page`, `search_pages`, `assign_tag` |\n| **Talk (chat)** | `talk_*` | `send_to_user`, `list_conversations`, `get_messages` |\n\n**Auto-respond Mode:**\n\nWhen enabled, the app long-polls every DM and group chat your account is in. A real user's DM or a direct `@<you>` mention in a group triggers a call to the configured LLM (Claude Code via Beacon by default). The reply is posted back to Talk — prefixed with `\U0001F916 ` so humans can tell AI-generated answers apart.\n\n- Presence-immune: works even while you have Talk open in a browser.\n- Own-message-aware: never responds to its own replies or to messages you typed from another client.\n- Gapless: resumes at the right cursor after restarts (state in `data/poll-state.json`).\n\n**Security:**\n- Your Nextcloud app-password is stored only in `/DATA/AppData/nextcloudmcp/config.json` and is never logged or returned via the API.\n- The Web UI is protected by the server's single sign-on — you sign in once with your server account.\n"
    fr_fr: "**Demarrage**\n\nNextcloud MCP a besoin d'acces a un compte Nextcloud (l'app soeur `Nextcloud` fonctionne parfaitement). Apres installation:\n\n1. Dans Nextcloud, allez dans **Parametres → Personnel → Securite → Appareils et sessions** et cliquez sur **Creer un nouveau mot de passe d'application** (nommez-le `nextcloudmcp`).\n2. Ouvrez l'interface Web de Nextcloud MCP (vous vous connecterez avec votre compte serveur — la meme authentification unique que d'habitude) et collez l'URL, le nom d'utilisateur et le mot de passe d'application.\n3. Cliquez sur **Tester la connexion**, puis **Enregistrer**.\n4. (Optionnel) Dans le panneau **LLM Target**, cliquez sur **Rescan Beacon** — si un LLM MCP (ex. ClaudeCode) est installe sur le meme serveur, il est auto-selectionne.\n5. (Optionnel) Activez **Reponse automatique** pour laisser Claude repondre automatiquement a vos messages prives Talk et aux mentions `@<vous>`.\n\n**Integration MCP (pour IA/LLMs):**\n\nL'app expose un seul serveur MCP, `nextcloud-mcp`, avec 138 outils : 118 pour Nextcloud et 20 pour le chat Talk.\n\n**Option 1: Via Beacon (recommande)**\nSi Beacon est installe, le serveur est auto-decouvert et ses outils namespaces:\n- `nextcloud-mcp__nc_notes_*`, `nextcloud-mcp__nc_calendar_*`, `nextcloud-mcp__deck_*`, etc.\n- `nextcloud-mcp__talk_send_to_user`, `nextcloud-mcp__talk_list_conversations`, etc.\n\n**Option 2: URL publique (OAuth)**\n\n`/mcp` est protege par OAuth 2.1. Les clients compatibles avec la\ndecouverte OAuth (claude.ai, Claude Desktop) s'enregistrent seuls et\nouvrent un navigateur pour que vous autorisiez avec votre compte\nserveur (authentification unique). Pour les clients necessitant un client_id/client_secret\npre-cree (n8n, scripts), creez-le par un `POST` de son enregistrement (JSON avec `client_name` et `redirect_uris`) vers **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients**, depuis un navigateur connecte a cette app ; **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** liste les clients existants et permet de les revoquer.\n```json\n{\n  \"mcpServers\": {\n    \"nextcloud-mcp\": {\n      \"type\": \"http\",\n      \"url\": \"${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp\"\n    }\n  }\n}\n```\n**Option 3: Connexion Docker locale (pas d'auth requise)**\n```json\n{\n  \"mcpServers\": {\n    \"nextcloud-mcp\": {\n      \"type\": \"http\",\n      \"url\": \"http://nextcloudmcp-backend:9650/mcp\"\n    }\n  }\n}\n```\n*Note: Requiert que l'assistant IA soit sur le reseau Docker `pcs`.*\n\n**Mode Reponse automatique:**\n\nLorsqu'active, l'app interroge en long-poll chaque message prive et discussion de groupe dont votre compte fait partie. Un message prive d'un vrai utilisateur ou une mention directe `@<vous>` dans un groupe declenche un appel au LLM configure (Claude Code via Beacon par defaut). La reponse est postee dans Talk — prefixee de `\U0001F916 ` pour distinguer les reponses IA.\n\n- Insensible a la presence: fonctionne meme si Talk est ouvert dans un navigateur.\n- Conscient des messages propres: ne repond jamais a ses propres reponses ni aux messages que vous avez tapes depuis un autre client.\n- Sans trou: reprend au bon curseur apres redemarrage (etat dans `data/poll-state.json`).\n\n**Securite:**\n- Votre mot de passe d'application Nextcloud est stocke uniquement dans `/DATA/AppData/nextcloudmcp/config.json` et n'est jamais journalise ni retourne via l'API.\n- L'interface Web est protegee par l'authentification unique du serveur (SSO) — vous vous connectez avec votre compte serveur.\n"
    zh_cn: |
      **快速开始**

      Nextcloud MCP 需要访问 Nextcloud 账户（同级 `Nextcloud` 应用即可）。安装后：

      1. 在 Nextcloud 中，转到 **设置 → 个人 → 安全 → 设备和会话**，点击 **创建新的应用密码**（命名为 `nextcloudmcp`）。
      2. 打开 Nextcloud MCP Web UI（使用您的服务器账户（单点登录）登录——与平时相同的登录方式），粘贴 URL、用户名和应用密码。
      3. 点击 **测试连接**，然后 **保存**。
      4. （可选）在 **LLM Target** 面板中，点击 **重新扫描 Beacon** — 如果同一服务器上安装了 LLM MCP（例如 ClaudeCode），它将被自动选中。
      5. （可选）启用 **自动回复**，让 Claude 自动回复您的 Talk 私信和 `@<您>` 提及。

      **MCP 集成（用于 AI/LLM）：**

      应用公开一个 MCP 服务器 `nextcloud-mcp`，共 138 个工具：118 个 Nextcloud 工具和 20 个 Talk 聊天工具。

      **选项 1：通过 Beacon（推荐）**
      如果安装了 Beacon，该服务器会自动发现，其工具会加上命名空间。

      **选项 2：公共 URL（OAuth）**

      `/mcp` 受 OAuth 2.1 保护。支持 OAuth 发现的客户端（claude.ai、Claude Desktop）
      会自动注册并打开浏览器，让您使用服务器账户（单点登录）授权。对于需要预先创建
      client_id/client_secret 的客户端（n8n、自定义脚本），请从已登录本应用的浏览器向 **${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth/clients** 发送 `POST` 注册请求（包含 `client_name` 和 `redirect_uris` 的 JSON）来创建；**${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/AppShield/oauth** 页面可列出并撤销已有客户端。
      ```json
      {
        "mcpServers": {
          "nextcloud-mcp": {
            "type": "http",
            "url": "${APP_URL:-https://nextcloudmcp-${APP_DOMAIN}}/mcp"
          }
        }
      }
      ```

      **选项 3：本地 Docker 连接（无需认证）**
      ```json
      {
        "mcpServers": {
          "nextcloud-mcp": {
            "type": "http",
            "url": "http://nextcloudmcp-backend:9650/mcp"
          }
        }
      }
      ```
      *注意：需要 AI 助手在 `pcs` Docker 网络上。*

      **安全：**
      - Nextcloud 应用密码仅存储在 `/DATA/AppData/nextcloudmcp/config.json` 中，不会被记录或通过 API 返回。
      - Web UI 受服务器的单点登录 (SSO) 保护——使用您的服务器账户登录即可。
