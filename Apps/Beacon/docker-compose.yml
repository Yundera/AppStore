name: beacon

services:
  beacon-backend:
    image: ghcr.io/worph/beacon:1.0.19
    container_name: beacon-backend
    hostname: beacon-backend
    restart: unless-stopped
    environment:
      DISCOVERY_INTERVAL: "60"
      DISCOVERY_PORT: "9099"
      MCP_CLIENT_TIMEOUT : 300
      WEB_PORT: "9300"
      LOG_LEVEL: info
      PUBLIC_URL: "https://beacon-${APP_DOMAIN}/mcp"
      # Surfaces a "Manage remote access" link in the Beacon dashboard pointing
      # at the AppShield-hosted OAuth admin page. Beacon itself does no OAuth.
      OAUTH_ADMIN_URL: "https://beacon-${APP_DOMAIN}/AppShield/oauth"
      TZ: $TZ
    expose:
      - 9300
      - 9099
    volumes:
      # Beacon's own state, all under /app/data: externally-added MCP server
      # configs (external.json), the per-server description/note overrides
      # (annotations.json), the OAuth tokens and registered client for each
      # OAuth-protected external server (oauth/*.json, written 0600), and the
      # instance id used as the federation loop guard (beacon-id).
      # Without this it is all recreated empty on every redeploy, which means
      # re-adding external servers and re-authorizing each one by hand after
      # every app update.
      - ${DATA_ROOT:-/DATA}/AppData/beacon/data:/app/data
    networks:
      - pcs
    # 80 — user-facing API backend (CONTRIBUTING "CPU Share Allocation").
    cpu_shares: 80
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  beacon-proxy:
    # 2.0.7+ is a generic OAuth 2.1 broker (oidc-provider fronting Dex): it
    # protects whatever path the OAUTH_RESOURCE URL names (here /mcp) and
    # advertises OAUTH_SCOPE — no MCP-specific knowledge. Activated by
    # OAUTH_RESOURCE below. (2.0.5/2.0.6 used the MCP_OAUTH_RESOURCE name, kept as
    # a back-compat alias.)
    # 2.0.9+ additionally advertises offline_access and adds prompt=consent to
    # authorization requests that ask for it — without that, OIDC Core 11.1 makes
    # the provider drop the scope and issue no refresh token, so every client had
    # to be re-authorized by hand once the 1h access token expired.
    image: ghcr.io/yundera/appshield:2.0.9
    container_name: beacon
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: beacon
    restart: unless-stopped
    expose:
      - 80
    labels:
      caddy_0: beacon-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: beacon-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: beacon-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    user: 0:0
    environment:
      BACKEND_HOST: "beacon-backend"
      BACKEND_PORT: "9300"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # OAuth 2.1 broker (opt-in). When OAUTH_RESOURCE is set, AppShield runs an
      # OAuth/OIDC authorization server fronting Dex so claude.ai (via DCR) and
      # clients like n8n (via a manual client) can reach this resource with Bearer
      # tokens. AppShield protects the path in the URL (/mcp) and advertises the
      # OAUTH_SCOPE below. Requires appshield >= 2.0.7 (older images read the
      # legacy MCP_OAUTH_RESOURCE name instead and hardcode the /mcp path + scope).
      OAUTH_RESOURCE: "https://beacon-${APP_DOMAIN}/mcp"
      # Scope this resource advertises/grants. Free-form label (AppShield's own
      # default is the generic "access"); set explicitly to "mcp" so Beacon's
      # advertised scope is unchanged from earlier releases.
      OAUTH_SCOPE: "mcp"
      OAUTH_DATA_DIR: "/data/oauth"
    volumes:
      # Persist DCR/manual clients, signing keys and grants across redeploys.
      - ${DATA_ROOT:-/DATA}/AppData/beacon/oauth:/data/oauth
    depends_on:
      - beacon-backend
    networks:
      - pcs
    # 80 — reverse proxy in front of a user-facing app (CONTRIBUTING
    # "CPU Share Allocation").
    cpu_shares: 80
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  # The deployment's shared network, under whatever name it carries there.
  # ${APP_NET} comes from the app's .env; the `:-pcs` default keeps a hand-run
  # `docker compose up -d` working. Maison copies this file byte-for-byte and
  # never rewrites it, so the reference has to be written here.
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  # The served service: beacon-proxy is what carries the caddy_N labels and what
  # webui-host resolves to. beacon-backend is reachable only from inside `pcs`.
  main: beacon-proxy
  index: /

  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png

  architectures:
    - amd64
  author: Yundera
  category: Developer
  tags: ["developer"]
  developer: Worph
  title:
    en_us: Beacon
  tagline:
    en_us: Discover and unify MCP servers behind a single endpoint
    fr_fr: Decouvrez et unifiez vos serveurs MCP derriere un seul endpoint
  description:
    en_us: |
      **A local service that discovers and aggregates multiple MCP servers into one endpoint**

      Beacon discovers MCP server containers on your Docker network via UDP broadcast, collects their tool manifests, and exposes them as namespaced tools through a single MCP streamable HTTP endpoint.

      **What you can do:**
      - Automatically discover MCP servers on the same Docker network
      - Add remote MCP servers by URL, including ones behind an OAuth login
      - Connect another Beacon and get its servers individually, not buried behind it
      - Access all MCP tools through a single unified endpoint
      - View discovered servers and their tools via the web dashboard
      - Trigger manual discovery scans
      - Tools are namespaced as `{server}__{tool}` to avoid conflicts

      **Think of it like:** A reverse proxy for MCP servers — one endpoint to rule them all.

      **Perfect if you:** Run multiple MCP-enabled apps and want your AI assistant to access all their tools from a single connection.
    fr_fr: |
      **Un service local qui decouvre et agrege plusieurs serveurs MCP en un seul endpoint**

      Beacon decouvre les conteneurs serveurs MCP sur votre reseau Docker via broadcast UDP, collecte leurs manifestes d'outils et les expose comme outils namespaces a travers un seul endpoint HTTP MCP streamable.

      **Ce que vous pouvez faire:**
      - Decouvrir automatiquement les serveurs MCP sur le meme reseau Docker
      - Ajouter des serveurs MCP distants par URL, y compris ceux proteges par OAuth
      - Connecter un autre Beacon et recuperer ses serveurs individuellement
      - Acceder a tous les outils MCP via un seul endpoint unifie
      - Visualiser les serveurs decouverts et leurs outils via le tableau de bord web
      - Declencher des scans de decouverte manuels
      - Les outils sont namespaces en `{serveur}__{outil}` pour eviter les conflits

      **Parfait si vous:** Executez plusieurs applications MCP et souhaitez que votre assistant IA accede a tous leurs outils depuis une seule connexion.
  tips:
    before_install:
      en_us: |
        **Getting Started**

        Beacon automatically discovers MCP servers on the `pcs` Docker network.

        **Authentication (on by default):**
        - **Humans** — the web dashboard is behind your Yundera single sign-on. Opening the
          app redirects you to the Yundera login; there is no separate Beacon password.
        - **Machines** — the `/mcp` endpoint is behind OAuth 2.1. AI clients get a token by
          logging in with the same Yundera account (see Option 1 below).

        Nothing is reachable unauthenticated from the public URL.

        **How it works:**
        1. The aggregator broadcasts UDP discovery packets on port 9099
        2. MCP servers using the `mcp-announce` SDK respond with their manifests
        3. Tools are collected and exposed through a single endpoint
        4. The web dashboard shows all discovered servers and tools

        **MCP Integration (for AI/LLMs):**

        Connect your AI assistant to the aggregated endpoint to access all discovered MCP tools at once.

        **Option 1: Public URL (OAuth)**

        The `/mcp` endpoint is protected by OAuth 2.1. Point your client at the URL below —
        clients that support OAuth discovery (claude.ai, Claude Desktop) register themselves
        and open a browser for you to approve with your Yundera login.
        ```json
        {
          "mcpServers": {
            "beacon": {
              "type": "http",
              "url": "https://beacon-${APP_DOMAIN}/mcp"
            }
          }
        }
        ```
        For clients that need a pre-created client_id/client_secret (n8n, custom scripts),
        open **https://beacon-${APP_DOMAIN}/AppShield/oauth** and create one there. The same
        page is linked from the Beacon dashboard as "Manage remote access".

        **Option 2: Local Docker connection (no auth required)**

        For AI assistants running on the same server, connect directly via the Docker network:
        ```json
        {
          "mcpServers": {
            "beacon": {
              "type": "http",
              "url": "http://beacon-backend:9300/mcp"
            }
          }
        }
        ```
        *Note: Requires the AI assistant to be on the `pcs` Docker network. Port 9300 is the
        web/MCP port; 9099 is the UDP discovery port and serves no HTTP.*

        **Web Dashboard:**
        - View all discovered MCP servers at the main URL
        - See available tools per server
        - Trigger manual discovery via the UI

        **Adding servers that aren't on this machine:**

        Open **External MCP Servers** in the dashboard and paste the endpoint URL.
        - If it needs an OAuth login, Beacon registers itself with the remote automatically and shows a **Connect** button — finish the login in the popup and it stays connected, refreshing its own token from then on.
        - If the URL is another Beacon, its servers are imported individually (`remote.docmost-mcp__…`) rather than hidden behind it.
        - Pre-registered OAuth credentials and custom scopes live under **Advanced**, and a JSON bundle can still be pasted there to add several at once or to set static auth headers.

        **Compatible MCP servers:**
        Any MCP server using the `mcp-announce` SDK on the `pcs` network will be automatically discovered. Apps like Lystik, OpenKeep, BrowserMCP, and others are compatible.
      fr_fr: |
        **Pour commencer**

        Beacon decouvre automatiquement les serveurs MCP sur le reseau Docker `pcs`.

        **Authentification (active par defaut):**
        - **Humains** — le tableau de bord web est protege par votre authentification unique
          Yundera (SSO). Ouvrir l'application redirige vers la connexion Yundera; il n'y a pas
          de mot de passe Beacon separe.
        - **Machines** — l'endpoint `/mcp` est protege par OAuth 2.1. Les clients IA obtiennent
          un jeton en se connectant avec le meme compte Yundera (voir Option 1 ci-dessous).

        Rien n'est accessible sans authentification depuis l'URL publique.

        **Comment ca marche:**
        1. L'aggregateur envoie des paquets de decouverte UDP sur le port 9099
        2. Les serveurs MCP utilisant le SDK `mcp-announce` repondent avec leurs manifestes
        3. Les outils sont collectes et exposes via un seul endpoint
        4. Le tableau de bord web affiche tous les serveurs et outils decouverts

        **Integration MCP (pour IA/LLMs):**

        Connectez votre assistant IA a l'endpoint agrege pour acceder a tous les outils MCP decouverts.

        **Option 1: URL publique (OAuth)**

        L'endpoint `/mcp` est protege par OAuth 2.1. Pointez votre client vers l'URL
        ci-dessous — les clients qui gerent la decouverte OAuth (claude.ai, Claude Desktop)
        s'enregistrent seuls et ouvrent un navigateur pour que vous approuviez avec votre
        connexion Yundera.
        ```json
        {
          "mcpServers": {
            "beacon": {
              "type": "http",
              "url": "https://beacon-${APP_DOMAIN}/mcp"
            }
          }
        }
        ```
        Pour les clients qui exigent un client_id/client_secret pre-cree (n8n, scripts),
        ouvrez **https://beacon-${APP_DOMAIN}/AppShield/oauth** et creez-en un. La meme page
        est accessible depuis le tableau de bord Beacon via "Manage remote access".

        **Option 2: Connexion Docker locale (sans auth)**
        ```json
        {
          "mcpServers": {
            "beacon": {
              "type": "http",
              "url": "http://beacon-backend:9300/mcp"
            }
          }
        }
        ```
        *Note: L'assistant IA doit etre sur le reseau Docker `pcs`. Le port 9300 est celui
        du web/MCP; 9099 est le port de decouverte UDP et ne sert aucun HTTP.*

        **Ajouter des serveurs distants:**

        Ouvrez **External MCP Servers** dans le tableau de bord et collez l'URL du endpoint.
        - Si le serveur necessite une connexion OAuth, Beacon s'enregistre automatiquement aupres du serveur distant et affiche un bouton **Connect** — terminez la connexion dans la popup et Beacon renouvelle ensuite son jeton tout seul.
        - Si l'URL est un autre Beacon, ses serveurs sont importes individuellement (`distant.docmost-mcp__…`) au lieu d'etre masques derriere lui.
        - Les identifiants OAuth pre-enregistres et les scopes personnalises sont dans **Advanced**, ou l'on peut aussi coller un bundle JSON pour en ajouter plusieurs a la fois.

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up` —
  # the two bind-mount sources above. Declared here rather than mkdir'd in a
  # hook: a hook's mkdir runs inside the Maison container, so it would create
  # the directory in the wrong place.
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/oauth
      user: $PUID
      group: $PGID
  webui-host: beacon-${domain}
  webui-path: "/"
