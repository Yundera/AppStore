name: paperlessngx

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless
    restart: unless-stopped
    networks:
      - paperless-network
      - pcs
    expose:
      - "8000"
    labels:
      caddy_0: paperlessngx-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 8000}}"
      caddy_1: paperlessngx-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 8000}}"
      caddy_2: paperlessngx-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 8000}}"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/data:/usr/src/paperless/data
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/media:/usr/src/paperless/media
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/export:/usr/src/paperless/export
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: $APP_DEFAULT_PASSWORD
      PAPERLESS_SECRET_KEY: $APP_DEFAULT_PASSWORD
      PAPERLESS_URL: https://paperlessngx-${APP_DOMAIN}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: $APP_DEFAULT_PASSWORD
      PAPERLESS_ADMIN_MAIL: admin@paperless.local
      USERMAP_UID: $PUID
      USERMAP_GID: $PGID
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    cpu_shares: 70

  tika:
    image: docker.io/apache/tika:2.9.2.1
    container_name: paperless-tika
    restart: unless-stopped
    networks:
      - paperless-network
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 10

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.36.0
    container_name: paperless-gotenberg
    restart: unless-stopped
    networks:
      - paperless-network
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 10

  broker:
    image: docker.io/valkey/valkey:9.1.1-alpine
    container_name: paperless-broker
    restart: unless-stopped
    networks:
      - paperless-network
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/redisdata:/data
    environment:
      TZ: $TZ
    deploy:
      resources:
        limits:
          memory: 256M
    cpu_shares: 10

  db:
    image: docker.io/library/postgres:17.11
    container_name: paperless-db
    restart: unless-stopped
    networks:
      - paperless-network
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: $APP_DEFAULT_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 20

networks:
  paperless-network:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Yundera Team
  category: Utilities
  developer: paperless-ngx
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  thumbnail: thumbnail.png
  index: /
  tagline:
    en_us: Transform your paper documents into a searchable digital archive
    fr_fr: Transformez vos documents papier en archive numerique consultable
    ko_kr: 종이 문서를 검색 가능한 디지털 보관소로 변환하세요
    zh_cn: 将纸质文档转换为可搜索的数字档案
    es_es: Transforma tus documentos en papel en un archivo digital con busqueda
  title:
    en_us: Paperless-ngx
  store_app_id: paperless-ngx
  main: paperless
  webui_port: 8000
  description:
    en_us: |
      **Go paperless. Find any document in seconds.**

      Paperless-ngx is a powerful, open-source document management system that transforms your physical documents into a searchable online archive. Scan once, find anything instantly.

      **What you can do:**
      - Scan and upload documents from any scanner, phone, or folder
      - Full-text OCR search across all your documents in seconds
      - Auto-tag and organize documents with AI-powered suggestions
      - Support for PDF, images, Word docs, spreadsheets, and more
      - Share documents and assign permissions to multiple users
      - Export and backup your entire archive anytime

      **How it works:**
      1. Drop documents into the consume folder (via scanner, email, or file upload)
      2. Paperless automatically OCR-processes and indexes them
      3. Search and retrieve any document instantly

      **Perfect for:** Home offices, small businesses, accountants, lawyers, and anyone tired of paper clutter. Store tax records, invoices, contracts, manuals — everything searchable and organized.
    ko_kr: |
      **종이 없는 사무실. 어떤 문서도 몇 초 안에 찾으세요.**

      Paperless-ngx는 물리적 문서를 검색 가능한 온라인 보관소로 변환하는 강력한 오픈소스 문서 관리 시스템입니다. 한 번 스캔하면, 언제든지 즉시 찾을 수 있습니다.

      **할 수 있는 것:**
      - 스캐너, 스마트폰, 폴더에서 문서 스캔 및 업로드
      - 모든 문서에서 전문 OCR 텍스트 검색
      - AI 기반 제안으로 자동 태그 및 정리
      - PDF, 이미지, Word, 스프레드시트 등 지원
      - 다중 사용자 문서 공유 및 권한 설정
      - 언제든지 전체 보관소 내보내기 및 백업

      **이런 분께 완벽해요:** 홈 오피스, 소규모 사업장, 회계사, 법무사, 종이 서류 정리에 지친 모든 분.
    zh_cn: |
      **无纸化办公。几秒内找到任何文档。**

      Paperless-ngx 是一个强大的开源文档管理系统，将您的纸质文档转化为可搜索的在线档案。扫描一次，随时即时查找。

      **您可以做的事:**
      - 从任何扫描仪、手机或文件夹扫描和上传文档
      - 在几秒内对所有文档进行全文 OCR 搜索
      - 使用 AI 驱动的建议自动标记和整理文档
      - 支持 PDF、图像、Word 文档、电子表格等
      - 为多个用户共享文档并分配权限
      - 随时导出和备份整个档案
    fr_fr: |
      **Passez au numerique. Retrouvez n'importe quel document en quelques secondes.**

      Paperless-ngx est un puissant systeme de gestion documentaire open source qui transforme vos documents physiques en archive numerique consultable.

      **Ce que vous pouvez faire:**
      - Scanner et telecharger des documents depuis n'importe quel scanner, telephone ou dossier
      - Recherche OCR en texte integral dans tous vos documents en quelques secondes
      - Tagger et organiser automatiquement les documents avec des suggestions IA
      - Support PDF, images, Word, tableurs et plus
      - Partager des documents et assigner des permissions a plusieurs utilisateurs
      - Exporter et sauvegarder toute votre archive a tout moment
    es_es: |
      **Digitaliza tu oficina. Encuentra cualquier documento en segundos.**

      Paperless-ngx es un potente sistema de gestion documental de codigo abierto que transforma tus documentos fisicos en un archivo digital con busqueda.

      **Lo que puedes hacer:**
      - Escanear y subir documentos desde cualquier escaner, telefono o carpeta
      - Busqueda OCR de texto completo en todos tus documentos en segundos
      - Etiquetar y organizar automaticamente documentos con sugerencias de IA
      - Soporte para PDF, imagenes, Word, hojas de calculo y mas
      - Compartir documentos y asignar permisos a multiples usuarios
      - Exportar y hacer copia de seguridad de todo tu archivo en cualquier momento
  tips:
    before_install:
      en_us: |
        **Quick Start:**

        After installation, log in with:
        - **Username:** `admin`
        - **Password:** `$APP_DEFAULT_PASSWORD`

        **Add documents:**
        - **Web upload:** Drag and drop files directly in the browser
        - **Consume folder:** Place files in `/DATA/AppData/paperlessngx/consume/` for automatic import
        - **Email import:** Configure an email account in Settings → Mail

        **Tips:**
        - OCR processing runs automatically in the background after upload
        - Use tags, correspondents, and document types to organize your archive
        - Enable auto-tagging in Settings for AI-powered document classification
      ko_kr: |
        **빠른 시작:**

        설치 후 로그인 정보:
        - **사용자명:** `admin`
        - **비밀번호:** `$APP_DEFAULT_PASSWORD`

        **문서 추가:**
        - **웹 업로드:** 브라우저에서 파일을 드래그 앤 드롭
        - **소비 폴더:** `/DATA/AppData/paperlessngx/consume/`에 파일을 넣으면 자동 가져오기
        - **이메일 가져오기:** 설정 → 메일에서 이메일 계정 구성

        **팁:**
        - OCR 처리는 업로드 후 자동으로 백그라운드에서 실행됩니다
        - 태그, 발신자, 문서 유형으로 보관소를 정리하세요

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before images are
  # pulled and before any container starts - on the first boot and every one
  # after it. Declared here rather than mkdir'd in a hook: a hook runs inside
  # the Maison container, so it would create root-owned directories, and
  # paperless drops to $PUID:$PGID through USERMAP_UID/USERMAP_GID.
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/media
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/export
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/consume
      user: $PUID
      group: $PGID
    # postgres and valkey both re-chown their own data dir to their internal
    # uid on start, so $PUID:$PGID here is only the pre-creation owner.
    - path: /DATA/AppData/$AppID/pgdata
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/redisdata
      user: $PUID
      group: $PGID
  webui-host: paperlessngx-${domain}
