name: readeck
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  readeck:
    image: ghcr.io/nsl-sh/appshield:4.1.0
    container_name: readeck
    # OIDC identity: the auth-registrar attests this app's name via the container's PTR
    # record, so the hostname must equal the app name.
    hostname: readeck
    restart: unless-stopped
    environment:
      BACKEND_HOST: "readeck-app"
      BACKEND_PORT: "8000"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      readeck-app:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On `pcs` to reach the platform's auth-registrar, and on the app's own
      # network because that is where the router and the backend live.
      - pcs
      - readeck-internal

  readeck-app:
    image: codeberg.org/readeck/readeck:0.23.5
    container_name: readeck-app
    restart: unless-stopped
    # A single static binary with no root-only setup: it runs straight as the box user.
    user: "$PUID:$PGID"
    environment:
      READECK_SERVER_HOST: "0.0.0.0"
      READECK_SERVER_PORT: "8000"
      # Readeck answers only on the hosts the platform gives this app. The gate in front
      # is on the app-private network, inside Readeck's default trusted proxies, so the
      # forwarded scheme and client address are honoured.
      READECK_ALLOWED_HOSTS: "${APP_HOSTS:-readeck-${APP_DOMAIN}}"
      READECK_LOG_FORMAT: text
      TZ: $TZ
    expose:
      - 8000
    volumes:
      # Everything Readeck keeps: config.toml (with its generated secret key), the
      # SQLite database and the saved copies of every bookmark.
      - ${DATA_ROOT:-/DATA}/AppData/readeck/data:/readeck
    healthcheck:
      test: ["CMD", "/bin/readeck", "healthcheck", "-config", "config.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 80
    logging: *logging
    networks:
      # App-private only: reached by the gate and, for the manifest alone, the router.
      - readeck-internal

  # The app's own router: the only routed service. It sends exactly one path,
  # /manifest.webmanifest, straight to Readeck and everything else to the
  # AppShield gate. See rationale.md.
  readeck-router:
    image: nginx:1.31.9-alpine
    container_name: readeck-router
    restart: unless-stopped
    depends_on:
      - readeck
      - readeck-app
    expose:
      - 80
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    configs:
      - source: readeck-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - readeck-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the router, the gate and Readeck.
  readeck-internal:
    driver: bridge

configs:
  readeck-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$client_ip;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate readeck:80;
        set $$app readeck-app:8000;

        location = /_router/health { access_log off; return 204; }

        # The PWA manifest, and nothing else, bypasses the gate. nginx matches
        # the normalised path exactly (dot segments and %-escapes resolved), and
        # the URI sent on is fixed, so no other path can ride this location.
        location = /manifest.webmanifest {
          proxy_pass http://$$app/manifest.webmanifest;
        }

        # Every other path, including the gate's own /AppShield/ (and legacy
        # /nhl-auth/) endpoints: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: readeck-router
  webui_port: 80
  category: Documents
  tags: ["productivity", "bookmarks", "read-later"]
  developer: Readeck
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  index: /
  store_app_id: readeck
  title:
    en_us: Readeck
  tagline:
    en_us: Save web pages to read later and keep them forever
  description:
    en_us: |
      Readeck is a read-later and bookmark app. Save a link and Readeck keeps a clean, readable copy of the page - its text and images - on your server, so you can read it later, even after the original is gone.

      **Key features:**
      • Readable copies of articles, with pictures and videos recognised as such
      • Highlights, labels, favourites and archive to organise what you read
      • Collections: saved searches that stay up to date
      • Full-text search across everything you saved
      • E-book (EPUB) export of a bookmark or a whole collection
      • Import from Pocket, Wallabag, Omnivore, browser bookmarks and more

      Everything is stored on your server, under the app's own folder.
  tips:
    before_install:
      en_us: |
        **Sign-in:** Readeck is protected by your server's single sign-on.
        -----------------------------
        **First visit:** Readeck asks you to create its first user - choose a username,
        an email address and a password. That user is Readeck's administrator, and you
        sign in to Readeck with it from then on.
        -----------------------------
        Every request goes through the single sign-on gate, so the Readeck browser extension
        and mobile apps cannot reach this server. Save and read bookmarks from the browser.
x-compose-app:
  schema_version: 2
  version: "0.23.5"
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in when single sign-on is unavailable. Day to day, use single sign-on. Readeck's own user is the one you create on first visit.
      # Behind SSO nobody needs it on the first click: tile menu only.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  # How the app is reached; the box's routing setting decides the rest.
  routes:
    - { service: readeck-router, name: readeck, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: readeck
  title:
    en_us: Readeck
  tagline:
    en_us: Save web pages to read later and keep them forever
  description:
    en_us: |
      Readeck is a read-later and bookmark app. Save a link and Readeck keeps a clean, readable copy of the page - its text and images - on your server, so you can read it later, even after the original is gone.

      **Key features:**
      • Readable copies of articles, with pictures and videos recognised as such
      • Highlights, labels, favourites and archive to organise what you read
      • Collections: saved searches that stay up to date
      • Full-text search across everything you saved
      • E-book (EPUB) export of a bookmark or a whole collection
      • Import from Pocket, Wallabag, Omnivore, browser bookmarks and more

      Everything is stored on your server, under the app's own folder.
  developer: Readeck
  category: Documents
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** Readeck is protected by your server's single sign-on.
      -----------------------------
      **First visit:** Readeck asks you to create its first user - choose a username,
      an email address and a password. That user is Readeck's administrator, and you
      sign in to Readeck with it from then on.
      -----------------------------
      Every request goes through the single sign-on gate, so the Readeck browser extension
      and mobile apps cannot reach this server. Save and read bookmarks from the browser.
  # Readeck runs as $PUID:$PGID and writes its whole state here.
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
      mode: "0700"
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
