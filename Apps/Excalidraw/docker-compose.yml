name: excalidraw

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  excalidraw:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: excalidraw
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: excalidraw
    restart: unless-stopped
    expose:
      - 80
    environment:
      BACKEND_HOST: "excalidraw-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env): the registrar on a
      # Yundera box, or a provider the user configured. Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      # Without a value (a platform that ignores x-compose-app) the gate generates
      # one and prints it in its log.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      # Empty elsewhere, where the gate falls back to REDIRECT_HOST_SUFFIXES.
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    depends_on:
      - excalidraw-backend
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      # On `pcs` to reach the platform's auth-registrar, and on the app's own
      # network because that is where the router and the backend live.
      - pcs
      - excalidraw-internal

  excalidraw-backend:
    # Static site served by nginx on port 80. No volume: drawings are kept in the
    # browser's local storage, not on the server (see rationale.md).
    # Pinned by digest: upstream publishes its multi-arch image only as `latest`
    # (this digest is the 2026-05-06 build, after v0.18.1); see rationale.md.
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw-backend
    restart: unless-stopped
    expose:
      - 80
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      # App-private: reached only by the gate and the router, so it has no
      # business on the shared network.
      - excalidraw-internal

  # The app's own router: the only routed service. It sends exactly one path,
  # /manifest.webmanifest, straight to the backend and everything else to the
  # AppShield gate. See rationale.md.
  excalidraw-router:
    image: nginx:1.31.9-alpine
    container_name: excalidraw-router
    restart: unless-stopped
    depends_on:
      - excalidraw
      - excalidraw-backend
    expose:
      - 80
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    configs:
      - source: excalidraw-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - excalidraw-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the router, the gate and the backend.
  excalidraw-internal:
    driver: bridge

configs:
  excalidraw-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;
        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate excalidraw:80;
        set $$app excalidraw-backend:80;

        location = /_router/health { access_log off; return 204; }

        # The PWA manifest, and nothing else, bypasses the gate. nginx matches
        # the normalised path exactly (dot segments and %-escapes resolved), and
        # the URI sent on is fixed, so no other path can ride this location.
        location = /manifest.webmanifest {
          proxy_pass http://$$app/manifest.webmanifest;
        }

        # Every other path, including the gate's own /AppShield/ (and legacy
        # /nhl-auth/) endpoints: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: excalidraw-router
  webui_port: 80
  index: /
  category: Documents
  tags: ["productivity", "whiteboard", "diagrams"]
  developer: Excalidraw
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Excalidraw
  tagline:
    en_us: Virtual whiteboard for hand-drawn-style diagrams
  description:
    en_us: |
      Excalidraw is a virtual whiteboard for sketching diagrams that look hand-drawn: flowcharts, wireframes, architecture sketches, mind maps and quick illustrations. Draw with shapes, arrows, text and freehand lines, reuse elements from libraries, and export your drawing as PNG, SVG or an .excalidraw file.

      Your drawing is saved in your browser's local storage, not on the server: it stays on the device and browser you drew it in. Use **Save to...** to keep a copy as a file.

      This listing is the single-user editor. Live collaboration and shareable links are not run on your server: those buttons use Excalidraw's own public service at excalidraw.com.

      The upstream build loads its fonts from Excalidraw's CDN and sends an anonymous, cookie-free page view to Simple Analytics; your drawings are not sent anywhere.

      The app is protected by your server's single sign-on.
  tips:
    before_install:
      en_us: |
        **Sign-in:** Excalidraw is protected by your server's single sign-on.
        When single sign-on is unavailable, sign in with the app password from the tile menu (**Credentials**).

        **Where drawings live:** in your browser's local storage, not on the server. Clearing your browser data deletes them; use **Save to...** to keep a file.

        **Collaboration and share links** go through Excalidraw's public service (excalidraw.com), not your server.

        Access via: `${APP_URL:-https://excalidraw-${APP_DOMAIN}}`

x-compose-app:
  schema_version: 2
  id: excalidraw
  # The upstream image carries no version tag; this is the date of the pinned build.
  version: "2026.05.06"
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI.
  routes:
    - { service: excalidraw-router, name: excalidraw, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Excalidraw
  tagline:
    en_us: Virtual whiteboard for hand-drawn-style diagrams
  description:
    en_us: |
      Excalidraw is a virtual whiteboard for sketching diagrams that look hand-drawn: flowcharts, wireframes, architecture sketches, mind maps and quick illustrations. Draw with shapes, arrows, text and freehand lines, reuse elements from libraries, and export your drawing as PNG, SVG or an .excalidraw file.

      Your drawing is saved in your browser's local storage, not on the server: it stays on the device and browser you drew it in. Use **Save to...** to keep a copy as a file.

      This listing is the single-user editor. Live collaboration and shareable links are not run on your server: those buttons use Excalidraw's own public service at excalidraw.com.

      The upstream build loads its fonts from Excalidraw's CDN and sends an anonymous, cookie-free page view to Simple Analytics; your drawings are not sent anywhere.

      The app is protected by your server's single sign-on.
  developer: Excalidraw
  category: Documents
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** Excalidraw is protected by your server's single sign-on.
      When single sign-on is unavailable, sign in with the app password from the tile menu (**Credentials**).

      **Where drawings live:** in your browser's local storage, not on the server. Clearing your browser data deletes them; use **Save to...** to keep a file.

      **Collaboration and share links** go through Excalidraw's public service (excalidraw.com), not your server.

      Access via: `${APP_URL:-https://excalidraw-${APP_DOMAIN}}`
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
