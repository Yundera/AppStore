  # Outline's three signing/encryption secrets are state, not config: SECRET_KEY
  # encrypts the authentications table, so a key that changed would leave the
  # stored OIDC credentials undecryptable. They are generated once into the app's
  # .env — which the app folder's backup archives — and never regenerated.
  #
  # This replaces `openssl rand -hex 32` ×3 in a hook. openssl is not in Maison's
  # runtime, so those three substitutions produced empty strings, the guard file
  # was written non-empty anyway, and the app ran with empty secrets.
  #
  # The bcrypt hash was a `docker run dex hash` with a `docker run python + pip
  # install bcrypt` fallback behind it. It is a generator now, hashing the app's
  # own admin password.
  #
  # The database and admin passwords used to be the box-wide shared password. They
  # are seeded from it: an installed app keeps the values its database and its dex
  # login were initialised with, and a fresh install gets its own.
  secrets:
    OUTLINE_SECRET_KEY: hex:32
    OUTLINE_UTILS_SECRET: hex:32
    OUTLINE_OIDC_SECRET: hex:32
    OUTLINE_DB_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
    OUTLINE_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
    OUTLINE_DEX_PASSWORD_HASH: bcrypt:${OUTLINE_ADMIN_PASSWORD}
  credentials:
    - label:
        en_us: Administrator
        fr_fr: Administrateur
        es_es: Administrador
        zh_cn: 管理员
        ko_kr: 관리자
      username: ${APP_EMAIL}
      password: ${OUTLINE_ADMIN_PASSWORD}
      # The password is dex's static admin entry. OUTLINE_DEX_PASSWORD_HASH derives
      # from it, so Maison regenerates the hash on the same up, re-renders
      # dex/config.yaml (ensure: always) and - through the outline.dex-password-rev
      # label - recreates dex, which reads its config only at start.
      change:
        apply: env
  # Dex's config carries the deployment's domain in its issuer, and Outline's own
  # OIDC_AUTH_URI (in the environment above) is re-resolved on every up. The two
  # have to move together: the hook this replaces rendered the issuer once at
  # install, so changing the PCS domain afterwards left dex issuing for the old
  # one and login silently stopped working. Re-rendering is safe because every
  # value in the file is derived — the secrets it embeds are generated once and
  # stable, so a converge that changes nothing rewrites nothing.
  files:
    - path: /DATA/AppData/outline/dex/config.yaml
      from: dex/config.yaml.tmpl
      ensure: always
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/outline/data
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/outline/dex
      user: $PUID
      group: $PGID
    # Not /DATA/AppData/outline/pgdata: outline-postgres starts as root and its image hands that directory to
    # its own user; chowning it to $PUID here would leave the running
    # database unable to write there.
    - path: /DATA/AppData/outline/redis
      user: $PUID
      group: $PGID
      # Reclaims a dump.rdb written by the image's own uid 999 before the fix.
      recursive: true
