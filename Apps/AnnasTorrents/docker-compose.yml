name: annas-torrents-webui

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── AppShield sidecar ──────────────────────────────────────────────
  # AppShield (ghcr.io/yundera/appshield, formerly nginx-hash-lock) in OIDC
  # mode. It self-registers as an OIDC client with the PCS auth-registrar on
  # first login and gates every request through the built-in Authelia SSO
  # before proxying to the backend. Only this service is publicly reachable
  # (routed); the backend is not routed and lives on the app's own
  # internal network.
  annas-torrents-webui:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: annas-torrents-webui
    # OIDC identity: AppShield builds its OIDC redirect URIs from os.hostname(),
    # and the auth-registrar attests this app's name via the container's PTR
    # record — both container_name and hostname must equal the app name, or OIDC
    # registration fails.
    hostname: annas-torrents-webui
    restart: unless-stopped
    expose:
      - "80"
    environment:
      BACKEND_HOST: "annas-torrents-webui-backend"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      # Presence of OIDC_REGISTRAR_URL enables OIDC (Authelia SSO) mode.
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    depends_on:
      - annas-torrents-webui-backend
    networks:
      # On `pcs` because the router must reach it, and on the app's own
      # network because that is where its backend lives.
      - pcs
      - annas-torrents-webui-internal
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging

  # ── Backend (protected) ────────────────────────────────────────────
  # The FastAPI + embedded-libtorrent app. Not routed: the web UI is
  # only reachable through the AppShield sidecar and is never published to
  # the host. The BitTorrent peer port (6881 TCP+UDP) *is* published: raw
  # swarm traffic cannot go through an HTTP proxy, and without it no peer
  # can dial in — hence the `needs-public-ip` tag.
  annas-torrents-webui-backend:
    image: ghcr.io/worph/annas-torrents-webui:1.0.2
    container_name: annas-torrents-webui-backend
    restart: unless-stopped
    # Runs unprivileged as the platform-injected PUID:PGID. The data dir is
    # created + chowned by x-compose-app.folders so this non-root process can
    # write /data/content — no root needed.
    expose:
      - "8080"          # Web UI — internal only, fronted by the sidecar
    ports:
      - "6881:6881/tcp" # BitTorrent peer traffic
      - "6881:6881/udp" # DHT / uTP
    environment:
      DATA_DIR: /data
      TORRENT_PORT: "6881"
      # Public base URL for share links (/view). Points at the SSO-fronted
      # domain so shared links resolve for other viewers.
      PUBLIC_URL: "${APP_URL:-https://annas-torrents-webui-${APP_DOMAIN}}"
      TZ: $TZ
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/annas-torrents-webui/data/:/data
    networks:
      # App-private: reached only by its AppShield sidecar, so it has no
      # business on the shared network.
      - annas-torrents-webui-internal
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M

networks:
  # The deployment's shared network, under whatever name it carries there.
  # ${APP_NET} comes from the app's .env; the `:-pcs` default keeps a hand-run
  # `docker compose up -d` working. Maison copies this file byte-for-byte and
  # never rewrites it, so the reference has to be written here.
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the sidecar and the backend.
  annas-torrents-webui-internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: annas-torrents-webui
  webui_port: 80
  index: /
  # No pre-install-cmd: the data dir is created and chowned to $PUID:$PGID by
  # x-compose-app.folders below, before any image is pulled or container starts.
  category: Downloader
  tags: ["files", "personal", "needs-public-ip"]
  developer: cparthiv
  store_app_id: annas-torrents-webui
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Anna's Torrents
  tagline:
    en_us: Seed Anna's Archive and watch your live contribution — behind SSO.
    fr_fr: Partagez Anna's Archive et suivez votre contribution en direct — derrière le SSO.
  description:
    en_us: |
      **A dashboard for seeding Anna's Archive — the largest open library in human history.**

      Anna's Archive stays alive because volunteers seed its torrents. This web UI
      wraps the `annas-torrents` selection logic in a friendly dashboard: pick how
      much you want to contribute, and the app downloads and seeds the actual
      content from an embedded libtorrent session — no separate torrent client to
      install and wire up.

      **What you can do:**
      - Set a target size (TB/GB) and start seeding with one click
      - Watch live **coverage** — how much of Anna's Archive your seeded torrents represent
      - Track **disk used**, **upload/download bandwidth**, and **swarm health** (seeders/leechers) in near real time
      - Review your impact on a read-only `/view` vantage page (SSO-gated like the
        rest of the app, so it is visible to accounts on this server, not to the public)
      - Donate to Anna's Archive directly from the UI

      **Protected by AppShield:** every route, including `/view`, is fronted by the
      built-in Authelia SSO, so only you can reach it — no login page to configure.
      Share links therefore do not open for anyone without an account on this server.

      **Note on safety:** this app downloads and seeds real content. Distributing
      certain materials may not be legal in all jurisdictions; seed at your own risk.
    fr_fr: |
      **Un tableau de bord pour partager Anna's Archive — la plus grande bibliothèque ouverte de l'histoire.**

      Anna's Archive survit grâce aux volontaires qui partagent ses torrents. Cette
      interface web enveloppe la logique de sélection d'`annas-torrents` dans un
      tableau de bord convivial : choisissez votre contribution, et l'application
      télécharge et partage le contenu réel via une session libtorrent embarquée —
      aucun client torrent séparé à installer.

      **Ce que vous pouvez faire :**
      - Définir une taille cible (To/Go) et démarrer le partage en un clic
      - Suivre la **couverture** en direct de la portion d'Anna's Archive que vous préservez
      - Suivre l'**espace disque**, la **bande passante** et la **santé du swarm** en temps quasi réel
      - Consulter votre impact sur une page `/view` en lecture seule (protégée par le
        SSO comme le reste de l'app : accessible aux comptes de ce serveur, pas au public)
      - Faire un don à Anna's Archive directement depuis l'interface

      **Protégé par AppShield :** toutes les routes, y compris `/view`, sont protégées
      par le SSO Authelia intégré — aucune page de connexion à configurer. Les liens de
      partage ne s'ouvrent donc pas pour qui n'a pas de compte sur ce serveur.
  tips:
    before_install:
      en_us: |
        **Access & login**
        - Open the app URL and sign in with your server account (single sign-on) —
          AppShield (Authelia) gates the dashboard, so you reuse the credentials you
          already have.

        **BitTorrent connectivity**
        - Peer traffic uses port **6881 (TCP + UDP)**, published directly to the
          host. Forward/open 6881 on your router so peers can reach you.
        - Needs a publicly reachable IP. Behind CGNAT, or on a PCS routed through
          the mesh tunnel, the app still runs but only makes outbound
          connections: far fewer peers, and nobody can download from you.

        **Getting started**
        1. Set a contribution target (in TB or GB) and click *Start contributing*.
        2. The app fetches the prioritized torrent list and begins downloading +
           seeding to its data volume.
        3. The dashboard updates coverage, disk, bandwidth, and swarm stats live.

        **Data** is stored under `/DATA/AppData/annas-torrents-webui/data`
        (.torrent files, seeded content, and libtorrent resume state — seeding
        resumes across restarts without re-checking).

        **⚠️ Safety:** this app downloads and seeds real content. Distributing
        certain materials may not be legal in all jurisdictions. Consider a VPN and
        seed at your own risk.

x-compose-app:
  schema_version: 2
  version: "1.0.2"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: annas-torrents-webui, name: annas-torrents-webui, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: annas-torrents-webui
  title:
    en_us: Anna's Torrents
  tagline:
    en_us: Seed Anna's Archive and watch your live contribution — behind SSO.
    fr_fr: Partagez Anna's Archive et suivez votre contribution en direct — derrière le SSO.
