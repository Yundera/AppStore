  developer: cparthiv
  category: Downloader
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
  # Raw TCP/UDP must be dialled from the internet: hidden on a box behind NAT or the tunnel.
  requires: [public-ip]
  # Sum of the service limits (~2.1G: the torrent backend and the gate) plus headroom.
  resources:
    recommended: { memory: 3G }
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Access & login**
      - Open the app URL and sign in with your server account (single sign-on) —
        AppShield (Authelia) gates the dashboard, so you reuse the credentials you
