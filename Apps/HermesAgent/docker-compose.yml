name: hermes

services:
  # One container. The image runs an s6 supervision tree: the gateway (agent
  # runtime, cron scheduler, messaging bridges) and the web dashboard are two
  # supervised services inside it, not two images.
  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    # NO `init: true`, and NO `user:`. Both break this image — see rationale.md.
    # File ownership is handled by PUID/PGID below, which the image reads and
    # applies by remapping its own user before dropping privileges.
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 3G
    # Playwright's browser tools crash on the default 64M of shared memory.
    shm_size: 1gb
    # The gateway does not finish its shutdown path inside the default 10s and
    # the next start then reports the previous life as having died uncleanly.
    stop_grace_period: 30s
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      # Turns on the supervised dashboard service. Without it the slot is
      # declared but parked, and the app has no web UI at all.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Used verbatim as the OAuth redirect_uri base, in preference to
      # reconstructing it from proxy headers. Pinning it to the canonical
      # hostname means a login started on the nip.io or sslip.io alias
      # finishes on this one; all three are registered with the identity
      # provider by the install hook below, so any entry point works.
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes-${APP_DOMAIN}
      # Fallback sign-in, second to the server account. The dashboard's auth
      # gate is mandatory on a non-loopback bind and fails closed with no
      # provider, so this is what keeps the app reachable if the OIDC
      # registration below cannot complete. No signing secret is set, so these
      # sessions are deliberately dropped on restart.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: $APP_DEFAULT_PASSWORD
    volumes:
      # Everything the agent owns lives here: config.yaml, .env (API keys),
      # sessions, memories, skills, cron jobs, logs, and the per-profile HOME
      # its tool subprocesses run in.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID:/opt/data
    expose:
      # The dashboard. 8642 (the OpenAI-compatible gateway API) is deliberately
      # left unexposed: it is a second credentialled entry point to the same
      # agent and nothing outside this app needs it.
      - 9119
    labels:
      caddy_0: hermes-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 9119}}"
      caddy_1: hermes-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 9119}}"
      caddy_2: hermes-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 9119}}"
    healthcheck:
      # /api/health is one of the few paths the dashboard's auth gate lets
      # through unauthenticated, precisely so a probe can use it.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9119/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - default
      - pcs

networks:
  default:
    name: hermes_default
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: hermes
  index: /
  store_app_id: hermes
  webui_port: 9119
  developer: Nous Research
  category: AI
  tags: ["ai", "developer", "automation"]
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  thumbnail: thumbnail.png
  # Runs once the container is up. It asks the server's identity provider for
  # an OIDC client of its own, writes the result into the agent's config, and
  # restarts it so the dashboard picks the provider up. Re-registering returns
  # the same credentials, so this is safe to repeat; `|| true` keeps a failed
  # registration from failing the install, because the basic-auth fallback
  # above still gets the user in.
  post-install-cmd: |
    docker exec hermes sh -c 'curl -fsS --retry 90 --retry-delay 2 --retry-connrefused -X POST http://auth-registrar:9092/register -H "content-type: application/json" -d "{\"callback_path\":\"/auth/callback\"}" -o /opt/data/.oidc.json' && docker exec hermes sh -c 'ISS=$(python3 -c "import json;print(json.load(open(\"/opt/data/.oidc.json\"))[\"issuer_url\"])"); CID=$(python3 -c "import json;print(json.load(open(\"/opt/data/.oidc.json\"))[\"client_id\"])"); SEC=$(python3 -c "import json;print(json.load(open(\"/opt/data/.oidc.json\"))[\"client_secret\"])"); hermes config set --force dashboard.oauth.self_hosted.issuer "$ISS"; hermes config set --force dashboard.oauth.self_hosted.client_id "$CID"; hermes config set --force dashboard.oauth.self_hosted.client_secret "$SEC"; rm -f /opt/data/.oidc.json' && docker restart hermes || true
  title:
    en_us: Hermes Agent
  tagline:
    en_us: An AI agent that runs on your server, learns your work, and keeps it
    fr_fr: Un agent IA qui tourne sur votre serveur, apprend votre travail et le retient
    es_es: Un agente de IA que se ejecuta en tu servidor, aprende tu trabajo y lo conserva
    zh_cn: 在你自己的服务器上运行的 AI 代理，学习你的工作方式并长期记住
    ko_kr: 내 서버에서 실행되며 작업 방식을 배우고 기억하는 AI 에이전트
  description:
    en_us: |
      Hermes Agent — an autonomous AI agent with a memory

      Hermes is a general-purpose AI agent that runs entirely on your own server. You give it work in plain language; it decides which tools to use, runs them, and reports back. What makes it different from a chat window is what happens afterwards: it writes down what it learned as a reusable skill, so the second time you ask for something similar it already knows how.

      What you get:

      • A full agent in your browser — the same terminal interface the project ships, rendered as a web page, with sessions, history and search
      • Persistent memory and a growing library of skills, kept across conversations
      • Bring your own model — Nous Portal, OpenRouter, Anthropic, OpenAI, a subscription you already pay for, or a model running on your own hardware
      • Scheduled work — give it a cron expression and it runs the job on its own
      • Reach it from Telegram, Discord, Slack, WhatsApp or Signal, not only the browser
      • MCP servers, web search and browser automation as tools it can pick up

      Sign-in uses your server account. A model provider is the one thing you add yourself, from the Keys page, the first time you open it.
    fr_fr: |
      Hermes Agent — un agent IA autonome doté d'une mémoire

      Hermes est un agent IA polyvalent qui s'exécute entièrement sur votre propre serveur. Vous lui confiez une tâche en langage courant ; il choisit les outils, les exécute et vous rend compte. Ce qui le distingue d'une fenêtre de discussion, c'est la suite : il consigne ce qu'il a appris sous forme de compétence réutilisable, si bien qu'à la demande suivante du même genre, il sait déjà faire.

      Ce que vous obtenez :

      • Un agent complet dans votre navigateur — l'interface console du projet, rendue en page web, avec sessions, historique et recherche
      • Une mémoire persistante et une bibliothèque de compétences qui s'étoffe, conservées d'une conversation à l'autre
      • Le modèle de votre choix — Nous Portal, OpenRouter, Anthropic, OpenAI, un abonnement que vous payez déjà, ou un modèle tournant sur votre propre matériel
      • Des tâches planifiées — donnez-lui une expression cron, il exécute le travail tout seul
      • Un accès depuis Telegram, Discord, Slack, WhatsApp ou Signal, et pas uniquement le navigateur
      • Des serveurs MCP, la recherche web et l'automatisation de navigateur comme outils à sa disposition

      La connexion se fait avec votre compte serveur. Le fournisseur de modèle est la seule chose à renseigner vous-même, depuis la page Keys, à la première ouverture.
    es_es: |
      Hermes Agent — un agente de IA autónomo con memoria

      Hermes es un agente de IA de uso general que se ejecuta íntegramente en tu propio servidor. Le encargas trabajo en lenguaje natural; él decide qué herramientas usar, las ejecuta y te informa. Lo que lo distingue de una ventana de chat es lo que ocurre después: anota lo aprendido como una habilidad reutilizable, de modo que la segunda vez que pidas algo parecido ya sabe cómo hacerlo.

      Lo que obtienes:

      • Un agente completo en el navegador — la misma interfaz de terminal del proyecto, presentada como página web, con sesiones, historial y búsqueda
      • Memoria persistente y una biblioteca de habilidades que crece, conservadas entre conversaciones
      • El modelo que prefieras — Nous Portal, OpenRouter, Anthropic, OpenAI, una suscripción que ya pagas, o un modelo que corre en tu propio hardware
      • Trabajo programado — dale una expresión cron y ejecuta la tarea por su cuenta
      • Acceso desde Telegram, Discord, Slack, WhatsApp o Signal, no solo desde el navegador
      • Servidores MCP, búsqueda web y automatización de navegador como herramientas a su alcance

      El inicio de sesión usa tu cuenta del servidor. El proveedor del modelo es lo único que añades tú, desde la página Keys, la primera vez que lo abres.
    zh_cn: |
      Hermes Agent — 具备记忆能力的自主 AI 代理

      Hermes 是一个通用 AI 代理，完全运行在你自己的服务器上。你用日常语言交待任务，它自行决定使用哪些工具、执行并回报结果。它与普通聊天窗口的区别在于之后发生的事：它会把学到的东西写成可复用的技能，下次再遇到类似请求时，它已经知道该怎么做。

      你将获得：

      • 浏览器中的完整代理 — 项目自带的终端界面，以网页形式呈现，含会话、历史与搜索
      • 持久记忆与不断扩充的技能库，跨对话保留
      • 自带模型 — Nous Portal、OpenRouter、Anthropic、OpenAI、你已订阅的服务，或运行在自有硬件上的模型
      • 定时任务 — 给出一条 cron 表达式，它便自行执行
      • 可从 Telegram、Discord、Slack、WhatsApp 或 Signal 使用，不限于浏览器
      • MCP 服务器、网页搜索与浏览器自动化，皆可作为它的工具

      登录使用你的服务器账户。首次打开时，唯一需要你自己填写的是模型服务商，在 Keys 页面完成。
    ko_kr: |
      Hermes Agent — 기억을 갖춘 자율 AI 에이전트

      Hermes는 전적으로 내 서버에서 실행되는 범용 AI 에이전트입니다. 평범한 말로 일을 맡기면 어떤 도구를 쓸지 스스로 정해 실행하고 결과를 알려줍니다. 채팅창과 다른 점은 그 다음입니다. 배운 것을 재사용 가능한 스킬로 적어 두기 때문에, 비슷한 요청을 두 번째로 하면 이미 방법을 알고 있습니다.

      제공되는 것:

      • 브라우저 안의 완전한 에이전트 — 프로젝트의 터미널 인터페이스를 웹 페이지로 그대로 옮긴 화면, 세션·기록·검색 포함
      • 대화를 넘어 유지되는 지속 메모리와 점점 늘어나는 스킬 라이브러리
      • 원하는 모델 사용 — Nous Portal, OpenRouter, Anthropic, OpenAI, 이미 구독 중인 서비스, 또는 직접 보유한 하드웨어에서 돌리는 모델
      • 예약 실행 — cron 표현식을 주면 알아서 작업을 수행
      • 브라우저뿐 아니라 Telegram, Discord, Slack, WhatsApp, Signal에서도 이용
      • MCP 서버, 웹 검색, 브라우저 자동화를 도구로 활용

      로그인은 서버 계정으로 합니다. 처음 열었을 때 직접 넣어야 하는 것은 모델 제공자 하나뿐이며, Keys 페이지에서 설정합니다.
  tips:
    before_install:
      en_us: |
        **Signing in**

        Click the app and sign in with your server account — the same one you use for this dashboard. A second method, `admin` / `$APP_DEFAULT_PASSWORD`, is on the sign-in page as a fallback.

        **Add a model before your first message**

        Hermes brings no model of its own. Open **KEYS** in the sidebar and either sign in to a provider (Nous Portal, a ChatGPT/Codex subscription, MiniMax, xAI) or paste an API key (Anthropic, OpenAI, OpenRouter, …). A message sent before a model is configured sits and spins with no error.

        **What it can reach**

        The agent runs shell commands and reads and writes files as part of doing its job. It is confined to its own folder, `/DATA/AppData/hermes` — your documents and media are not mounted into it.

        **Disk**

        It downloads its own tool dependencies on first run and keeps sessions, skills and caches. Expect around 500 MB before you have done anything, and give it a couple of GB to work with.

        **Documentation:** [https://hermes-agent.nousresearch.com/](https://hermes-agent.nousresearch.com/)
      fr_fr: |
        **Connexion**

        Cliquez sur l'application et connectez-vous avec votre compte serveur — le même que pour ce tableau de bord. Une seconde méthode, `admin` / `$APP_DEFAULT_PASSWORD`, figure sur la page de connexion en secours.

        **Ajoutez un modèle avant votre premier message**

        Hermes n'embarque pas de modèle. Ouvrez **KEYS** dans la barre latérale et connectez-vous à un fournisseur (Nous Portal, un abonnement ChatGPT/Codex, MiniMax, xAI) ou collez une clé API (Anthropic, OpenAI, OpenRouter, …). Un message envoyé avant qu'un modèle soit configuré tourne indéfiniment sans message d'erreur.

        **Ce à quoi il a accès**

        L'agent exécute des commandes shell et lit et écrit des fichiers, c'est son mode de fonctionnement. Il est confiné à son propre dossier, `/DATA/AppData/hermes` — vos documents et vos médias n'y sont pas montés.

        **Disque**

        Il télécharge ses propres dépendances au premier démarrage et conserve sessions, compétences et caches. Comptez environ 500 Mo avant toute utilisation, et prévoyez quelques Go.

        **Documentation :** [https://hermes-agent.nousresearch.com/](https://hermes-agent.nousresearch.com/)
      es_es: |
        **Iniciar sesión**

        Abre la aplicación e inicia sesión con tu cuenta del servidor, la misma de este panel. Como alternativa, en la página de acceso está `admin` / `$APP_DEFAULT_PASSWORD`.

        **Añade un modelo antes del primer mensaje**

        Hermes no incluye ningún modelo. Abre **KEYS** en la barra lateral e inicia sesión en un proveedor (Nous Portal, una suscripción de ChatGPT/Codex, MiniMax, xAI) o pega una clave de API (Anthropic, OpenAI, OpenRouter, …). Un mensaje enviado antes de configurar un modelo se queda girando sin dar error.

        **A qué tiene acceso**

        El agente ejecuta comandos de shell y lee y escribe archivos; así es como trabaja. Está confinado a su propia carpeta, `/DATA/AppData/hermes`: tus documentos y tu contenido multimedia no están montados dentro.

        **Disco**

        Descarga sus propias dependencias en el primer arranque y guarda sesiones, habilidades y cachés. Cuenta con unos 500 MB antes de hacer nada, y resérvale un par de GB.

        **Documentación:** [https://hermes-agent.nousresearch.com/](https://hermes-agent.nousresearch.com/)
      zh_cn: |
        **登录**

        点击应用，用你的服务器账户登录 —— 与登录本面板的账户相同。登录页上还有一种备用方式：`admin` / `$APP_DEFAULT_PASSWORD`。

        **发第一条消息前先添加模型**

        Hermes 本身不含模型。打开侧边栏的 **KEYS**，登录某个服务商（Nous Portal、ChatGPT/Codex 订阅、MiniMax、xAI），或粘贴 API 密钥（Anthropic、OpenAI、OpenRouter 等）。若在配置模型前发送消息，界面会一直转圈且不报错。

        **它能访问什么**

        该代理会执行 shell 命令、读写文件，这正是它的工作方式。它被限制在自己的目录 `/DATA/AppData/hermes` 内 —— 你的文档与媒体并未挂载给它。

        **磁盘**

        首次运行时它会下载自身的工具依赖，并保存会话、技能与缓存。尚未使用就约占 500 MB，建议预留数 GB。

        **文档：** [https://hermes-agent.nousresearch.com/](https://hermes-agent.nousresearch.com/)
      ko_kr: |
        **로그인**

        앱을 열고 서버 계정으로 로그인하세요. 이 대시보드에 쓰는 계정과 같습니다. 로그인 화면에는 대체 수단으로 `admin` / `$APP_DEFAULT_PASSWORD` 도 있습니다.

        **첫 메시지 전에 모델을 추가하세요**

        Hermes에는 모델이 들어 있지 않습니다. 사이드바의 **KEYS**를 열어 제공자(Nous Portal, ChatGPT/Codex 구독, MiniMax, xAI)에 로그인하거나 API 키(Anthropic, OpenAI, OpenRouter 등)를 붙여 넣으세요. 모델을 설정하기 전에 메시지를 보내면 오류 없이 계속 돌기만 합니다.

        **접근 범위**

        이 에이전트는 셸 명령을 실행하고 파일을 읽고 씁니다. 그것이 작동 방식입니다. 자신의 폴더 `/DATA/AppData/hermes` 안에 갇혀 있으며, 문서와 미디어는 마운트되지 않습니다.

        **디스크**

        첫 실행 때 필요한 도구 의존성을 내려받고 세션·스킬·캐시를 보관합니다. 아무것도 하지 않은 상태에서 약 500 MB를 쓰므로 수 GB를 여유로 두세요.

        **문서:** [https://hermes-agent.nousresearch.com/](https://hermes-agent.nousresearch.com/)

x-compose-app:
  schema_version: 2
  folders:
    - path: /DATA/AppData/$AppID
      user: $PUID
      group: $PGID
  webui-host: hermes-${domain}
