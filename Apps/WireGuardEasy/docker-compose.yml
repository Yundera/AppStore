name: wgeasy

services:
  wgeasy:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wgeasy
    restart: unless-stopped
    user: "0:0"
    labels:
      caddy_0: wgeasy-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: wgeasy-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: wgeasy-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      - pcs
    environment:
      PORT: '80'
      INSECURE: 'true'
      DISABLE_IPV6: 'true'
      INIT_ENABLED: 'true'
      INIT_USERNAME: admin
      INIT_PASSWORD: $APP_DEFAULT_PASSWORD
      INIT_HOST: $APP_PUBLIC_IP
      INIT_PORT: '51820'
      INIT_DNS: '9.9.9.9'
    expose:
      - 80
    ports:
      - target: 51820
        published: 51820
        protocol: udp
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    cpu_shares: 50
    mem_limit: 256m

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: wgeasy
  store_app_id: wgeasy
  webui_port: 80
  index: /
  # New clients inherit the server-wide default PersistentKeepalive from wg-easy's
  # userConfig row (factory-seeded to 0 = off). With 0, a client behind NAT (a home PC)
  # cannot be reached by other clients until it has sent traffic itself. v15 dropped the
  # keepalive env/INIT var, so the only way to seed a default is to write it after the
  # container has built its SQLite DB: poll until the user_configs_table row exists, then
  # set 25s (standard NAT-traversal value) — only while still at the factory default, so
  # a later change in the UI is never clobbered. Uses the image's own bundled @libsql
  # driver (no sqlite3 CLI present). Same step as WireGuardEasyHost.
  post-install-cmd: |
    for i in $(seq 1 60); do
      docker exec -w /app/server wgeasy node --input-type=module -e 'import {createClient} from "@libsql/client"; const c=createClient({url:"file:/etc/wireguard/wg-easy.db"}); const r=await c.execute("SELECT count(*) AS n FROM user_configs_table"); if(Number(r.rows[0].n)<1) process.exit(3); await c.execute("UPDATE user_configs_table SET default_persistent_keepalive=25 WHERE default_persistent_keepalive=0"); console.log("wgeasy: default PersistentKeepalive set to 25s");' && break
      sleep 2
    done
    exit 0
  developer: WeejeWel
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  category: Network
  # needs-public-ip: a WireGuard server is useless unless inbound UDP 51820 from the
  # internet reaches the host (a CGNAT/tunnelled PCS never accepts a peer).
  tags: ["privacy", "personal", "needs-public-ip"]
  title:
    en_us: WireGuard Easy
  tagline:
    en_us: Simple web UI to manage WireGuard VPN (v15)
    ko_kr: WireGuard VPN을 관리하는 간단한 웹 UI (v15)
    zh_cn: 管理 WireGuard VPN 的简单 Web UI (v15)
    fr_fr: Interface web simple pour gerer WireGuard VPN (v15)
    es_es: Interfaz web simple para gestionar WireGuard VPN (v15)
  description:
    en_us: |
      **The easiest way to install and manage WireGuard on any Linux host**

      WireGuard Easy provides a simple web interface to create and manage WireGuard VPN connections. Add clients with one click, download configurations, and monitor connected devices.

      **What you can do:**
      - Create and manage VPN clients with one click
      - Download client configs or scan QR codes
      - Monitor connected clients and bandwidth
      - Enable/disable clients instantly

      **Perfect for:** Anyone who wants a personal VPN server without complex command-line setup.
    ko_kr: |
      **Linux 호스트에서 WireGuard를 설치하고 관리하는 가장 쉬운 방법**

      WireGuard Easy는 WireGuard VPN 연결을 생성하고 관리하는 간단한 웹 인터페이스를 제공합니다. 한 번의 클릭으로 클라이언트를 추가하고, 설정을 다운로드하고, 연결된 장치를 모니터링할 수 있습니다.

      **할 수 있는 것:**
      - 한 번의 클릭으로 VPN 클라이언트 생성 및 관리
      - 클라이언트 설정 다운로드 또는 QR 코드 스캔
      - 연결된 클라이언트 및 대역폭 모니터링
      - 클라이언트 즉시 활성화/비활성화

      **이런 분께 완벽해요:** 복잡한 명령줄 설정 없이 개인 VPN 서버를 원하는 모든 분.
    zh_cn: |
      **在任何 Linux 主机上安装和管理 WireGuard 的最简单方法**

      WireGuard Easy 提供简单的 Web 界面来创建和管理 WireGuard VPN 连接。一键添加客户端、下载配置并监控已连接的设备。

      **您可以做的事:**
      - 一键创建和管理 VPN 客户端
      - 下载客户端配置或扫描二维码
      - 监控已连接的客户端和带宽
      - 即时启用/禁用客户端

      **完美适合:** 任何想要个人 VPN 服务器而无需复杂命令行设置的人。
    fr_fr: |
      **Le moyen le plus simple d'installer et de gerer WireGuard sur n'importe quel hote Linux**

      WireGuard Easy fournit une interface web simple pour creer et gerer les connexions VPN WireGuard. Ajoutez des clients en un clic, telechargez les configurations et surveillez les appareils connectes.

      **Ce que vous pouvez faire:**
      - Creer et gerer des clients VPN en un clic
      - Telecharger les configs ou scanner les QR codes
      - Surveiller les clients connectes et la bande passante
      - Activer/desactiver les clients instantanement

      **Parfait pour:** Tous ceux qui veulent un serveur VPN personnel sans configuration complexe en ligne de commande.
    es_es: |
      **La forma mas facil de instalar y gestionar WireGuard en cualquier host Linux**

      WireGuard Easy proporciona una interfaz web simple para crear y gestionar conexiones VPN WireGuard. Agregue clientes con un clic, descargue configuraciones y monitoree dispositivos conectados.

      **Lo que puedes hacer:**
      - Crear y gestionar clientes VPN con un clic
      - Descargar configs de clientes o escanear codigos QR
      - Monitorear clientes conectados y ancho de banda
      - Activar/desactivar clientes al instante

      **Perfecto para:** Cualquiera que quiera un servidor VPN personal sin configuracion compleja por linea de comandos.
  tips:
    before_install:
      en_us: |
        # Default Account

        | Username | Password                |
        | -------- | ----------------------- |
        | `admin`  | `$APP_DEFAULT_PASSWORD` |

        This is **WireGuard Easy v15**. The admin account is auto-configured. VPN settings can be changed from the web UI after login.

        The VPN listens on UDP port 51820. Make sure this port is open on your firewall/router.

        **Reaching a Windows client from other clients:** connected clients can reach each other at their VPN addresses (`10.8.0.x`). A Windows client answers only once its tunnel is a *Private* network — Windows files a new tunnel as *Public* and blocks unsolicited inbound connections (ping, file sharing, Remote Desktop). Once per tunnel, in an **administrator** PowerShell:

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<tunnel name>" -NetworkCategory Private
        ```

        This lets every client on the VPN reach that PC's shares and Remote Desktop. Keep the tunnel's name when you re-import a config, or Windows treats it as a new, Public network again.
      ko_kr: |
        # 기본 계정

        | 사용자명 | 비밀번호                |
        | -------- | ----------------------- |
        | `admin`  | `$APP_DEFAULT_PASSWORD` |

        **WireGuard Easy v15** 버전입니다. 관리자 계정이 자동 설정됩니다. VPN 설정은 로그인 후 웹 UI에서 변경할 수 있습니다.

        VPN은 UDP 포트 51820에서 수신합니다. 방화벽/라우터에서 이 포트가 열려있는지 확인하세요.

        **다른 클라이언트에서 Windows 클라이언트에 접속하기:** 연결된 클라이언트는 VPN 주소(`10.8.0.x`)로 서로 접속할 수 있습니다. 단, Windows 클라이언트는 터널이 *개인(Private)* 네트워크일 때만 응답합니다. Windows는 새 터널을 *공용(Public)*으로 분류하여 요청하지 않은 수신 연결(ping, 파일 공유, 원격 데스크톱)을 차단합니다. 터널마다 한 번, **관리자** PowerShell에서 실행하세요:

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<터널 이름>" -NetworkCategory Private
        ```

        이렇게 하면 VPN의 모든 클라이언트가 해당 PC의 공유 폴더와 원격 데스크톱에 접속할 수 있습니다. 설정을 다시 가져올 때 터널 이름을 유지하세요. 이름이 바뀌면 Windows가 새로운 공용 네트워크로 취급합니다.
      zh_cn: |
        # 默认账户

        | 用户名   | 密码                    |
        | -------- | ----------------------- |
        | `admin`  | `$APP_DEFAULT_PASSWORD` |

        这是 **WireGuard Easy v15** 版本。管理员账户已自动配置。登录后可在 Web UI 中更改 VPN 设置。

        VPN 监听 UDP 端口 51820。请确保防火墙/路由器上此端口已开放。

        **从其他客户端访问 Windows 客户端：** 已连接的客户端可以通过 VPN 地址（`10.8.0.x`）互相访问。但 Windows 客户端只有在隧道被设为*专用（Private）*网络时才会响应——Windows 会把新隧道归类为*公用（Public）*，并阻止所有未经请求的入站连接（ping、文件共享、远程桌面）。每个隧道只需执行一次，在**管理员** PowerShell 中运行：

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<隧道名称>" -NetworkCategory Private
        ```

        之后 VPN 上的所有客户端都能访问该电脑的共享和远程桌面。重新导入配置时请保持隧道名称不变，否则 Windows 会将其视为新的公用网络。
      fr_fr: |
        # Compte par defaut

        | Nom d'utilisateur | Mot de passe            |
        | ----------------- | ----------------------- |
        | `admin`           | `$APP_DEFAULT_PASSWORD` |

        Ceci est **WireGuard Easy v15**. Le compte administrateur est configure automatiquement. Les parametres VPN peuvent etre modifies depuis l'interface web apres connexion.

        Le VPN ecoute sur le port UDP 51820. Assurez-vous que ce port est ouvert sur votre pare-feu/routeur.

        **Joindre un client Windows depuis les autres clients :** les clients connectes peuvent se joindre entre eux via leur adresse VPN (`10.8.0.x`). Un client Windows ne repond toutefois qu'une fois son tunnel classe en reseau *Prive* — Windows classe un nouveau tunnel en *Public* et bloque les connexions entrantes non sollicitees (ping, partage de fichiers, Bureau a distance). Une fois par tunnel, dans un PowerShell **administrateur** :

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<nom du tunnel>" -NetworkCategory Private
        ```

        Tous les clients du VPN peuvent alors atteindre les partages et le Bureau a distance de ce PC. Gardez le meme nom de tunnel en reimportant une configuration, sinon Windows le traite comme un nouveau reseau Public.
      es_es: |
        # Cuenta predeterminada

        | Usuario  | Contrasena              |
        | -------- | ----------------------- |
        | `admin`  | `$APP_DEFAULT_PASSWORD` |

        Esta es la version **WireGuard Easy v15**. La cuenta de administrador se configura automaticamente. La configuracion VPN se puede cambiar desde la interfaz web despues de iniciar sesion.

        La VPN escucha en el puerto UDP 51820. Asegurese de que este puerto este abierto en su firewall/router.

        **Acceder a un cliente Windows desde otros clientes:** los clientes conectados pueden comunicarse entre si mediante su direccion VPN (`10.8.0.x`). Sin embargo, un cliente Windows solo responde cuando su tunel es una red *Privada*: Windows clasifica un tunel nuevo como *Publica* y bloquea las conexiones entrantes no solicitadas (ping, uso compartido de archivos, Escritorio remoto). Una vez por tunel, en un PowerShell de **administrador**:

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<nombre del tunel>" -NetworkCategory Private
        ```

        Asi, todos los clientes de la VPN pueden acceder a las carpetas compartidas y al Escritorio remoto de ese PC. Mantenga el mismo nombre de tunel al reimportar una configuracion; de lo contrario, Windows lo trata como una nueva red Publica.

x-compose-app:
  webui-host: wgeasy-${domain}
