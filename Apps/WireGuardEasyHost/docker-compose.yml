name: wgeasyhost

services:
  # WireGuard server, running in the HOST network namespace.
  # Because wg0 lives on the host, the VPN server address (10.9.0.1) IS the host,
  # so VPN clients can reach host-bound services (Samba :445, Guacamole, ...) at 10.9.0.1.
  # A host-networked container cannot be a Caddy upstream, so the web UI is exposed
  # through the wgeasyhost-proxy sidecar below instead of Caddy labels here.
  wgeasyhost:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wgeasyhost
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    environment:
      PORT: '51821'            # web UI port on the host (proxied by the sidecar)
      INSECURE: 'true'         # plain HTTP; TLS is terminated by the gateway
      DISABLE_IPV6: 'true'
      INIT_ENABLED: 'true'
      INIT_USERNAME: admin
      INIT_PASSWORD: $APP_DEFAULT_PASSWORD
      INIT_HOST: $APP_PUBLIC_IP   # endpoint written into client configs
      INIT_PORT: '51820'          # WireGuard UDP port on the host
      INIT_DNS: '9.9.9.9'
      # VPN subnet. Uses 10.9.0.0/24 to avoid colliding with the bridge-mode WireGuardEasy
      # app (10.8.0.0/24). NOTE: wg-easy only applies IPV4_CIDR when BOTH v4+v6 are set,
      # so INIT_IPV6_CIDR is required even though IPv6 is disabled.
      INIT_IPV4_CIDR: '10.9.0.0/24'
      INIT_IPV6_CIDR: 'fdcc:ad94:bacf:61a4::cafe:0/112'
      # Split-tunnel default for new clients (NOT a 0.0.0.0/0 catch-all / kill switch):
      # only the VPN subnet is routed, so clients reach host services at 10.9.0.1 while
      # their normal internet stays direct. Comma-separated; seeds on first init only.
      INIT_ALLOWED_IPS: '10.9.0.0/24'
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/wgeasyhost/wireguard/:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # NOTE: host network mode forbids setting net.ipv4.* sysctls on the container
    # (they would mutate the host). They are set on the HOST by pre-install-cmd below.
    cpu_shares: 50
    mem_limit: 256m

  # Bridged reverse-proxy on the pcs network. Carries the gateway labels and forwards
  # to the host-mode web UI via the docker host-gateway (host.docker.internal:51821).
  # nginx.conf ships in seed/ (create-if-absent on every up) and is bind-mounted read-only.
  wgeasyhost-proxy:
    image: nginx:1.29.3-alpine
    container_name: wgeasyhost-proxy
    restart: unless-stopped
    # Must be root: the CasaOS installer injects `user: $PUID:$PGID` into any service
    # without an explicit user, and nginx:alpine's master can't run as non-root
    # (fails to create /var/cache/nginx). Declaring it here prevents that injection.
    user: "0:0"
    depends_on:
      - wgeasyhost
    labels:
      caddy_0: wgeasyhost-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: wgeasyhost-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: wgeasyhost-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      - pcs
    expose:
      - 80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/nginx.conf:/etc/nginx/nginx.conf:ro
    cpu_shares: 80
    mem_limit: 64m

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  # ghcr.io/wg-easy/wg-easy:15.3.0 publishes only linux/amd64 and linux/arm64
  # (no 32-bit armv7); nginx:1.29.3-alpine is broader, so this is the intersection.
  architectures:
    - amd64
    - arm64
  # Backend+proxy pattern (cf. lystik): main = the backend service name = subdomain prefix;
  # the -proxy sidecar carries the caddy labels advertising <main>-user.nsl.sh and forwards
  # to the host-mode wg-easy. The store installer injects `hostname` (user-specific) at install;
  # scheme/port_map are static. Health probe follows redirects: / -> /login -> 200. (webui_port
  # is deprecated.)
  main: wgeasyhost
  store_app_id: wgeasyhost
  index: /
  # Host kernel parameters, the only reason this app still carries a hook. A hook runs
  # inside the Maison container, where /proc/sys is read-only — a bare `sysctl -w` there
  # exits 1, and pre_install is fatal, so it would leave the app installed but stopped.
  # The supported way to reach the host is through the Docker socket the hook already
  # holds: --privileged for a writable /proc/sys, --network=host because net.* keys are
  # per-namespace. Idempotent, and best-effort: clients reach host services at 10.9.0.1
  # without forwarding (only peer-to-peer and full-tunnel routing need it), so a PCS
  # that refuses the sysctls should still get the app — the hook always exits 0.
  # The sysctl alone does not make forwarding work on a PCS — see post-install-cmd.
  # nginx.conf is no longer fetched here; it ships in seed/ (see x-compose-app).
  pre-install-cmd: |
    docker run --rm --privileged --network=host alpine:3.20 sh -c '
      sysctl -w net.ipv4.ip_forward=1
      sysctl -w net.ipv4.conf.all.src_valid_mark=1
    ' || echo "[pre-install] host sysctl setup skipped; peer-to-peer and full-tunnel routing may need net.ipv4.ip_forward=1"
    exit 0
  # Runs AFTER container startup, against wg-easy's SQLite DB (polls until it is built),
  # using the image's own bundled @libsql driver (no sqlite3 CLI present). Three writes:
  #
  # 1. Default PersistentKeepalive -> 25s. New clients inherit it from the userConfig row
  #    (factory 0 = off); v15 dropped the env/INIT var. Only while still at 0, so a manual
  #    change in the UI is never clobbered.
  #
  # 2. Forwarding through Docker's firewall. wg-easy's own PostUp FORWARD accepts go
  #    through the image's `iptables`, which is iptables-LEGACY. Docker on the host writes
  #    nft, and its nft FORWARD chain has policy DROP. A forwarded packet has to pass both
  #    hooks, so the nft drop wins and wg-easy's accepts do nothing: peer-to-peer (wg0->wg0)
  #    and full-tunnel (wg0->uplink) traffic is silently dropped on any Docker host.
  #    Fix: append rules to PostUp/PostDown that go into DOCKER-USER (Docker never flushes
  #    that chain) via iptables-nft, which the image also ships. They live in the hooks, so
  #    they are re-applied by every `wg-quick up` (reboots included) and removed on down.
  #    Scoped to wg0->wg0 and wg0<->uplink only, NOT a blanket `-i wg0`: that would let
  #    a peer route into Docker's container networks and bypass the gateway. Each command
  #    ends in `|| true` because wg-quick aborts `up` on a failing hook — a host without
  #    DOCKER-USER (e.g. Docker's native nftables backend) keeps a working VPN instead.
  #    Appended once (guarded by the DOCKER-USER marker), keeping any user-edited hooks.
  #
  # 3. Uplink device. The hooks' {{device}} (MASQUERADE for full-tunnel, and rule 2) is
  #    hard-coded to `eth0` by wg-easy's first migration, with no env var to change it.
  #    Set it to the interface of the host's default route, only while still `eth0`.
  #
  # If 2 or 3 changed anything, the script leaves a marker in the container and the hook
  # restarts it, so wg-quick re-reads the hooks. (A marker rather than a captured $var:
  # Compose interpolates x- fields too, and warns on every shell variable in a hook.)
  post-install-cmd: |
    for i in $(seq 1 60); do
      docker exec -w /app/server wgeasyhost node --input-type=module -e '
        import {createClient} from "@libsql/client";
        import {execSync} from "node:child_process";
        const c = createClient({url: "file:/etc/wireguard/wg-easy.db"});
        const n = await c.execute("SELECT count(*) AS n FROM user_configs_table");
        if (Number(n.rows[0].n) < 1) process.exit(3);
        await c.execute("UPDATE user_configs_table SET default_persistent_keepalive=25 WHERE default_persistent_keepalive=0");
        let changed = false;
        // host netns, so this is the host default route
        let up = "";
        try { up = (execSync("ip -4 route show default").toString().match(/ dev (\S+)/) || [])[1] || ""; } catch {}
        if (up && up !== "eth0") {
          const r = await c.execute({sql: "UPDATE interfaces_table SET device=? WHERE name=? AND device=?", args: [up, "wg0", "eth0"]});
          if (r.rowsAffected) { changed = true; console.log("wgeasyhost: uplink device set to " + up); }
        }
        const rules = [
          "DOCKER-USER -i wg0 -o wg0 -j ACCEPT",
          "DOCKER-USER -i wg0 -o {{device}} -j ACCEPT",
          "DOCKER-USER -i {{device}} -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT",
        ];
        const addUp = rules.map(r => " iptables-nft -C " + r + " 2>/dev/null || iptables-nft -I " + r + " || true;").join("");
        const addDown = rules.map(r => " iptables-nft -D " + r + " 2>/dev/null || true;").join("");
        const h = (await c.execute({sql: "SELECT post_up FROM hooks_table WHERE id=?", args: ["wg0"]})).rows[0];
        if (h && !String(h.post_up).includes("DOCKER-USER")) {
          await c.execute({sql: "UPDATE hooks_table SET post_up=post_up||?, post_down=post_down||? WHERE id=?", args: [addUp, addDown, "wg0"]});
          changed = true; console.log("wgeasyhost: DOCKER-USER forward rules added to PostUp/PostDown");
        }
        if (changed) (await import("node:fs")).writeFileSync("/tmp/wgeasyhost-restart", "");
        else console.log("wgeasyhost: hooks already up to date");
      ' && break
      sleep 2
    done
    docker exec wgeasyhost rm /tmp/wgeasyhost-restart 2>/dev/null && docker restart wgeasyhost
    exit 0
  developer: WeejeWel
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  category: Network
  # needs-public-ip: a WireGuard server is useless unless inbound UDP 51820 from the
  # internet reaches the host (a CGNAT/tunnelled PCS never accepts a peer).
  tags: ["privacy", "personal", "needs-public-ip"]
  title:
    en_us: WireGuard Easy - Host
  tagline:
    en_us: WireGuard VPN with host networking - reach Samba, Guacamole & other host services (v15)
    fr_fr: WireGuard VPN en mode hote - accedez a Samba, Guacamole et autres services de l'hote (v15)
  description:
    en_us: |
      **WireGuard VPN that can reach the rest of your PCS** - built on WireGuard Easy v15, but running in **host networking** mode.

      Unlike the standard WireGuard Easy app (which is isolated on a Docker bridge), this version puts the VPN interface directly on the host. That means the VPN server address `10.9.0.1` **is your PCS**, so connected clients can reach host-bound services - Samba file shares, Guacamole, and anything else listening on the host - at `10.9.0.1:<port>`. This is the closest WireGuard equivalent to a Tailscale-style "reach my whole server" setup.

      **What you can do:**
      - Reach host services (Samba :445, Guacamole, ...) over the VPN at `10.9.0.1`
      - Create and manage VPN clients with one click
      - Download client configs or scan QR codes
      - Monitor connected clients and bandwidth

      **Requires:** inbound **UDP 51820** reachable on your PCS public IP.
    fr_fr: |
      **WireGuard VPN capable d'atteindre le reste de votre PCS** - base sur WireGuard Easy v15, mais en mode **reseau hote**.

      Contrairement a l'app WireGuard Easy standard (isolee sur un bridge Docker), cette version place l'interface VPN directement sur l'hote. L'adresse du serveur VPN `10.9.0.1` **est votre PCS**, donc les clients connectes peuvent atteindre les services de l'hote - partages Samba, Guacamole, etc. - a `10.9.0.1:<port>`. C'est l'equivalent WireGuard le plus proche d'une configuration Tailscale.

      **Necessite :** le port **UDP 51820** entrant accessible sur l'IP publique de votre PCS.
  tips:
    before_install:
      en_us: |
        # Default Account

        | Username | Password                |
        | -------- | ----------------------- |
        | `admin`  | `$APP_DEFAULT_PASSWORD` |

        This is **WireGuard Easy v15 in host-networking mode**. The admin account is auto-configured; VPN settings can be changed from the web UI after login.

        **Reaching your PCS over the VPN — use `10.9.0.1`:** once a client is connected, the whole server is reachable at the VPN address **`10.9.0.1`** (that address *is* your PCS). Point any tool at that IP:

        - **File shares (Samba), port 445:**
          - Windows: open Explorer and type `\\10.9.0.1`
          - macOS: Finder -> *Go* -> *Connect to Server* -> `smb://10.9.0.1`
          - Linux: in your file manager, `smb://10.9.0.1`
        - **Other host apps (e.g. Guacamole):** `http://10.9.0.1:<port>`
        - **Ping test:** `ping 10.9.0.1` should reply once connected.

        Notes: the default split-tunnel only routes `10.9.0.0/24`, so your normal internet stays direct (no kill-switch). The target service must listen on all interfaces (`0.0.0.0`), not just one — apps installed from this store already do.

        **Reaching a Windows client from other peers:** clients can also reach each other (e.g. `10.9.0.3` → `10.9.0.4`). A Windows client answers, though, only once its tunnel is a *Private* network. Windows files a new tunnel as *Public*, which blocks every unsolicited inbound connection — ping, file sharing, Remote Desktop — while its own outgoing traffic still works. Once per tunnel, in an **administrator** PowerShell (the tunnel name is the one shown in the WireGuard app):

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<tunnel name>" -NetworkCategory Private
        ```

        This lets every peer on the VPN reach that PC's shares and Remote Desktop, the same as on a home network. The setting is tied to the tunnel's **name**: keep the name when you re-import a config, or Windows treats it as a new, Public network again.

        **Firewall:** the VPN listens on **UDP 51820** - it must be open on your firewall/router. The management UI also binds host port `51821` over plain HTTP; access it via the HTTPS gateway link, and firewall `51821` if you don't want it exposed directly.
      fr_fr: |
        # Compte par defaut

        | Nom d'utilisateur | Mot de passe            |
        | ----------------- | ----------------------- |
        | `admin`           | `$APP_DEFAULT_PASSWORD` |

        Ceci est **WireGuard Easy v15 en mode reseau hote**. Le compte admin est configure automatiquement ; les parametres VPN sont modifiables depuis l'interface web apres connexion.

        **Acceder a votre PCS via le VPN — utilisez `10.9.0.1` :** une fois un client connecte, tout le serveur est accessible a l'adresse VPN **`10.9.0.1`** (cette adresse *est* votre PCS). Pointez n'importe quel outil vers cette IP :

        - **Partages de fichiers (Samba), port 445 :**
          - Windows : ouvrez l'Explorateur et tapez `\\10.9.0.1`
          - macOS : Finder -> *Aller* -> *Se connecter au serveur* -> `smb://10.9.0.1`
          - Linux : dans votre gestionnaire de fichiers, `smb://10.9.0.1`
        - **Autres applis de l'hote (ex. Guacamole) :** `http://10.9.0.1:<port>`
        - **Test ping :** `ping 10.9.0.1` doit repondre une fois connecte.

        Notes : le split-tunnel par defaut ne route que `10.9.0.0/24`, votre trafic internet normal reste direct (pas de kill-switch). Le service cible doit ecouter sur toutes les interfaces (`0.0.0.0`).

        **Joindre un client Windows depuis les autres pairs :** les clients peuvent aussi se joindre entre eux (ex. `10.9.0.3` → `10.9.0.4`). Un client Windows ne repond toutefois qu'une fois son tunnel classe en reseau *Prive*. Windows classe un nouveau tunnel en *Public*, ce qui bloque toute connexion entrante non sollicitee — ping, partage de fichiers, Bureau a distance — alors que son trafic sortant fonctionne. Une fois par tunnel, dans un PowerShell **administrateur** (le nom du tunnel est celui affiche dans l'application WireGuard) :

        ```powershell
        Set-NetConnectionProfile -InterfaceAlias "<nom du tunnel>" -NetworkCategory Private
        ```

        Tous les pairs du VPN peuvent alors atteindre les partages et le Bureau a distance de ce PC, comme sur un reseau domestique. Ce reglage est lie au **nom** du tunnel : gardez le meme nom en reimportant une configuration, sinon Windows le traite comme un nouveau reseau Public.

        **Pare-feu :** le VPN ecoute sur **UDP 51820** - ce port doit etre ouvert. L'interface de gestion ecoute aussi sur le port hote `51821` en HTTP ; utilisez le lien HTTPS de la passerelle.

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    # The app folder itself: seed/nginx.conf lands here and the proxy bind-mounts it.
    # Not emitted by gen-folders.py (that mount is a file, not a trailing-slash dir).
    - path: /DATA/AppData/wgeasyhost
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/wgeasyhost/wireguard
      user: $PUID
      group: $PGID
  webui-host: wgeasyhost-${domain}
