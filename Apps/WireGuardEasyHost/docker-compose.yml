  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    # The app folder itself: seed/nginx.conf lands here and the proxy bind-mounts it.
    # Not emitted by gen-folders.py (that mount is a file, not a trailing-slash dir).
    - path: /DATA/AppData/wgeasyhost
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/wgeasyhost/wireguard
      user: $PUID
      group: $PGID
  secrets:
    # Seeded: an installed app provisioned its admin at first boot with the former
    # shared password, which it keeps; a fresh install gets its own.
    WGEASYHOST_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${WGEASYHOST_ADMIN_PASSWORD}
      # wg-easy keeps its own argon2 hash in users_table; INIT_PASSWORD is read only by
      # the first-boot setup, so .env alone would change nothing. Hash and write it the
      # way the image's `cli db:admin:reset` does — that CLI cannot be used directly: in
      # 15.3.0 it fails to load (its `citty` dependency is not shipped), and it exits 0
      # on errors. Unlike it, this leaves the admin's 2FA alone. The 12-character floor
      # is wg-easy's own password rule.
      change:
        apply: script
        script: |
          compose exec -w /app/server -e WGEASYHOST_ADMIN_PASSWORD wgeasyhost node --input-type=module -e "
            import argon2 from 'argon2';
            import {createClient} from '@libsql/client';
            const c = createClient({url: 'file:/etc/wireguard/wg-easy.db'});
            const r = await c.execute({sql: 'UPDATE users_table SET password = ?, updated_at = CURRENT_TIMESTAMP WHERE id = 1', args: [await argon2.hash(process.env.WGEASYHOST_ADMIN_PASSWORD)]});
            if (r.rowsAffected !== 1) { console.error('wgeasyhost: admin user not found'); process.exit(1); }
          "
        policy:
          min_length: 12
  steps:
    # Host kernel parameters. A step's shell runs inside the Maison container, where
    # /proc/sys is read-only — a bare `sysctl -w` there exits 1, and a failing setup step
    # is fatal, so it would leave the app installed but stopped. The supported way to
    # reach the host is through the Docker socket the step already holds: --privileged
    # for a writable /proc/sys, --network=host because net.* keys are per-namespace.
    # Idempotent, and best-effort: clients reach host services at 10.9.0.1 without
    # forwarding (only peer-to-peer and full-tunnel routing need it), so a PCS that
    # refuses the sysctls should still get the app — the step always exits 0.
    # The sysctl alone does not make forwarding work on a PCS — see patch-wg-easy-db.
    # nginx.conf is no longer fetched here; it ships in seed/ (see x-compose-app).
    - name: host-ip-forward
      at: setup
      run: once
      script: |
        docker run --rm --privileged --network=host alpine:3.20 sh -c '
          sysctl -w net.ipv4.ip_forward=1
          sysctl -w net.ipv4.conf.all.src_valid_mark=1
        ' || echo "host sysctl setup skipped; peer-to-peer and full-tunnel routing may need net.ipv4.ip_forward=1"
    # After every start, five idempotent writes to wg-easy's SQLite DB (keepalive,
    # DOCKER-USER forwarding, uplink device, MTU, MSS clamping), then a restart if any
    # changed. Long enough to live in its own file, where the why of each write is.
    - name: patch-wg-easy-db
      at: started
      run: always
      file: scripts/patch-wg-easy-db.sh