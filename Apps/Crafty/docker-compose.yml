name: crafty
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.11.0
    container_name: crafty
    hostname: crafty
    user: "0:0"                          # Crafty requires root; see rationale.md
    cpu_shares: 50
    logging: *logging
    restart: unless-stopped
    expose:
      - 8443                             # self-signed HTTPS panel, reached only by crafty-router over crafty-net
    ports:
      - "25500-25600:25500-25600"       # Minecraft Java server port pool (Crafty's default range for new servers)
      - "19132:19132/udp"               # Minecraft Bedrock
    environment:
      TZ: $TZ
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/backups/:/crafty/backups
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/logs/:/crafty/logs
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/servers/:/crafty/servers
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/config/:/crafty/app/config
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/import/:/crafty/import
    networks:
      - crafty-net
    deploy:
      resources:
        limits:
          memory: 2048M

  # ── The app's own router, in front of the panel ────────────────────
  # The panel's live status and console are a websocket (/ws), and Crafty
  # (Tornado's check_origin) refuses the handshake with 403 "Cross origin
  # websockets not allowed" unless the Host it sees matches the browser's Origin.
  # A route is only "host -> one port", so the header fix lives here: Host passed
  # through as the browser sent it, Upgrade/Connection forwarded, the forwarded
  # scheme kept. It also makes the self-signed HTTPS hop to 8443 itself, so the
  # route is plain HTTP.
  crafty-router:
    image: nginx:1.31.8-alpine
    container_name: crafty-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: crafty-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - crafty-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  crafty-net:
    name: crafty-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  crafty-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      # Crafty logs logins by X-Real-IP: take it from the LAST X-Forwarded-For
      # entry, the one the platform proxy appended, never the client's first.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;

        # Server jars, world imports and backup downloads go through the panel.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        # Self-signed panel certificate, not verified (nginx's default); crafty-net only.
        set $$panel crafty:8443;

        location = /_router/health { access_log off; return 204; }
        location / { proxy_pass https://$$panel; }

        # Crafty 4.10.7's own pages link files its image does not ship (login.html:
        # login.css, the `assest` typo, settings.js, todolist.js; base.html:
        # fontawesome6). Each is a 404 and a console error on every load. Answer
        # them empty, which is what the browser made of the 404 anyway.
        location = /static/assets/css/login.css                    { default_type text/css; return 200 ""; }
        location = /static/assest/css/internal/root.css            { default_type text/css; return 200 ""; }
        location = /static/assets/vendors/fontawesome6/css/all.css { default_type text/css; return 200 ""; }
        location = /static/assets/js/shared/settings.js            { default_type application/javascript; return 200 ""; }
        location = /static/assets/js/shared/todolist.js            { default_type application/javascript; return 200 ""; }

        # The login page probes this to decide whether to show the passkey button;
        # with passkeys off (Crafty's default) the panel answers 400 PASSKEY_DISABLED,
        # a console error on every login. Same answer as a 200: the page only reads
        # `status`. With passkeys on, the panel's 200 passes through untouched.
        location = /api/v2/auth/passkey/login/options/ {
          proxy_pass https://$$panel;
          proxy_intercept_errors on;
          error_page 400 = @passkey_off;
        }
        location @passkey_off {
          default_type application/json;
          return 200 '{"status":"error","error":"PASSKEY_DISABLED"}';
        }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: crafty-router
  webui_port: 80
  index: /
  category: Games
  tags: ["games", "personal", "family", "needs-public-ip"]
  developer: Arcadia Technology
  store_app_id: crafty
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Crafty - Minecraft Server Manager
  tagline:
    en_us: Web-based Minecraft server manager.
    fr_fr: Gestionnaire de serveurs Minecraft en ligne.
    ko_kr: 웹 기반 마인크래프트 서버 관리자.
    es_es: Gestor de servidores de Minecraft basado en web.
  description:
    en_us: |
      Crafty is a web GUI for creating, running and managing
      Minecraft servers (Java and Bedrock) from your browser. It launches and
      supervises your server processes, automates backups, builds servers from
      common loaders, gives you live console access, and supports per-user
      roles and permissions.
    fr_fr: |
      Crafty est une interface web pour creer, lancer et gerer des
      serveurs Minecraft (Java et Bedrock) depuis votre navigateur. Il lance et
      supervise les processus serveur, automatise les sauvegardes, cree des
      serveurs a partir des loaders courants, donne acces a la console en direct
      et gere les roles et permissions par utilisateur.
    ko_kr: |
      Crafty 는 브라우저에서 마인크래프트 서버(자바 및 베드락)를
      생성, 실행, 관리할 수 있는 웹 GUI입니다. 서버 프로세스 실행 및 관리,
      백업 자동화, 일반 로더 기반 서버 생성, 실시간 콘솔 접근, 사용자별 역할
      및 권한을 지원합니다.
  tips:
    before_install:
      en_us: |
        **Getting started**

        Login: `admin`
        The password is shown when you open the app (tile menu → Credentials).

        **Creating a server**

        When you create a server, choose a port in the `25500-25600` range
        (the ports this app publishes). Bedrock servers use UDP port `19132`.

        **Sharing your server with players**

        Give players the address below, plus the port of the server you
        created:
 
        - **Java (Java Edition on PC):** host `${APP_PUBLIC_IPV4:-${APP_PUBLIC_IPV6}}`:`25565`
          (or whichever port you chose)
        - **Bedrock (Consoles + Mobile + Bedrock Edition on PC):** host `${APP_PUBLIC_IPV4:-${APP_PUBLIC_IPV6}}`, port `19132`

        Your server must be reachable from the internet on that port. If your
        PCS is behind CGNAT or the port is not forwarded, players outside your
        network may be unable to connect.

x-compose-app:
  schema_version: 2
  version: "4.11.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: crafty-router, name: crafty, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: crafty
  title:
    en_us: Crafty - Minecraft Server Manager
  tagline:
    en_us: Web-based Minecraft server manager.
    fr_fr: Gestionnaire de serveurs Minecraft en ligne.
    ko_kr: 웹 기반 마인크래프트 서버 관리자.
    es_es: Gestor de servidores de Minecraft basado en web.
  description:
    en_us: |
      Crafty is a web GUI for creating, running and managing
      Minecraft servers (Java and Bedrock) from your browser. It launches and
      supervises your server processes, automates backups, builds servers from
      common loaders, gives you live console access, and supports per-user
      roles and permissions.
    fr_fr: |
      Crafty est une interface web pour creer, lancer et gerer des
      serveurs Minecraft (Java et Bedrock) depuis votre navigateur. Il lance et
      supervise les processus serveur, automatise les sauvegardes, cree des
      serveurs a partir des loaders courants, donne acces a la console en direct
      et gere les roles et permissions par utilisateur.
    ko_kr: |
      Crafty 는 브라우저에서 마인크래프트 서버(자바 및 베드락)를
      생성, 실행, 관리할 수 있는 웹 GUI입니다. 서버 프로세스 실행 및 관리,
      백업 자동화, 일반 로더 기반 서버 생성, 실시간 콘솔 접근, 사용자별 역할
      및 권한을 지원합니다.
  developer: Arcadia Technology
  category: Games
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
  # Raw TCP/UDP must be dialled from the internet: hidden on a box behind NAT or the tunnel.
  requires: [public-ip]
  architectures:
    - amd64
    - arm64
  # The server is capped at 2G; the box needs room around it.
  resources:
    recommended: { cpu: 2, memory: 4G }
  tips:
    en_us: |
      **Getting started**

      Login: `admin`
      The password is shown when you open the app (tile menu → Credentials).

      **Creating a server**

      When you create a server, choose a port in the `25500-25600` range
      (the ports this app publishes). Bedrock servers use UDP port `19132`.

      **Sharing your server with players**

      Give players the address below, plus the port of the server you
      created:

      - **Java (Java Edition on PC):** host `${APP_PUBLIC_IPV4:-${APP_PUBLIC_IPV6}}`:`25565`
        (or whichever port you chose)
      - **Bedrock (Consoles + Mobile + Bedrock Edition on PC):** host `${APP_PUBLIC_IPV4:-${APP_PUBLIC_IPV6}}`, port `19132`

      Your server must be reachable from the internet on that port. If your
      PCS is behind CGNAT or the port is not forwarded, players outside your
      network may be unable to connect.
  secrets:
    CRAFTY_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${CRAFTY_ADMIN_PASSWORD}!
  # Why this is a step and not a seed/ file.
  #
  # crafty-4's docker_launcher.sh bootstraps its config ONLY when the directory is
  # empty: `if [ ! "$(ls -A --ignore=.gitkeep ./app/config)" ]` copies all of
  # app/config_original/* and runs repair_permissions; otherwise it copies just
  # version.json and nothing else. seed/ files land BEFORE the first up, so seeding
  # `config/default.json` — the only file that carries the initial admin credentials —
  # made the directory non-empty and took the else branch: credits.json, logging.json
  # and motd_format.json never reached the volume. /panel/credits then 500s on the
  # missing file and logging silently falls back to logging.basicConfig, so the
  # declared logs/ volume never gets the configured handlers.
  #
  # The trap: what defeats the launcher is ANY file in config/, not how it got there.
  # So this does the launcher's job itself, from the same image, before the first up —
  # copy the full config_original set, then overwrite the one file we actually mean to
  # change. `cp` without -n so an image upgrade refreshes the upstream files, then the
  # credential is rewritten last.
  #
  # The admin password is CRAFTY_ADMIN_PASSWORD with a literal "!" appended. Crafty
  # itself only requires 8+ characters (minimum_password_length, no symbol rule); the
  # "!" is historical — the listing has always written `<password>!`, so installed
  # boxes log in with it. CRAFTY_ADMIN_PASSWORD is seeded from the box-wide password,
  # so for them `${CRAFTY_ADMIN_PASSWORD}!` is exactly the password they have. Keep the
  # suffix here and in `credentials` together.
  #
  # Guarded on credits.json rather than `run: once`: the `once` marker lives with the
  # compose and an uninstall-keep-data removes it, so `once` would re-run on reinstall
  # and reset a password the user had changed.
  steps:
    - name: seed-config
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/config/credits.json" ] && exit 0
        docker run --rm -i --entrypoint sh --user "$PUID:$PGID" \
          -v "$APP_DIR/config:/out" -e CRAFTY_ADMIN_PASSWORD \
          registry.gitlab.com/crafty-controller/crafty-4:4.11.0 -s <<'SH'
        set -e
        cp -r /crafty/app/config_original/. /out/
        printf '{"username":"admin","password":"%s!"}' "$CRAFTY_ADMIN_PASSWORD" > /out/default.json
        SH
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/backups
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/logs
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/servers
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/import
      user: $PUID
      group: $PGID
  backup:
    # Regenerable data: restored empty, rebuilt by the app. Declared in folders above.
    exclude:
      - logs/
