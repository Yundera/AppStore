name: chronosmcp
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Main server — reachable at chronosmcp-backend:9054 on this app's private
  # network only. It ships no authentication of its own, so it must never join
  # the shared `pcs` network: any co-tenant container there could read and
  # rewrite the cron rules and trigger arbitrary MCP tool calls unauthenticated.
  # The perimeter is chronosmcp-proxy (AppShield) and nothing else.
  chronosmcp-backend:
    image: ghcr.io/worph/chronos-mcp:1.0.8
    container_name: chronosmcp-backend
    hostname: chronosmcp-backend
    user: $PUID:$PGID
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - 9054
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/chronosmcp/
        target: /app/data
    networks:
      # App-private only — the link that carries proxy -> backend traffic.
      # Deliberately not on `pcs`; see the note above and tips Option 2.
      - chronosmcp-internal

  # AppShield provides perimeter authentication for the web UI (SSO) and
  # for the /mcp endpoint (OAuth 2.1 broker — see OAUTH_RESOURCE below).
  chronosmcp-proxy:
    # 2.0.7+ is required: first image with the generic OAUTH_RESOURCE /
    # OAUTH_SCOPE names and a configurable protected path.
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: chronosmcp
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: chronosmcp
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    expose:
      - 80
    user: "0:0"   # numeric: scratch image has no passwd; /data/oauth is chowned $PUID
    environment:
      BACKEND_HOST: chronosmcp-backend
      BACKEND_PORT: "9054"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # OAuth 2.1 broker: AppShield runs an OAuth/OIDC authorization server
      # fronting Dex and gates the path named by the resource URL (/mcp) on
      # Bearer tokens. This is the machine/API path: clients like claude.ai
      # self-register via DCR, others get a manual client
      # by POST to https://chronosmcp-${APP_DOMAIN}/AppShield/oauth/clients (the admin page lists and revokes).
      OAUTH_RESOURCE: "${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/mcp"
      OAUTH_SCOPE: "mcp"
      OAUTH_DATA_DIR: "/data/oauth"
    volumes:
      # Persist DCR/manual clients, signing keys and grants across redeploys.
      - ${DATA_ROOT:-/DATA}/AppData/chronosmcp/oauth:/data/oauth
    depends_on:
      - chronosmcp-backend
    networks:
      # Shared with the backend and never rewritten by the launcher — this is the
      # link the sidecar proxies over. See the note on the backend's networks.
      - chronosmcp-internal
      - pcs

networks:
  # App-private link between the sidecar and the backend.
  chronosmcp-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    # amd64 only: the backend image ghcr.io/worph/chronos-mcp:1.0.8 publishes an
    # amd64 manifest only (the AppShield sidecar does ship arm64, but the app
    # cannot run without its backend). Re-add arm64 when the backend does.
    - amd64
  # The AppShield sidecar, i.e. the service every route points at. It has
  # to be this one and not the backend: the launcher attaches the deployment's app
  # network to the main service only, so naming the backend leaves the sidecar
  # off the network the router uses (503). It also makes the tile's health
  # reflect the service the user actually reaches.
  main: chronosmcp-proxy
  webui_port: 80
  index: /
  category: Utilities
  tags: ["developer", "ai"]
  description:
    en_us: |
      **Schedule MCP tool calls with cron expressions**

      Chronos MCP is a cron-based scheduler that triggers MCP (Model Context Protocol) tool calls at configured times. It connects to any MCP-compatible server via stdio or HTTP transports and invokes tools on a schedule.

      **What you can do:**
      - Define cron rules to call any tool on any MCP server on a schedule
      - Use dynamic parameter templates with date/time variables (e.g. `{{date}}`, `{{now}}`)
      - Monitor execution history and results from the web dashboard
      - Manage rules via the Web UI or directly from an AI assistant via its built-in MCP server

      **Think of it like:** A cron scheduler, but instead of running shell commands, it calls MCP tools.

      **Perfect if you:** Want to automate recurring tasks across your MCP-enabled services — daily reports, periodic health checks, scheduled notifications, and more.
    zh_cn: |
      **使用 cron 表达式调度 MCP 工具调用**

      Chronos MCP 是一个基于 cron 的调度器，可在配置的时间触发 MCP（模型上下文协议）工具调用。它通过 stdio 或 HTTP 传输连接到任何兼容 MCP 的服务器，并按计划调用工具。

      **功能：**
      - 定义 cron 规则，按计划调用任何 MCP 服务器上的任何工具
      - 使用日期/时间变量的动态参数模板（例如 `{{date}}`、`{{now}}`）
      - 从 Web 仪表板监控执行历史和结果
      - 通过 Web UI 或内置 MCP 服务器直接从 AI 助手管理规则
  developer: Worph
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Cron-based scheduler for MCP tool calls
    zh_cn: 基于 cron 的 MCP 工具调用调度器
  thumbnail: thumbnail.png
  title:
    en_us: Chronos MCP
  chips:
    - key: mcp
      name:
        en_us: MCP
  tips:
    before_install:
      en_us: |
        **Getting Started**

        Chronos MCP is ready to use immediately after installation.

        **How to use:**
        1. Open the Web UI and create a new cron rule
        2. Set a cron schedule (e.g. `0 9 * * 1-5` for weekdays at 9am)
        3. Configure the target MCP server (stdio command or HTTP URL)
        4. Choose the tool to call and set parameters
        5. Enable the rule — Chronos will call the tool on schedule

        **Parameter Templates:**
        Use dynamic values in your parameters that resolve at trigger time:
        - `{{date}}` → `2025-01-15`
        - `{{now}}` → ISO 8601 timestamp
        - `{{time}}` → `09:00:00`
        - `{{timestamp}}` → Unix timestamp

        **MCP Integration (for AI/LLMs):**

        Chronos itself exposes an MCP server, allowing AI assistants to create, update, and manage cron rules.

        **Option 1: Public URL (OAuth)**

        The `/mcp` endpoint is protected by OAuth 2.1. Point your client at the
        URL below — clients that support OAuth discovery (claude.ai, Claude
        Desktop) register themselves and open a browser for you to approve with
        your server account (single sign-on).
        ```json
        {
          "mcpServers": {
            "chronos-mcp": {
              "type": "http",
              "url": "${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```
        For clients that need a pre-created client_id/client_secret (n8n, custom
        scripts), create it with a `POST` of its registration (JSON with `client_name` and `redirect_uris`) to **${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/AppShield/oauth/clients**, sent from a browser signed in to this app; **${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/AppShield/oauth** lists the clients that exist and revokes them.

        **Option 2: Local Docker connection (no auth required) — on your server, use Option 1 instead**

        On a plain Docker host you could reach the backend directly over the
        shared network:
        ```json
        {
          "mcpServers": {
            "chronos-mcp": {
              "type": "http",
              "url": "http://chronosmcp-backend:9054/mcp"
            }
          }
        }
        ```
        *Use Option 1 here.* On your server the launcher attaches the backend to
        this app's private network only, so `chronosmcp-backend` cannot be
        resolved from the shared `pcs` network — a client on `pcs` will not reach
        it. Use **Option 1** above, which is OAuth-gated and works from anywhere.

        **Available MCP Tools:**
        | Tool | Description |
        |------|-------------|
        | `list_rules` | List all cron rules |
        | `create_rule` | Create a new scheduled rule |
        | `update_rule` | Update an existing rule |
        | `delete_rule` | Delete a rule |
        | `toggle_rule` | Enable or disable a rule |
        | `trigger_rule` | Manually trigger a rule now |
        | `get_logs` | View execution logs |
        | `clear_logs` | Clear logs for a rule |
        | `get_status` | Get scheduler status |
      zh_cn: |
        **快速开始**

        Chronos MCP 安装后即可立即使用。

        **使用方法：**
        1. 打开 Web UI 并创建新的 cron 规则
        2. 设置 cron 计划（例如 `0 9 * * 1-5` 表示工作日上午9点）
        3. 配置目标 MCP 服务器（stdio 命令或 HTTP URL）
        4. 选择要调用的工具并设置参数
        5. 启用规则 — Chronos 将按计划调用工具

        **参数模板：**
        在参数中使用在触发时解析的动态值：
        - `{{date}}` → `2025-01-15`
        - `{{now}}` → ISO 8601 时间戳
        - `{{time}}` → `09:00:00`
        - `{{timestamp}}` → Unix 时间戳

        **MCP 集成（用于 AI/LLM）：**

        Chronos 本身暴露一个 MCP 服务器，允许 AI 助手创建、更新和管理 cron 规则。

        **选项 1：公共 URL（OAuth）**

        `/mcp` 端点受 OAuth 2.1 保护。将客户端指向以下 URL — 支持 OAuth 发现的客户端
        （claude.ai、Claude Desktop）会自动注册并打开浏览器，让您使用服务器账号（单点登录）授权。
        ```json
        {
          "mcpServers": {
            "chronos-mcp": {
              "type": "http",
              "url": "${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```
        对于需要预先创建 client_id/client_secret 的客户端（n8n、自定义脚本），请从已登录本应用的浏览器向 **${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/AppShield/oauth/clients** 发送 `POST` 注册请求（包含 `client_name` 和 `redirect_uris` 的 JSON）来创建；**${APP_URL:-https://chronosmcp-${APP_DOMAIN}}/AppShield/oauth** 页面可列出并撤销已有客户端。

        **选项 2：本地 Docker 连接（无需认证）— 在您的服务器上请改用选项 1**

        在普通 Docker 主机上，可以通过共享网络直接连接后端：
        ```json
        {
          "mcpServers": {
            "chronos-mcp": {
              "type": "http",
              "url": "http://chronosmcp-backend:9054/mcp"
            }
          }
        }
        ```
        *在您的服务器上请使用选项 1*：启动器只把后端接入本应用的专用网络，
        因此共享 `pcs` 网络上的客户端无法解析 `chronosmcp-backend`。请使用上面的
        **选项 1**（OAuth 保护，任何位置均可访问）。

        **可用 MCP 工具：**
        | 工具 | 描述 |
        |------|------|
        | `list_rules` | 列出所有 cron 规则 |
        | `create_rule` | 创建新的定时规则 |
        | `update_rule` | 更新现有规则 |
        | `delete_rule` | 删除规则 |
        | `toggle_rule` | 启用或禁用规则 |
        | `trigger_rule` | 立即手动触发规则 |
        | `get_logs` | 查看执行日志 |
        | `clear_logs` | 清除规则的日志 |
        | `get_status` | 获取调度器状态 |

