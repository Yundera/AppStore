name: audiobookshelf
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The app's own router: the only routed service. The web UI goes through the
  # AppShield gate; the client API the mobile apps use goes straight to
  # Audiobookshelf, which checks its own token on it. See rationale.md.
  audiobookshelf-router:
    image: nginx:1.31.10-alpine
    container_name: audiobookshelf-router
    restart: unless-stopped
    expose:
      - 80
    configs:
      - source: audiobookshelf-router
        target: /etc/nginx/conf.d/default.conf
    deploy:
      resources:
        limits:
          memory: 64M
    cpu_shares: 50
    logging: *logging
    networks:
      - pcs
      - audiobookshelf-internal

  audiobookshelf:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: audiobookshelf
    # OIDC identity: the auth-registrar attests this app's name via the container's PTR
    # record, so the hostname must equal the app name.
    hostname: audiobookshelf
    restart: unless-stopped
    environment:
      BACKEND_HOST: "audiobookshelf-app"
      BACKEND_PORT: "13378"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      # Empty elsewhere, where the gate falls back to REDIRECT_HOST_SUFFIXES.
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      - audiobookshelf-app
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On `pcs` to reach the auth-registrar, and on the app's own network for its backend.
      - pcs
      - audiobookshelf-internal

  audiobookshelf-app:
    image: ghcr.io/advplyr/audiobookshelf:2.38.0
    container_name: audiobookshelf-app
    restart: unless-stopped
    # The image has no USER of its own; run it as the box user so files it writes
    # into the media folders belong to the user.
    user: "$PUID:$PGID"
    environment:
      # An unprivileged port, since the server does not run as root.
      PORT: "13378"
      TZ: $TZ
    expose:
      - 13378
    volumes:
      # Server database, users, settings and backups.
      - ${DATA_ROOT:-/DATA}/AppData/audiobookshelf/config:/config
      # Covers, author images, cache and logs.
      - ${DATA_ROOT:-/DATA}/AppData/audiobookshelf/metadata:/metadata
      # The user's libraries: read by the scanner, written by uploads and podcast downloads.
      - ${DATA_ROOT:-/DATA}/Media/Audiobooks:/audiobooks
      - ${DATA_ROOT:-/DATA}/Media/Podcasts:/podcasts
    deploy:
      resources:
        limits:
          memory: 1G
    cpu_shares: 70
    logging: *logging
    networks:
      # App-private only: reached by the router and the gate.
      - audiobookshelf-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  audiobookshelf-internal:
    driver: bridge

configs:
  audiobookshelf-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge. Audiobookshelf rate-limits sign-ins on
      # it, reading X-Client-IP first (then True-/Fastly-/Cluster-Client-IP, X-Real-IP).
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }
      # A sign-in or sign-out call (POST) is the API; the page of the same name is web UI.
      map $$request_method $$signin { POST audiobookshelf-app:13378; default audiobookshelf:80; }

      server {
        listen 80;
        absolute_redirect off;

        # Uploads and audio streaming: no size cap, no buffering.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Client-IP $$client_ip;
        proxy_set_header X-Real-IP $$client_ip;
        # Not forwarded: a client could set them to rotate its address.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Fastly-Client-IP "";
        proxy_set_header X-Cluster-Client-IP "";
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate audiobookshelf:80;
        set $$abs audiobookshelf-app:13378;

        location = /_router/health { access_log off; return 204; }

        # The client API, with or without the server's /audiobookshelf base path. Each
        # of these checks Audiobookshelf's own token, or is public by its design
        # (status, ping, the RSS feeds a user opens on purpose).
        location ~ ^(/audiobookshelf)?/(api|hls|auth|socket\.io|feed)/ { proxy_pass http://$$abs; }
        location ~ ^(/audiobookshelf)?/(status|ping|healthcheck)$$ { proxy_pass http://$$abs; }
        location ~ ^(/audiobookshelf)?/(login|logout)$$ { proxy_pass http://$$signin; }
        # The web app manifest and its icons: a browser fetches the manifest without
        # cookies, so behind the gate it would only ever get the SSO redirect.
        location ~ ^(/audiobookshelf)?/(_nuxt/manifest\.[0-9a-f]+\.json|icon\.svg|icon192\.png)$$ { proxy_pass http://$$abs; }

        # Everything else - the web UI, first-run setup (/init) and the gate's own
        # /AppShield/ endpoints - through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: audiobookshelf-router
  webui_port: 80
  category: Media
  tags: ["media", "audiobooks", "podcasts"]
  developer: advplyr
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  index: /
  store_app_id: audiobookshelf
  title:
    en_us: Audiobookshelf
  tagline:
    en_us: Self-hosted audiobook and podcast server with mobile apps
  description:
    en_us: |
      Audiobookshelf is a self-hosted audiobook and podcast server. Stream your library from the browser or the Android and iOS apps, and pick up where you left off on any device.

      **Key features:**
      • Libraries of audiobooks, podcasts and ebooks, scanned and matched to metadata from several providers
      • Progress, bookmarks and listening stats synced per user across devices
      • Podcast search, subscriptions and automatic episode downloads
      • Multiple users with per-library permissions
      • Chapter editing, collections, playlists and RSS feeds
      • Android and iOS apps with offline downloads

      **Your files:** Audiobookshelf reads and writes `/DATA/Media/Audiobooks` and `/DATA/Media/Podcasts` - uploads and downloaded podcast episodes land there. Its database, covers and cache stay in the app's own folder.
  tips:
    before_install:
      en_us: |
        **Sign-in:** the web interface is protected by your server account (single sign-on). On a server without single sign-on, use the app password Maison shows on first open (also in the tile menu under **Credentials**).
        -----------------------------
        **First visit:** Audiobookshelf asks you to create its **root user** (username and
        password). That account is Audiobookshelf's own login, for the web and the mobile apps.
        -----------------------------
        **Libraries:** put audiobooks in `/DATA/Media/Audiobooks` and podcasts in
        `/DATA/Media/Podcasts`, then add a library pointing at `/audiobooks` or `/podcasts`.
        -----------------------------
        **Mobile apps:** enter this app's address as the server and sign in with an
        Audiobookshelf user. The apps talk to the server's API, which Audiobookshelf's own
        login protects; they never see the single sign-on page.
x-compose-app:
  schema_version: 2
  version: "2.38.0"
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to the web interface. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable. Audiobookshelf's own login is the root user you create on first visit.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  # How the app is reached; the box's routing setting decides the rest.
  routes:
    - { service: audiobookshelf-router, name: audiobookshelf, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: audiobookshelf
  title:
    en_us: Audiobookshelf
  tagline:
    en_us: Self-hosted audiobook and podcast server with mobile apps
  description:
    en_us: |
      Audiobookshelf is a self-hosted audiobook and podcast server. Stream your library from the browser or the Android and iOS apps, and pick up where you left off on any device.

      **Key features:**
      • Libraries of audiobooks, podcasts and ebooks, scanned and matched to metadata from several providers
      • Progress, bookmarks and listening stats synced per user across devices
      • Podcast search, subscriptions and automatic episode downloads
      • Multiple users with per-library permissions
      • Chapter editing, collections, playlists and RSS feeds
      • Android and iOS apps with offline downloads

      **Your files:** Audiobookshelf reads and writes `/DATA/Media/Audiobooks` and `/DATA/Media/Podcasts` - uploads and downloaded podcast episodes land there. Its database, covers and cache stay in the app's own folder.
  developer: advplyr
  category: Media
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** the web interface is protected by your server account (single sign-on). On a server without single sign-on, use the app password Maison shows on first open (also in the tile menu under **Credentials**).
      -----------------------------
      **First visit:** Audiobookshelf asks you to create its **root user** (username and
      password). That account is Audiobookshelf's own login, for the web and the mobile apps.
      -----------------------------
      **Libraries:** put audiobooks in `/DATA/Media/Audiobooks` and podcasts in
      `/DATA/Media/Podcasts`, then add a library pointing at `/audiobooks` or `/podcasts`.
      -----------------------------
      **Mobile apps:** enter this app's address as the server and sign in with an
      Audiobookshelf user. The apps talk to the server's API, which Audiobookshelf's own
      login protects; they never see the single sign-on page.
  # Audiobookshelf runs as $PUID:$PGID and writes to all four.
  folders:
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
      mode: "0755"
    - path: /DATA/AppData/$AppID/metadata
      user: $PUID
      group: $PGID
      mode: "0755"
    - path: /DATA/Media/Audiobooks
      user: $PUID
      group: $PGID
    - path: /DATA/Media/Podcasts
      user: $PUID
      group: $PGID
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
