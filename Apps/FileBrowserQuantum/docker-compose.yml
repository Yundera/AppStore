  secrets:
    # Seeded: an installed app keeps the shared password its admin already has;
    # a fresh install gets its own.
    FILEBROWSERQUANTUM_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
        fr_fr: Administrateur
        zh_cn: 管理员
      username: admin
      password: ${FILEBROWSERQUANTUM_ADMIN_PASSWORD}
      note:
        en_us: Re-applied on every restart from FILEBROWSER_ADMIN_PASSWORD; a change made inside the app does not stick while that variable is set.
        fr_fr: Réappliqué à chaque redémarrage depuis FILEBROWSER_ADMIN_PASSWORD ; une modification faite dans l'application n'est pas conservée tant que cette variable est définie.
        zh_cn: 每次重启都会从 FILEBROWSER_ADMIN_PASSWORD 重新应用；只要该变量存在，在应用内的修改不会保留。
      # FILEBROWSER_ADMIN_PASSWORD is re-applied to the admin user on every start
      # (see the note), so a new value in .env plus a recreate is the whole change.
      # Quantum refuses passwords shorter than its default minimum of 10.
      change:
        apply: env
        policy:
          min_length: 10
  # No init containers: Quantum creates its own database on first start, and the
  # admin account comes from FILEBROWSER_ADMIN_PASSWORD rather than a seeding CLI
  # call. config.yaml arrives via the seed tree (seed/data/config.yaml), which is
  # create-if-absent - so the operator's edits to it are never clobbered.
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
