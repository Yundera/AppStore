name: claude

services:
  claude:
    image: ghcr.io/worph/claude-code-container:1.0.26
    container_name: claude
    restart: unless-stopped
    user: 0:0
    expose:
      - 8080
      - 9090
    labels:
      caddy_0: claude-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      # /login, /logout — no forward_auth, served by MCP server
      caddy_0.0_handle: "/login*"
      caddy_0.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_0.1_handle: "/logout"
      caddy_0.1_handle.reverse_proxy: "{{upstreams 9090}}"
      # /mcp — no forward_auth, MCP server has its own Bearer auth.
      # MCP automation itself is disabled via MCP_ENABLED=false below; with that
      # set, the 9090 server returns 404 for /mcp (auth/login still served).
      caddy_0.2_handle: "/mcp*"
      caddy_0.2_handle.reverse_proxy: "{{upstreams 9090}}"
      # Everything else — forward_auth via MCP, then proxy to ttyd
      caddy_0.3_handle: ""
      caddy_0.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_0.3_handle.forward_auth.uri: /auth
      caddy_0.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_0.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_0.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_0.3_handle.reverse_proxy: "{{upstreams 8080}}"

      caddy_1: claude-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.0_handle: "/login*"
      caddy_1.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.1_handle: "/logout"
      caddy_1.1_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.2_handle: "/mcp*"
      caddy_1.2_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.3_handle: ""
      caddy_1.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_1.3_handle.forward_auth.uri: /auth
      caddy_1.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_1.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_1.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_1.3_handle.reverse_proxy: "{{upstreams 8080}}"

      caddy_2: claude-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.0_handle: "/login*"
      caddy_2.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.1_handle: "/logout"
      caddy_2.1_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.2_handle: "/mcp*"
      caddy_2.2_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.3_handle: ""
      caddy_2.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_2.3_handle.forward_auth.uri: /auth
      caddy_2.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_2.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_2.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_2.3_handle.reverse_proxy: "{{upstreams 8080}}"
    environment:
      - AUTH_PASSWORD=$APP_DEFAULT_PASSWORD
      # MCP automation disabled. With MCP_ENABLED=true the image also starts a UDP
      # discovery responder (mcp-announce.js: binds 0.0.0.0:9099, joins multicast
      # 239.255.99.1) that replies to ANY unauthenticated datagram with a manifest
      # carrying auth:{type:bearer,token:$AUTH_PASSWORD} — i.e. it hands
      # $APP_DEFAULT_PASSWORD, which is both the /mcp bearer token and the terminal
      # login password, to every other container on the shared pcs network. The image
      # offers no way to keep /mcp while suppressing that announcement, so MCP stays
      # off until that is fixed upstream. See rationale.md.
      # The 9090 auth layer (login/auth/logout) keeps running; only /mcp is turned off.
      - MCP_ENABLED=false
    # SANDBOXED variant: NO docker.sock, NO host /home/admin/.ssh mount, and NO
    # full /DATA mount. This container has no path to the host VM — it is
    # confined to its own workspace.
    volumes:
      # Claude Code workspace persistence
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/workspace/
        target: /home/claude/workspace
      # Claude config persistence (contains credentials, settings, and other important data)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/config/
        target: /home/claude/.claude
      # Claude session state file (required for auth persistence across restarts)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/config/.claude.json
        target: /home/claude/.claude.json
    networks:
      pcs: null
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 2048M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  index: /

  architectures:
    - amd64
    - arm64
  main: claude
  author: Yundera
  category: Developer
  tags: ["developer", "ai"]
  description:
    en_us: |
      Claude Code Container - Web-based terminal interface for Claude Code (Anthropic's CLI for Claude).

      This is the standard, sandboxed Claude Code app. It runs confined to its own workspace with NO Docker socket, NO host SSH access, and NO sudo account — it cannot touch the host VM. If you need full PCS administration and debugging with host control, install "Claude Code (root)" instead.

      Features:
      - Web-based terminal access to Claude Code
      - Styled login page with session management
      - Persistent workspace volume
      - Claude starts automatically on connection
      - No host access — runs fully sandboxed

      Default password is auto-generated. Check the app settings for the AUTH_PASSWORD value.
    zh_cn: |
      Claude Code 容器 - Claude Code（Anthropic 的 Claude CLI）的 Web 终端界面。

      这是标准的沙盒版 Claude Code 应用，仅限于自己的工作区运行：没有 Docker 套接字、没有主机 SSH 访问、也没有 sudo 账户，无法触及主机虚拟机。如需对 PCS 进行管理和调试（具备主机控制权），请改装 “Claude Code (root)”。

      注意：本版本已禁用 MCP 自动化端点。
  developer: Anthropic / Yundera
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Web terminal for Claude Code - Anthropic's AI coding assistant (sandboxed)
    zh_cn: Claude Code 的 Web 终端 - Anthropic 的 AI 编程助手（沙盒化）
  thumbnail: thumbnail.png
  title:
    en_us: Claude Code
    zh_cn: Claude Code
  tips:
    before_install:
      en_us: |
        Authentication options:
        - Anthropic API key (https://console.anthropic.com/), OR
        - Claude Pro/Max subscription (authenticate via OAuth on first run)

        Leave API key empty to use subscription auth.

        Default login password: `$APP_DEFAULT_PASSWORD`

        **Sandboxed variant:** This app has no Docker socket, no host SSH, and no sudo account. It cannot perform host maintenance — use "Claude Code (root)" for that.

        **MCP automation is turned off in this listing** (`MCP_ENABLED=false`), so `/mcp` answers 404 and there is no endpoint for another AI assistant (n8n, an aggregator) to drive. The image's MCP mode also starts a UDP discovery responder that hands this app's login password — the same `$APP_DEFAULT_PASSWORD` other apps on the server use — to any container that asks for it on the shared Docker network, and the image gives no way to keep one without the other. See `rationale.md`.

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/claude/workspace
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/claude/config
      user: $PUID
      group: $PGID
  webui-host: claude-${domain}
