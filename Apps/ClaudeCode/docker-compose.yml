name: claude

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  claude:
    image: ghcr.io/worph/claude-code-container:1.0.31
    container_name: claude
    restart: unless-stopped
    user: 0:0
    expose:
      - 8080
      - 9090
    environment:
      - AUTH_PASSWORD=${CLAUDECODE_AUTH_PASSWORD}
      # MCP automation disabled. With MCP_ENABLED=true the image also starts a UDP
      # discovery responder (mcp-announce.js: binds 0.0.0.0:9099, joins multicast
      # 239.255.99.1) that replies to ANY unauthenticated datagram with a manifest
      # carrying auth:{type:bearer,token:$AUTH_PASSWORD} — i.e. it hands this app's
      # password, which is both the /mcp bearer token and the terminal login, to
      # every other container on the shared pcs network. The image
      # offers no way to keep /mcp while suppressing that announcement, so MCP stays
      # off until that is fixed upstream. See rationale.md.
      # The 9090 auth layer (login/auth/logout) keeps running; only /mcp is turned off.
      - MCP_ENABLED=false
    # SANDBOXED variant: NO docker.sock, NO host /home/admin/.ssh mount, and NO
    # full /DATA mount. This container has no path to the host VM — it is
    # confined to its own workspace.
    volumes:
      # Claude Code workspace persistence
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/workspace/
        target: /home/claude/workspace
      # Claude config persistence (contains credentials, settings, and other important data)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/config/
        target: /home/claude/.claude
      # Claude session state file (required for auth persistence across restarts)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/claude/config/.claude.json
        target: /home/claude/.claude.json
    networks:
      claude-net: null
      # On `pcs` so Beacon's UDP discovery (port 9099) can reach the responder when
      # a box turns MCP on in its override. Trade-off: co-tenant containers on
      # `pcs` reach ttyd (8080) and the auth server (9090) directly, past the
      # router's gate. See rationale.md.
      pcs: null
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2048M

  # The app's own router: login/logout/mcp straight to the auth server, everything
  # else gated by it (auth_request) and then proxied to ttyd. This was a Caddy
  # forward_auth tree; the platform now only routes a host to port 80 here.
  claude-router:
    image: nginx:1.28.0-alpine
    container_name: claude-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: claude-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      claude-net: null
      pcs: null
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  claude-net:
    name: claude-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  claude-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }

      server {
        listen 80;
        # Relative Location headers, as Caddy's `redir * /login` sent.
        absolute_redirect off;

        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$auth claude:9090;
        set $$ttyd claude:8080;

        location = /_router/health { access_log off; return 204; }

        # Served by the auth server itself, ungated.
        location /login  { proxy_pass http://$$auth; }
        location = /logout { proxy_pass http://$$auth; }
        location /mcp    { proxy_pass http://$$auth; }

        # The gate: Caddy forward_auth's contract (GET, original request in
        # X-Forwarded-*, no body); a 401 sends the browser to /login.
        location = /_router/auth {
          internal;
          proxy_method GET;
          proxy_pass_request_body off;
          # Setting any header here drops every inherited one, so restate them.
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$fwd_proto;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header Content-Length "";
          proxy_set_header Upgrade "";
          proxy_set_header Connection "";
          proxy_set_header X-Forwarded-Method $$request_method;
          proxy_set_header X-Forwarded-Uri $$request_uri;
          proxy_pass http://$$auth/auth;
        }
        location @login { return 302 /login; }

        location / {
          auth_request /_router/auth;
          error_page 401 = @login;
          proxy_pass http://$$ttyd;
        }
      }

x-casaos:
  index: /

  architectures:
    - amd64
    - arm64
  main: claude-router
  webui_port: 80
  category: Developer
  tags: ["developer", "ai"]
  description:
    en_us: |
      Claude Code Container - Web-based terminal interface for Claude Code (Anthropic's CLI for Claude).

      This is the standard, sandboxed Claude Code app. It runs confined to its own workspace with NO Docker socket, NO host SSH access, and NO sudo account — it cannot touch the host VM. If you need full PCS administration and debugging with host control, install "Claude Code (root)" instead.

      Features:
      - Web-based terminal access to Claude Code
      - Styled login page with session management
      - Persistent workspace volume
      - Claude starts automatically on connection
      - No host access — runs fully sandboxed

      The login password is generated per app and shown when you first open it.
    zh_cn: |
      Claude Code 容器 - Claude Code（Anthropic 的 Claude CLI）的 Web 终端界面。

      这是标准的沙盒版 Claude Code 应用，仅限于自己的工作区运行：没有 Docker 套接字、没有主机 SSH 访问、也没有 sudo 账户，无法触及主机虚拟机。如需对 PCS 进行管理和调试（具备主机控制权），请改装 “Claude Code (root)”。

      注意：本版本已禁用 MCP 自动化端点。
  developer: Anthropic
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Web terminal for Claude Code - Anthropic's AI coding assistant (sandboxed)
    zh_cn: Claude Code 的 Web 终端 - Anthropic 的 AI 编程助手（沙盒化）
  thumbnail: thumbnail.png
  title:
    en_us: Claude Code
    zh_cn: Claude Code
  tips:
    before_install:
      en_us: |
        Authentication options:
        - Anthropic API key (https://console.anthropic.com/), OR
        - Claude Pro/Max subscription (authenticate via OAuth on first run)

        Leave API key empty to use subscription auth.

        The login password is shown when you open the app (tile menu → Credentials).

        **Sandboxed variant:** This app has no Docker socket, no host SSH, and no sudo account. It cannot perform host maintenance — use "Claude Code (root)" for that.

        **MCP automation is turned off in this listing** (`MCP_ENABLED=false`), so `/mcp` answers 404 and there is no endpoint for another AI assistant (n8n, an aggregator) to drive. The image's MCP mode also starts a UDP discovery responder that hands this app's login password to any container that asks for it on the shared Docker network, and the image gives no way to keep one without the other. See `rationale.md`.

x-compose-app:
  schema_version: 2
  version: "1.0.31"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: claude-router, name: claude, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Claude Code
    zh_cn: Claude Code
  tagline:
    en_us: Web terminal for Claude Code - Anthropic's AI coding assistant (sandboxed)
    zh_cn: Claude Code 的 Web 终端 - Anthropic 的 AI 编程助手（沙盒化）
  description:
    en_us: |
      Claude Code Container - Web-based terminal interface for Claude Code (Anthropic's CLI for Claude).

      This is the standard, sandboxed Claude Code app. It runs confined to its own workspace with NO Docker socket, NO host SSH access, and NO sudo account — it cannot touch the host VM. If you need full PCS administration and debugging with host control, install "Claude Code (root)" instead.

      Features:
      - Web-based terminal access to Claude Code
      - Styled login page with session management
      - Persistent workspace volume
      - Claude starts automatically on connection
      - No host access — runs fully sandboxed

      The login password is generated per app and shown when you first open it.
    zh_cn: |
      Claude Code 容器 - Claude Code（Anthropic 的 Claude CLI）的 Web 终端界面。

      这是标准的沙盒版 Claude Code 应用，仅限于自己的工作区运行：没有 Docker 套接字、没有主机 SSH 访问、也没有 sudo 账户，无法触及主机虚拟机。如需对 PCS 进行管理和调试（具备主机控制权），请改装 “Claude Code (root)”。

      注意：本版本已禁用 MCP 自动化端点。
  developer: Anthropic
  category: Developer
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      Authentication options:
      - Anthropic API key (https://console.anthropic.com/), OR
      - Claude Pro/Max subscription (authenticate via OAuth on first run)

      Leave API key empty to use subscription auth.

      The login password is shown when you open the app (tile menu → Credentials).

      **Sandboxed variant:** This app has no Docker socket, no host SSH, and no sudo account. It cannot perform host maintenance — use "Claude Code (root)" for that.

      **MCP automation is turned off in this listing** (`MCP_ENABLED=false`), so `/mcp` answers 404 and there is no endpoint for another AI assistant (n8n, an aggregator) to drive. The image's MCP mode also starts a UDP discovery responder that hands this app's login password to any container that asks for it on the shared Docker network, and the image gives no way to keep one without the other. See `rationale.md`.
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/claude/workspace
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/claude/config
      user: $PUID
      group: $PGID
  secrets:
    # Seeded from the box-wide password it replaces, so an installed app keeps the
    # login it already had; a fresh install gets its own.
    CLAUDECODE_AUTH_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Terminal login
      password: ${CLAUDECODE_AUTH_PASSWORD}
      # The auth layer reads AUTH_PASSWORD from the environment on every start and
      # keeps sessions in memory only, so .env plus a recreate is the whole change.
      # Open terminals are logged out by the recreate.
      change:
        apply: env
