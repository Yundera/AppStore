  # Seeded: an installed ntfy keeps the box-wide password its admin user was
  # created with; a fresh install gets its own.
  secrets:
    NTFY_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator (web UI and mobile app)
        zh_cn: 管理员（网页界面和手机应用）
      username: admin
      password: ${NTFY_ADMIN_PASSWORD}
      # A hook, not env: the image's entrypoint only adds `admin` to user.db when
      # it is missing, so a new value in .env would never reach it. The hook runs
      # ntfy's own CLI in the running container; `user change-pass` reads the
      # new password from NTFY_PASSWORD and the auth file from the server.yml
      # the entrypoint wrote. The sidecar's access token is not a password and
      # keeps working.
      change:
        apply: script
        script: |
          compose exec -e NTFY_ADMIN_PASSWORD ntfy sh -c '
            [ -n "$NTFY_ADMIN_PASSWORD" ] || exit 1
            NTFY_PASSWORD="$NTFY_ADMIN_PASSWORD" ntfy user change-pass admin'
      note:
        en_us: After a change, phones and browsers signed in with the old password must sign in again.
        zh_cn: 修改后，使用旧密码登录的手机和浏览器需要重新登录。
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/ntfy/cache
      user: $PUID
      group: $PGID
