name: anse

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The AppShield SSO gate: every request except the PWA manifest goes through it.
  anse:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: anse
    # The auth-registrar names the app from the container's hostname: it must equal
    # container_name (and the compose name), or OIDC registration fails.
    hostname: anse
    restart: unless-stopped
    expose:
      - 80
    environment:
      BACKEND_HOST: "anse-app"
      BACKEND_PORT: "8014"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    depends_on:
      - anse-app
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      # On `pcs` to reach the platform's auth-registrar, and on the app's own
      # network, where the router and the backend live.
      - pcs
      - anse-internal

  anse-app:
    # Astro (Node) server on port 8014. No volume: Anse keeps every conversation,
    # setting and API key in the browser (IndexedDB), never on the server (see rationale.md).
    image: ddiu8081/anse:v1.1.11
    container_name: anse-app
    restart: unless-stopped
    environment:
      PORT: "8014"
    expose:
      - 8014
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      # App-private: reached only by the gate and the router.
      - anse-internal

  # The app's own router, the only routed service. It sends exactly one path,
  # /manifest.webmanifest, straight to the backend and everything else to the gate.
  # See rationale.md.
  anse-router:
    image: nginx:1.31.10-alpine
    container_name: anse-router
    restart: unless-stopped
    depends_on:
      - anse
      - anse-app
    expose:
      - 80
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    configs:
      - source: anse-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - anse-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the router, the gate and the backend.
  anse-internal:
    driver: bridge

configs:
  anse-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;
        client_max_body_size 0;

        proxy_http_version 1.1;
        # Chat answers stream back as server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate anse:80;
        set $$app anse-app:8014;

        location = /_router/health { access_log off; return 204; }

        # The PWA manifest, and nothing else, bypasses the gate. nginx matches the
        # normalised path exactly and the URI sent on is fixed, so no other path
        # can ride this location.
        location = /manifest.webmanifest {
          proxy_pass http://$$app/manifest.webmanifest;
        }

        # Every other path, including the gate's own /AppShield/ (and legacy
        # /nhl-auth/) endpoints: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: anse-router
  webui_port: 80
  index: /
  category: AI
  tags: ["ai", "chat", "llm"]
  developer: ddiu8081
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Anse
  tagline:
    en_us: A fast, polished web UI for AI chats
  description:
    en_us: &desc |
      Anse is a fully optimized UI for AI chats, with a supercharged experience for several models: ChatGPT (the OpenAI API, or any OpenAI-compatible endpoint you set), DALL-E image generation and Stable Diffusion through Replicate.

      Keep many conversations side by side, give each one its own model, system prompt and temperature, and switch between single-shot and continuous chat. Answers render Markdown, code and maths.

      You bring the AI: add your provider's API key in Anse's Settings panel. Conversations, settings and keys are stored in your browser, not on the server, so each browser keeps its own.

      The app is protected by your server account (single sign-on). On a server without single sign-on, use the app password Maison shows on first open (also in the tile menu under **Credentials**).
  tips:
    before_install:
      en_us: &tips |
        **Sign-in:** Anse is protected by your server account (single sign-on).
        On a server without single sign-on, or while it is unavailable, sign in with the app password Maison shows on first open (also in the tile menu under **Credentials**).

        **First use:** in the **Settings** panel on the right, press the pencil next to **OpenAI** (or **Replicate**, for Stable Diffusion images) and paste your API key. **Base URL** there can point to any OpenAI-compatible endpoint instead. Then press **New** and start a conversation.

        **Your data stays in your browser:** conversations, settings and API keys are kept in the browser you use, not on the server. Another browser or device starts empty, and clearing the site's data deletes them.

        Access via: `${APP_URL:-https://anse-${APP_DOMAIN}}`

x-compose-app:
  schema_version: 2
  id: anse
  version: "1.1.11"
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  # The first route is the web UI.
  routes:
    - { service: anse-router, name: anse, upstream-port: 80 }
  # Maison reads x-compose-app only: x-casaos is kept for CasaOS and older Maison, and must match.
  title:
    en_us: Anse
  tagline:
    en_us: A fast, polished web UI for AI chats
  description:
    en_us: *desc
  developer: ddiu8081
  category: AI
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  # Chatting needs an API key from an AI provider, with paid API credit.
  cost: paid
  accounts:
    - provider: OpenAI
      url: https://platform.openai.com/
    - provider: Replicate
      url: https://replicate.com/
  tips:
    en_us: *tips
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
