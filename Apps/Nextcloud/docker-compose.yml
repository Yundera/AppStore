name: nextcloud

services:
  nextcloud:
    image: nextcloud:33.0.3
    container_name: nextcloud
    restart: unless-stopped
    user: $PUID:$PGID
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - 80
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      # Auto-install: skip the setup wizard, log in directly with admin / $NEXTCLOUD_ADMIN_PASSWORD
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      # Do NOT set REDIS_HOST here. The official entrypoint reacts to it by writing
      # /usr/local/etc/php/conf.d/redis-session.ini, a root-owned path baked into
      # the image that no volume covers, so this container (running as
      # $PUID:$PGID) cannot create it: the entrypoint dies and `restart:
      # unless-stopped` loops it forever. Without REDIS_HOST the entrypoint keeps
      # PHP's default session handler; Redis is wired up as the distributed cache
      # and file-locking backend by the configure-redis-and-cron step instead (memcache.local
      # stays APCu, from the image's own apcu.config.php). The password below is
      # inert for the entrypoint and is what the configure-redis-and-cron step reads.
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASSWORD}
      # Install-time only; the trusted-domains step keeps the list current afterwards.
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost $APP_DOMAIN ${APP_HOST:-nextcloud-${APP_DOMAIN}}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${APP_HOST:-nextcloud-${APP_DOMAIN}}
      - TRUSTED_PROXIES=172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
      - NC_maintenance_window_start=4
    volumes:
      # nextcloud root directory, Contains the core application files
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/root/:/var/www/html/:z
      # Stores all user files, uploads, and app data
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/data/:/var/www/html/data/
      # Essential for maintaining settings between container updates
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/config/:/var/www/html/config/
      # Stores manually installed apps that aren't part of the base image, Preserves custom apps during updates
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/apps/:/var/www/html/apps/
    networks:
      - nextcloud-network
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  db:
    image: mariadb:12.2.2
    container_name: nextcloud_db
    user: $PUID:$PGID
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 1G
    command: >
      --innodb-buffer-pool-size=256M
      --transaction-isolation=READ-COMMITTED
      --binlog-format=ROW
      --innodb-file-per-table=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - TZ=$TZ
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/db/:/var/lib/mysql/
    restart: unless-stopped
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.6.2-alpine3.23
    container_name: nextcloud_redis
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 256M
    # Stated explicitly per the Permission Strategy, and it matches the ownership
    # `x-compose-app.folders` gives /DATA/AppData/nextcloud/redis.
    user: $PUID:$PGID
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - TZ=$TZ
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/redis/:/data/
    restart: unless-stopped
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${NEXTCLOUD_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cron:
    image: nextcloud:33.0.3
    container_name: nextcloud_cron
    restart: unless-stopped
    cpu_shares: 30
    deploy:
      resources:
        limits:
          memory: 512M
    # Must match the `nextcloud` service exactly so cron.php sees the same file
    # ownership as the web container.
    user: $PUID:$PGID
    # The image's default entrypoint, /cron.sh, runs busybox crond, which is asked
    # to execute a crontab entry belonging to www-data (uid 33) while crond itself
    # runs as $PUID:$PGID (uid 1000) — a privilege change (setuid to another
    # non-root uid) it cannot make. So the cron job never fires at all: no error,
    # no log, just an empty core/lastcron forever and Nextcloud's admin overview
    # reporting "Last background job execution ran 56 years ago" (the epoch, i.e.
    # never once). This is a different defect from the one the 2026-08-27 fix
    # addressed (that one was really about /cron.sh running as the wrong uid and
    # failing to write config.php) — this container already runs as the right uid,
    # it's /cron.sh's internal setuid that's broken, so keeping `user: $PUID:$PGID`
    # alone does not fix it.
    #
    # Bypass /cron.sh and call cron.php directly instead: no setuid needed, so the
    # uid this container already runs as is all that's required. Nextcloud's own
    # docs recommend a 5-minute interval for system cron, matching this
    # requirement's wording, so loop on 300s. `|| true` after php keeps a single
    # failed tick (e.g. a transient DB hiccup) from exiting the loop — and with it
    # the container, which `restart: unless-stopped` would otherwise cycle.
    #
    # `command` MUST be a LIST whose single element is a `- |` block scalar, not a
    # plain folded string (`command: >`) — folded form gets word-split into argv by
    # compose and `sh -c` only receives the first word (see Apps/Crafty, which shipped
    # dead this way; Apps/Tailscale and Apps/TINCatan use this same list-of-one shape).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php -f /var/www/html/cron.php || true
          sleep 300
        done
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/root/:/var/www/html/:z
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/data/:/var/www/html/data/
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/config/:/var/www/html/config/
      - ${DATA_ROOT:-/DATA}/AppData/nextcloud/apps/:/var/www/html/apps/
    networks:
      - nextcloud-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Talk High-Performance Backend: the official Nextcloud AIO talk image bundles the
  # signaling server, Janus (SFU), NATS and an eturnal TURN server. Without it Talk
  # runs every call peer-to-peer, which falls apart past ~4 participants.
  # Browsers reach signaling over HTTPS on its own route (nextcloud-signaling → 8081);
  # media goes through TURN on 3478 tcp/udp of the server's public IP, which Janus
  # also relays through, so 3478 is the only port the call path needs.
  talk:
    image: ghcr.io/nextcloud-releases/aio-talk:20260929_105435
    container_name: nextcloud_talk
    restart: unless-stopped
    user: $PUID:$PGID
    init: true
    read_only: true
    tmpfs:
      - /run
      - /opt/eturnal/run
      - /conf
      - /tmp
    cap_drop:
      - NET_RAW
    cpu_shares: 80
    deploy:
      resources:
        limits:
          memory: 1G
    expose:
      - 8081
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    environment:
      - TZ=$TZ
      - NC_DOMAIN=${APP_HOST:-nextcloud-${APP_DOMAIN}}
      # Same as AIO: TALK_HOST is the container itself, so TURN relays on the
      # container address and Janus (same container) reaches TURN without hairpin.
      - TALK_HOST=nextcloud_talk
      - TURN_DOMAIN=nextcloud_talk
      - TALK_PORT=3478
      - TURN_SECRET=${TALK_TURN_SECRET}
      - SIGNALING_SECRET=${TALK_SIGNALING_SECRET}
      - INTERNAL_SECRET=${TALK_INTERNAL_SECRET}
      - AIO_LOG_LEVEL=warn
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - pcs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  nextcloud-network:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  main: nextcloud
  webui_port: 80
  index: /

  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  thumbnail: thumbnail.png

  category: Utilities

  # `needs-public-ip`: the talk service publishes TURN on 3478 tcp/udp, which call
  # participants reach directly. See the ports: block on that service.
  tags: ["files", "productivity", "business", "personal", "needs-public-ip"]
  architectures: [amd64, arm64]
  developer: Nextcloud GmbH
  description:
    en_us: |
      **☁️ What is Nextcloud?**

      **Nextcloud** is your own personal cloud : like **Google Drive, Dropbox, Microsoft Teams, and WhatsApp all-in-one**, but fully under your control.

      If you want to sync your files across devices, you'll need to use the Nextcloud Files app --- it's like your own private version of Google Drive or Dropbox.

      You can **store files, share them, collaborate, chat, and even manage calendars and tasks**, all from a single private space.

      Think of it as your **own private workspace**, with apps you choose, running on your own server.

      **🔧 What Can You Do with Nextcloud?**

      Nextcloud is modular : you can **add features like apps on a phone**. Here are some of the most popular ones:

      • 📁 **Nextcloud Files**: Upload, access, and share files --- like your own Google Drive
      • 🗓️ **Calendar**: Manage events and sync with your phone or laptop
      • 📇 **Contacts**: Store and sync all your contacts privately
      • 🗣️ **Talk**: Chat and video call with your team or family --- like a private WhatsApp or Zoom
      • ✅ **Deck**: Organize tasks and projects like Trello or Notion
      • 📝 **Nextcloud Office**: Open and edit Word, Excel, and PowerPoint files in your browser --- just like Google Docs
      • 📦 **More Apps**: Over 100+ apps available to customize your workspace

      **🚀 Why Use Nextcloud?**

      • **No more Google or Microsoft** --- keep your files and data private
      • **Fully customizable** --- add only the tools you need
      • **Accessible anywhere** --- use the official Nextcloud mobile app or desktop app
      • **Share with others** --- send files, create shared folders, or chat securely
      • **Control your data** --- your files, your server, your rules

      **🛠️ Example Use Cases**

      • Use **Nextcloud Files** like Google Drive
      • Use **Talk** to message and call like WhatsApp or Zoom
      • Use **Office + Calendar + Deck** to replace Microsoft Teams
      • Invite your team or family and manage everything from one place
    en_gb: |
      **☁️ What is Nextcloud?**

      **Nextcloud** is your own personal cloud : like **Google Drive, Dropbox, Microsoft Teams, and WhatsApp all-in-one**, but fully under your control.

      If you want to sync your files across devices, you'll need to use the Nextcloud Files app --- it's like your own private version of Google Drive or Dropbox.

