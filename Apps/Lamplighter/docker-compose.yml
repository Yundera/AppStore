name: lamplighter

# Bounded container logs: json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── the app ───────────────────────────────────────────────────────────────────────────
  # No route of its own: reachable from outside only through the AppShield gate below. On the
  # shared network because it calls the box's Beacon (and through it the shared claude-code
  # container), and because that agent calls back into its workspace endpoint.
  lamplighter-backend:
    image: ghcr.io/worph/lamplighter:0.2.1
    container_name: lamplighter-backend
    hostname: lamplighter-backend
    restart: unless-stopped
    user: $PUID:$PGID
    expose:
      - 8080
    environment:
      TZ: $TZ
      LAMPLIGHTER_DATA_DIR: /DATA
      LAMPLIGHTER_PORT: "8080"
      # Seeds config.yaml on first boot only; Settings → Inference changes it afterwards.
      # Any OpenAI-compatible endpoint works too (driver `openai`, a base URL and a model).
      LAMPLIGHTER_INFERENCE_DRIVER: claude-code
      LAMPLIGHTER_INFERENCE_URL: http://beacon-backend:9300/mcp
      LAMPLIGHTER_INFERENCE_TOOL: claude-code__query_claude
      LAMPLIGHTER_INFERENCE_VIA: beacon
      # How the agent reaches the workspace endpoint: the backend by name on `pcs`, never the
      # AppShield gate (an SSO redirect is not an API answer).
      LAMPLIGHTER_PUBLIC_URL: http://lamplighter-backend:8080
      # Bearer of the admin MCP endpoint, shared with the lamplighter-mcp sidecar.
      LAMPLIGHTER_ADMIN_MCP_TOKEN: ${LAMPLIGHTER_ADMIN_MCP_TOKEN}
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/lamplighter/:/DATA
    networks:
      - pcs
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── the admin MCP, announced to this box's Beacon ─────────────────────────────────────
  # Points at the backend directly, never at the gate. The bearer never travels in the
  # announce manifest — Beacon calls the sidecar, the sidecar adds the header.
  lamplighter-mcp:
    image: ghcr.io/worph/beaconify:1.0.3
    container_name: lamplighter-mcp
    hostname: lamplighter-mcp
    restart: unless-stopped
    expose:
      - 9099
    environment:
      TZ: $TZ
      BEACONIFY_NAME: lamplighter
      BEACONIFY_DESCRIPTION: "Lamplighter — keeps a fleet of git repos maintained (docs, CVEs, deps, dead code, quality, patterns, architecture, security). Read repos, findings, rounds, proposals and the schedule; request rounds and fixes; dismiss findings; edit policy and check switches. Cannot approve, merge or push."
      BEACONIFY_UPSTREAM_URL: http://lamplighter-backend:8080/mcp/admin
      BEACONIFY_AUTH: "Bearer ${LAMPLIGHTER_ADMIN_MCP_TOKEN}"
    depends_on:
      - lamplighter-backend
    networks:
      - pcs
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── the only public surface ───────────────────────────────────────────────────────────
  lamplighter:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    # OIDC identity: the auth-registrar attests the app name through this container's PTR
    # record, so container_name, hostname and the compose name must all be `lamplighter`.
    container_name: lamplighter
    hostname: lamplighter
    restart: unless-stopped
    user: 0:0
    expose:
      - 80
    environment:
      TZ: $TZ
      BACKEND_HOST: "lamplighter-backend"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env): the registrar on a
      # Yundera box, or a provider the user configured. Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      # Without a value (a platform that ignores x-compose-app) the gate generates
      # one and prints it in its log.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      # Empty elsewhere, where the gate falls back to REDIRECT_HOST_SUFFIXES.
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # No ALLOWED_PATHS: forge push webhooks would be a machine path, and the store opens
      # none through the gate. Lamplighter polls each remote instead (Settings → Schedule).
    depends_on:
      - lamplighter-backend
    networks:
      - pcs
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-compose-app:
  schema_version: 2
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  id: lamplighter
  version: "0.2.1"
  routes:
    - { service: lamplighter, name: lamplighter, upstream-port: 80 }
  title:
    en_us: Lamplighter
  tagline:
    en_us: An LLM that keeps your git repositories maintained
  description:
    en_us: |
      **Lamplighter walks its rounds over your git repositories — on a schedule and after every push — and keeps them lit.**

      Nine checks: documentation drift, known CVEs, outdated dependencies, dead code, refactoring, code quality, bad patterns, architecture and security. Findings are remembered — a dismissal sticks until the code it is about changes. Fixes are written by an LLM, validated by a second, independent session, and delivered per check as a report, a branch, a pull request or a push, with you approving each one in the Activity page.

      - GitHub, Gitea and plain git remotes; forge tokens stay in Lamplighter, never in a prompt
      - Any inference backend: Claude Code over MCP through Beacon, or any OpenAI-compatible API with function calling
      - An administrator chat, and an admin MCP so other assistants can read the fleet and request rounds
  developer: Worph
  category: Developer
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  # Developer and AI-agent tooling.
  audience: technical
  tips:
    en_us: |
      The CVE and dependency checks work at once. The LLM checks need a backend in **Settings → Inference**, then **Test**: preset is Claude Code's `query_claude` through this box's **Beacon** (the Claude Code listing ships with MCP off — enable it on boxes that should serve it), or any OpenAI-compatible API with function calling (OpenAI, OpenRouter, Ollama…).

      1. **Settings → Forges**: add GitHub or Gitea with a fine-grained token (contents and pull requests: read and write), or a plain git remote prefix.
      2. **Repos → Add repositories**: enrol a few, then press **Round** on a check.
      3. **Activity**: approve, reject or merge what Lamplighter proposes.

      Everything Lamplighter keeps lives in `AppData/lamplighter/`: `config.yaml`, `checks/*.md` (the check prompts, editable), `lamplighter.db` and the clones under `repos/`.
  folders:
    - path: /DATA/AppData/lamplighter
      user: $PUID
      group: $PGID
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
    # Bearer of the admin MCP endpoint, between the backend and the lamplighter-mcp sidecar.
    LAMPLIGHTER_ADMIN_MCP_TOKEN: hex:32

x-casaos:
  store_app_id: lamplighter
  main: lamplighter
  webui_port: 80
  architectures:
    - amd64
    - arm64
  author: Worph
  developer: Worph
  category: Developer
  tags: ["developer", "ai", "git"]
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Lamplighter
  tagline:
    en_us: An LLM that keeps your git repositories maintained
  description:
    en_us: |
      **Lamplighter walks its rounds over your git repositories — on a schedule and after every push — and keeps them lit.**

      Nine checks: documentation drift, known CVEs, outdated dependencies, dead code, refactoring, code quality, bad patterns, architecture and security. Findings are remembered — a dismissal sticks until the code it is about changes. Fixes are written by an LLM, validated by a second, independent session, and delivered per check as a report, a branch, a pull request or a push, with you approving each one in the Activity page.

      - GitHub, Gitea and plain git remotes; forge tokens stay in Lamplighter, never in a prompt
      - Any inference backend: Claude Code over MCP through Beacon, or any OpenAI-compatible API with function calling
      - An administrator chat, and an admin MCP so other assistants can read the fleet and request rounds
  tips:
    before_install:
      en_us: |
        The CVE and dependency checks work at once. The LLM checks need a backend in **Settings → Inference**, then **Test**: preset is Claude Code's `query_claude` through this box's **Beacon** (the Claude Code listing ships with MCP off — enable it on boxes that should serve it), or any OpenAI-compatible API with function calling (OpenAI, OpenRouter, Ollama…).

        1. **Settings → Forges**: add GitHub or Gitea with a fine-grained token (contents and pull requests: read and write), or a plain git remote prefix.
        2. **Repos → Add repositories**: enrol a few, then press **Round** on a check.
        3. **Activity**: approve, reject or merge what Lamplighter proposes.

        Everything Lamplighter keeps lives in `AppData/lamplighter/`: `config.yaml`, `checks/*.md` (the check prompts, editable), `lamplighter.db` and the clones under `repos/`.
