  developer: Kopia Authors
  category: Backup
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  main: kopia
  tips:
    en_us: |
      Setup takes three steps

      1. Create a private bucket and an application key limited to it (on Backblaze:
         Buckets › Create, then Application Keys › Add, restricted to that bucket).
      2. In /DATA/AppData/kopia/engine/, copy connect.json.example to connect.json and
         credentials.env.example to credentials.env, and fill both in. The engine
         connects within a minute; check the kopia-engine logs if it does not.
      3. Open Settings › Backups and click Enable on Kopia, then tick it for the
         nightly backup.

      Save the repository password (Settings › Backups offers it by email or on
      screen). It is the only way to read these backups on another server.

