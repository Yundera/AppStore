name: kopia

# Kopia as Maison's off-site backup engine, for a box with no backup provisioned by
# its platform (the stock FOSS mesh stack). A Yundera PCS already runs a `kopia` stack
# of its own, and Maison refuses to install this app over it.
#
# Three containers, the same shape the Yundera platform stack uses, and a small router:
#
#   kopia         AppShield gate. The only public entrypoint (kopia-${APP_DOMAIN}).
#   kopia-router  nginx between the gate and the UI. See its config below.
#   kopia-app     `kopia server --ui` — kopia's own web UI, to browse and restore.
#   kopia-engine  `maison-engine serve` — the container Maison `docker exec`s into.
#
# Setup is kopia's own screen: with no repository yet, the UI opens on it. The repository
# it creates lands in /DATA/AppData/kopia/engine/, the engine picks it up from there, and
# Maison asks the admin to enable it in Settings > Backups. See rationale.md.

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kopia:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: kopia
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via
    # the container's PTR record, rejecting any redirect URI that doesn't match. Must
    # equal the app name, or Docker defaults the hostname to the random container ID
    # and OIDC registration fails.
    hostname: kopia
    restart: unless-stopped
    environment:
      # The app's own router, not the UI (see kopia-router below).
      BACKEND_HOST: "kopia-router"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      SESSION_DURATION_HOURS: "720"
    expose:
      - 80
    depends_on:
      - kopia-router
    networks:
      # On `pcs` because the router and auth-registrar must reach it, and on the app's
      # own network because that is where kopia's UI lives.
      - pcs
      - kopia-internal
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

  # Behind the gate, on the app's own network only: every request is gated anyway.
  kopia-router:
    image: nginx:1.31.8-alpine
    container_name: kopia-router
    restart: unless-stopped
    expose:
      - 80
    configs:
      - source: kopia-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - kopia-internal
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  kopia-app:
    image: ghcr.io/yundera/maison-kopia-engine:1.4.0
    container_name: kopia-app
    # The identity a repository created from the UI is filed under: the engine's,
    # because Maison only execs into a container whose hostname matches it.
    hostname: kopia-pcs
    restart: unless-stopped
    # The UI is kopia's own server. With no repository yet it opens on kopia's setup
    # screen, which writes repository.config where the engine reads it. kopia keeps the
    # password it was given in repository.config.kopia-password (base64), so the loop
    # hands that to repository.password, the file the engine reads.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        E=/DATA/AppData/kopia/engine
        (
          while sleep 5; do
            if [ -s "$$E/repository.config.kopia-password" ]; then
              base64 -d "$$E/repository.config.kopia-password" > "$$E/repository.password.tmp"
              chmod 600 "$$E/repository.password.tmp"
              mv "$$E/repository.password.tmp" "$$E/repository.password"
              rm "$$E/repository.config.kopia-password"
            fi
          done
        ) &
        if [ -f "$$E/credentials.env" ]; then set -a; . "$$E/credentials.env"; set +a; fi
        if [ -f "$$E/repository.config" ] && [ -f "$$E/repository.password" ]; then
          export KOPIA_PASSWORD="$$(cat "$$E/repository.password")"
        fi
        exec /bin/kopia server start \
          --config-file="$$E/repository.config" \
          --address=0.0.0.0:51515 \
          --ui \
          --ui-preferences-file="$$E/ui-preferences.json" \
          --insecure \
          --without-password \
          --allow-extremely-dangerous-unauthenticated-server-on-the-network \
          --no-grpc \
          --no-check-for-updates
    # Root with five capabilities, like the engine: browsing and restoring files
    # owned by other apps' uids. See rationale.md.
    user: 0:0
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - FSETID
    security_opt:
      - no-new-privileges:true
    environment:
      # The image turns this off, and the setup screen's password would then be lost.
      KOPIA_PERSIST_CREDENTIALS_ON_CONNECT: "true"
      KOPIA_CACHE_DIRECTORY: "/DATA/AppData/kopia/engine/cache"
      KOPIA_LOG_DIR: "/DATA/AppData/kopia/engine/logs"
      TZ: $TZ
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}
        target: /DATA
        bind:
          propagation: rshared
    expose:
      - 51515
    # Not routed and NOT on `pcs`: the server runs without a password of its
    # own, so the gate must be the only way in. DO NOT move this service onto `pcs`.
    networks:
      - kopia-internal
    cpu_shares: 50
    logging: *logging
    # 4G: as the maintenance owner this server runs the daily full maintenance, whose
    # memory grows with the repository (1G was OOM-killed at ~1.9M contents, 119 GB).
    deploy:
      resources:
        limits:
          memory: 4G

  kopia-engine:
    image: ghcr.io/yundera/maison-kopia-engine:1.4.0
    container_name: kopia-engine
    # The identity snapshots are filed under (pcs@kopia-pcs). It is written once into
    # repository.config at connect, and Maison only execs into a container whose
    # hostname matches it — change it and every backup becomes a new source.
    hostname: kopia-pcs
    restart: unless-stopped
    # Resident: waits for the repository the setup screen creates, writes the
    # adapter.json Maison discovers, then idles while Maison
    # runs `maison-engine <verb>` in it with `docker exec`.
    command: ["serve", "--repo-dir=/DATA/AppData/kopia/engine"]
    user: 0:0
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH   # read app data owned by other uids
      - DAC_OVERRIDE      # restore into it
      - CHOWN             # put recorded ownership back on restore
      - FOWNER
      - FSETID
    security_opt:
      - no-new-privileges:true
    environment:
      # What serve writes into adapter.json. MAISON_ENGINE_IMAGE must be the exact
      # string of `image:` above: Maison only enables an engine whose container
      # runs the image its descriptor names.
      MAISON_ENGINE_IMAGE: "ghcr.io/yundera/maison-kopia-engine:1.4.0"
      MAISON_ENGINE_CONTAINER: "kopia-engine"
      KOPIA_CACHE_DIRECTORY: "/DATA/AppData/kopia/engine/cache"
      KOPIA_LOG_DIR: "/DATA/AppData/kopia/engine/logs"
      TZ: $TZ
    volumes:
      # The whole of /DATA: it is what gets backed up and restored. Maison passes
      # the paths; the engine never derives them.
      - type: bind
        source: ${DATA_ROOT:-/DATA}
        target: /DATA
        bind:
          propagation: rshared
    tmpfs:
      - /run/maison-ops
    # Needs the internet to reach the bucket, but nothing needs to reach it.
    networks:
      - kopia-internal
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  kopia-internal:
    name: kopia-internal

configs:
  kopia-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      server {
        listen 80;
        absolute_redirect off;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_http_version 1.1;
        # The gate already set these from the real client; pass them on as they are.
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$http_x_real_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_x_forwarded_host;

        # Browsers fetch a web manifest without cookies unless told otherwise, so the gate
        # sent kopia's to the SSO and the page logged a CORS error. sub_filter needs the
        # page uncompressed.
        proxy_set_header Accept-Encoding "";
        sub_filter '<link rel="manifest"' '<link rel="manifest" crossorigin="use-credentials"';

        set $$kopia kopia-app:51515;

        # While a path is typed in New Snapshot, kopia's UI asks for the policy of each
        # partial path. Kopia answers 400 for "no policy here", which the UI expects and
        # the browser logs as an error. An empty policy says the same without the error.
        # Only that GET: a 400 on saving or deleting a policy is real and passes through.
        location = /api/v1/policy {
          error_page 418 = @kopia;
          if ($$request_method != GET) { return 418; }
          proxy_intercept_errors on;
          error_page 400 = @no-policy;
          proxy_pass http://$$kopia;
        }
        location @no-policy {
          default_type application/json;
          return 200 '{}';
        }
        location @kopia { proxy_pass http://$$kopia; }

        # Before creating a repository kopia's UI asks whether one exists. Kopia answers 400
        # NOT_INITIALIZED, which the UI expects and the browser logs as an error. The UI only
        # needs a non-2xx status and the JSON body, and browsers log from 400 up, so the 400
        # is asked again (nginx can't keep the first body) and sent on as a 300, body intact:
        # storage errors still reach the setup screen. Only this read-only probe.
        location = /api/v1/repo/exists {
          proxy_request_buffering on;
          proxy_intercept_errors on;
          error_page 400 =300 @repo-exists;
          proxy_pass http://$$kopia;
        }
        location @repo-exists {
          proxy_request_buffering on;
          proxy_pass http://$$kopia;
        }

        location / { proxy_pass http://$$kopia; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: kopia
  developer: Kopia Authors
  category: Backup
  tags: ["backup", "personal"]
  description:
    en_us: |
      💾 **What is Kopia?**

      **Kopia** is a fast, encrypted, deduplicating backup tool. This app plugs it into
      your server's **Backups** page as an off-site destination: your apps and your
      Documents, Downloads and Media are backed up every night to a storage bucket you
      own — Backblaze B2, or any S3-compatible service.

      ✅ **What you get**
      • Nightly, incremental, end-to-end encrypted backups to your own bucket
      • Restore an app or your files from the Backups page, like a local backup
      • Kopia's own web UI to browse snapshots and restore single files

      🔑 **You hold the key.** You choose the repository password at setup and it never leaves this server unless you save it. Without it, nobody — including you — can read
      the backups. Save it somewhere off the server.

      ⚠️ **For servers without a provided backup.** A Yundera PCS already includes
      Yundera Backup; this app is for self-hosted servers that do not.
    fr_fr: |
      💾 **Qu'est-ce que Kopia ?**

      **Kopia** est un outil de sauvegarde rapide, chiffré et dédupliqué. Cette
      application le branche sur la page **Sauvegardes** de votre serveur comme
      destination externe : vos applications ainsi que vos Documents, Téléchargements
      et Médias sont sauvegardés chaque nuit vers un bucket qui vous appartient —
      Backblaze B2 ou tout service compatible S3.

      ✅ **Ce que vous obtenez**
      • Des sauvegardes nocturnes, incrémentales et chiffrées de bout en bout
      • La restauration d'une application ou de vos fichiers depuis la page Sauvegardes
      • L'interface web de Kopia pour parcourir les instantanés et restaurer un fichier

      🔑 **Vous détenez la clé.** Vous choisissez le mot de passe du dépôt à la configuration et il ne quitte pas ce serveur tant que vous ne l'avez pas sauvegardé. Sans lui, personne — vous
      compris — ne peut lire les sauvegardes. Conservez-le hors du serveur.

      ⚠️ **Pour les serveurs sans sauvegarde fournie.** Un PCS Yundera inclut déjà
      Yundera Backup ; cette application s'adresse aux serveurs auto-hébergés.
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  tagline:
    en_us: Encrypted nightly backups of your server to your own Backblaze B2 or S3 bucket.
    fr_fr: Des sauvegardes nocturnes chiffrées de votre serveur vers votre propre bucket Backblaze B2 ou S3.
  tips:
    before_install:
      en_us: |
        Setup happens in your browser

        1. Create a private bucket and an application key limited to it (on Backblaze:
           Buckets › Create, then Application Keys › Add, restricted to that bucket).
        2. Open Kopia. On its setup screen pick your storage type, enter the bucket and the
           key, choose a repository password and create the repository. To try it without a
           bucket, pick Local Directory or NAS and enter /DATA/AppData/kopia/repository. That
           is for trying it only: the copy stays inside this app's folder on this server's
           disk, even though Settings › Backups calls it off-site, and it goes when you
           uninstall the app or lose the server.
        3. Within a minute Kopia appears in Settings › Backups. Click Enable, then tick it
           for the nightly backup.

        Save the repository password (Settings › Backups offers it by email or on
        screen). It is the only way to read these backups on another server.

        What this app can reach

        The engine and the UI mount the whole of /DATA, run as root with five file
        capabilities, and are only reachable through your server's sign-in.

        Not for a Yundera PCS, which ships its own Kopia engine.
      fr_fr: |
        La configuration se fait dans votre navigateur

        1. Créez un bucket privé et une clé d'application limitée à ce bucket (chez
           Backblaze : Buckets › Create, puis Application Keys › Add).
        2. Ouvrez Kopia. Sur son écran de configuration, choisissez le type de stockage,
           saisissez le bucket et la clé, choisissez un mot de passe de dépôt et créez le
           dépôt. Pour essayer sans bucket, choisissez Local Directory or NAS et saisissez
           /DATA/AppData/kopia/repository. C'est pour un essai seulement : la copie reste dans
           le dossier de cette application sur le disque de ce serveur, même si Paramètres ›
           Sauvegardes la dit externe, et disparaît si vous désinstallez l'application ou
           perdez le serveur.
        3. En moins d'une minute, Kopia apparaît dans Paramètres › Sauvegardes. Cliquez sur
           Activer, puis cochez-le pour la sauvegarde nocturne.

        Conservez le mot de passe du dépôt (Paramètres › Sauvegardes le propose par
        e-mail ou à l'écran). C'est le seul moyen de lire ces sauvegardes ailleurs.

        Ce à quoi cette application a accès

        Le moteur et l'interface montent tout /DATA, tournent en root avec cinq
        capacités de fichiers, et ne sont joignables qu'après connexion à votre serveur.

        Pas pour un PCS Yundera, qui embarque déjà son propre moteur Kopia.
  title:
    en_us: Kopia
  index: /
  webui_port: 80
  store_app_id: kopia

x-compose-app:
  schema_version: 2
  version: "1.4.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: kopia, name: kopia, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: kopia
  title:
    en_us: Kopia
  tagline:
    en_us: Encrypted nightly backups of your server to your own Backblaze B2 or S3 bucket.
    fr_fr: Des sauvegardes nocturnes chiffrées de votre serveur vers votre propre bucket Backblaze B2 ou S3.
  description:
    en_us: "\U0001F4BE **What is Kopia?**\n\n**Kopia** is a fast, encrypted, deduplicating backup tool. This app plugs it into\nyour server's **Backups** page as an off-site destination: your apps and your\nDocuments, Downloads and Media are backed up every night to a storage bucket you\nown — Backblaze B2, or any S3-compatible service.\n\n✅ **What you get**\n• Nightly, incremental, end-to-end encrypted backups to your own bucket\n• Restore an app or your files from the Backups page, like a local backup\n• Kopia's own web UI to browse snapshots and restore single files\n\n\U0001F511 **You hold the key.** You choose the repository password at setup and it never leaves this server unless you save it. Without it, nobody — including you — can read\nthe backups. Save it somewhere off the server.\n\n⚠️ **For servers without a provided backup.** A Yundera PCS already includes\nYundera Backup; this app is for self-hosted servers that do not.\n"
    fr_fr: "\U0001F4BE **Qu'est-ce que Kopia ?**\n\n**Kopia** est un outil de sauvegarde rapide, chiffré et dédupliqué. Cette\napplication le branche sur la page **Sauvegardes** de votre serveur comme\ndestination externe : vos applications ainsi que vos Documents, Téléchargements\net Médias sont sauvegardés chaque nuit vers un bucket qui vous appartient —\nBackblaze B2 ou tout service compatible S3.\n\n✅ **Ce que vous obtenez**\n• Des sauvegardes nocturnes, incrémentales et chiffrées de bout en bout\n• La restauration d'une application ou de vos fichiers depuis la page Sauvegardes\n• L'interface web de Kopia pour parcourir les instantanés et restaurer un fichier\n\n\U0001F511 **Vous détenez la clé.** Vous choisissez le mot de passe du dépôt à la configuration et il ne quitte pas ce serveur tant que vous ne l'avez pas sauvegardé. Sans lui, personne — vous\ncompris — ne peut lire les sauvegardes. Conservez-le hors du serveur.\n\n⚠️ **Pour les serveurs sans sauvegarde fournie.** Un PCS Yundera inclut déjà\nYundera Backup ; cette application s'adresse aux serveurs auto-hébergés.\n"
  developer: Kopia Authors
  category: Backup
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  # kopia-app runs full repository maintenance under a 4G cap.
  resources:
    recommended: { memory: 4G }
  # What the user must bring (GUIDELINES › What the user brings): the bucket the
  # backups go to is storage the user buys from a third party.
  cost: paid
  accounts:
    - provider: Backblaze B2 or another S3-compatible storage service
      url: https://www.backblaze.com/cloud-storage
  tips:
    en_us: |
      Setup happens in your browser

      1. Create a private bucket and an application key limited to it (on Backblaze:
         Buckets › Create, then Application Keys › Add, restricted to that bucket).
      2. Open Kopia. On its setup screen pick your storage type, enter the bucket and the
         key, choose a repository password and create the repository. To try it without a
         bucket, pick Local Directory or NAS and enter /DATA/AppData/kopia/repository. That
         is for trying it only: the copy stays inside this app's folder on this server's
         disk, even though Settings › Backups calls it off-site, and it goes when you
         uninstall the app or lose the server.
      3. Within a minute Kopia appears in Settings › Backups. Click Enable, then tick it
         for the nightly backup.

      Save the repository password (Settings › Backups offers it by email or on
      screen). It is the only way to read these backups on another server.

      What this app can reach

      The engine and the UI mount the whole of /DATA, run as root with five file
      capabilities, and are only reachable through your server's sign-in.

      Not for a Yundera PCS, which ships its own Kopia engine.
    fr_fr: |
      La configuration se fait dans votre navigateur

      1. Créez un bucket privé et une clé d'application limitée à ce bucket (chez
         Backblaze : Buckets › Create, puis Application Keys › Add).
      2. Ouvrez Kopia. Sur son écran de configuration, choisissez le type de stockage,
         saisissez le bucket et la clé, choisissez un mot de passe de dépôt et créez le
         dépôt. Pour essayer sans bucket, choisissez Local Directory or NAS et saisissez
         /DATA/AppData/kopia/repository. C'est pour un essai seulement : la copie reste dans
         le dossier de cette application sur le disque de ce serveur, même si Paramètres ›
         Sauvegardes la dit externe, et disparaît si vous désinstallez l'application ou
         perdez le serveur.
      3. En moins d'une minute, Kopia apparaît dans Paramètres › Sauvegardes. Cliquez sur
         Activer, puis cochez-le pour la sauvegarde nocturne.

      Conservez le mot de passe du dépôt (Paramètres › Sauvegardes le propose par
      e-mail ou à l'écran). C'est le seul moyen de lire ces sauvegardes ailleurs.

      Ce à quoi cette application a accès

      Le moteur et l'interface montent tout /DATA, tournent en root avec cinq
      capacités de fichiers, et ne sont joignables qu'après connexion à votre serveur.

      Pas pour un PCS Yundera, qui embarque déjà son propre moteur Kopia.
  # The engine directory holds the repository password and the storage key, so it is
  # 0700. Everything in it is written by the root engine, which copies this
  # directory's owner onto what it creates.
  folders:
    - path: /DATA/AppData/$AppID
    - path: /DATA/AppData/$AppID/engine
      mode: "0700"
    - path: /DATA/AppData/$AppID/engine/cache
    - path: /DATA/AppData/$AppID/engine/logs
    # The path the tips offer for trying the setup screen without a bucket.
    - path: /DATA/AppData/$AppID/repository
  # The engine's own state is not app data: the repository config and password are
  # useless inside the very repository they open, and the cache is rebuilt on demand.
  backup:
    skip: true
    exclude:
      - "**/cache/"
      - "**/logs/"
