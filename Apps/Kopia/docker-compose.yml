      La configuration tient en trois étapes

      1. Créez un bucket privé et une clé d'application limitée à ce bucket (chez
         Backblaze : Buckets › Create, puis Application Keys › Add).
      2. Dans /DATA/AppData/kopia/engine/, copiez connect.json.example en connect.json
         et credentials.env.example en credentials.env, puis remplissez-les. Le moteur
         se connecte en moins d'une minute ; sinon, consultez les logs de kopia-engine.
      3. Ouvrez Paramètres › Sauvegardes, cliquez sur Activer pour Kopia, puis
         cochez-le pour la sauvegarde nocturne.

      Conservez le mot de passe du dépôt (Paramètres › Sauvegardes le propose par
      e-mail ou à l'écran). C'est le seul moyen de lire ces sauvegardes ailleurs.

      Ce à quoi cette application a accès

      Le moteur et l'interface montent tout /DATA, tournent en root avec cinq
      capacités de fichiers, et ne sont joignables qu'après connexion à votre serveur.

      Pas pour un PCS Yundera, qui embarque déjà son propre moteur Kopia.
  # The engine directory holds the repository password and the storage key, so it is
  # 0700. Everything in it is written by the root engine, which copies this
  # directory's owner onto what it creates.
  folders:
    - path: /DATA/AppData/$AppID
    - path: /DATA/AppData/$AppID/engine
      mode: "0700"
    - path: /DATA/AppData/$AppID/engine/cache
    - path: /DATA/AppData/$AppID/engine/logs
  # The engine's own state is not app data: the repository config and password are
  # useless inside the very repository they open, and the cache is rebuilt on demand.
  backup:
    skip: true
    exclude:
      - "**/cache/"
      - "**/logs/"
  webui-host: kopia-${domain}
  webui-path: /
