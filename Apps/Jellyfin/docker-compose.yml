name: jellyfin

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jellyfin-proxy:
    image: ghcr.io/yundera/nginx-hash-lock:1.0.7
    container_name: jellyfin-proxy
    restart: unless-stopped
    expose:
      - 80
    user: "0:0"
    cpu_shares: 80
    logging: *logging
    environment:
      BACKEND_HOST: jellyfin
      BACKEND_PORT: "8096"
      LISTEN_PORT: "80"
      AUTH_DISABLED: "true"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - jellyfin
    networks:
      # Only `pcs`: the router reaches it here, and so is its backend.
      - pcs

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/config/:/config
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/cache/:/cache
      - ${DATA_ROOT:-/DATA}/Media/Movies/:/media/movies
      - ${DATA_ROOT:-/DATA}/Media/TV Shows/:/media/tvshows
      - ${DATA_ROOT:-/DATA}/Media/Music/:/media/music
      - ${DATA_ROOT:-/DATA}/Downloads/:/media/downloads
    user: $PUID:$PGID
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      # Kept on the shared network: a media server is something other apps on
      # this box legitimately address by name, not only through its public URL.
      - pcs

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  category: Media
  tags: ["media", "personal", "family"]
  developer: Jellyfin Project
  description:
    en_us: Jellyfin - The Free Software Media System that puts you in control of managing and streaming your media. Stream to any device from your own server.
    fr_fr: Jellyfin - Le système multimédia libre qui vous donne le contrôle total de la gestion et du streaming de vos médias. Diffusez vers n'importe quel appareil depuis votre propre serveur.
    es_es: Jellyfin - El sistema multimedia de software libre que te da control total sobre la gestión y transmisión de tus medios. Transmite a cualquier dispositivo desde tu propio servidor.
    zh_cn: Jellyfin - 免费开源媒体系统，让您完全控制媒体的管理和流媒体播放。从您自己的服务器流式传输到任何设备。
    ko_kr: Jellyfin - 미디어 관리 및 스트리밍을 완전히 제어할 수 있는 무료 오픈소스 미디어 시스템입니다. 자체 서버에서 모든 기기로 스트리밍하세요.
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  thumbnail: thumbnail.png
  index: /
  tagline:
    en_us: This is your Movie Hub. Watch your own movies, shows, and live TV - just like a streaming app, but fully hosted by you.
    fr_fr: Votre serveur de streaming multimédia personnel sans contraintes
    es_es: Tu servidor personal de transmisión multimedia sin ataduras
    zh_cn: 您的个人媒体流媒体服务器，完全自由
    ko_kr: 완전히 자유로운 개인 미디어 스트리밍 서버
  title:
    en_us: Jellyfin
  store_app_id: jellyfin
  main: jellyfin-proxy
  is_uncontrolled: false
  webui_port: 80
  tips:
    before_install:
      en_us: |
        💡 **Tips**: Jellyfin gives you a Netflix-style interface for the TV shows and movies stored on your computer or server.

        📖 **Setup guide**: [Set up your own streaming service](https://yundera.com/blog/tutorial-1/set-up-your-own-netflix-style-streaming-service-with-jellyfin-on-yundera-3)

        🎬 **Enjoy!** ❓ Questions? Contact us at help@yundera.com

        **Getting Started:**
        1. Open Jellyfin after installation
        2. Follow the setup wizard to create your admin account
        3. Add your media libraries (Movies, TV Shows, Music)

        **Media Location:**
        - Movies: `/DATA/Media/Movies/`
        - TV Shows: `/DATA/Media/TV Shows/`
        - Music: `/DATA/Media/Music/`

        **Tip:** Jellyfin is completely free with no subscriptions or limitations.
      ko_kr: |
        💡 **팁**: Jellyfin은 컴퓨터나 서버에 저장된 TV 프로그램과 영화를 위한 Netflix 스타일 인터페이스를 제공합니다.

        📖 **설정 가이드**: [나만의 스트리밍 서비스 설정하기](https://yundera.com/blog/tutorial-1/set-up-your-own-netflix-style-streaming-service-with-jellyfin-on-yundera-3)

        🎬 **즐기세요!** ❓ 궁금한 점이 있으신가요? help@yundera.com으로 연락주세요

        **시작하기:**
        1. 설치 후 Jellyfin 열기
        2. 설정 마법사를 따라 관리자 계정 생성
        3. 미디어 라이브러리 추가 (영화, TV 프로그램, 음악)

        **미디어 위치:**
        - 영화: `/DATA/Media/Movies/`
        - TV 프로그램: `/DATA/Media/TV Shows/`
        - 음악: `/DATA/Media/Music/`

        **팁:** Jellyfin은 구독이나 제한 없이 완전히 무료입니다.
      zh_cn: |
        💡 **提示**: Jellyfin 为存储在您计算机或服务器上的电视节目和电影提供 Netflix 风格的界面。

        📖 **设置指南**: [设置您自己的流媒体服务](https://yundera.com/blog/tutorial-1/set-up-your-own-netflix-style-streaming-service-with-jellyfin-on-yundera-3)

        🎬 **尽情享受！** ❓ 有问题？请联系 help@yundera.com

        **开始使用：**
        1. 安装后打开 Jellyfin
        2. 按照设置向导创建管理员账户
        3. 添加您的媒体库（电影、电视节目、音乐）

        **媒体位置：**
        - 电影：`/DATA/Media/Movies/`
        - 电视节目：`/DATA/Media/TV Shows/`
        - 音乐：`/DATA/Media/Music/`

        **提示：** Jellyfin 完全免费，没有订阅或限制。
      es_es: |
        💡 **Consejos**: Jellyfin te ofrece una interfaz estilo Netflix para los programas de TV y películas almacenados en tu computadora o servidor.

        📖 **Guía de configuración**: [Configura tu propio servicio de streaming](https://yundera.com/blog/tutorial-1/set-up-your-own-netflix-style-streaming-service-with-jellyfin-on-yundera-3)

        🎬 **¡Disfruta!** ❓ ¿Preguntas? Contáctanos en help@yundera.com

        **Para empezar:**
        1. Abre Jellyfin después de la instalación
        2. Sigue el asistente de configuración para crear tu cuenta de administrador
        3. Añade tus bibliotecas multimedia (Películas, Series, Música)

        **Ubicación de medios:**
        - Películas: `/DATA/Media/Movies/`
        - Series: `/DATA/Media/TV Shows/`
        - Música: `/DATA/Media/Music/`

        **Consejo:** Jellyfin es completamente gratuito sin suscripciones ni limitaciones.
      fr_fr: |
        💡 **Conseils**: Jellyfin vous offre une interface de style Netflix pour les émissions TV et films stockés sur votre ordinateur ou serveur.

        📖 **Guide de configuration**: [Configurez votre propre service de streaming](https://yundera.com/blog/tutorial-1/set-up-your-own-netflix-style-streaming-service-with-jellyfin-on-yundera-3)

        🎬 **Profitez-en !** ❓ Des questions ? Contactez-nous à help@yundera.com

        **Pour commencer :**
        1. Ouvrez Jellyfin après l'installation
        2. Suivez l'assistant de configuration pour créer votre compte administrateur
        3. Ajoutez vos bibliothèques multimédia (Films, Séries TV, Musique)

        **Emplacement des médias :**
        - Films : `/DATA/Media/Movies/`
        - Séries TV : `/DATA/Media/TV Shows/`
        - Musique : `/DATA/Media/Music/`

        **Astuce :** Jellyfin est entièrement gratuit sans abonnement ni limitation.

x-compose-app:
