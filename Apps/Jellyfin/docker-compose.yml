  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/cache
      user: $PUID
      group: $PGID
    - path: /DATA/Media/Movies
      user: $PUID
      group: $PGID
    - path: /DATA/Media/TV Shows
      user: $PUID
      group: $PGID
    - path: /DATA/Media/Music
      user: $PUID
      group: $PGID
    - path: /DATA/Downloads
      user: $PUID
      group: $PGID
  backup:
    # Regenerable data: restored empty, rebuilt by the app. Declared in folders above.
    exclude:
