name: vikunja

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The login gate. Vikunja's own sign-up stays open to anyone who can reach it
  # (with registration disabled, nobody could create the first account from the
  # browser), so the whole app sits behind the platform SSO.
  vikunja-proxy:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: vikunja
    # The AppShield auth-service builds its OIDC redirect URIs from os.hostname(),
    # and the auth-registrar attests this app's name via the container's PTR record.
    hostname: vikunja
    restart: unless-stopped
    environment:
      # Behind the gate: the app's router, then Vikunja (see vikunja-router).
      BACKEND_HOST: "vikunja-router"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      vikunja-router:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On the shared network to reach the platform's auth-registrar, and on the
      # app's own network, where the router lives.
      - pcs
      - vikunja-internal

  vikunja-app:
    image: vikunja/vikunja:2.8.0
    container_name: vikunja-app
    restart: unless-stopped
    # A single static binary with no root-only setup: it runs straight as the box user.
    user: "$PUID:$PGID"
    environment:
      # The app's primary address: links in notifications, exports and imports.
      VIKUNJA_SERVICE_PUBLICURL: "${APP_URL:-https://vikunja-${APP_DOMAIN}}/"
      # Signs sessions and tokens; generated once per install and kept in .env.
      VIKUNJA_SERVICE_SECRET: "${VIKUNJA_SECRET}"
      # SQLite: no database service. The image already defaults to this path;
      # stated here because /db is the mapped volume below.
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    expose:
      - 3456
    volumes:
      # The SQLite database (users, projects, tasks, sessions).
      - ${DATA_ROOT:-/DATA}/AppData/vikunja/db:/db
      # Task attachments, avatars and project backgrounds.
      - ${DATA_ROOT:-/DATA}/AppData/vikunja/files:/app/vikunja/files
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 50
    logging: *logging
    networks:
      # App-private only: reached solely through the gate and the router.
      - vikunja-internal

  # The app's own router, behind the gate (every request is gated anyway).
  # Vikunja writes its public URL into every page as the frontend's API base
  # (window.API_URL), so on any other host the box serves the app at (the
  # gateway or IP name) the frontend called the primary host cross-origin and
  # failed. The router rewrites that one assignment to '' (the page's own
  # origin, which is what Vikunja's frontend uses when the value is empty), so
  # every host works, while VIKUNJA_SERVICE_PUBLICURL still names the primary
  # one for links.
  # On the app's own network only: the gate is the one way in.
  vikunja-router:
    image: nginx:1.31.10-alpine
    container_name: vikunja-router
    restart: unless-stopped
    depends_on:
      - vikunja-app
    expose:
      - 80
    configs:
      - source: vikunja-router
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    cpu_shares: 50
    logging: *logging
    networks:
      - vikunja-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  vikunja-internal:
    driver: bridge

configs:
  vikunja-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }

      server {
        listen 80;
        absolute_redirect off;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        # The gate already set these from the real client; pass them on as they are.
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$http_x_real_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_x_forwarded_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;
        # Uncompressed from Vikunja, so the HTML rewrite below can see the page.
        proxy_set_header Accept-Encoding "";

        set $$app vikunja-app:3456;

        location = /_router/health { access_log off; return 204; }

        # In HTML only (sub_filter's default type), the public URL Vikunja injects
        # as the API base becomes '' and is kept as an unused variable, so the
        # frontend calls the origin it was loaded from.
        location / {
          proxy_pass http://$$app;
          sub_filter "window.API_URL = '" "window.API_URL = ''; window.VIKUNJA_PUBLIC_URL = '";
          sub_filter_once on;
        }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: vikunja-proxy
  webui_port: 80
  category: Productivity
  tags: ["productivity", "tasks", "project-management", "kanban"]
  developer: Vikunja
  store_app_id: vikunja
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  index: /
  title:
    en_us: Vikunja
  tagline:
    en_us: To-do lists and projects, as lists, kanban boards, gantt charts or tables
  description:
    en_us: |
      **Self-hosted to-do and project management**

      Vikunja organises everything you have to do: personal to-do lists, household chores
      and team projects. Every project can be viewed as a list, a kanban board, a gantt
      chart or a table.

      **Key features:**
      - Projects and sub-projects, with list, kanban, gantt and table views
      - Due dates, reminders, repeating tasks, priorities, labels and assignees
      - Attachments, comments and task relations
      - Saved filters and a quick-add syntax ("Buy milk tomorrow *shopping")
      - Share projects with other users, teams or by public link
      - Import from Todoist, Trello, Microsoft To Do and TickTick; CalDAV for tasks

      **Sign-in:** the app is protected by your server account (single sign-on). On first
      open, register your Vikunja account; it is the account your projects belong to.
  tips:
    before_install:
      en_us: |
        **Sign-in:** Vikunja is protected by your server account (single sign-on).
        On a server without single sign-on, use the app password Maison shows on first
        open (also in the tile menu under **Credentials**).

        **First run:** once past the sign-in, click **Create account** and register your
        Vikunja account (username, email and password). Then start adding projects and tasks.
        Anyone else who can pass the sign-in can register an account of their own.

        **Note:** the mobile apps, CalDAV clients and API tokens talk to Vikunja directly
        and cannot pass the single sign-on gate; use the web app.

x-compose-app:
  schema_version: 2
  version: "2.8.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI.
  routes:
    - { service: vikunja-proxy, name: vikunja, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: vikunja
  title:
    en_us: Vikunja
  tagline:
    en_us: To-do lists and projects, as lists, kanban boards, gantt charts or tables
  description:
    en_us: |
      **Self-hosted to-do and project management**

      Vikunja organises everything you have to do: personal to-do lists, household chores
      and team projects. Every project can be viewed as a list, a kanban board, a gantt
      chart or a table.

      **Key features:**
      - Projects and sub-projects, with list, kanban, gantt and table views
      - Due dates, reminders, repeating tasks, priorities, labels and assignees
      - Attachments, comments and task relations
      - Saved filters and a quick-add syntax ("Buy milk tomorrow *shopping")
      - Share projects with other users, teams or by public link
      - Import from Todoist, Trello, Microsoft To Do and TickTick; CalDAV for tasks

      **Sign-in:** the app is protected by your server account (single sign-on). On first
      open, register your Vikunja account; it is the account your projects belong to.
  developer: Vikunja
  category: Productivity
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** Vikunja is protected by your server account (single sign-on).
      On a server without single sign-on, use the app password Maison shows on first
      open (also in the tile menu under **Credentials**).

      **First run:** once past the sign-in, click **Create account** and register your
      Vikunja account (username, email and password). Then start adding projects and tasks.
      Anyone else who can pass the sign-in can register an account of their own.

      **Note:** the mobile apps, CalDAV clients and API tokens talk to Vikunja directly
      and cannot pass the single sign-on gate; use the web app.
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to the gate in front of Vikunja. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
    # Vikunja's service secret (VIKUNJA_SERVICE_SECRET, formerly JWTSECRET).
    VIKUNJA_SECRET: hex:32
  # vikunja-app runs as $PUID:$PGID and writes both mounted directories.
  folders:
    - path: /DATA/AppData/vikunja/db
      user: $PUID
      group: $PGID
      mode: "0700"
    - path: /DATA/AppData/vikunja/files
      user: $PUID
      group: $PGID
      mode: "0700"
