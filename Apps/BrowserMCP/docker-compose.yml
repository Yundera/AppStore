  tips:
    en_us: |
      **Getting Started**

      Chromium starts on demand, on the first MCP tool call or browser action, inside a virtual display.
      It is shut down after 2 hours idle and starts again on the next use.
      The Web UI is protected by your server's single sign-on — you sign in with your existing server account.

      **Web Interface:**
      - **Main UI** — Dashboard with live noVNC browser view, status, and tool information
      - The dashboard's *MCP Server Info* panel shows `http://browsermcp:9746/mcp`, which does not answer:
        use the addresses below instead.
      - The *VNC Resolution* field in the configuration form has no effect; the virtual display is fixed
        at 1280x720.

      **MCP Integration (for AI/LLMs):**

      Connect your AI assistant to control the browser.

      **Option 1: Public URL (OAuth)**

      The `/mcp` endpoint is protected by OAuth 2.1. Point your client at the
      URL below — clients that support OAuth discovery (claude.ai, Claude
      Desktop) register themselves and open a browser for you to approve with
      your server account (single sign-on).
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "${APP_URL:-https://browsermcp-${APP_DOMAIN}}/mcp"
          }
        }
      }
      ```
      For clients that need a pre-created client_id/client_secret (n8n, custom
      scripts), create it with a `POST` of its registration (JSON with `client_name` and `redirect_uris`) to **${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth/clients**, sent from a browser signed in to this app; **${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth** lists the clients that exist and revokes them.

      **Option 2: Local Docker connection (no auth required)**

      For AI assistants running on the same server, connect directly via the Docker network:
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "http://browsermcp-backend:9746/mcp"
          }
        }
      }
      ```
      *Note: Requires the AI assistant to be on the `pcs` Docker network.*

      **Option 3: Via Beacon (aggregated)**

      If you have **Beacon** installed, Browser MCP auto-registers there and its tools
      show up under the `browser-mcp__*` namespace — no extra config.

      **Available MCP Tools (29, from Chrome DevTools MCP):**
      | Category | Tools |
      |----------|-------|
      | Pages | `navigate_page`, `new_page`, `list_pages`, `select_page`, `close_page`, `resize_page`, `wait_for` |
      | Input | `click`, `hover`, `drag`, `fill`, `fill_form`, `type_text`, `press_key`, `upload_file`, `handle_dialog` |
      | Inspection | `take_snapshot`, `take_screenshot`, `evaluate_script` |
      | Console & network | `list_console_messages`, `get_console_message`, `list_network_requests`, `get_network_request` |
      | Performance & audits | `performance_start_trace`, `performance_stop_trace`, `performance_analyze_insight`, `lighthouse_audit`, `take_heapsnapshot` |
      | Emulation | `emulate` |

      **Security:**
      - The Web UI, live noVNC viewer, and `/api` endpoints sit behind your server's
        single sign-on.
      - `/mcp` is gated separately on OAuth 2.1 Bearer tokens, so nothing on the
        public URL is reachable without a credential. Only the in-network address
        `http://browsermcp-backend:9746/mcp` (Option 2) is unauthenticated, and it
        is not published outside the `pcs` Docker network.
    zh_cn: |
      **快速开始**

      Chromium 在虚拟显示中按需启动：第一次 MCP 工具调用或浏览器操作时启动，空闲 2 小时后关闭，下次使用时再次启动。Web 界面受您服务器的单点登录 (SSO) 保护——使用您现有的服务器账号登录即可。

      **Web 界面：**
      - **主 UI** — 带有实时 noVNC 浏览器视图、状态和工具信息的仪表板
      - 仪表板 *MCP Server Info* 面板显示的 `http://browsermcp:9746/mcp` 无法连接，请使用下面的地址。
      - 配置表单中的 *VNC Resolution* 字段不起作用，虚拟显示固定为 1280x720。

      **MCP 集成（用于 AI/LLM）：**

      **选项 1：公共 URL（OAuth 2.1）**

      `/mcp` 端点受 OAuth 2.1 保护。将客户端指向下面的 URL——支持 OAuth 发现的客户端
      （claude.ai、Claude Desktop）会自动注册并打开浏览器，使用您服务器的账号（单点登录）授权。
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "${APP_URL:-https://browsermcp-${APP_DOMAIN}}/mcp"
          }
        }
      }
      ```
      对于需要预先创建 client_id/client_secret 的客户端（n8n、自定义脚本），请从已登录本应用的浏览器向 **${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth/clients** 发送 `POST` 注册请求（包含 `client_name` 和 `redirect_uris` 的 JSON）来创建；**${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth** 页面可列出并撤销已有客户端。

      **选项 2：本地 Docker 连接（无需认证）**
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "http://browsermcp-backend:9746/mcp"
          }
        }
      }
      ```
      *注意：需要 AI 助手在 `pcs` Docker 网络上。*

      **选项 3：通过 Beacon（聚合）**

      如果安装了 **Beacon**，Browser MCP 会自动注册，其工具显示在 `browser-mcp__*` 命名空间下，无需额外配置。

      **可用 MCP 工具（29 个，来自 Chrome DevTools MCP）：**
      | 类别 | 工具 |
      |------|------|
      | 页面 | `navigate_page`, `new_page`, `list_pages`, `select_page`, `close_page`, `resize_page`, `wait_for` |
      | 输入 | `click`, `hover`, `drag`, `fill`, `fill_form`, `type_text`, `press_key`, `upload_file`, `handle_dialog` |
      | 检查 | `take_snapshot`, `take_screenshot`, `evaluate_script` |
      | 控制台与网络 | `list_console_messages`, `get_console_message`, `list_network_requests`, `get_network_request` |
      | 性能与审计 | `performance_start_trace`, `performance_stop_trace`, `performance_analyze_insight`, `lighthouse_audit`, `take_heapsnapshot` |
      | 模拟 | `emulate` |
    ko_kr: |
      **시작하기**

      Chromium은 가상 디스플레이 안에서 필요할 때 시작됩니다. 첫 MCP 도구 호출이나 브라우저 동작 때 실행되고,
      2시간 동안 사용하지 않으면 종료되며, 다음에 사용할 때 다시 시작됩니다.
      Web UI는 서버의 싱글 사인온(SSO)으로 보호됩니다 — 기존 서버 계정으로 로그인하세요.

      **웹 인터페이스:**
      - **메인 UI** — 실시간 noVNC 브라우저 뷰, 상태, 도구 정보가 포함된 대시보드
      - 대시보드의 *MCP Server Info* 패널에 표시되는 `http://browsermcp:9746/mcp`는 연결되지 않습니다.
        아래 주소를 사용하세요.
      - 설정 폼의 *VNC Resolution* 항목은 적용되지 않으며, 가상 디스플레이는 1280x720으로 고정됩니다.

      **MCP 연동 (AI/LLM용):**

      AI 어시스턴트를 연결하여 브라우저를 제어할 수 있습니다.

      **옵션 1: 공개 URL (OAuth)**

      `/mcp` 엔드포인트는 OAuth 2.1로 보호됩니다. 아래 URL을 클라이언트에 설정하세요.
      OAuth 디스커버리를 지원하는 클라이언트(claude.ai, Claude Desktop)는 스스로 등록한 뒤
      브라우저를 열어 서버 계정(싱글 사인온)으로 승인하게 합니다.
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "${APP_URL:-https://browsermcp-${APP_DOMAIN}}/mcp"
          }
        }
      }
      ```
      client_id/client_secret를 미리 만들어야 하는 클라이언트(n8n, 커스텀 스크립트)는 이 앱에 로그인된 브라우저에서 **${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth/clients** 로 등록 정보(`client_name`과 `redirect_uris`가 담긴 JSON)를 `POST`해서 만드세요. **${APP_URL:-https://browsermcp-${APP_DOMAIN}}/AppShield/oauth** 에서 기존 클라이언트를 확인하고 폐기할 수 있습니다.

      **옵션 2: 로컬 Docker 연결 (인증 불필요)**

      같은 서버에서 실행 중인 AI 어시스턴트는 Docker 네트워크로 직접 연결:
      ```json
      {
        "mcpServers": {
          "browser-mcp": {
            "type": "http",
            "url": "http://browsermcp-backend:9746/mcp"
          }
        }
      }
      ```
      *참고: AI 어시스턴트가 `pcs` Docker 네트워크에 있어야 합니다.*

      **옵션 3: Beacon 경유 (통합)**

      **Beacon**이 설치되어 있으면 Browser MCP가 자동 등록되며, `browser-mcp__*` 네임스페이스에서 도구를 사용할 수 있습니다. 추가 설정은 필요 없습니다.

      **사용 가능한 MCP 도구 (29개, Chrome DevTools MCP 제공):**
      | 분류 | 도구 |
      |------|------|
      | 페이지 | `navigate_page`, `new_page`, `list_pages`, `select_page`, `close_page`, `resize_page`, `wait_for` |
      | 입력 | `click`, `hover`, `drag`, `fill`, `fill_form`, `type_text`, `press_key`, `upload_file`, `handle_dialog` |
      | 검사 | `take_snapshot`, `take_screenshot`, `evaluate_script` |
      | 콘솔 및 네트워크 | `list_console_messages`, `get_console_message`, `list_network_requests`, `get_network_request` |
      | 성능 및 감사 | `performance_start_trace`, `performance_stop_trace`, `performance_analyze_insight`, `lighthouse_audit`, `take_heapsnapshot` |
      | 에뮬레이션 | `emulate` |

      **보안:**
      - Web UI, 실시간 noVNC 뷰어, `/api` 엔드포인트는 서버의 싱글 사인온 뒤에 있습니다.
      - `/mcp`는 OAuth 2.1 Bearer 토큰으로 따로 보호되므로, 공개 URL의 어떤 것도 자격 증명 없이는
        접근할 수 없습니다. 인증이 없는 주소는 네트워크 내부 주소
        `http://browsermcp-backend:9746/mcp`(옵션 2)뿐이며, `pcs` Docker 네트워크 밖으로는 공개되지 않습니다.
