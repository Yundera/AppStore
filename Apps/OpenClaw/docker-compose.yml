x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before any image is pulled
  # and before any hook runs. Declared here rather than mkdir'd in the hook: a hook
  # mkdir runs inside the Maison container and lands root-owned, which is exactly
  # what leaves the gateway unable to write its own config volume.
  folders:
    - path: /DATA/AppData/openclaw
      user: $PUID
      group: $PGID
  # openclaw.json is the LIVE gateway config the user edits from the Config section
  # of the UI. Declared rather than heredoc'd in a hook: `ensure: once` is
  # create-if-absent on every up, so a reinstall or a version upgrade never
  # overwrites what the gateway or the user wrote, and Maison chowns it to
  # $PUID:$PGID so the gateway can rewrite its own config.
  files:
    - path: /DATA/AppData/openclaw/openclaw.json
      from: openclaw.json
      ensure: once
      mode: "0644"
  webui-host: openclaw-${domain}
  webui-path: "/"
