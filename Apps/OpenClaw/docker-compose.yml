  title:
    en_us: OpenClaw
  tips:
    before_install:
      en_us: |
        **API Key Required**

        OpenClaw requires an AI provider API key to function. Configure at least one:

        | Provider | Environment Variable |
        |----------|---------------------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **First-Time Setup**

        1. **Access the Web UI**: Click the app icon on your dashboard and sign in with your server account (single sign-on)
        2. **Unlock the gateway**: if the Control UI asks for a gateway token or password, paste the gateway token shown when you open the app (tile menu → Credentials)
        3. **Configure API Key**: Add your Anthropic or OpenAI API key in the Config section
        4. **Start chatting**: Use the built-in WebChat or connect messaging platforms

        **Messaging Integrations:**

        OpenClaw supports WhatsApp, Telegram, Discord, Slack, Signal, and more. Configure through the Web UI after setup.

        **Already installed from an earlier version?**

        The gateway only accepts browser origins listed in its own config file, and that file is never overwritten once it exists - so an existing install keeps the old one. If the Web UI reports `Browser origin not allowed`, edit `/DATA/AppData/openclaw/openclaw.json`, add the block below inside `gateway.controlUi`, and restart the app:

        `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]`

        **Documentation:** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
      fr_fr: |
        **Cle API requise**

        OpenClaw necessite une cle API de fournisseur d'IA pour fonctionner. Configurez au moins une :

        | Fournisseur | Variable d'environnement |
        |-------------|-------------------------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **Configuration initiale**

        1. **Acceder a l'interface Web** : Cliquez sur l'icone de l'app et connectez-vous avec votre compte serveur (authentification unique)
        2. **Deverrouiller la passerelle** : si l'interface demande un token ou un mot de passe, collez le token de passerelle affiche a l'ouverture de l'app (menu de la tuile → Credentials)
        3. **Configurer la cle API** : Ajoutez votre cle API dans la section Config

        **Deja installe depuis une version anterieure ?**

        Le fichier de configuration existant n'est jamais ecrase. Si l'interface affiche `Browser origin not allowed`, ajoutez `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]` dans `gateway.controlUi` de `/DATA/AppData/openclaw/openclaw.json`, puis redemarrez l'app.

        **Documentation :** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
      de_de: |
        **API-Schlussel erforderlich**

        OpenClaw benotigt einen KI-Anbieter-API-Schlussel. Konfigurieren Sie mindestens einen:

        | Anbieter | Umgebungsvariable |
        |----------|-------------------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **Ersteinrichtung**

        1. **Web-UI aufrufen**: Klicken Sie auf das App-Symbol und melden Sie sich mit Ihrem Server-Konto an (Single Sign-on)
        2. **Gateway entsperren**: Fragt die Control UI nach einem Token oder Passwort, fugen Sie das Gateway-Token ein, das beim Offnen der App angezeigt wird (Kachelmenu → Credentials)
        3. **API-Schlussel konfigurieren**: Fugen Sie Ihren API-Schlussel im Config-Bereich hinzu

        **Bereits aus einer fruheren Version installiert?**

        Die vorhandene Konfigurationsdatei wird nie uberschrieben. Meldet die Web-UI `Browser origin not allowed`, erganzen Sie in `/DATA/AppData/openclaw/openclaw.json` unter `gateway.controlUi` den Eintrag `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]` und starten Sie die App neu.

        **Dokumentation:** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
      es_es: |
        **Clave API requerida**

        OpenClaw requiere una clave API de proveedor de IA para funcionar. Configura al menos una:

        | Proveedor | Variable de entorno |
        |-----------|---------------------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **Configuracion inicial**

        1. **Acceder a la interfaz Web**: Haz clic en el icono de la app e inicia sesion con tu cuenta del servidor (inicio de sesion unico)
        2. **Desbloquear el gateway**: si la interfaz pide un token o contrasena, pega el token del gateway que se muestra al abrir la app (menu del icono → Credentials)
        3. **Configurar clave API**: Agrega tu clave API en la seccion Config

        **Ya instalado desde una version anterior?**

        El archivo de configuracion existente nunca se sobrescribe. Si la interfaz muestra `Browser origin not allowed`, anade `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]` dentro de `gateway.controlUi` en `/DATA/AppData/openclaw/openclaw.json` y reinicia la app.

        **Documentacion:** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
      zh_cn: |
        **需要API密钥**

        OpenClaw需要AI提供商的API密钥才能运行。请至少配置一个：

        | 提供商 | 环境变量 |
        |--------|----------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **首次设置**

        1. **访问Web界面**：点击应用图标，使用您的服务器账户登录（单点登录）
        2. **解锁网关**：如果控制界面要求输入网关令牌或密码，请粘贴打开应用时显示的网关令牌（磁贴菜单 → Credentials）
        3. **配置API密钥**：在Config部分添加您的API密钥

        **从旧版本升级？**

        已存在的配置文件不会被覆盖。如果界面提示 `Browser origin not allowed`，请在 `/DATA/AppData/openclaw/openclaw.json` 的 `gateway.controlUi` 中加入 `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]`，然后重启应用。

        **文档：** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
      ko_kr: |
        **API 키 필요**

        OpenClaw가 작동하려면 AI 제공업체 API 키가 필요합니다. 최소 하나를 구성하세요:

        | 제공업체 | 환경 변수 |
        |----------|-----------|
        | Anthropic Claude | `ANTHROPIC_API_KEY` |
        | OpenAI | `OPENAI_API_KEY` |

        **최초 설정**

        1. **웹 UI 접속**: 앱 아이콘을 클릭하고 서버 계정으로 로그인 (통합 인증)
        2. **게이트웨이 잠금 해제**: 컨트롤 UI가 게이트웨이 토큰이나 비밀번호를 요구하면 앱을 열 때 표시되는 게이트웨이 토큰(타일 메뉴 → Credentials)을 붙여넣으세요
        3. **API 키 구성**: Config 섹션에서 API 키 추가

        **이전 버전에서 이미 설치했나요?**

        기존 설정 파일은 덮어쓰지 않습니다. 웹 UI에 `Browser origin not allowed` 가 표시되면 `/DATA/AppData/openclaw/openclaw.json` 의 `gateway.controlUi` 안에 `"allowedOrigins": ["${APP_URL:-https://openclaw-${APP_DOMAIN}}"]` 를 추가하고 앱을 재시작하세요.

        **문서:** [https://docs.openclaw.ai/](https://docs.openclaw.ai/)
  index: /
  webui_port: 80
  port_map: "80"

