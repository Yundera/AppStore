name: openclaw

services:
  # AppShield sidecar — the only publicly reachable service. It fronts the OpenClaw
  # gateway with the PCS's built-in Authelia SSO (OIDC) and self-registers with
  # auth-registrar on first login: no client id, no secret, no issuer to configure.
  # No AUTH_HASH anywhere — Maison injects no such variable, so it would be empty.
  openclaw:
    image: ghcr.io/yundera/appshield:2.0.9
    container_name: openclaw
    # OIDC identity: AppShield's auth-service builds its OIDC redirect URIs from
    # os.hostname(), and auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal
    # container_name, or Docker defaults the hostname to the random container ID.
    hostname: openclaw
    restart: unless-stopped
    user: "root"
    cpu_shares: 50
    expose:
      - 80
    labels:
      caddy_0: openclaw-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: openclaw-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: openclaw-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    environment:
      BACKEND_HOST: "openclaw-backend"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
    depends_on:
      - openclaw-backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      # On `pcs` because Caddy must reach it, and on the app's own network
      # because that is where its backend lives.
      - pcs
      - openclaw-internal

  # The gateway itself. It executes shell commands and reads/writes files by design,
  # so it is deliberately NOT on the shared `pcs` network: only the AppShield sidecar
  # can reach it, and every request therefore passes the SSO gate first.
  openclaw-backend:
    image: alpine/openclaw:2026.6.9
    container_name: openclaw-backend
    init: true
    deploy:
      resources:
        limits:
          memory: 2048M
    cpu_shares: 90
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - 8080
    environment:
      TZ: $TZ
      NODE_ENV: production
      # AI Provider API Keys (configure at least one)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The Control UI's own device-pairing flow is disabled because authentication is
      # delegated to the AppShield sidecar in front of it. Safe only because this
      # service sits on an app-private bridge and has no route of its own.
      OPENCLAW_GATEWAY_CONTROL_UI_ALLOW_INSECURE_AUTH: "true"
      OPENCLAW_GATEWAY_CONTROL_UI_DANGEROUSLY_DISABLE_DEVICE_AUTH: "true"
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "8080", "--allow-unconfigured"]
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/openclaw:/home/node/.openclaw
    restart: unless-stopped
    networks:
      # App-private only: reached solely by the AppShield sidecar.
      - openclaw-internal

networks:
  # The deployment's shared network, under whatever name it carries there.
  # ${APP_NET} comes from the app's .env; the `:-pcs` default keeps a hand-run
  # `docker compose up -d` working. Maison copies this file byte-for-byte and
  # never rewrites it, so the reference has to be written here.
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the sidecar and the gateway.
  openclaw-internal:
    driver: bridge

