name: hubs

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hubs-client:
    image: hubsfoundation/hubs:stable-3111
    container_name: hubs-client
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      DOMAIN: "${APP_DOMAIN}"
      SUB_DOMAIN: "hubs"
      turkeyCfg_thumbnail_server: "${ROUTE_HUBSNEARSPARK_HOST:-hubsnearspark-${APP_DOMAIN}}"
      turkeyCfg_base_assets_path: "${ROUTE_HUBSASSETS_URL:-https://hubsassets-${APP_DOMAIN}}/hubs/"
      turkeyCfg_non_cors_proxy_domains: "${APP_HOST:-hubs-${APP_DOMAIN}},${ROUTE_HUBSASSETS_HOST:-hubsassets-${APP_DOMAIN}}"
      turkeyCfg_reticulum_server: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_cors_proxy_server: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_shortlink_domain: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_tier: "p1"
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 8080
    networks:
      - hubs-net
      - pcs

  db:
    image: postgres:17.11-alpine
    container_name: hubs-db
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: ${POSTGRES_DB:-ret_production}
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - 5432
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/hubs/pgdata:/var/lib/postgresql/data
    networks:
      - hubs-net

  hubs:
    image: hubsfoundation/reticulum:stable-855
    container_name: hubs-reticulum
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POD_IP: "127.0.0.1"
      POD_NAME: "reticulum-1"
      turkeyCfg_POD_NS: "hubs"
      turkeyCfg_HUB_DOMAIN: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_DOMAIN: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_RET_HOST: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_LINK_HOST: "${ROUTE_HUBSLINK_HOST:-hubslink-${APP_DOMAIN}}"
      turkeyCfg_ASSETS_HOST: "${ROUTE_HUBSASSETS_HOST:-hubsassets-${APP_DOMAIN}}"
      turkeyCfg_DIALOG_HOST: "${ROUTE_HUBSDIALOG_HOST:-hubsdialog-${APP_DOMAIN}}"
      turkeyCfg_NEARSPARK_HOST: "${ROUTE_HUBSNEARSPARK_HOST:-hubsnearspark-${APP_DOMAIN}}"
      turkeyCfg_SPOKE_HOST: "${ROUTE_HUBSSPOKE_HOST:-hubsspoke-${APP_DOMAIN}}"
      turkeyCfg_DB_HOST: "db"
      turkeyCfg_DB_HOST_T: "db"
      turkeyCfg_APP_EMAIL: "${APP_EMAIL}"
      turkeyCfg_MAILER_RELAY: "smtp"
      turkeyCfg_MAILER_PORT: "587"
      turkeyCfg_MAILER_TLS: "never"
      turkeyCfg_DB_USER: ${POSTGRES_USER:-postgres}
      turkeyCfg_DB_PASS: $POSTGRES_PASSWORD
      turkeyCfg_DB_NAME: ${POSTGRES_DB:-ret_production}
      turkeyCfg_NODE_COOKIE: $turkeyCfg_NODE_COOKIE
      turkeyCfg_GUARDIAN_KEY: $turkeyCfg_GUARDIAN_KEY
      turkeyCfg_PHX_KEY: $turkeyCfg_PHX_KEY
      turkeyCfg_DASHBOARD_ACCESS_KEY: $turkeyCfg_DASHBOARD_ACCESS_KEY
      turkeyCfg_POSTGREST_PASSWORD: $turkeyCfg_POSTGREST_PASSWORD
      turkeyCfg_PERMS_KEY: $turkeyCfg_PERMS_KEY
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 4000
      - 4001
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/hubs/retstorage:/storage
      - ${DATA_ROOT:-/DATA}/AppData/hubs/config.toml.template:/home/ret/config.toml.template:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hubs-net
      - pcs

  postgrest:
    image: mozillareality/postgrest:8@sha256:ab00c933c3d74164041e2316f0d95ad6ed50e5ae13b54223cabe5de9a18d619d
    container_name: hubs-postgrest
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ret_production}
      PGRST_JWT_SECRET: $PGRST_JWT_SECRET
      PGRST_LOG_LEVEL: info
      PGRST_DB_SCHEMA: ret0_admin
      PGRST_DB_ANON_ROLE: postgres
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hubs-net

  hubs-spoke:
    image: hubsfoundation/spoke:stable-95
    container_name: hubs-spoke
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      DOMAIN: "${APP_DOMAIN}"
      SUB_DOMAIN: "hubsspoke"
      turkeyCfg_thumbnail_server: "${ROUTE_HUBSNEARSPARK_HOST:-hubsnearspark-${APP_DOMAIN}}"
      turkeyCfg_base_assets_path: "${ROUTE_HUBSSPOKE_URL:-https://hubsspoke-${APP_DOMAIN}}/spoke/"
      turkeyCfg_non_cors_proxy_domains: "${APP_HOST:-hubs-${APP_DOMAIN}},${ROUTE_HUBSSPOKE_HOST:-hubsspoke-${APP_DOMAIN}}"
      turkeyCfg_reticulum_server: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_cors_proxy_server: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_shortlink_domain: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      turkeyCfg_hubs_server: "${APP_HOST:-hubs-${APP_DOMAIN}}"
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 8080
    networks:
      hubs-net:
        # reticulum's config.toml.template (ghcr.io/worph/hubs-seed) hardcodes
        # `spoke_page_origin = https://spoke:8080/spoke/pages` — upstream turkey's
        # service name. This service is app-prefixed for shared-network hygiene,
        # so `spoke` resolves only through this alias. Without it the name does
        # not resolve, Ret.PageOriginWarmer.get_aggregated_etag/0 blocks on its
        # 15s Task.await, the cachex warmer GenServer crashes on every cycle and
        # the page cache is never populated — so EVERY reticulum page answers
        # 503 "Missing file <page>.html", including the two pages whose origin
        # (hubs-client) is perfectly healthy. Verified on demostaging1.
        aliases:
          - spoke
      pcs: {}

  hubs-dialog:
    image: hubsfoundation/dialog:stable-331
    container_name: hubs-dialog
    restart: unless-stopped
    user: "0:0"
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      AUTH_KEY: /app/certs/perms.pub.pem
      HTTPS_CERT_FULLCHAIN: /app/certs/fullchain.pem
      HTTPS_CERT_PRIVKEY: /app/certs/privkey.pem
      INTERACTIVE: "false"
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40050
      MEDIASOUP_ANNOUNCED_IP: "${APP_PUBLIC_IPV4}"
      DEBUG: "*INFO* *WARN* *ERROR*"
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/hubs/perms.pub.pem:/app/certs/perms.pub.pem:ro
    command: ["node", "index.js"]
    expose:
      - 4443
    ports:
      - "40000-40050:40000-40050/udp"
      - "40000-40050:40000-40050/tcp"
    networks:
      - hubs-net
      - pcs

  hubs-nearspark:
    image: hubsfoundation/nearspark:stable-28
    container_name: hubs-nearspark
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 5000
    networks:
      hubs-net:
        # Same upstream-name / app-prefix mismatch as hubs-spoke above: the
        # template's `[...Endpoint.imgproxy_url] host = "nearspark"` names the
        # thumbnail service, which is `hubs-nearspark` here. Not fatal the way
        # the spoke one is — it is a separate subsystem from the page warmer —
        # but without the alias reticulum cannot reach the thumbnailer at all.
        aliases:
          - nearspark
      pcs: {}

  photomnemonic:
    image: hubsfoundation/photomnemonic:stable-75
    container_name: hubs-photomnemonic
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: UTC
    expose:
      - 5000
    networks:
      - hubs-net

networks:
  hubs-net:
    name: hubs-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
  main: hubs
  webui_port: 4001

  author: Hubs Foundation
  developer: Hubs Foundation
  category: Communication
  # `needs-public-ip`: hubs-dialog publishes the mediasoup 40000-40050 range that
  # remote participants dial in on directly. See the ports: block on that service.
  tags: ["personal", "family", "games", "needs-public-ip"]

  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png

  title:
    en_us: Hubs

  tagline:
    en_us: Self-hosted social VR rooms in your browser
    fr_fr: Salons VR sociaux auto-hébergés dans votre navigateur
    es_es: Salas de VR social autoalojadas en tu navegador
    zh_cn: 自托管的浏览器内社交 VR 房间
    ko_kr: 브라우저에서 즐기는 셀프호스팅 소셜 VR 룸

  description:
    en_us: |
      Hubs is an open-source social VR platform from the Hubs Foundation. Create persistent virtual rooms for meetings, classes, events, or hangouts — accessible from any browser, no install required, with full WebXR support for VR headsets.
    fr_fr: |
      Hubs est une plateforme de VR sociale open-source de la Hubs Foundation. Créez des salons virtuels persistants pour des réunions, cours, événements ou rencontres — accessibles depuis n'importe quel navigateur, sans installation, avec une prise en charge complète de WebXR pour les casques VR.
    es_es: |
      Hubs es una plataforma de VR social de código abierto de la Hubs Foundation. Crea salas virtuales persistentes para reuniones, clases, eventos o encuentros — accesibles desde cualquier navegador, sin instalación, con soporte completo de WebXR para visores de VR.
    zh_cn: |
      Hubs 是 Hubs Foundation 推出的开源社交 VR 平台。创建持久化的虚拟房间，用于会议、课程、活动或聚会 —— 直接通过浏览器访问，无需安装，并完整支持 WebXR VR 头显。
    ko_kr: |
      Hubs는 Hubs Foundation의 오픈소스 소셜 VR 플랫폼입니다. 회의·수업·이벤트·모임을 위한 영구 가상 룸을 만들 수 있으며, 어떤 브라우저에서도 설치 없이 접속할 수 있고 VR 헤드셋용 WebXR을 완벽 지원합니다.

  tips:
    before_install:
      en_us: |
        **🔑 Initial admin: `${APP_EMAIL}`** — the only account with admin rights. Sign in with this email at ${APP_URL:-https://hubs-${APP_DOMAIN}} to receive a magic-link.

        **Operator surfaces** (after admin sign-in):
        - [Admin panel](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)
        - [Spoke scene editor](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)

        **Voice / video** needs UDP ports 40000-40050 reachable on the server's public IP. HTTPS-only tunnels leave signaling working but audio silent.

        **Resources:** ~3 GB RAM, ~2 vCPU. Suitable for rooms up to ~10 concurrent users.
        **More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)
      fr_fr: |
        **🔑 Administrateur initial : `${APP_EMAIL}`** — seul compte avec les droits admin. Connectez-vous avec cet email sur ${APP_URL:-https://hubs-${APP_DOMAIN}} pour recevoir un lien magique.

        **Interfaces d'administration** (après connexion admin) :
        - [Panneau admin](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)
        - [Éditeur de scène Spoke](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)

        **Voix / vidéo** : les ports UDP 40000-40050 doivent être joignables sur l'IP publique du serveur. Un tunnel HTTPS uniquement laisse la signalisation fonctionnelle mais coupe le média.

        **Ressources :** ~3 Go de RAM, ~2 vCPU. Adapté aux salons jusqu'à ~10 utilisateurs simultanés.
        **More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)
      es_es: |
        **🔑 Administrador inicial: `${APP_EMAIL}`** — la única cuenta con permisos de admin. Inicia sesión con ese correo en ${APP_URL:-https://hubs-${APP_DOMAIN}} para recibir un enlace mágico.

        **Interfaces de administración** (tras iniciar sesión como admin):
        - [Panel de admin](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)
        - [Editor de escenas Spoke](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)

        **Voz / vídeo:** los puertos UDP 40000-40050 deben estar accesibles en la IP pública del servidor. Un túnel solo HTTPS deja la señalización funcionando pero corta el audio.

        **Recursos:** ~3 GB de RAM, ~2 vCPU. Adecuado para salas de hasta ~10 usuarios simultáneos.
        **More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)
      zh_cn: |
        **🔑 初始管理员：`${APP_EMAIL}`** —— 唯一拥有管理员权限的账户。在 ${APP_URL:-https://hubs-${APP_DOMAIN}} 使用该邮箱登录以接收魔法链接。

        **管理员界面**（管理员登录后）：
        - [管理面板](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)
        - [Spoke 场景编辑器](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)

        **语音 / 视频**：服务器公网 IP 的 UDP 端口 40000-40050 必须开放。仅 HTTPS 隧道可保持信令但会丢失媒体。

        **资源：** 约 3 GB 内存、~2 vCPU。适合 ~10 名以下并发用户的房间。
      ko_kr: |
        **🔑 초기 관리자: `${APP_EMAIL}`** — 관리자 권한을 가진 유일한 계정입니다. ${APP_URL:-https://hubs-${APP_DOMAIN}} 에서 이 이메일로 로그인하면 매직 링크를 받게 됩니다.

        **운영자 화면** (관리자 로그인 후):
        - [관리 패널](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)
        - [Spoke 씬 에디터](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)

        **음성 / 영상**: 서버의 공인 IP에서 UDP 40000-40050 포트가 열려 있어야 합니다. HTTPS 전용 터널 환경에서는 시그널링만 동작하고 미디어는 끊깁니다.

        **리소스:** RAM 약 3 GB, vCPU 약 2개. 동시 접속 ~10명 이하 룸에 적합합니다.
        **More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)

x-compose-app:
  schema_version: 2
  version: "stable-855"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: hubs, name: hubs, upstream-port: 4001 }
    - { service: hubs-client, name: hubsassets, upstream-port: 8080, upstream-scheme: https, insecure-upstream: true }
    - { service: hubs, name: hubslink, upstream-port: 4001 }
    - { service: hubs-spoke, name: hubsspoke, upstream-port: 8080, upstream-scheme: https, insecure-upstream: true }
    - { service: hubs-dialog, name: hubsdialog, upstream-port: 4443, upstream-scheme: https, insecure-upstream: true }
    - { service: hubs-nearspark, name: hubsnearspark, upstream-port: 5000 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Hubs
  tagline:
    en_us: Self-hosted social VR rooms in your browser
    fr_fr: Salons VR sociaux auto-hébergés dans votre navigateur
    es_es: Salas de VR social autoalojadas en tu navegador
    zh_cn: 自托管的浏览器内社交 VR 房间
    ko_kr: 브라우저에서 즐기는 셀프호스팅 소셜 VR 룸
  description:
    en_us: |
      Hubs is an open-source social VR platform from the Hubs Foundation. Create persistent virtual rooms for meetings, classes, events, or hangouts — accessible from any browser, no install required, with full WebXR support for VR headsets.
    fr_fr: |
      Hubs est une plateforme de VR sociale open-source de la Hubs Foundation. Créez des salons virtuels persistants pour des réunions, cours, événements ou rencontres — accessibles depuis n'importe quel navigateur, sans installation, avec une prise en charge complète de WebXR pour les casques VR.
    es_es: |
      Hubs es una plataforma de VR social de código abierto de la Hubs Foundation. Crea salas virtuales persistentes para reuniones, clases, eventos o encuentros — accesibles desde cualquier navegador, sin instalación, con soporte completo de WebXR para visores de VR.
    zh_cn: |
      Hubs 是 Hubs Foundation 推出的开源社交 VR 平台。创建持久化的虚拟房间，用于会议、课程、活动或聚会 —— 直接通过浏览器访问，无需安装，并完整支持 WebXR VR 头显。
    ko_kr: |
      Hubs는 Hubs Foundation의 오픈소스 소셜 VR 플랫폼입니다. 회의·수업·이벤트·모임을 위한 영구 가상 룸을 만들 수 있으며, 어떤 브라우저에서도 설치 없이 접속할 수 있고 VR 헤드셋용 WebXR을 완벽 지원합니다.
  developer: Hubs Foundation
  category: Communication
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  # Raw TCP/UDP must be dialled from the internet: hidden on a box behind NAT or the tunnel.
  requires: [public-ip]
  architectures:
    - amd64
  # Sum of the service limits (~3.1G); WebRTC media is CPU-bound.
  resources:
    recommended: { cpu: 2, memory: 4G }
  tips:
    en_us: "**\U0001F511 Initial admin: `${APP_EMAIL}`** — the only account with admin rights. Sign in with this email at ${APP_URL:-https://hubs-${APP_DOMAIN}} to receive a magic-link.\n\n**Operator surfaces** (after admin sign-in):\n- [Admin panel](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)\n- [Spoke scene editor](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)\n\n**Voice / video** needs UDP ports 40000-40050 reachable on the server's public IP. HTTPS-only tunnels leave signaling working but audio silent.\n\n**Resources:** ~3 GB RAM, ~2 vCPU. Suitable for rooms up to ~10 concurrent users.\n**More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)\n"
    fr_fr: "**\U0001F511 Administrateur initial : `${APP_EMAIL}`** — seul compte avec les droits admin. Connectez-vous avec cet email sur ${APP_URL:-https://hubs-${APP_DOMAIN}} pour recevoir un lien magique.\n\n**Interfaces d'administration** (après connexion admin) :\n- [Panneau admin](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)\n- [Éditeur de scène Spoke](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)\n\n**Voix / vidéo** : les ports UDP 40000-40050 doivent être joignables sur l'IP publique du serveur. Un tunnel HTTPS uniquement laisse la signalisation fonctionnelle mais coupe le média.\n\n**Ressources :** ~3 Go de RAM, ~2 vCPU. Adapté aux salons jusqu'à ~10 utilisateurs simultanés.\n**More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)\n"
    es_es: "**\U0001F511 Administrador inicial: `${APP_EMAIL}`** — la única cuenta con permisos de admin. Inicia sesión con ese correo en ${APP_URL:-https://hubs-${APP_DOMAIN}} para recibir un enlace mágico.\n\n**Interfaces de administración** (tras iniciar sesión como admin):\n- [Panel de admin](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)\n- [Editor de escenas Spoke](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)\n\n**Voz / vídeo:** los puertos UDP 40000-40050 deben estar accesibles en la IP pública del servidor. Un túnel solo HTTPS deja la señalización funcionando pero corta el audio.\n\n**Recursos:** ~3 GB de RAM, ~2 vCPU. Adecuado para salas de hasta ~10 usuarios simultáneos.\n**More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)\n"
    zh_cn: "**\U0001F511 初始管理员：`${APP_EMAIL}`** —— 唯一拥有管理员权限的账户。在 ${APP_URL:-https://hubs-${APP_DOMAIN}} 使用该邮箱登录以接收魔法链接。\n\n**管理员界面**（管理员登录后）：\n- [管理面板](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)\n- [Spoke 场景编辑器](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)\n\n**语音 / 视频**：服务器公网 IP 的 UDP 端口 40000-40050 必须开放。仅 HTTPS 隧道可保持信令但会丢失媒体。\n\n**资源：** 约 3 GB 内存、~2 vCPU。适合 ~10 名以下并发用户的房间。\n"
    ko_kr: "**\U0001F511 초기 관리자: `${APP_EMAIL}`** — 관리자 권한을 가진 유일한 계정입니다. ${APP_URL:-https://hubs-${APP_DOMAIN}} 에서 이 이메일로 로그인하면 매직 링크를 받게 됩니다.\n\n**운영자 화면** (관리자 로그인 후):\n- [관리 패널](${APP_URL:-https://hubs-${APP_DOMAIN}}/admin)\n- [Spoke 씬 에디터](${APP_URL:-https://hubs-${APP_DOMAIN}}/spoke/projects)\n\n**음성 / 영상**: 서버의 공인 IP에서 UDP 40000-40050 포트가 열려 있어야 합니다. HTTPS 전용 터널 환경에서는 시그널링만 동작하고 미디어는 끊깁니다.\n\n**리소스:** RAM 약 3 GB, vCPU 약 2개. 동시 접속 ~10명 이하 룸에 적합합니다.\n**More info:** [Hubs Community setup guide](https://yundera.com/blog/best-apps-1/hubs-community-available-in-one-click-40)\n"
  # postgres 14 reaches end-of-life in Nov 2026; the store moved to 17.11 on
  # 2026-10-16. postgres:17 will not start on a 14 cluster, so every earlier install
  # needs pg_upgrade once. Installs predate .data-version and arrive at data version
  # 1 whatever cluster they hold: pgautoupgrade reads PG_VERSION and exits untouched
  # on a cluster already at 17.
  data_version: 2
  migrations:
    # POSTGRES_USER / POSTGRES_DB are in .env on an install made by the former
    # hubs-seed bootstrap step; the defaults are the values it wrote. The -alpine
    # variant because postgres:14-alpine wrote the cluster (musl collation). As root, as the service runs: it chowns
    # for the upgrade and restores the original (uid 70) ownership afterwards.
    # PostgREST 8 was checked against 17.11: it connects, loads its schema cache and
    # serves the ret0_admin views and RPCs.
    - id: 2
      name:
        en_us: postgres-14-to-17
      images: [pgautoupgrade/pgautoupgrade:17.11-alpine]
      script: |
        docker run --rm -e PGAUTO_ONESHOT=yes \
          -e POSTGRES_USER="${POSTGRES_USER:-postgres}" -e POSTGRES_DB="${POSTGRES_DB:-ret_production}" \
          -v "$APP_DIR/pgdata:/var/lib/postgresql/data" \
          pgautoupgrade/pgautoupgrade:17.11-alpine
  # Every internal credential is generated here, once, and kept in .env. The
  # names and sizes are the ones the former hubs-seed bootstrap step minted, so
  # an installed box keeps the values its pgdata was initialised with: a key the
  # .env already holds is reused, never regenerated.
  secrets:
    POSTGRES_PASSWORD: hex:24
    turkeyCfg_NODE_COOKIE: hex:32
    turkeyCfg_GUARDIAN_KEY: hex:48
    turkeyCfg_PHX_KEY: hex:48
    turkeyCfg_DASHBOARD_ACCESS_KEY: hex:24
    turkeyCfg_POSTGREST_PASSWORD: hex:24
  # reticulum's config template: hubs-seed 2.0.0's templates/config.toml.template,
  # with one change. Its CSP script_src adds the hashes of the Google Analytics
  # loader inline in the hubs-client stable-3111 pages; reticulum's built-in list
  # holds only older builds' hashes, so the browser refused the script and logged an
  # error on every page. `always` so a template change in the store reaches
  # installed apps, as the former bootstrap step's rewrite on every run did.
  files:
    - path: /DATA/AppData/hubs/config.toml.template
      from: config.toml.template
      ensure: always
  steps:
    # Reticulum's permissions keypair: RSA, which no `secrets` generator produces.
    # The private key signs room permission tokens and is reused when present -
    # regenerating it would invalidate every token already minted. Run as the app's
    # user, so the two files it writes are the app's. Prints the two values derived
    # from the key, in the exact shape the former bootstrap step wrote them; $MAISON_ENV
    # adds a key only when .env lacks it, so an installed box keeps its own.
    - name: perms-keypair
      at: setup
      run: always
      images: [ghcr.io/worph/hubs-seed:2.0.0]
      script: |
        docker run --rm -i --network none --user "$PUID:$PGID" -v "$APP_DIR:/out" \
          --entrypoint node ghcr.io/worph/hubs-seed:2.0.0 - >> "$MAISON_ENV" <<'JS'
        const fs = require("node:fs");
        const crypto = require("node:crypto");
        const privPath = "/out/perms.key.pem", pubPath = "/out/perms.pub.pem";
        if (!(fs.existsSync(privPath) && fs.existsSync(pubPath))) {
          const { privateKey, publicKey } = crypto.generateKeyPairSync("rsa", { modulusLength: 2048 });
          fs.writeFileSync(privPath, privateKey.export({ format: "pem", type: "pkcs1" }), { mode: 0o600 });
          fs.writeFileSync(pubPath, publicKey.export({ format: "pem", type: "spki" }));
        }
        const priv = fs.readFileSync(privPath, "utf8");
        const jwk = crypto.createPublicKey(priv).export({ format: "jwk" });
        process.stdout.write("PGRST_JWT_SECRET=" + JSON.stringify({ alg: "RS256", kty: jwk.kty, n: jwk.n, e: jwk.e }) + "\n");
        process.stdout.write("turkeyCfg_PERMS_KEY=" + priv.split("\n").join("\\\\n") + "\n");
        JS
    # Runs after the stack is up, on the app's own network, because it talks to
    # reticulum: mints an admin token with the dashboard key and uploads the default
    # scene and branding.
    - name: seed
      at: started
      run: once
      script: |
        DASHBOARD_ACCESS_KEY="$turkeyCfg_DASHBOARD_ACCESS_KEY" \
        docker run --rm --network hubs-net \
          -e DASHBOARD_ACCESS_KEY \
          -e RET_INTERNAL_URL=https://hubs-reticulum:4000 \
          -e RET_PUBLIC_URL="${APP_URL:-https://hubs-${APP_DOMAIN}}" \
          -e APP_EMAIL \
          ghcr.io/worph/hubs-seed:2.0.0
  # Created and owned by Maison before images are pulled, before any step runs and
  # before any container starts - on the first boot and every one after it.
  folders:
    - path: /DATA/AppData/hubs
      user: $PUID
      group: $PGID
    # postgres:17.11-alpine drops to uid 70 through gosu, so the cluster directory
    # has to be its own. recursive because a chown of /DATA/AppData can re-lock
    # the tree to PUID between boots, which crash-loops the database.
    - path: /DATA/AppData/hubs/pgdata
      user: 70
      group: 70
      recursive: true
    - path: /DATA/AppData/hubs/retstorage
      user: $PUID
      group: $PGID
