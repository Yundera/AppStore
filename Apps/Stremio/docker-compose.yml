name: stremio
services:
    stremio:
        cpu_shares: 70
        container_name: stremio
        depends_on:
            stremiocommunity:
                condition: service_started
                required: true
        deploy:
            resources:
                limits:
                    memory: "536870912"
        environment:
            BACKEND_HOST: stremiocommunity
            BACKEND_PORT: "8080"
            LISTEN_PORT: "80"
            USER: admin
            PASSWORD: $DEFAULT_PWD
            ALLOW_HASH_CONTENT_PATHS: "true"
        expose:
            - "80"
        hostname: stremio
        image: ghcr.io/yundera/appshield:2.0.3
        labels:
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stremio.png
            caddy_0: stremio-${APP_DOMAIN}
            caddy_0.import: gateway_tls
            caddy_0.reverse_proxy: '{{upstreams 80}}'
            caddy_1: stremio-${APP_PUBLIC_IP_DASH}.nip.io
            caddy_1.import: gateway_tls
            caddy_1.reverse_proxy: '{{upstreams 80}}'
            caddy_2: stremio-${APP_PUBLIC_IP_DASH}.sslip.io
            caddy_2.reverse_proxy: '{{upstreams 80}}'
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 50m
        networks:
            # On `pcs` because Caddy must reach it, and on the app's own
            # network because that is where its backend lives.
            pcs: {}
            stremio-internal: {}
        restart: unless-stopped
        tmpfs:
            - /var/cache/nginx:size=50M
        user: root
    stremiocommunity:
        cpu_shares: 70
        container_name: stremiocommunity
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                if ! grep -q 'yundera-download-fix' /etc/nginx/http.d/default.conf; then
                  sed -i 's@^\(    location / {\)@    location ~ "^/([a-zA-Z0-9]{40})/(.+)$$" { proxy_pass http://backend; proxy_buffering off; proxy_max_temp_file_size 0; }  # yundera-download-fix\n\1@' /etc/nginx/http.d/default.conf
                fi
                cd /srv/stremio-server
                exec ./stremio-web-service-run.sh
        deploy:
            resources:
                limits:
                    memory: "1073741824"
        environment:
            AUTO_SERVER_URL: "1"
            NO_CORS: "1"
            USERNAME: admin
            PASSWORD: $DEFAULT_PWD
        image: tsaridas/stremio-docker:v1.2.12
        labels:
            icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stremio.png
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 50m
        networks:
            # App-private: reached only by the AppShield proxy, so it has no
            # business on the shared network.
            stremio-internal: {}
        restart: unless-stopped
        user: "0:0"
        volumes:
            - type: bind
              source: ${DATA_ROOT:-/DATA}/AppData/stremio/server/
              target: /root/.stremio-server
              bind:
                create_host_path: true
        x-casaos:
            envs:
                - container: USERNAME
                  description:
                    en_us: Username for Stremio web UI
                - container: PASSWORD
                  description:
                    en_us: Password for Stremio web UI
            volumes:
                - container: /root/.stremio-server
                  description:
                    en_us: Stremio server data and configuration
networks:
    default:
        name: stremio_default
    pcs:
        name: ${APP_NET:-pcs}
        external: true
    # App-private link between the proxy and the Stremio server.
    stremio-internal:
        driver: bridge
x-casaos:
    architectures:
        - amd64
        - arm64
        - arm/v7
    author: Yundera
    category: Entertainment
    description:
        en_us: |
            Stremio Community Edition.
            Features:
            - Clean subdomain (no port prefix)
            - All-in-one streaming server with FFmpeg transcoding
            - Login with your Yundera default password
    developer: Yundera
    hostname: stremio-${APP_DOMAIN}
    icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/stremio.png
    index: /
    is_uncontrolled: false
    main: stremio
    port_map: "443"
    scheme: https
    screenshot_link:
        - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Stremio/screenshot-1.png
        - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Stremio/screenshot-2.png
    store_app_id: stremio
    tagline:
        en_us: Stream movies & series (Community Edition)
    thumbnail: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/Stremio/thumbnail.png
    tips:
        before_install:
            en_us: |
                Login with username `admin` and your Yundera default password.
                You can find Stremio addons at https://addons.strem.io/
    title:
        en_us: Stremio
    webui_port: 80

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/stremio/server
      user: $PUID
      group: $PGID
