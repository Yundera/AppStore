name: stremio
services:
    stremio:
        cpu_shares: 70
        container_name: stremio
        depends_on:
            stremiocommunity:
                condition: service_started
                required: true
        deploy:
            resources:
                limits:
                    memory: "536870912"
        environment:
            BACKEND_HOST: stremiocommunity
            BACKEND_PORT: "8080"
            LISTEN_PORT: "80"
            # Auth gate: the presence of OIDC_REGISTRAR_URL puts AppShield in OIDC
            # mode, so it self-registers with the PCS auth-registrar and every human
            # request is sent through the built-in Authelia SSO. No client id/secret
            # to configure, and no static credentials (USER/PASSWORD would be ignored
            # in this mode anyway).
            OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
            REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
            # Stremio streams torrent content from /<40-hex-chars>/... paths where the
            # hash itself is the capability; external players and casting devices cannot
            # carry the SSO session cookie. Everything else stays behind the gate.
            ALLOW_HASH_CONTENT_PATHS: "true"
        expose:
            - "80"
        hostname: stremio
        image: ghcr.io/yundera/appshield:3.2.0
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 50m
        networks:
            # On `pcs` because the router must reach it, and on the app's own
            # network because that is where its backend lives.
            pcs: {}
            stremio-internal: {}
        restart: unless-stopped
        tmpfs:
            - /var/cache/nginx:size=50M
    stremiocommunity:
        cpu_shares: 70
        container_name: stremiocommunity
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                # Torrent downloads are served from /<40-char-hash>/<name>, which the
                # stock image only routes for a numeric file index. This widens it.
                #
                # It must NOT swallow the app's own assets: Stremio's web build lives in
                # a directory whose name is itself 40 hex chars, so an unconditional
                # proxy_pass sent /<build-hash>/binaries/stremio_core_web_bg.wasm to the
                # torrent backend, which tried to resolve the build hash as an infohash
                # and hung until nginx returned 504 at proxy_read_timeout. The WASM module
                # never instantiated and the UI never booted. try_files serves the file
                # from disk when it exists and only falls through to the torrent backend
                # when it does not, which keeps the download route working.
                if ! grep -q 'yundera-download-fix' /etc/nginx/http.d/default.conf; then
                  sed -i 's|^\(    location / {\)|    location ~ "^/([a-zA-Z0-9]{40})/(.+)$$" { root /srv/stremio-server/build; try_files $$uri @yundera_torrent; }  # yundera-download-fix\n    location @yundera_torrent { proxy_pass http://backend; proxy_buffering off; proxy_max_temp_file_size 0; }\n\1|' /etc/nginx/http.d/default.conf
                fi
                cd /srv/stremio-server
                exec ./stremio-web-service-run.sh
        deploy:
            resources:
                limits:
                    memory: "1073741824"
        environment:
            AUTO_SERVER_URL: "1"
            NO_CORS: "1"
        image: tsaridas/stremio-docker:v1.3.14
        logging:
            driver: json-file
            options:
                max-file: "3"
                max-size: 50m
        networks:
            # App-private: reached only by the AppShield proxy, so it has no
            # business on the shared network.
            stremio-internal: {}
        restart: unless-stopped
        user: "0:0"
        volumes:
            - type: bind
              source: ${DATA_ROOT:-/DATA}/AppData/stremio/server/
              target: /root/.stremio-server
              bind:
                create_host_path: true
        x-casaos:
            volumes:
                - container: /root/.stremio-server
                  description:
                    en_us: Stremio server data and configuration
networks:
    default:
        name: stremio_default
    pcs:
        name: ${APP_NET:-pcs}
        external: true
    # App-private link between the proxy and the Stremio server.
    stremio-internal:
        driver: bridge
x-casaos:
    architectures:
        - amd64
        - arm64
    developer: Stremio
    category: Entertainment
    description:
        en_us: |
            Stremio Community Edition.
            Features:
            - Clean subdomain (served on a plain HTTPS address)
            - All-in-one streaming server with FFmpeg transcoding
            - Protected by the server's single sign-on (Authelia SSO)
    hostname: ${APP_HOST:-stremio-${APP_DOMAIN}}
    index: /
    icon: icon.png
    is_uncontrolled: false
    main: stremio
    port_map: "443"
    scheme: https
    screenshot_link:
        - screenshot-1.png
        - screenshot-2.png
    store_app_id: stremio
    tagline:
        en_us: Stream movies & series (Community Edition)
    thumbnail: thumbnail.png
    tips:
        before_install:
            en_us: |
                Access is protected by the server's single sign-on: opening the app
                sends you to the usual login page, where your server account signs you in.
                You can find Stremio addons at https://addons.strem.io/
    title:
        en_us: Stremio
    webui_port: 80

x-compose-app:
  schema_version: 2
  version: "1.3.14"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: stremio, name: stremio, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: stremio
  title:
    en_us: Stremio
  tagline:
    en_us: Stream movies & series (Community Edition)
  description:
    en_us: |
      Stremio Community Edition.
      Features:
      - Clean subdomain (served on a plain HTTPS address)
      - All-in-one streaming server with FFmpeg transcoding
      - Protected by the server's single sign-on (Authelia SSO)
  developer: Stremio
  category: Entertainment
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      Access is protected by the server's single sign-on: opening the app
      sends you to the usual login page, where your server account signs you in.
      You can find Stremio addons at https://addons.strem.io/
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/stremio/server
      user: $PUID
      group: $PGID
