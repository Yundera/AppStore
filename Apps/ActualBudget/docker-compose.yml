name: actualbudget
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  actualbudget-proxy:
    image: ghcr.io/nsl-sh/appshield:4.1.0
    container_name: actualbudget
    # OIDC identity: the auth-registrar attests this app's name via the container's
    # PTR record, so the hostname must equal the app name.
    hostname: actualbudget
    restart: unless-stopped
    environment:
      BACKEND_HOST: "actualbudget-backend"
      BACKEND_PORT: "5006"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      actualbudget-backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On `pcs` because the platform proxy must reach it, and on the app's own
      # network because that is where the backend lives.
      - pcs
      - actualbudget-internal

  actualbudget-backend:
    image: actualbudget/actual-server:26.11.0
    container_name: actualbudget-backend
    restart: unless-stopped
    user: $PUID:$PGID
    environment:
      TZ: $TZ
      ACTUAL_PORT: "5006"
    volumes:
      # Server password, account/session database and every budget file.
      - ${DATA_ROOT:-/DATA}/AppData/actualbudget/data:/data
    expose:
      - 5006
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      # App-private only: reached solely through the AppShield gate.
      - actualbudget-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  actualbudget-internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: actualbudget-proxy
  webui_port: 80
  index: /
  store_app_id: actualbudget
  category: Finance
  tags: ["finance", "budget", "personal"]
  developer: Actual Budget
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  title:
    en_us: Actual Budget
  tagline:
    en_us: Local-first personal finance with envelope budgeting
  description:
    en_us: |
      Actual Budget is a fast, privacy-focused app for managing your personal finances. At its heart is the well-proven envelope budgeting method: give every unit of income a job, then track spending against your categories month by month.

      **Key features:**
      • Envelope budgeting with rollover and month-by-month planning
      • Accounts, transactions, rules, schedules and reports
      • Import from OFX, QFX, QIF, CSV, YNAB 4 and nYNAB
      • Local-first: the budget runs in your browser and syncs to this server
      • Multi-device sync, with optional end-to-end encryption
      • Your data stays on your server

      Access is protected by your server's single sign-on. On first open, Actual also asks you to set a server password of its own.
  tips:
    before_install:
      en_us: |
        **Sign-in:** Actual Budget is protected by your server's single sign-on.

        **First open:** Actual asks you to **set a server password**. Choose one and keep it
        safe - Actual asks for it again when you open the budget from a new browser or device.
        Then create a new budget (or import one) and start assigning money to categories.

        To change it later, open the **Server online** menu at the top right of Actual and
        choose **Change password**.
x-compose-app:
  schema_version: 2
  version: "26.11.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI.
  routes:
    - { service: actualbudget-proxy, name: actualbudget, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: actualbudget
  title:
    en_us: Actual Budget
  tagline:
    en_us: Local-first personal finance with envelope budgeting
  description:
    en_us: |
      Actual Budget is a fast, privacy-focused app for managing your personal finances. At its heart is the well-proven envelope budgeting method: give every unit of income a job, then track spending against your categories month by month.

      **Key features:**
      • Envelope budgeting with rollover and month-by-month planning
      • Accounts, transactions, rules, schedules and reports
      • Import from OFX, QFX, QIF, CSV, YNAB 4 and nYNAB
      • Local-first: the budget runs in your browser and syncs to this server
      • Multi-device sync, with optional end-to-end encryption
      • Your data stays on your server

      Access is protected by your server's single sign-on. On first open, Actual also asks you to set a server password of its own.
  developer: Actual Budget
  category: Finance
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** Actual Budget is protected by your server's single sign-on.

      **First open:** Actual asks you to **set a server password**. Choose one and keep it
      safe - Actual asks for it again when you open the budget from a new browser or device.
      Then create a new budget (or import one) and start assigning money to categories.

      To change it later, open the **Server online** menu at the top right of Actual and
      choose **Change password**.
  folders:
    # The backend runs as $PUID:$PGID and writes here from its first start.
    - /DATA/AppData/actualbudget/data
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in when single sign-on is unavailable. Day to day, use single sign-on. Actual's own server password is the one you set on first open.
      # Behind SSO nobody needs it on the first click: tile menu only.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
