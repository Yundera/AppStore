    - screenshot-2.png
    - screenshot-3.png
  # Raw TCP/UDP must be dialled from the internet: hidden on a box behind NAT or the tunnel.
  requires: [public-ip]
  architectures:
    - amd64
    - arm64
  # Uncapped: a late-game map takes ~2G and grows with the factory; one fast core.
  resources:
    recommended: { memory: 4G }
