  folders:
    - /DATA/AppData/$AppID/data
    - /DATA/AppData/$AppID/data/config
  secrets:
    # The password players type to join. alnum keeps it easy to read out to friends.
    FACTORIO_GAME_PASSWORD: alnum:16
  credentials:
    - label:
        en_us: Game password
      password: ${FACTORIO_GAME_PASSWORD}
      note:
        en_us: Players enter it in Multiplayer → Connect to address.
      # The password lives in server-settings.json (seeded once, then the owner's file),
      # so the change edits it there; Maison's recreate then restarts the server on it.
      change:
        apply: script
        images:
          - factoriotools/factorio:2.1.23
        script: |
          docker run --rm -i --user "$PUID:$PGID" --entrypoint sh \
            -e FACTORIO_GAME_PASSWORD -v "$APP_DIR/data/config:/config" \
            factoriotools/factorio:2.1.23 -s <<'SH'
          set -e
          f=/config/server-settings.json
          jq --arg p "$FACTORIO_GAME_PASSWORD" '.game_password = $p' "$f" > "$f.new"
          mv "$f.new" "$f"
          SH
        policy:
          min_length: 8
          max_length: 64
  steps:
    # Surfaces the Space Age switch in App settings › Env; MAISON_ENV only adds the key
    # when .env lacks it, so the owner's choice is kept.
    - name: space-age-setting
      at: setup
      run: always
      script: |
        echo "FACTORIO_SPACE_AGE=true" >> "$MAISON_ENV"
