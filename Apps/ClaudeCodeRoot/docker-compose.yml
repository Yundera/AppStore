name: clauderoot

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clauderoot:
    image: ghcr.io/worph/claude-code-container:1.0.26
    container_name: clauderoot
    restart: unless-stopped
    user: 0:0
    expose:
      - 8080
      - 9090
    environment:
      - AUTH_PASSWORD=${CLAUDECODEROOT_AUTH_PASSWORD}
      # MCP automation disabled on the privileged (root) app. The 9090 auth layer
      # (login/auth/logout) keeps running; only the /mcp endpoint is turned off.
      - MCP_ENABLED=false
    volumes:
      # Docker socket for container management
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # SSH keys for claude host user access to host VM (used for system maintenance via sudo)
      - type: bind
        source: /home/claude/.ssh/
        target: /host_ssh/
      # Used for PCS integration
      - type: bind
        source: ${DATA_ROOT:-/DATA}/
        target: /DATA/
      # Claude Code workspace persistence
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/workspace/
        target: /home/claude/workspace
      # Claude config persistence (contains credentials, settings, and other important data)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/config/
        target: /home/claude/.claude
      # Claude session state file (required for auth persistence across restarts)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/config/.claude.json
        target: /home/claude/.claude.json
    networks:
      clauderoot-net: null
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2048M

  # The app's own router: login/logout/mcp straight to the auth server, everything
  # else gated by it (auth_request) and then proxied to ttyd. This was a Caddy
  # forward_auth tree; the platform now only routes a host to port 80 here.
  clauderoot-router:
    image: nginx:1.28.0-alpine
    container_name: clauderoot-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: clauderoot-router
        target: /etc/nginx/conf.d/default.conf
    labels:
      caddy_0: clauderoot-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: clauderoot-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: clauderoot-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      clauderoot-net: null
      pcs: null
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  clauderoot-net:
    name: clauderoot-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  clauderoot-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }

      server {
        listen 80;
        # Relative Location headers, as Caddy's `redir * /login` sent.
        absolute_redirect off;

        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$auth clauderoot:9090;
        set $$ttyd clauderoot:8080;

        location = /_router/health { access_log off; return 204; }

        # Served by the auth server itself, ungated.
        location /login  { proxy_pass http://$$auth; }
        location = /logout { proxy_pass http://$$auth; }
        location /mcp {
          rewrite ^/mcp/?(.*)$$ /$$1 break;
          proxy_pass http://$$auth;
        }

        # The gate: Caddy forward_auth's contract (GET, original request in
        # X-Forwarded-*, no body); a 401 sends the browser to /login.
        location = /_router/auth {
          internal;
          proxy_method GET;
          proxy_pass_request_body off;
          # Setting any header here drops every inherited one, so restate them.
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$fwd_proto;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header Content-Length "";
          proxy_set_header Upgrade "";
          proxy_set_header Connection "";
          proxy_set_header X-Forwarded-Method $$request_method;
          proxy_set_header X-Forwarded-Uri $$request_uri;
          proxy_pass http://$$auth/auth;
        }
        location @login { return 302 /login; }

        location / {
          auth_request /_router/auth;
          error_page 401 = @login;
          proxy_pass http://$$ttyd;
        }
      }

x-casaos:
  index: /

  architectures:
    - amd64
    - arm64
  main: clauderoot-router
  category: Developer
  tags: ["developer", "ai"]
  description:
    en_us: |
      Claude Code Container (root) - Web-based terminal interface for Claude Code (Anthropic's CLI for Claude).

      This is the PRIVILEGED variant, intended for PCS administration and debugging. It has full control of the host VM. For a sandboxed Claude Code without host access, install "Claude Code" instead.

      Features:
      - Web-based terminal access to Claude Code
      - Styled login page with session management
      - Persistent workspace volume
      - Claude starts automatically on connection
      - Full administrative power: Docker socket access + SSH access (dedicated `claude` host user with NOPASSWD sudo) to host VM
      - Mounts the whole of /DATA read-write, including every other app's data
      - Can perform any maintenance task on the VM

      The login password is generated per app and shown when you first open it.
    zh_cn: |
      Claude Code 容器（root）- Claude Code（Anthropic 的 Claude CLI）的 Web 终端界面。

      这是**特权版本**，用于 PCS 管理和调试，拥有对宿主虚拟机的完全控制权。如果只需要不接触宿主机的沙盒化 Claude Code，请改为安装“Claude Code”应用。

      功能：
      - 基于 Web 的 Claude Code 终端访问
      - 带会话管理的登录页面
      - 持久化工作区
      - 连接时自动启动 Claude
      - 完整的管理权限：可访问 Docker socket，并通过专用的 `claude` 宿主机用户（免密 sudo）以 SSH 登录宿主虚拟机
      - 可挂载整个 /DATA（包括其他应用的数据），并可对虚拟机执行任何维护操作

      登录密码按应用单独生成，首次打开应用时会显示。
  developer: Anthropic
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Web terminal for Claude Code - Anthropic's AI coding assistant
    zh_cn: Claude Code 的 Web 终端 - Anthropic 的 AI 编程助手
  thumbnail: thumbnail.png
  title:
    en_us: Claude Code (root)
    zh_cn: Claude Code (root)
  tips:
    before_install:
      en_us: |
        Authentication options:
        - Anthropic API key (https://console.anthropic.com/), OR
        - Claude Pro/Max subscription (authenticate via OAuth on first run)

        Leave API key empty to use subscription auth.

        The login password is shown when you open the app (tile menu → Credentials).

        **This is the privileged (root) app for PCS administration and debugging.** It has full control of the host VM (Docker socket + SSH admin/sudo) and mounts the whole of `/DATA` read-write, so it can read and modify every other app's data. Install it only on a PCS you administer yourself, and consider changing its generated password from Maison's Security tab.

        **MCP automation is disabled on this app.** The programmatic MCP endpoint is intentionally not exposed here (the sandboxed "Claude Code" app has it off as well).
      zh_cn: |
        认证方式：
        - Anthropic API 密钥（https://console.anthropic.com/），或
        - Claude Pro/Max 订阅（首次运行时通过 OAuth 认证）

        使用订阅认证时请将 API 密钥留空。

        首次打开应用时会显示登录密码（也可在磁贴菜单 → 凭据中查看）。

        **这是用于 PCS 管理和调试的特权（root）应用。** 它拥有对宿主虚拟机的完全控制权（Docker socket + SSH 管理员/sudo），并以读写方式挂载整个 /DATA，因此可以读取和修改其他所有应用的数据。请仅在您自己管理的 PCS 上安装，并可在 Maison 的安全选项卡中修改生成的密码。

        **本应用已禁用 MCP 自动化。** 此处刻意不开放程序化 MCP 端点（沙盒版“Claude Code”应用同样已关闭）。

