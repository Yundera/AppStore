  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/clauderoot/workspace
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/clauderoot/config
      user: $PUID
      group: $PGID
  webui-host: clauderoot-${domain}
  secrets:
    # Seeded from the box-wide password it replaces, so an installed app keeps the
    # login it already had; a fresh install gets its own.
    CLAUDECODEROOT_AUTH_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Terminal login
      password: ${CLAUDECODEROOT_AUTH_PASSWORD}
      # The auth layer reads AUTH_PASSWORD from the environment on every start and
      # keeps sessions in memory only, so .env plus a recreate is the whole change.
      # Open terminals are logged out by the recreate.
      change:
        apply: env
  # Host provisioning: a dedicated `claude` host user + NOPASSWD sudo + a writable
  # ~/.ssh (the /home/claude/.ssh mount above feeds the optional host-SSH feature),
  # which no declaration can express. Everything this used to do to the app's own
  # files (CLAUDE.md, .claude.json) lives in seed/ instead.
  # A step's shell runs inside the Maison container, but its docker client talks to
  # the HOST daemon — so `docker run -v /:/host … chroot /host` is how this reaches
  # the host namespace.
  # ENSURE semantics: every command is idempotent and best-effort, and the step
  # always succeeds — the host `claude` user is only needed for the optional
  # host-SSH feature, so it must NEVER block the app from installing.
  steps:
    - name: host-claude-user
      at: setup
      run: once
      script: |
        docker run --rm -v /:/host alpine:3.20 chroot /host /bin/sh -c '
          id claude >/dev/null 2>&1 || useradd -m -s /bin/bash -p "*" claude || true
          # OpenSSH refuses ALL auth (incl. pubkey) for an account whose shadow
          # password field is "!" — the default useradd leaves. "*" means "no
          # password set" without tripping the locked-account check, so key-based
          # SSH works. Run unconditionally to also repair accounts already
          # provisioned locked. (passwd -u would NOT fix this: it refuses to
          # unlock an account with no real hash behind the "!".)
          usermod -p "*" claude 2>/dev/null || true
          if [ ! -f /etc/sudoers.d/claude ]; then
            echo "claude ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/claude && chmod 440 /etc/sudoers.d/claude
          fi
          install -d -m 700 -o claude -g claude /home/claude/.ssh 2>/dev/null || mkdir -p /home/claude/.ssh
          touch /home/claude/.ssh/authorized_keys 2>/dev/null || true
          chmod 600 /home/claude/.ssh/authorized_keys 2>/dev/null || true
          chown claude:claude /home/claude/.ssh /home/claude/.ssh/authorized_keys 2>/dev/null || true
          exit 0
        ' || echo "host claude provisioning skipped (host-SSH may be unavailable); continuing"
