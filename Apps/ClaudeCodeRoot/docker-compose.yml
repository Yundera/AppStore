name: clauderoot

services:
  clauderoot:
    image: ghcr.io/worph/claude-code-container:1.0.26
    container_name: clauderoot
    restart: unless-stopped
    user: 0:0
    expose:
      - 8080
      - 9090
    labels:
      caddy_0: clauderoot-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      # /login, /logout — no forward_auth, served by MCP server
      caddy_0.0_handle: "/login*"
      caddy_0.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_0.1_handle: "/logout"
      caddy_0.1_handle.reverse_proxy: "{{upstreams 9090}}"
      # /mcp — no forward_auth, MCP server has its own Bearer auth.
      # MCP automation itself is disabled via MCP_ENABLED=false below; with that
      # set, the 9090 server returns 404 for /mcp (auth/login still served).
      caddy_0.2_handle_path: "/mcp*"
      caddy_0.2_handle_path.reverse_proxy: "{{upstreams 9090}}"
      # Everything else — forward_auth via MCP, then proxy to ttyd
      caddy_0.3_handle: ""
      caddy_0.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_0.3_handle.forward_auth.uri: /auth
      caddy_0.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_0.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_0.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_0.3_handle.reverse_proxy: "{{upstreams 8080}}"

      caddy_1: clauderoot-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.0_handle: "/login*"
      caddy_1.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.1_handle: "/logout"
      caddy_1.1_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.2_handle_path: "/mcp*"
      caddy_1.2_handle_path.reverse_proxy: "{{upstreams 9090}}"
      caddy_1.3_handle: ""
      caddy_1.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_1.3_handle.forward_auth.uri: /auth
      caddy_1.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_1.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_1.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_1.3_handle.reverse_proxy: "{{upstreams 8080}}"

      caddy_2: clauderoot-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.0_handle: "/login*"
      caddy_2.0_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.1_handle: "/logout"
      caddy_2.1_handle.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.2_handle_path: "/mcp*"
      caddy_2.2_handle_path.reverse_proxy: "{{upstreams 9090}}"
      caddy_2.3_handle: ""
      caddy_2.3_handle.forward_auth: "{{upstreams 9090}}"
      caddy_2.3_handle.forward_auth.uri: /auth
      caddy_2.3_handle.forward_auth.@unauthorized.status: "401"
      caddy_2.3_handle.forward_auth.handle_response: "@unauthorized"
      caddy_2.3_handle.forward_auth.handle_response.redir: "* /login"
      caddy_2.3_handle.reverse_proxy: "{{upstreams 8080}}"
    environment:
      - AUTH_PASSWORD=$APP_DEFAULT_PASSWORD
      # MCP automation disabled on the privileged (root) app. The 9090 auth layer
      # (login/auth/logout) keeps running; only the /mcp endpoint is turned off.
      - MCP_ENABLED=false
    volumes:
      # Docker socket for container management
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      # SSH keys for claude host user access to host VM (used for system maintenance via sudo)
      - type: bind
        source: /home/claude/.ssh/
        target: /host_ssh/
      # Used for PCS integration
      - type: bind
        source: ${DATA_ROOT:-/DATA}/
        target: /DATA/
      # Claude Code workspace persistence
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/workspace/
        target: /home/claude/workspace
      # Claude config persistence (contains credentials, settings, and other important data)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/config/
        target: /home/claude/.claude
      # Claude session state file (required for auth persistence across restarts)
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/clauderoot/config/.claude.json
        target: /home/claude/.claude.json
    networks:
      pcs: null
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 2048M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  index: /

  architectures:
    - amd64
    - arm64
  main: clauderoot
  author: Yundera
  category: Developer
  tags: ["developer", "ai"]
  description:
    en_us: |
      Claude Code Container (root) - Web-based terminal interface for Claude Code (Anthropic's CLI for Claude).

      This is the PRIVILEGED variant, intended for PCS administration and debugging. It has full control of the host VM. For sandboxed automation (e.g. n8n via MCP) without host access, install "Claude Code" instead.

      Features:
      - Web-based terminal access to Claude Code
      - Styled login page with session management
      - Persistent workspace volume
      - Claude starts automatically on connection
      - Full administrative power: Docker socket access + SSH access (dedicated `claude` host user with NOPASSWD sudo) to host VM
      - Mounts the whole of /DATA read-write, including every other app's data
      - Can perform any maintenance task on the VM

      Default password is auto-generated. Check the app settings for the AUTH_PASSWORD value.
    zh_cn: |
      Claude Code 容器（root）- Claude Code（Anthropic 的 Claude CLI）的 Web 终端界面。

      这是**特权版本**，用于 PCS 管理和调试，拥有对宿主虚拟机的完全控制权。如果只需要不接触宿主机的沙盒化自动化（例如通过 MCP 驱动 n8n），请改为安装“Claude Code”应用。

      功能：
      - 基于 Web 的 Claude Code 终端访问
      - 带会话管理的登录页面
      - 持久化工作区
      - 连接时自动启动 Claude
      - 完整的管理权限：可访问 Docker socket，并通过专用的 `claude` 宿主机用户（免密 sudo）以 SSH 登录宿主虚拟机
      - 可挂载整个 /DATA（包括其他应用的数据），并可对虚拟机执行任何维护操作

      默认密码为自动生成，请在应用设置中查看 AUTH_PASSWORD 的值。
  developer: Anthropic / Yundera
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Web terminal for Claude Code - Anthropic's AI coding assistant
    zh_cn: Claude Code 的 Web 终端 - Anthropic 的 AI 编程助手
  thumbnail: thumbnail.png
  title:
    en_us: Claude Code (root)
    zh_cn: Claude Code (root)
  tips:
    before_install:
      en_us: |
        Authentication options:
        - Anthropic API key (https://console.anthropic.com/), OR
        - Claude Pro/Max subscription (authenticate via OAuth on first run)

        Leave API key empty to use subscription auth.

        Default login password: `$APP_DEFAULT_PASSWORD`

        **This is the privileged (root) app for PCS administration and debugging.** It has full control of the host VM (Docker socket + SSH admin/sudo) and mounts the whole of `/DATA` read-write, so it can read and modify every other app's data. Install it only on a PCS you administer yourself, and change the default password immediately.

        **MCP automation is disabled on this app.** The programmatic MCP endpoint is intentionally not exposed here. If you want to drive Claude Code from n8n or other agents via MCP, install the standard "Claude Code" app instead.
      zh_cn: |
        认证方式：
        - Anthropic API 密钥（https://console.anthropic.com/），或
        - Claude Pro/Max 订阅（首次运行时通过 OAuth 认证）

        使用订阅认证时请将 API 密钥留空。

        默认登录密码：`$APP_DEFAULT_PASSWORD`

        **这是用于 PCS 管理和调试的特权（root）应用。** 它拥有对宿主虚拟机的完全控制权（Docker socket + SSH 管理员/sudo），并以读写方式挂载整个 /DATA，因此可以读取和修改其他所有应用的数据。请仅在您自己管理的 PCS 上安装，并立即修改默认密码。

        **本应用已禁用 MCP 自动化。** 此处刻意不开放程序化 MCP 端点。如果需要通过 MCP 从 n8n 或其他智能体驱动 Claude Code，请改为安装标准的“Claude Code”应用。
  # Runs as root INSIDE the casa-img container (only /DATA + docker.sock are in
  # scope here), so host-user provisioning must break out to the host namespace
  # via the docker socket: `docker run -v /:/host alpine:3.20 chroot /host ...`.
  # This block ensures a dedicated `claude` host user + NOPASSWD sudo + a
  # writable ~/.ssh exist (the /home/claude/.ssh mount above feeds the optional
  # host-SSH feature). Idempotent: a no-op where they already do.
  # ENSURE semantics: every step is idempotent and best-effort, and the whole
  # script always exits 0 — provisioning the host `claude` user is only needed for
  # the optional host-SSH feature, so it must NEVER block the app from installing.
  pre-install-cmd: |
    # Host provisioning, and the only reason this app still carries a hook: it
    # creates the `claude` account on the HOST and grants it sudo, which is not
    # something any declaration can express. Everything it used to do to the app's
    # own files (CLAUDE.md, .claude.json) now lives in seed/ instead.
    #
    # Every step is best-effort and the hook ends with `exit 0`: a PCS where host
    # SSH is unavailable should still get the app.
    docker run --rm -v /:/host alpine:3.20 chroot /host /bin/sh -c '
      id claude >/dev/null 2>&1 || useradd -m -s /bin/bash -p "*" claude || true
      # OpenSSH refuses ALL auth (incl. pubkey) for an account whose shadow
      # password field is "!" — the default useradd leaves. "*" means "no
      # password set" without tripping the locked-account check, so key-based
      # SSH works. Run unconditionally to also repair accounts already
      # provisioned locked. (passwd -u would NOT fix this: it refuses to
      # unlock an account with no real hash behind the "!".)
      usermod -p "*" claude 2>/dev/null || true
      if [ ! -f /etc/sudoers.d/claude ]; then
        echo "claude ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/claude && chmod 440 /etc/sudoers.d/claude
      fi
      install -d -m 700 -o claude -g claude /home/claude/.ssh 2>/dev/null || mkdir -p /home/claude/.ssh
      touch /home/claude/.ssh/authorized_keys 2>/dev/null || true
      chmod 600 /home/claude/.ssh/authorized_keys 2>/dev/null || true
      chown claude:claude /home/claude/.ssh /home/claude/.ssh/authorized_keys 2>/dev/null || true
      exit 0
    ' || echo "[pre-install] host claude provisioning skipped (host-SSH may be unavailable); continuing"
    exit 0

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/clauderoot/workspace
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/clauderoot/config
      user: $PUID
      group: $PGID
  webui-host: clauderoot-${domain}
