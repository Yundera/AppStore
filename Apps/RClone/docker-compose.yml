      **Default Account**: log in as `admin`; the password is shown when you open the app (tile menu → Credentials).
  # The Web GUI login (--rc-pass above). Seeded from the box-wide password it
  # replaces, so an installed app keeps the login its user knows; a fresh install
  # gets its own.
  secrets:
    RCLONE_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${RCLONE_ADMIN_PASSWORD}
      note:
        en_us: After a change, sign in to the web GUI again with the new password - the browser keeps the old one until then.
      # --rc-pass is read from the command line on every start, so a new value in
      # .env plus a recreate is the whole change.
      change:
        apply: env
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/rclone/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/rclone/cache
      user: $PUID
      group: $PGID
    - path: /DATA/Rclone
      user: $PUID
      group: $PGID
