  developer: Rclone
  category: Cloud
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  # Sum of the service limits (~2.25G) plus room for the OS and other apps.
  resources:
    recommended: { memory: 3G }
  architectures:
    - amd64
    - arm
    - arm64
  tips:
    en_us: |
      **Setup Steps**:
      1. **Configure Remote**: Use "Remotes" to add your cloud storage (Google Drive, OneDrive, etc.)
      2. **Verify Connection**: Use "Explorer" to browse and test access to your remote files
      3. **Mount Remote**: Use "Mounts" to mount your remote to `/data` path

