name: rclone
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rclone:
    user: $PUID:$PGID
    image: rclone/rclone:1.76.0
    container_name: rclone
    hostname: rclone
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    # 5580 serves the web GUI, 5572 the RC API it calls; rclone-router puts
    # both on the app's one host.
    expose:
      - 5580
      - 5572
    networks:
      - rclone-net
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/rclone/config/:/config/rclone/
      - ${DATA_ROOT:-/DATA}/AppData/rclone/cache/:/cache/
      - ${DATA_ROOT:-/DATA}/Rclone/:/data/:rshared,z
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # No /etc/fuse.conf bind: a host without that file made Docker create a
      # directory there and the start fail. The image ships its own fuse.conf.
    cap_add:
      - SYS_ADMIN
    privileged: true
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    # 1.76 refuses `rcd --rc-web-gui` ("superseded by the `rclone gui`
    # command"): `rclone gui` serves the GUI embedded in the binary on one port
    # and the RC API, behind the login, on another.
    command:
      - gui
      - --no-open-browser
      - --addr
      - :5580
      - --api-addr
      - :5572
      - --user
      - admin
      - --pass
      - ${RCLONE_ADMIN_PASSWORD}
      - --config
      - /config/rclone/rclone.conf
      - --cache-dir
      - /cache

  # ── The app's own router ───────────────────────────────────────────
  # The GUI finds the RC API only through `?url=` on /login (it has no field
  # for it), and calls it with POST. So one host serves both: GET and HEAD go
  # to the GUI, every other method to the API, and a browser that has never
  # connected is sent once to /login?url=<this host>.
  rclone-router:
    image: nginx:1.31.8-alpine
    container_name: rclone-router
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: rclone-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - rclone-net
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  rclone-net:
    name: rclone-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  rclone-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      # Upstreams are variables so nginx starts before they exist and re-resolves
      # them through Docker's DNS when a container is recreated with a new IP.
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      # The proxy in front terminated TLS: keep its scheme, not ours (http).
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The GUI is static files fetched with GET; the RC API is POST only.
      map $$request_method $$upstream { GET rclone:5580; HEAD rclone:5580; default rclone:5572; }
      # The GUI stores the API address in the browser only when a login succeeds,
      # so the cookie that marks "has connected" rides an authenticated API call.
      map "$$request_method:$$http_authorization" $$connected_cookie {
        "~^(GET|HEAD):"  "";
        "~^[A-Z]+:.+"    "rclone_gui=1; Path=/; Max-Age=31536000; SameSite=Lax";
        default          "";
      }

      server {
        listen 80;
        absolute_redirect off;

        # Uploads go through the API, and long calls (sync, copy) must not time out.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;
        # The GUI sends the login itself. rclone's Basic challenge on a 401 would
        # make the browser hold the GUI's first, credential-less probe open
        # behind a native password prompt instead of showing the GUI's own form.
        proxy_hide_header WWW-Authenticate;

        location = /_router/health { access_log off; return 204; }

        # The GUI keeps the API address in the browser once connected; a browser
        # that has not connected yet (no cookie) is sent to the login with it.
        location = / {
          if ($$cookie_rclone_gui = "") {
            return 302 "/login?url=$$fwd_proto://$$http_host";
          }
          proxy_pass http://$$upstream;
        }
        # A full load of /login without the address (a reload, an expired
        # session) gets it added, so the form can always connect.
        location = /login {
          if ($$arg_url = "") {
            return 302 "/login?url=$$fwd_proto://$$http_host&$$args";
          }
          proxy_pass http://$$upstream;
        }
        location / {
          # Not `always`: only a successful API answer marks the browser as connected.
          add_header Set-Cookie $$connected_cookie;
          proxy_pass http://$$upstream;
        }
      }

x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  tagline:
    en_us: Web UI to manage and mount cloud storage.
    zh_cn: 管理和挂载云存储的 Web UI。
    de_de: Web-UI zum Verwalten und Einbinden von Cloud-Speicher.
    es_es: Interfaz web para gestionar y montar almacenamiento en la nube.
    fr_fr: Interface web pour gérer et monter le stockage cloud.
    it_it: Interfaccia web per gestire e montare l'archiviazione cloud.
    ko_kr: 클라우드 스토리지를 관리하고 마운트하는 웹 UI입니다.
  description:
    en_us: Rclone is a command-line program to manage files on cloud storage. It mounts cloud storage as a local disk, allowing you to access your cloud files as if they were on your local machine.
    zh_cn: Rclone 是一个管理云存储文件的命令行程序。它将云存储挂载为本地磁盘，使您能够像访问本地文件一样访问云文件。
    de_de: Rclone ist ein Kommandozeilenprogramm zur Verwaltung von Dateien in der Cloud. Es bindet Cloud-Speicher als lokale Festplatte ein, sodass Sie auf Ihre Cloud-Dateien zugreifen können, als wären sie auf Ihrem lokalen Computer.
    es_es: Rclone es un programa de línea de comandos para gestionar archivos en almacenamiento en la nube. Monta el almacenamiento en la nube como un disco local, lo que le permite acceder a sus archivos en la nube como si estuvieran en su máquina local.
    fr_fr: Rclone est un programme en ligne de commande pour gérer les fichiers sur le stockage cloud. Il monte le stockage cloud comme un disque local, vous permettant d'accéder à vos fichiers cloud comme s'ils étaient sur votre machine locale.
    it_it: Rclone è un programma a riga di comando per gestire i file su cloud storage. Monta il cloud storage come disco locale, permettendo di accedere ai file cloud come se fossero sulla macchina locale.
    ko_kr: Rclone은 클라우드 스토리지의 파일을 관리하는 명령줄 프로그램입니다. 클라우드 스토리지를 로컬 디스크로 마운트하여 클라우드 파일을 로컬 컴퓨터에 있는 것처럼 사용할 수 있습니다.
  developer: Rclone
  author: Rclone
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  icon: icon.png
  category: Cloud
  title:
    en_us: Rclone
  tips:
    before_install:
      en_us: |
        **Setup Steps**:
        1. **Configure Remote**: Use "Remotes" to add your cloud storage (Google Drive, OneDrive, etc.)
        2. **Verify Connection**: Use "Explorer" to browse and test access to your remote files
        3. **Mount Remote**: Use "Mounts" to mount your remote to `/data` path

        **Important**: After mounting, files will be accessible at `/DATA/Rclone/` on your host system and to other containers.

        **Mount Configuration**:
        - Always mount remotes to `/data` inside the rclone web UI
        - This maps to `/DATA/Rclone/` on your CasaOS system
        - Files will be accessible to other containers that mount this directory
        - Other apps can access your cloud files by mounting `/DATA/Rclone/`

        **Virtual Files Setup (OneDrive/Dropbox style)**:
        For virtual files that download on-demand (like cloud sync clients):
        - **VFS Cache Mode**: Set to `minimal` for virtual files or `writes` for better performance
        - **VFS Cache Max Size**: Set based on available disk space (e.g., `10G` or `50G`)
        - **VFS Cache Max Age**: How long to keep cached files (e.g., `24h` or `168h` for 1 week)
        - **VFS Read Chunk Size**: Use `128M` for faster streaming of large files
        - **VFS Cache Poll Interval**: Set to `15s` to check for remote changes
        - **Mount Options**: Add `--allow-other` to make files accessible to other containers

        **Recommended Settings for Virtual Files**:
        ```
        VFS Cache Mode: minimal
        VFS Cache Max Size: 10G
        VFS Cache Max Age: 168h
        VFS Read Chunk Size: 128M
        VFS Cache Poll Interval: 15s
        Mount Options: --allow-other
        ```

        **Note**: The container is limited to 2 GB of RAM. If you raise **VFS Read Chunk Size**
        or run many parallel transfers, raise the memory limit accordingly, or transfers of
        large files may be killed by the OOM killer.

        **Default Account**: log in as `admin`; the password is shown when you open the app (tile menu → Credentials).
  index: /
  main: rclone-router
  webui_port: 80

x-compose-app:
  schema_version: 2
  version: "1.76.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: rclone-router, name: rclone, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  title:
    en_us: Rclone
  tagline:
