name: rclone
services:
  rclone:
    user: $PUID:$PGID
    image: rclone/rclone:1.74.4
    container_name: rclone
    hostname: rclone
    restart: unless-stopped
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    expose:
      - 80
    networks:
      - pcs
    labels:
      caddy_0: rclone-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: rclone-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: rclone-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/rclone/config/:/config/rclone/
      - ${DATA_ROOT:-/DATA}/AppData/rclone/cache/:/cache/
      - ${DATA_ROOT:-/DATA}/Rclone/:/data/:rshared,z
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/fuse.conf:/etc/fuse.conf:ro
    cap_add:
      - SYS_ADMIN
    privileged: true
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    command:
      - rcd
      - --rc-web-gui
      - --rc-addr
      - :80
      - --rc-user
      - admin
      - --rc-pass
      - $APP_DEFAULT_PASSWORD
      - --rc-allow-origin
      - "*"
      - --config
      - /config/rclone/rclone.conf
      - --cache-dir
      - /cache

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

