  tips:
    en_us: |
      **Uploading** opens with your server account (single sign-on), or the app password
      where there is none (tile menu → Credentials).

      **Sharing**: after an upload, send the *Download page* link. Recipients do not need
      to sign in. Keep the *Delete link* for yourself: anyone who has it can delete the file.

      **Admin page**: [admin.php](${APP_URL:-https://jirafeau-${APP_DOMAIN}}/admin.php), after
      signing in, asks for the Jirafeau admin password (tile menu → Credentials).

      Expired files are removed once a day.
    ko_kr: |
      **업로드**는 서버 계정(통합 인증)으로 열립니다. 통합 인증이 없으면 앱 비밀번호를
      쓰세요 (타일 메뉴 → Credentials).

      **공유**: 업로드 후 *다운로드 페이지* 링크를 보내세요. 받는 사람은 로그인할 필요가
      없습니다. *삭제 링크*는 본인만 가지고 있으세요. 그 링크가 있으면 누구나 파일을 지울 수 있습니다.

      **관리자 페이지**: [admin.php](${APP_URL:-https://jirafeau-${APP_DOMAIN}}/admin.php)는
      로그인 후 Jirafeau 관리자 비밀번호를 묻습니다 (타일 메뉴 → Credentials).

      만료된 파일은 하루에 한 번 삭제됩니다.
    fr_fr: |
      **L'envoi** s'ouvre avec votre compte serveur (authentification unique), ou avec le
      mot de passe de l'app s'il n'y en a pas (menu de la tuile → Credentials).

      **Partage** : après un envoi, transmettez le lien *Page de téléchargement*. Les
      destinataires n'ont pas à se connecter. Gardez le *lien de suppression* pour vous :
      quiconque l'a peut supprimer le fichier.

      **Page d'administration** : [admin.php](${APP_URL:-https://jirafeau-${APP_DOMAIN}}/admin.php),
      après connexion, demande le mot de passe admin de Jirafeau (menu de la tuile → Credentials).

      Les fichiers expirés sont supprimés une fois par jour.
    es_es: |
      **La subida** se abre con tu cuenta del servidor (inicio de sesión único), o con la
      contraseña de la app si no lo hay (menú del icono → Credentials).

      **Compartir**: tras subir, envía el enlace *Página de descarga*. Los destinatarios no
      necesitan iniciar sesión. Guarda el *enlace de borrado* para ti: quien lo tenga puede
      borrar el archivo.

      **Página de administración**: [admin.php](${APP_URL:-https://jirafeau-${APP_DOMAIN}}/admin.php),
      tras iniciar sesión, pide la contraseña de administrador de Jirafeau (menú del icono → Credentials).

      Los archivos caducados se eliminan una vez al día.
    zh_cn: |
      **上传**页面使用您的服务器账户（单点登录）打开；没有单点登录时使用应用密码
      （磁贴菜单 → Credentials）。

      **分享**：上传后发送*下载页面*链接，接收者无需登录。*删除链接*请自己保留：
      任何持有它的人都可以删除文件。

      **管理页面**：[admin.php](${APP_URL:-https://jirafeau-${APP_DOMAIN}}/admin.php)
      登录后会要求输入 Jirafeau 管理员密码（磁贴菜单 → Credentials）。

      过期文件每天清理一次。
