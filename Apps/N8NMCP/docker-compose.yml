  tagline:
    en_us: Expose your n8n workflows to LLMs via MCP
    fr_fr: Exposez vos workflows n8n aux LLMs via MCP
  thumbnail: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/N8NMCP/thumbnail.png
  title:
    en_us: n8n MCP
  chips:
    - key: mcp
      name:
        en_us: MCP
  tips:
    before_install:
      en_us: |
        **Getting Started**

        n8n MCP needs a running n8n instance and an API key.

        **Prerequisites:**
        1. Install the **n8n** app first (or have another reachable n8n instance)
        2. In n8n: **Settings → n8n API → Create an API key**

        **Setup (2 steps):**
        1. Open this app's Web UI (you'll sign in with your Yundera account — no extra password)
        2. Paste the **n8n Base URL** (`http://n8n:80` is pre-filled for the companion app) and the **API key**, click **Test connection** → **Save**

        **MCP Integration (for AI/LLMs):**

        **Option 1: Public URL (OAuth)**

        The `/mcp` endpoint is protected by OAuth 2.1. Point your client at the
        URL below — clients that support OAuth discovery (claude.ai, Claude
        Desktop) register themselves and open a browser for you to approve with
        your Yundera login.
        ```json
        {
          "mcpServers": {
            "n8n-mcp": {
              "type": "http",
              "url": "https://n8nmcp-${APP_DOMAIN}/mcp"
            }
          }
        }
        ```
        For clients that need a pre-created client_id/client_secret (n8n, custom
        scripts), open **https://n8nmcp-${APP_DOMAIN}/AppShield/oauth** and
        create one there.

        **Option 2: Local Docker connection (no auth required)**

        For AI assistants running on the same server, connect directly via the Docker network:
        ```json
        {
          "mcpServers": {
            "n8n-mcp": {
              "type": "http",
              "url": "http://n8nmcp-backend:9640/mcp"
            }
          }
        }
        ```
        *Note: Requires the AI assistant to be on the `pcs` Docker network.*

        **Option 3: Via Beacon (aggregated)**

        If you have **Beacon** installed, n8n MCP auto-registers there and its tools show up under the `n8n-mcp__*` namespace — no extra config.

        **Available MCP Tools:**
        | Tool | Description |
        |------|-------------|
        | `n8n_list_workflows` | List workflows (optionally filter by tag/active) |
        | `n8n_get_workflow` | Fetch a workflow by ID including nodes and connections |
        | `n8n_create_workflow` | Create a workflow from a JSON definition |
        | `n8n_update_full_workflow` | Replace a workflow's nodes/connections/settings |
        | `n8n_update_partial_workflow` | Apply diff operations (add/remove nodes, connections, activate, etc.) |
        | `n8n_delete_workflow` | Remove a workflow |
        | `n8n_test_workflow` | Trigger a webhook/form/chat workflow for testing |
        | `n8n_executions` | List, get, or delete executions |
        | `search_nodes` / `get_node` | Browse and inspect the n8n node catalog |
        | `validate_node` / `validate_workflow` | Validate configs before deployment |
        | `n8n_health_check` | Verify n8n API connectivity |

        **Security:**
        - The API key is stored only in `/DATA/AppData/n8nmcp/config.json` and is never logged or returned via the API
        - The Web UI and `/api` endpoints sit behind your Yundera single sign-on — no extra login needed
        - `/mcp` is gated separately on OAuth 2.1 Bearer tokens, so nothing on the
          public URL is reachable without a credential. Only the in-network address
          `http://n8nmcp-backend:9640/mcp` (Option 2) is unauthenticated, and it is
          not published outside the `pcs` Docker network.

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/n8nmcp
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/n8nmcp/oauth
      user: $PUID
      group: $PGID
  webui-host: n8nmcp-${domain}
  webui-path: "/"
