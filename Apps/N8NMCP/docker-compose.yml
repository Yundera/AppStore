name: n8nmcp
services:
  # Main MCP server — reachable at n8nmcp-backend:9640 on the pcs network
  n8nmcp-backend:
    image: ghcr.io/worph/n8nmcp:1.0.1
    container_name: n8nmcp-backend
    hostname: n8nmcp-backend
    # supervisord is PID 1 and MUST start as root so it can drop privileges for
    # each child program. Running as a non-root uid fails with "Can't drop
    # privilege as nonroot user". Child processes drop to their own uid as
    # configured in /etc/supervisord.conf.
    user: "0:0"
    restart: unless-stopped
    expose:
      - 9640
      - 9099
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - PORT=9640
      - UPSTREAM_PORT=3000
      - DISCOVERY_PORT=9099
      # Pre-seed the companion n8n app's in-network hostname.
      # The API key is left blank — paste it in the Web UI on first launch.
      - N8N_BASE_URL=http://n8n:80
    # The image inherits HEALTHCHECK CMD-SHELL "curl ... /health" from the upstream
    # n8n-mcp stage, but the wrapper never implements a /health route (only
    # /api/status), so the container permanently reports unhealthy even while
    # serving correctly. Override with an endpoint the wrapper actually has.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${PORT:-9640}/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # The image's supervisord.conf hard-codes CONFIG_PATH=/app/wrapper-data/config.json
      # for the wrapper program, so the persistent bind MUST land there — a container-
      # level CONFIG_PATH env is ignored because supervisord's program `environment=`
      # block wins.
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/n8nmcp/
        target: /app/wrapper-data
    networks:
      - pcs
    # 80 — user-facing API backend + Web UI (CONTRIBUTING "CPU Share Allocation").
    cpu_shares: 80

  # AppShield provides perimeter authentication: the Yundera SSO (OIDC) gate for the
  # Web UI, and the OAuth 2.1 broker for /mcp (machine clients). The backend trusts
  # the network, so it is never exposed directly — only this proxy gets caddy labels.
  n8nmcp-proxy:
    # 2.0.7+ is required for the generic OAUTH_RESOURCE / OAUTH_SCOPE names and a
    # configurable protected path; 2.0.9+ advertises offline_access and sends
    # prompt=consent, without which no refresh token is issued and every client has
    # to be re-authorized by hand once the 1h access token expires.
    image: ghcr.io/yundera/appshield:2.0.9
    container_name: n8nmcp
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: n8nmcp
    restart: unless-stopped
    # 80 — reverse proxy / user-facing interactive (CONTRIBUTING "CPU Share Allocation").
    cpu_shares: 80
    expose:
      - 80
    user: "root"
    environment:
      BACKEND_HOST: n8nmcp-backend
      BACKEND_PORT: "9640"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # Machine/API auth for the MCP endpoint. AppShield runs an OAuth/OIDC
      # authorization server fronting Dex and gates exactly the path named by the
      # resource URL (/mcp) on Bearer tokens; everything else stays behind the
      # Yundera SSO gate. Replaces ALLOWED_PATHS, which exempted /mcp from the gate
      # and — with AUTH_HASH inert under Maison — left it uncredentialed.
      OAUTH_RESOURCE: "https://n8nmcp-${APP_DOMAIN}/mcp"
      OAUTH_SCOPE: "mcp"
      OAUTH_DATA_DIR: "/data/oauth"
    volumes:
      # Persist DCR/manual clients, signing keys and grants across redeploys.
      - ${DATA_ROOT:-/DATA}/AppData/n8nmcp/oauth/:/data/oauth
    depends_on:
      - n8nmcp-backend
    networks:
      - pcs
    labels:
      caddy_0: n8nmcp-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: n8nmcp-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: n8nmcp-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  # The AppShield sidecar, not the backend: it is the container the Caddy labels
  # point at and the one users actually reach, and it is the service Maison
  # attaches ${APP_NET} to. The tile's health follows main, so pointing it at the
  # backend reported "unhealthy" while the app was serving correctly.
  main: n8nmcp-proxy
  index: /
  author: Aptero
  category: Developer
  tags: ["developer", "ai"]
  description:
    en_us: |
      **n8n workflow control for AI assistants via MCP**

      n8n MCP exposes the [n8n](https://n8n.io) REST API as an MCP (Model Context Protocol) server, letting LLMs and AI assistants list, read, create, edit, activate, and execute n8n workflows — plus browse the full n8n node catalog. Wraps the upstream [`czlonkowski/n8n-mcp`](https://github.com/czlonkowski/n8n-mcp) server and adds a Web UI for API-key setup and Beacon auto-discovery.

      **What you can do:**
      - Manage workflows (create, update, delete, activate, execute) from any MCP-compatible AI assistant
      - List and inspect executions including per-node output
      - Search the n8n node catalog and fetch per-node schemas
      - Validate workflows before deployment
      - Configure the n8n connection via the built-in Web UI — no hand-editing files

      **Think of it like:** A programmable remote control for your n8n instance, driven by natural language.

      **Perfect if you:** Want Claude / Cursor / any MCP client to build and operate n8n automations for you, or to pair with other MCP apps (Beacon, Ntfy, Chronos) for end-to-end AI-driven workflows.
    fr_fr: |
      **Controle des workflows n8n pour les assistants IA via MCP**

      n8n MCP expose l'API REST de [n8n](https://n8n.io) en tant que serveur MCP (Model Context Protocol), permettant aux LLMs et assistants IA de lister, lire, creer, modifier, activer et executer des workflows n8n — et de parcourir le catalogue complet des nodes n8n. Enveloppe le serveur amont [`czlonkowski/n8n-mcp`](https://github.com/czlonkowski/n8n-mcp) et ajoute une interface Web pour la configuration de la cle API et la decouverte automatique via Beacon.

      **Ce que vous pouvez faire:**
      - Gerer les workflows (creer, modifier, supprimer, activer, executer) depuis tout assistant IA compatible MCP
      - Lister et inspecter les executions, y compris la sortie par node
      - Rechercher dans le catalogue des nodes n8n et consulter le schema de chaque node
      - Valider les workflows avant deploiement
      - Configurer la connexion n8n via l'interface Web integree — sans editer de fichiers

      **Parfait si vous:** Voulez que Claude / Cursor / tout client MCP construise et pilote vos automatisations n8n, ou combiner avec d'autres apps MCP (Beacon, Ntfy, Chronos) pour des workflows pilotes par IA de bout en bout.
