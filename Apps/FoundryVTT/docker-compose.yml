  developer: Foundry Gaming LLC
  category: Games
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  main: foundryvtt
  tips:
    en_us: |
      **You need a Foundry VTT license** — buy one at
      [foundryvtt.com](https://foundryvtt.com/purchase/) first.

      **1. Enter your foundryvtt.com account**

      The app does not start until it knows your account. After install, open
      the app's **settings → Env** tab, fill in `FOUNDRY_USERNAME` and
      `FOUNDRY_PASSWORD` with your foundryvtt.com login, and save. The app
      restarts, downloads Foundry and activates your license — allow a minute
      or two. If your account owns several licenses, also set
      `FOUNDRY_LICENSE_KEY` to the one this server should use.

      **2. Open the app**

      Accept the license agreement, then log in to the setup screen with the
      administrator password — it is shown when you open the app (tile menu →
      Credentials).

      Install a game system, create a world and launch it.

      **3. Invite your players**

      Players join at `https://foundryvtt-$APP_DOMAIN` from any browser.
      Foundry's built-in users have **no password** until you set one: in the
      world, open **Settings → User Management** and give every user a password
      before sharing the link.

      Your worlds, systems, modules and uploads live in
      `/DATA/AppData/foundryvtt/data/`.
  secrets:
    # Seeded: an installed app keeps the shared password it already has; a fresh
    # install gets its own. The image re-applies it as the admin key on every start.
    FOUNDRYVTT_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator (setup screen)
      password: ${FOUNDRYVTT_ADMIN_PASSWORD}
      note:
        en_us: Unlocks Foundry's setup screen (worlds, systems, modules). Players log in as the world's own users instead. A change made from Foundry's own setup screen is overwritten on the next restart.
      # The felddy launcher rewrites admin.txt from FOUNDRY_ADMIN_KEY on every start,
      # so a new value in .env plus a recreate is the whole change. This relies on
      # CONTAINER_PRESERVE_CONFIG staying unset - with it set, the launcher keeps the
      # old admin.txt and the change would not take.
      change:
        apply: env
  # Rendered into the app's .env on every up. The template resolves to whatever the
  # user already saved (or to empty on a fresh install), so this never overwrites an
  # entered value — it only makes sure the rows exist in the Env tab to be filled in.
  variables:
    FOUNDRY_USERNAME: ${FOUNDRY_USERNAME:-}
    FOUNDRY_PASSWORD: ${FOUNDRY_PASSWORD:-}
    FOUNDRY_LICENSE_KEY: ${FOUNDRY_LICENSE_KEY:-}
  folders:
    - path: /DATA/AppData/$AppID/data
      user: $PUID
      group: $PGID
  webui-host: foundryvtt-${domain}
  webui-path: /
