# MailHub's built-in Baïkal serves CalDAV/CardDAV only. Its admin console and
# welcome page are not needed (the baikal-init step configures everything) and
# would be public on the phone-sync address, so only /dav.php is served.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /var/www/baikal/html;
  charset utf-8;
  # Relative redirects: behind the TLS proxy an absolute one would say http://.
  absolute_redirect off;

  location = /.well-known/caldav  { return 301 /dav.php/; }
  location = /.well-known/carddav { return 301 /dav.php/; }

  location ~ ^(/dav\.php)(/.*)?$ {
    include /etc/nginx/fastcgi_params;
    fastcgi_split_path_info ^(/dav\.php)(.*)$;
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
  }

  location / {
    return 404;
  }
}
