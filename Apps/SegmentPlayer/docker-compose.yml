name: segment

services:

  segmentplayer-backend:
    image: ghcr.io/worph/segmentplayer:1.4.2
    container_name: segmentplayer-backend
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ${DATA_ROOT:-/DATA}/Downloads:/data/media/Downloads:ro
      - ${DATA_ROOT:-/DATA}/Media:/data/media/Media:ro
    environment:
      # SEGMENT_DURATION is deliberately not set here: supervisord pins it to "4" in the
      # image's [program:transcoder] block, which overrides the container environment, and
      # nginx's vod_segment_duration is hardcoded to 4000ms. Setting it has no effect.
      - NGINX_PORT=80
    restart: unless-stopped
    # Runs as root - see rationale.md. Both user-directory mounts are read-only and this
    # service is not reachable from the pcs network.
    user: 0:0
    cpu_shares: 70
    networks:
      - segment-internal

  segment:
    image: ghcr.io/yundera/appshield:2.0.6
    container_name: segment
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: segment
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    labels:
      caddy_0: segment-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: segment-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: segment-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    environment:
      BACKEND_HOST: "segmentplayer-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
    depends_on:
      - segmentplayer-backend
    networks:
      - segment-internal
      - pcs
    cpu_shares: 50
    
networks:
  segment-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  index: /
  webui_port: 80
  main: segment

  architectures:
    - amd64
    - arm64
  author: Worph
  category: Media
  tags: ["media", "personal"]
  description:
    en_us: |
      SegmentPlayer is a media streaming application that serves your video files as HLS streams on-the-fly.

      Features:
      - Browse and play any video from your Downloads and Media folders
      - On-demand HLS packaging with nginx-vod-module (no pre-transcoding needed)
      - Live segment-level transcoding for incompatible codecs
      - Instant seeking support
      - Multi-audio track selection
      - Embedded subtitle extraction (ASS, SRT to WebVTT)
      - Modern responsive web player with hls.js

      Supported formats: MP4, MKV, MOV, AVI, WebM
      - Direct streaming: H.264/H.265 video with AAC audio
      - With live transcoding: Any FFmpeg-supported codec (HEVC, VP9, AV1, 10-bit, etc.)

      Simply drop video files into your Downloads or Media folder and they become instantly streamable!
    fr_fr: |
      SegmentPlayer est une application de streaming qui sert vos fichiers vidéo en flux HLS à la volée.

      Fonctionnalités:
      - Parcourir et lire n'importe quelle vidéo de vos dossiers Downloads et Media
      - Packaging HLS à la demande avec nginx-vod-module (pas de transcodage préalable)
      - Transcodage live segment par segment pour codecs incompatibles
      - Support de recherche instantané
      - Sélection de piste audio multiple
      - Extraction des sous-titres embarqués (ASS, SRT vers WebVTT)
      - Lecteur web moderne et responsive avec hls.js

      Formats supportés: MP4, MKV, MOV, AVI, WebM
      - Streaming direct: vidéo H.264/H.265 avec audio AAC
      - Avec transcodage live: tout codec supporté par FFmpeg (HEVC, VP9, AV1, 10-bit, etc.)

      Déposez simplement vos fichiers vidéo dans vos dossiers Downloads ou Media et ils deviennent instantanément streamables!
  developer: Worph
  icon: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/SegmentPlayer/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/SegmentPlayer/screenshot-1.png
  tagline:
    en_us: Stream any video file as HLS on-the-fly with live transcoding
    fr_fr: Diffusez n'importe quel fichier vidéo en HLS à la volée avec transcodage live
  thumbnail: https://cdn.jsdelivr.net/gh/Yundera/AppStore@main/Apps/SegmentPlayer/thumbnail.png
  tips:
    before_install:
      en_us: |
        This app reads your whole Downloads and Media folders (/DATA/Downloads and /DATA/Media)
        and streams every video it finds there. Both are mounted read-only: the app can play
        your files but can never modify or delete them.

        For best performance, use videos with:
        - H.264 or H.265 video codec
        - AAC audio codec

        Videos with incompatible codecs (like VP9, AV1, AC3 audio, or 10-bit video) will be
        transcoded on-the-fly at the segment level for smooth playback.
      fr_fr: |
        Cette application lit l'intégralité de vos dossiers Downloads et Media (/DATA/Downloads
        et /DATA/Media) et diffuse toutes les vidéos qui s'y trouvent. Les deux sont montés en
        lecture seule : l'application peut lire vos fichiers mais ne peut jamais les modifier
        ni les supprimer.

        Pour de meilleures performances, utilisez des vidéos avec:
        - Codec vidéo H.264 ou H.265
        - Codec audio AAC

        Les vidéos avec des codecs incompatibles (comme VP9, AV1, audio AC3, ou vidéo 10-bit)
        seront transcodées à la volée segment par segment pour une lecture fluide.
  title:
    en_us: SegmentPlayer
    fr_fr: SegmentPlayer

x-compose-app:
  webui-host: segment-${domain}
