  # Admin password for the account seeded into config.xml on first boot.
  # Generated once into the app's .env and never regenerated, so it survives
  # restarts, updates and restores. `alnum` rather than `password` because the
  # value lands in an XML text node, where symbols would need escaping. 24
  # alphanumerics is ~143 bits. Shown to the user through `credentials`.
  secrets:
    SONARR_ADMIN_PASSWORD: alnum:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${SONARR_ADMIN_PASSWORD}
      # A hook, not env: Sonarr consumes <Username>/<Password> from config.xml on
      # first boot, keeps the hash in its own database and strips them from the
      # file, and seed/ never rewrites config.xml anyway. The hook goes through
      # Sonarr's API in the running container instead: read the API key Sonarr
      # wrote into config.xml, fetch the host settings, set the new password and
      # put them back. A temp file rather than a pipe, so a failed fetch fails
      # the hook instead of PUTting an empty body.
      change:
        apply: script
        script: |
          compose exec -e SONARR_ADMIN_PASSWORD sonarr sh -c '
            [ -n "$SONARR_ADMIN_PASSWORD" ] || exit 1
            key=$(sed -n "s:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p" /config/config.xml)
            [ -n "$key" ] || exit 1
            f=$(mktemp) || exit 1
            trap "rm -f $f $f.new" EXIT
            url=http://127.0.0.1:8989/api/v3/config/host
            curl -fsS -H "X-Api-Key: $key" -o "$f" "$url" &&
            jq ".password = env.SONARR_ADMIN_PASSWORD | .passwordConfirmation = env.SONARR_ADMIN_PASSWORD" \
              "$f" > "$f.new" &&
            curl -fsS -X PUT -H "X-Api-Key: $key" -H "Content-Type: application/json" \
              --data-binary "@$f.new" -o /dev/null "$url"'
        policy:
          # Same alphabet the secret is generated from.
          charset: alnum
  # Directories Maison creates and chowns to $PUID:$PGID before every `up` —
  # before the image is pulled, before any hook, before the container starts.
  # Derived from the bind mounts in `volumes:` above; the container drops to
  # $PUID:$PGID, so each of these must be user-owned or Sonarr cannot write.
  folders:
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
      # Reclaim a tree an earlier root-running install left behind: the backend
      # now drops to $PUID:$PGID and dies on an unwritable /config otherwise.
      recursive: true
    - path: /DATA/Media/TV Shows
      user: $PUID
      group: $PGID
    - path: /DATA/Downloads
      user: $PUID
      group: $PGID
