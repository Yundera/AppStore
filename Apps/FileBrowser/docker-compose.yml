  thumbnail: thumbnail.png
  tips:
    before_install:
      en_us: |
        Sign-in

        FileBrowser is protected by your Yundera login (SSO) - the same account you
        use for the dashboard. There is no separate FileBrowser password to set or
        remember, and no login form of its own: open the app and you are already in,
        as its administrator.

        Share links keep working. A link you create from the Share menu stays
        reachable without a Yundera login, exactly as before - the code in the link
        is what grants access, plus the optional password you can set on it.

        What this app can reach

        FileBrowser mounts the whole of `/DATA` read-write. That includes
        `/DATA/Documents`, `/DATA/Downloads`, `/DATA/Media`, `/DATA/Gallery` and
        `/DATA/AppData` - the last one holding the databases, configuration and
        secrets of every other app installed on this server. Anyone who can sign in
        to your Yundera account can browse, edit, delete and share all of it, and
        so can anyone you hand a share link to for a file inside it.
      ko_kr: |
        로그인

        FileBrowser는 Yundera 로그인(SSO)으로 보호됩니다. 대시보드에서 사용하는 것과
        같은 계정이며, 따로 설정하거나 기억해야 할 FileBrowser 비밀번호는 없습니다.
        자체 로그인 화면도 없습니다. 앱을 열면 이미 관리자로 로그인된 상태입니다.

        공유 링크는 그대로 작동합니다. 공유 메뉴에서 만든 링크는 이전과 똑같이
        Yundera 로그인 없이 접근할 수 있습니다. 링크에 포함된 코드가 접근 권한을
        부여하며, 원한다면 링크에 비밀번호를 추가로 설정할 수 있습니다.

        이 앱이 접근할 수 있는 범위

        FileBrowser는 `/DATA` 전체를 읽기/쓰기로 마운트합니다. 여기에는
        `/DATA/Documents`, `/DATA/Downloads`, `/DATA/Media`, `/DATA/Gallery`,
        그리고 다른 모든 앱의 데이터베이스, 설정, 비밀 정보가 들어 있는
        `/DATA/AppData`가 포함됩니다. Yundera 계정에 로그인할 수 있는 사람은 누구나
        이 모든 것을 탐색, 편집, 삭제, 공유할 수 있으며, 그 안의 파일에 대한 공유
        링크를 받은 사람도 마찬가지입니다.
      zh_cn: |
        登录方式

        FileBrowser 由你的 Yundera 登录（SSO）保护，与你登录控制面板所用的是同一个
        账户。无需设置或记住单独的 FileBrowser 密码，它也没有自己的登录页面：打开应用
        即已以管理员身份登录。

        分享链接照常可用。你在「分享」菜单中创建的链接无需 Yundera 登录即可访问，
        与以往一致——链接中的代码就是访问凭证，你还可以为其另外设置密码。

        此应用可以访问的范围

        FileBrowser 以读写方式挂载整个 `/DATA`，其中包括 `/DATA/Documents`、
        `/DATA/Downloads`、`/DATA/Media`、`/DATA/Gallery`，以及保存着其他所有应用
        数据库、配置和密钥的 `/DATA/AppData`。任何能登录你 Yundera 账户的人都可以
        浏览、编辑、删除和分享这些内容，你分享出去的链接的接收者同样可以访问对应文件。
      fr_fr: |
        Connexion

        FileBrowser est protégé par votre connexion Yundera (SSO) — le même compte que
        pour le tableau de bord. Aucun mot de passe FileBrowser distinct à définir ou à
        retenir, et pas de formulaire de connexion propre à l'application : vous l'ouvrez
        et vous y êtes déjà, en tant qu'administrateur.

        Les liens de partage continuent de fonctionner. Un lien créé depuis le menu
        Partager reste accessible sans connexion Yundera, exactement comme avant : c'est
        le code contenu dans le lien qui donne l'accès, plus le mot de passe facultatif
        que vous pouvez y ajouter.

        Ce à quoi cette application a accès

        FileBrowser monte l'intégralité de `/DATA` en lecture-écriture : cela inclut
        `/DATA/Documents`, `/DATA/Downloads`, `/DATA/Media`, `/DATA/Gallery` et
        `/DATA/AppData`, qui contient les bases de données, configurations et secrets
        de toutes les autres applications du serveur. Toute personne pouvant se connecter
        à votre compte Yundera peut parcourir, modifier, supprimer et partager l'ensemble,
        de même que toute personne à qui vous transmettez un lien de partage.
      es_es: |
        Inicio de sesión

        FileBrowser está protegido por tu inicio de sesión de Yundera (SSO), la misma
        cuenta que usas para el panel. No hay una contraseña de FileBrowser aparte que
        configurar o recordar, ni un formulario de acceso propio: abres la aplicación y
        ya estás dentro, como administrador.

        Los enlaces para compartir siguen funcionando. Un enlace creado desde el menú
        Compartir sigue siendo accesible sin iniciar sesión en Yundera, igual que antes:
        el código del enlace es lo que concede el acceso, más la contraseña opcional que
        puedes añadirle.

        A qué puede acceder esta aplicación

        FileBrowser monta todo `/DATA` en modo lectura-escritura: incluye
        `/DATA/Documents`, `/DATA/Downloads`, `/DATA/Media`, `/DATA/Gallery` y
        `/DATA/AppData`, que contiene las bases de datos, la configuración y los
        secretos de todas las demás aplicaciones del servidor. Cualquiera que pueda
        iniciar sesión en tu cuenta de Yundera puede explorar, editar, eliminar y
        compartir todo ello, igual que cualquiera a quien le pases un enlace.
  title:
    en_us: FileBrowser
  index: /
  webui_port: 80

x-compose-app:
  schema_version: 2
  # Seeding the database needs filebrowser's own binary, so it stays a container —
  # but the container is declared, not shelled out to. The guard replaces the
  # `if [ ! -f ]` the hook opened with: `config init` refuses to overwrite an
  # existing database and used to abort the whole hook when it did.
  init:
    - name: init-db
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: config init --database /db/database.db
      when: absent:/DATA/AppData/$AppID/db/database.db
    - name: add-admin
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: ["users", "add", "admin", "$APP_DEFAULT_PASSWORD", "--perm.admin", "--database", "/db/database.db"]
      when: once
    # Hands authentication to the AppShield gate. `noauth` resolves every request to
    # user ID 1 — the `admin` seeded just above — so the app opens straight into the
    # UI with full rights and no second password, and never 302s to its own /login
    # (which the gate reserves and would answer with its own page).
    #
    # It has to be `config set`: the CLI's --noauth flag only applies to first-run
    # quick setup and is not persistent, and the setting lives in the bolt database,
    # not in an env var.
    #
    # `once`, not `always`, on purpose. The step name is new, so an existing install
    # has no `.init/set-noauth` marker and picks this up on its next install-from-store;
    # afterwards it is skipped, which is what keeps it off the restart path — bolt takes
    # an exclusive lock, and a pre_up step that fails against a still-running container
    # is fatal to the whole converge.
    - name: set-noauth
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: ["config", "set", "--auth.method=noauth", "--database", "/db/database.db"]
      when: once
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/db
      user: $PUID
      group: $PGID
  webui-host: filebrowser-${domain}
