name: filebrowser
services:
  # AppShield SSO gate — the only publicly reachable service. FileBrowser has no
  # OIDC of its own and never will (upstream archived the project on 2026-09-01
  # with the OIDC request, filebrowser/filebrowser#1328, closed unimplemented), so
  # the gate is what puts this app behind Yundera SSO.
  filebrowser:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: filebrowser
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: filebrowser
    restart: unless-stopped
    environment:
      BACKEND_HOST: "filebrowser-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # FileBrowser's share links are anonymous by design — the hash in the URL is
      # the credential, and the share can carry its own password on top. Behind an
      # unqualified gate every one of them would 302 to the SSO login and the
      # feature would be silently dead, so its three prefixes are exempted:
      #   share/       the share landing page (SPA route)
      #   api/public/  the endpoints that page calls (/api/public/share, /api/public/dl)
      #   static/      the JS/CSS that page loads
      # Prefix-matched, comma-separated, no leading slash. Nothing here reaches the
      # authenticated API: /api/resources, /api/users and /api/settings stay gated.
      ALLOWED_PATHS: "share/,api/public/,static/"
      # This is a file manager: uploads are the point. 0 = unlimited, which is the
      # image default today — pinned so a future default cannot cap uploads silently.
      CLIENT_MAX_BODY_SIZE: "0"
    expose:
      - 80
    labels:
      caddy_0: filebrowser-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: filebrowser-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: filebrowser-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - filebrowser-backend
    networks:
      # On `pcs` because Caddy and auth-registrar must reach it, and on the app's
      # own network because that is where its backend lives.
      - pcs
      - filebrowser-internal
    cpu_shares: 80
    deploy:
      resources:
        limits:
          memory: 128M

  filebrowser-backend:
    container_name: filebrowser-backend
    user: $PUID:$PGID
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      FB_DATABASE: /db/database.db
    image: filebrowser/filebrowser:v2.63.23
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/$AppID/db/
        target: /db/
      - type: bind
        source: ${DATA_ROOT:-/DATA}/
        target: /srv/
    expose:
      - 80
    # No Caddy labels and NOT on `pcs`: with its own auth turned off (see the
    # set-noauth init step) this container is unauthenticated, so the gate must be
    # the only path to it. `filebrowser-internal` is what enforces that — on `pcs`
    # any other app on the server could reach it directly.
    networks:
      - filebrowser-internal
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 256M
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User ID owning the files FileBrowser creates. Defaults to your server user.
        - container: PGID
          description:
            en_us: Group ID owning the files FileBrowser creates. Defaults to your server group.
        - container: TZ
          description:
            en_us: Timezone used for the file timestamps shown in the interface.
        - container: FB_DATABASE
          description:
            en_us: Path to the FileBrowser database inside the container. Stored on the /db volume.
      volumes:
        - container: /db/
          description:
            en_us: FileBrowser's own database - permissions, shares and settings. Kept across uninstall and reinstall.
        - container: /srv/
          description:
            en_us: The whole of /DATA - Documents, Downloads, Media and AppData. This is everything FileBrowser can browse, edit, delete and share, so anyone who passes the Yundera login can reach all of it.

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  filebrowser-internal:
    name: filebrowser-internal

x-casaos:
  architectures:
    - amd64
    - arm64
  main: filebrowser
  author: Yundera Team
  category: Cloud
  tags: ["files", "personal"]
  description:
    en_us: |
      FileBrowser Your Private File Manager Made Easy
      
      FileBrowser transforms the way you manage files on your Yundera Private Cloud Server. Just like Google Drive or Windows Explorer, it gives you a full-featured file management experience right in your browser. No setup required, no subscriptions, no tracking.
      
      Upload, organize, preview and share files from any device—desktop or mobile. Edit text files, view images or videos, create folders, and even generate custom access links for others. Whether you're backing up documents, managing media, or collaborating on projects, FileBrowser gives you full control.
      
      Designed for local hosting, FileBrowser ensures your files stay on your server—with zero reliance on third parties. Ideal for creators, teams, and privacy-focused users. Multi‑user access and role‑based permissions make it fit for home or business.
      
      With FileBrowser on your Yundera PCS, enjoy the speed of local hosting, the freedom of open source, and the simplicity of a modern file explorer.
    zh_cn: |
      FileBrowser - 让私有文件管理变得简单
      
      FileBrowser 重新定义了你在 Yundera 私有云服务器上管理文件的方式。就像使用 Google Drive 或 Windows 资源管理器一样，你可以直接在浏览器中享受完整的文件管理体验。无需配置，无需订阅，无需追踪。
      
      无论你使用电脑还是手机都可以轻松上传、组织、预览和分享文件。你可以编辑文本文件、查看图片或视频、创建文件夹，甚至生成自定义的共享链接。无论是备份文档、整理媒体内容，还是共享项目资料，FileBrowser 都能帮你轻松掌控一切。
      
      FileBrowser 专为本地部署而设计，所有文件始终保留在你的服务器上，无需依赖外部服务。非常适合创作者、团队，以及注重隐私的用户。支持多用户访问和角色权限管理，从家庭文件存储到商业文件共享都能轻松应对。
      
      在你的 Yundera 私有云服务器上部署 FileBrowser，你将拥有本地部署的速度、开源工具的自由，以及现代文件浏览器的简洁体验。
    fr_fr: |
      FileBrowser - Votre gestionnaire de fichiers privé simplifié
      
      FileBrowser transforme votre façon de gérer vos fichiers sur votre serveur cloud privé Yundera. Comme avec Google Drive ou l’Explorateur Windows, vous profitez d’une expérience complète de gestion directement dans votre navigateur. Pas besoin de configuration, pas d’abonnement, pas de suivi.
      
      Téléchargez, organisez, prévisualisez et partagez vos fichiers depuis n’importe quel appareil — ordinateur ou mobile. Éditez des fichiers texte, visualisez des images ou vidéos, créez des dossiers et générez des liens d’accès personnalisés. Que vous sauvegardiez des documents, gériez des médias ou collaboriez sur des projets, FileBrowser vous donne le contrôle total.
      
      Conçu pour l’hébergement local, FileBrowser garantit que vos fichiers restent sur votre serveur, sans dépendre de tiers. Idéal pour les créateurs, équipes et utilisateurs soucieux de leur vie privée. Accès multi‑utilisateur avec permissions par rôle. Parfait pour usage personnel ou professionnel.
      
      Avec FileBrowser sur votre PCS Yundera, profitez de la vitesse de l’hébergement local, de la liberté open source, et de la simplicité d’un explorateur moderne.
    ko_kr: |
      FileBrowser - 쉽고 강력한 개인 파일 관리자
      
      FileBrowser는 Yundera 프라이빗 클라우드 서버에서 파일을 관리하는 방식을 완전히 새롭게 바꿉니다. Google Drive나 Windows 탐색기처럼 브라우저만으로도 완전한 파일 관리 경험을 제공합니다. 설치 불필요, 구독 없음, 추적 없음.
      
      데스크탑이나 모바일에서 파일을 업로드, 정리, 미리보기, 공유할 수 있습니다. 텍스트 파일 편집, 이미지/영상 보기, 폴더 생성, 맞춤 공유 링크 생성도 가능합니다. 문서 백업, 미디어 관리, 프로젝트 협업에 이르기까지 FileBrowser는 당신의 모든 작업을 완벽히 제어합니다.
      
      로컬 호스팅을 기반으로 설계되어 파일은 서버에만 저장되고 외부 서비스에 의존하지 않습니다. 창작자, 팀, 개인정보 중시 사용자 모두에게 이상적입니다. 다중 사용자 접근과 역할 기반 권한 설정을 지원하여 홈 또는 비즈니스 환경에 적합합니다.
      
      Yundera PCS에 FileBrowser를 설치하면 로컬 호스팅의 속도, 오픈 소스의 자유, 현대적인 파일 탐색기의 편리함을 모두 누릴 수 있습니다。
