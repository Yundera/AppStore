name: budibase

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  budibase-router:
    # In front of the app, for two first-load errors the image produces: its
    # own nginx sends /favicon.ico to MinIO, which answers 403 on every page
    # load, and the login page's "who am I" probe answers 403 before anyone has
    # signed in. The router fixes both and passes everything else through.
    image: nginx:1.31.10-alpine
    container_name: budibase-router
    restart: unless-stopped
    expose:
      - "80"
    configs:
      - source: budibase-router
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - pcs
      - budibase-internal
    cpu_shares: 50
    logging: *logging

  budibase:
    # The all-in-one image: CouchDB, MinIO, Redis, the app server, the worker
    # and the LiteLLM proxy behind the image's own nginx on port 80. It starts
    # as root and hands its database directories to their own users; it
    # touches only its own app folder.
    image: budibase/budibase:v4.1.0
    # Reached only through budibase-router, on the app's own network.
    container_name: budibase-app
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # The first administrator, through Budibase's documented bootstrap
      # variables: created on start while no such user exists, so the
      # onboarding screen that would let any first visitor claim the instance
      # never shows. Self-hosted Budibase has no public sign-up; further users
      # are invited by an administrator.
      BB_ADMIN_USER_EMAIL: admin@budibase.local
      BB_ADMIN_USER_PASSWORD: ${BUDIBASE_ADMIN_PASSWORD}
      # Encrypts stored datasource credentials and app exports.
      ENCRYPTION_KEY: ${BUDIBASE_ENCRYPTION_KEY}
      # The address Budibase writes into invitation and password-reset links.
      PLATFORM_URL: ${APP_URL:-https://budibase-${APP_DOMAIN}}
      TZ: $TZ
      # The internal secrets (JWT_SECRET, INTERNAL_API_KEY, CouchDB, MinIO,
      # Redis and LiteLLM keys) are generated by the image on its first start
      # and kept in /data/.env, inside the mapped volume.
    volumes:
      # Everything: the .env above, CouchDB, MinIO objects, Redis, LiteLLM's Postgres.
      - ${DATA_ROOT:-/DATA}/AppData/budibase/data:/data
    # The image's own check, with room for a first start: CouchDB, MinIO and
    # LiteLLM's Postgres are initialised before the app server starts, which
    # can take longer than the image's 300 s start period.
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 900s
    # Idle it already fills 3G (CouchDB, MinIO, Redis, Postgres, two Node
    # processes and LiteLLM's Python proxy), and slows to a crawl there.
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - budibase-internal
    cpu_shares: 80
    logging: *logging

networks:
  budibase-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  budibase-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      # The client is the last X-Forwarded-For entry: the one the platform's
      # proxy appended. Earlier entries are whatever the client sent.
      map $$http_x_forwarded_for $$client_ip {
        "~(?:^|,)\s*(?<last>[^,\s]+)\s*$$" $$last;
        default $$remote_addr;
      }
      # A GET of /api/global/self with no session cookie and no API key: the
      # builder asking whether anyone is signed in. Budibase answers 403, which
      # the browser logs as an error; its client treats a 204 the same way
      # (no user, show the login), so the router answers that instead.
      map $$http_cookie $$bb_session { "~budibase:auth=" 1; default 0; }
      map "$$request_method:$$bb_session:$$http_x_budibase_api_key" $$bb_anonymous_self {
        "GET:0:" 1;
        default 0;
      }

      server {
        listen 80;
        absolute_redirect off;

        # App imports, attachments and backups can be large.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_x_forwarded_host;
        # Budibase's live updates (socket.io) are websockets.
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$budibase budibase-app:80;

        location = /_router/health { access_log off; return 204; }
        location = /favicon.ico {
          rewrite ^ /builder/bblogo.png break;
          proxy_pass http://$$budibase;
        }
        location = /api/global/self {
          if ($$bb_anonymous_self) { return 204; }
          proxy_pass http://$$budibase;
        }
        location / { proxy_pass http://$$budibase; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: budibase-router
  webui_port: 80
  store_app_id: budibase
  category: Developer
  tags: ["low-code", "internal-tools", "automation"]
  developer: Budibase
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  title:
    en_us: Budibase
  tagline:
    en_us: Build internal tools, forms and workflows in minutes
  description:
    en_us: &description |
      **The open-source low-code platform for internal tools**

      Budibase builds internal tools, admin panels, approval workflows and forms on top
      of your data, with a drag-and-drop designer and no front-end code to write.

      **Key features:**
      - Connect PostgreSQL, MySQL, MSSQL, MongoDB, CouchDB, REST APIs, Google Sheets and more
      - Or keep the data in Budibase's own built-in database
      - Drag-and-drop screens, tables, forms and charts, generated from your data
      - Automations triggered by row changes, webhooks, schedules or app actions
      - Users, groups and role-based access to each app
      - Publish apps for your team, embed them, or expose them through a REST API

      The administrator account is created at install with a generated password,
      shown from the app's tile.
  tips:
    before_install:
      en_us: &tips |
        **Signing in**

        Open Budibase from its tile and sign in as **admin@budibase.local** with the
        password shown in the tile's **Credentials** dialog. It is set on the first
        start only: change it later from your profile menu in Budibase, and the
        Credentials dialog keeps showing the password it was installed with.

        **Getting started**

        - Create a workspace and connect a data source, or start from Budibase's
          built-in database.
        - Invite your team from *Settings › Users*; nobody can sign up on their own.
        - Sending invitations by email needs an SMTP server, set in
          *Settings › Email*. Without one, copy the invitation link instead.

        The first start takes a minute or two while Budibase prepares its databases.
  index: /

x-compose-app:
  schema_version: 2
  version: "4.1.0"
  id: budibase
  # How the app is reached, stated without a domain or a proxy: the box's
  # routing setting decides. The router listens on 80.
  routes:
    - { service: budibase-router, name: budibase, upstream-port: 80 }
  title:
    en_us: Budibase
  tagline:
    en_us: Build internal tools, forms and workflows in minutes
  description:
    en_us: *description
  developer: Budibase
  category: Developer
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  # One container runs CouchDB, MinIO, Redis, Postgres and three Node/Python
  # processes; its limit is 4G, the router's 64M, plus room for the OS and
  # other apps.
  resources:
    recommended: { cpu: 2, memory: 6G }
  tips:
    en_us: *tips
  secrets:
    # The first administrator's login (BB_ADMIN_USER_PASSWORD).
    BUDIBASE_ADMIN_PASSWORD: password:24
    # Encrypts stored datasource credentials; internal, nobody types it.
    BUDIBASE_ENCRYPTION_KEY: alnum:48
  credentials:
    - label:
        en_us: Administrator
      username: admin@budibase.local
      password: ${BUDIBASE_ADMIN_PASSWORD}
      note:
        en_us: Set on the first start only. Change it later from your profile menu in Budibase.
