# nginx configuration for the Yundera Nginx app.
#
# This is nginx's main configuration file, bind-mounted at /etc/nginx/nginx.conf.
# It is seeded once from this file (Maison's declarative seed/ tree) and never
# overwritten, so edits survive reinstalls and upgrades. To customise, edit
# /DATA/AppData/nginx/nginx.conf on the host and restart the app.

# Workers run as root so that every file dropped into www/ is readable whatever
# mode it arrives with. The stock image's `user nginx;` drops the workers to uid
# 101, and a file written through the platform's file manager arrives 0640 —
# unreadable to that uid, so nginx answers a bare 403 and the site silently never
# updates. The container is already root and mounts nothing outside its own
# AppData folder (see rationale.md), so this widens nothing.
user root;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Caching for static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA support - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Disable logging for favicon and robots.txt
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
