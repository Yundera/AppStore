name: cloudflaredweb
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # AppShield: the SSO gate in front of the web UI. The backend below lives in this
  # container's network namespace, so the gate is the only way to its UI.
  cloudflaredweb:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: cloudflaredweb
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar attests this app's name via the
    # container's PTR record. Must equal the app name.
    hostname: cloudflaredweb
    restart: unless-stopped
    environment:
      # The backend shares this namespace and listens on loopback only.
      BACKEND_HOST: "127.0.0.1"
      BACKEND_PORT: "14333"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On `pcs` because the platform routes to it, and because the tunnel (which
      # runs in this namespace) must reach the other apps it publishes, by name.
      - pcs

  cloudflaredweb-backend:
    image: wisdomsky/cloudflared-web:2026.11.2
    container_name: cloudflaredweb-backend
    restart: unless-stopped
    # Joins the gate's network namespace instead of a network of its own:
    # cloudflared reaches the other apps on `pcs` (http://<app>:<port>), while the
    # web UI binds to loopback only and is reachable through the gate alone.
    # The upstream image asks for host networking; this replaces it.
    network_mode: "service:cloudflaredweb"
    depends_on:
      - cloudflaredweb
    environment:
      WEBUI_HOST: "127.0.0.1"
      WEBUI_PORT: "14333"
    volumes:
      # config.json: the tunnel token and whether the tunnel is started.
      - ${DATA_ROOT:-/DATA}/AppData/cloudflaredweb/config:/config
      # config.yml written by the UI's advanced (local ingress) settings.
      - ${DATA_ROOT:-/DATA}/AppData/cloudflaredweb/cloudflared:/root/.cloudflared
    deploy:
      resources:
        limits:
          memory: 256M
    cpu_shares: 50
    logging: *logging

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: cloudflaredweb
  webui_port: 80
  index: /
  store_app_id: cloudflaredweb
  category: Network
  tags: ["network", "tunnel", "cloudflare"]
  developer: WisdomSky
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  title:
    en_us: Cloudflared Web
  tagline:
    en_us: Start and stop a Cloudflare Tunnel from a simple web page
  description:
    en_us: &desc |
      Cloudflared Web packages the official `cloudflared` client with a small web UI, so you can run a
      remotely-managed Cloudflare Tunnel without a terminal: paste the tunnel's connector token, then
      start or stop the tunnel with one click. The token and the started state are saved, so the tunnel
      comes back on its own after a restart or an update.

      The tunnel runs on your server's app network, so in the Cloudflare dashboard you can point a public
      hostname at any other app by its name, for example `http://jellyfin:8096`.

      **You need a Cloudflare account** (the free plan is enough) with a domain on Cloudflare, and a tunnel
      created in the Cloudflare Zero Trust dashboard (Networks > Tunnels). Hostnames you publish through the
      tunnel are reachable from the internet, and their protection is configured at Cloudflare.
  tips:
    before_install:
      en_us: &tips |
        **Sign-in:** the page is protected by your server account (single sign-on). On a server
        without single sign-on, use the app password Maison shows on first open (also in the tile
        menu under **Credentials**).
        -----------------------------
        **Getting a token:**
        1. In the Cloudflare Zero Trust dashboard, open Networks > Tunnels and create a tunnel (type *Cloudflared*).
        2. Copy the connector token (the long string after `--token` in the install command).
        3. Paste it here and press **Start**. The tunnel shows as *Healthy* in Cloudflare a few seconds later.
        -----------------------------
        **Publishing an app:** add a public hostname to the tunnel in Cloudflare and use the app's
        container name and port as the service, for example `http://jellyfin:8096`.
        Anything you publish is reachable from the internet: protect it with the app's own login
        or Cloudflare Access.

x-compose-app:
  schema_version: 2
  id: cloudflaredweb
  version: "2026.11.2"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI.
  routes:
    - { service: cloudflaredweb, name: cloudflaredweb, upstream-port: 80 }
  title:
    en_us: Cloudflared Web
  tagline:
    en_us: Start and stop a Cloudflare Tunnel from a simple web page
  description:
    en_us: *desc
  developer: WisdomSky
  category: Network
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: *tips
  accounts:
    - provider: Cloudflare
      url: https://dash.cloudflare.com/
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
