# MailHub additions to the stock dovecot/dovecot 2.4 config.

# Roundcube, the mirror and the MCP server talk to Dovecot over the app-private
# network only; the public listener is IMAPS.
auth_allow_cleartext = yes

# One mailbox per box: a login given as user@something is the same user.
auth_username_format = %{user | username | lower}

# Public IMAPS uses the certificate Maison writes to /tls (x-compose-app
# `certificates`); clients connect to the host it names, APP_TLS_HOST:993.
# Maison restarts this container when the certificate is renewed.
import_environment {
  MAILHUB_TLS_CERT = %{env:MAILHUB_TLS_CERT}
  MAILHUB_TLS_KEY = %{env:MAILHUB_TLS_KEY}
}
ssl_server {
  cert_file = $ENV:MAILHUB_TLS_CERT
  key_file = $ENV:MAILHUB_TLS_KEY
}

# Every provider account as a local copy under Live/<address>/ (Maildir written by
# mailhub-mirror, pull only), with Dovecot's own files kept outside it. The
# provider stays the source of truth: IMAP actions here are recorded by
# mailhub-replay.lua and replayed at the provider by mailhub-mirror.
namespace live {
  prefix = Live/
  separator = /
  mail_driver = maildir
  mailbox_list_layout = fs
  mail_path = ~/live
  mail_index_path = ~/live-index
  mail_control_path = ~/live-control
  list = yes
  subscriptions = no
}
# Combined views over every account (Virtual/All inboxes, Unread, Flagged); their
# folder lists are written by mailhub-mirror from the accounts that exist.
namespace virtual {
  prefix = Virtual/
  separator = /
  mail_driver = virtual
  mailbox_list_layout = fs
  mail_path = ~/virtual
  list = yes
  subscriptions = no
}
mail_plugins {
  virtual = yes
  mail_lua = yes
  push_notification = yes
  push_notification_lua = yes
}
push_notification replay {
  driver = lua
  lua_file = /etc/dovecot/mailhub-replay.lua
}
