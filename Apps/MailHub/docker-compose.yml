name: mailhub
# MailHub — one mailbox for the mail accounts you already have.
# mailhub-mirror keeps a copy of every provider mailbox in Dovecot (Live/<address>/,
# IMAP, pull only) and replays what is done there at the provider, which stays the
# source of truth; Merged/ combines them. Roundcube reads it and sends every
# identity through its own provider's SMTP; mailhub-submit does the same for mail
# apps, behind one SMTP login. Calendar and
# contacts live in a built-in Baïkal (CalDAV/CardDAV only, no admin console), shown
# in Roundcube by the Kolab plugins and synced to phones; Settings can point them at
# another CalDAV/CardDAV server instead.
#
# The mailhub-roundcube, -mirror and -mcp images are each built from their own repo,
# github.com/worph/mailhub-<image>; github.com/worph/mailhub holds the spike's test
# kit and notes.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # SSO gate in front of the webmail, and its only login: AppShield signs the
  # identity on every request (X-AppShield-Assertion) and the webmail logs that
  # identity into its own mailbox (mailhub_sso).
  mailhub-proxy:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: mailhub
    hostname: mailhub
    restart: unless-stopped
    cpu_shares: 80
    logging: *logging
    user: "0:0"
    expose:
      - 80
    environment:
      BACKEND_HOST: mailhub-webmail
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # The assertion's audience, and the key it is signed with (the webmail checks both).
      APP_NAME: mailhub
      IDENTITY_ASSERTION_SECRET: "${MAILHUB_ASSERTION_SECRET}"
    # AppShield answers /health, but its image has no shell or HTTP client to
    # probe it from inside; no healthcheck (as in the official store apps).
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - mailhub-webmail
    networks:
      - pcs
      - mailhub-internal

  mailhub-webmail:
    image: ghcr.io/worph/mailhub-roundcube:0.8.0
    container_name: mailhub-webmail
    restart: unless-stopped
    cpu_shares: 80
    logging: *logging
    expose:
      - 80
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailhub-imap
      ROUNDCUBEMAIL_DEFAULT_PORT: "31143"
      # identity_smtp needs a global SMTP to exist. It points nowhere on purpose:
      # an identity without its provider's SMTP must fail, not leave through a
      # server whose SPF/DMARC don't cover the address.
      ROUNDCUBEMAIL_SMTP_SERVER: "${MAILHUB_DEFAULT_SMTP:-localhost}"
      ROUNDCUBEMAIL_SMTP_PORT: "${MAILHUB_DEFAULT_SMTP_PORT:-587}"
      # mailhub_sso (first): no login of its own. Logs the identity AppShield signed
      # into its own mailbox (the first one: admin), through Dovecot's master login;
      # Settings → Phones & computers shows the mailbox's IMAPS / DAV login.
      # mailhub_dav loads calendar + kolab_addressbook against the built-in Baïkal
      # (or another server set in Settings → Calendar & contacts).
      # mailhub_accounts: Settings → Mail accounts, writes the mirror's account
      # files and each address's identity + SMTP.
      # mailhub_folders: Merged/All inboxes, Trash, Junk and Archive are the Inbox, Trash,
      # Junk and Archive. mailhub_archive: Archive (toolbar, and on each row in place of
      # the flag) into the Archive folder of the message's own account. Not Roundcube's
      # `archive` plugin: it archives everything into one folder, and would add a
      # second Archive button now that an archive folder is set.
      # mailhub_mcp: Settings → AI assistant, turns the MCP server and its write
      # access on and off, tool by tool, and shows its calls.
      # mailhub_branding: the MailHub icon as logo and favicon, and the web app manifest
      # (Install app / Add to Home Screen gets the MailHub icon, not Roundcube's).
      # mailhub_push: Settings → Notifications, push notifications for new mail on
      # phones and computers (sent by mailhub-mirror), with a test button.
      ROUNDCUBEMAIL_PLUGINS: mailhub_sso,zipdownload,identity_smtp,mailhub_dav,mailhub_accounts,mailhub_folders,mailhub_archive,mailhub_collect,mailhub_mcp,mailhub_branding,mailhub_push
      ROUNDCUBEMAIL_DES_KEY: "${MAILHUB_DES_KEY}"
      ROUNDCUBEMAIL_SKIN: elastic2022
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      MAILHUB_DAV_DEBUG: "${MAILHUB_DAV_DEBUG:-}"
      MAILHUB_ASSERTION_SECRET: "${MAILHUB_ASSERTION_SECRET}"
      MAILHUB_MASTER_PASSWORD: "${MAILHUB_MASTER_PASSWORD}"
      # The owner's device login (admin), shown in Settings → Phones & computers and
      # used for the built-in calendar.
      MAILHUB_PASSWORD: "${MAILHUB_PASSWORD}"
      MAILHUB_IMAPS_HOST: "${APP_TLS_HOST:-}"
      MAILHUB_DAV_URL: "${ROUTE_MAILHUBDAV_URL:-https://mailhubdav-${APP_DOMAIN}}/dav.php"
      TZ: Etc/UTC
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/db:/var/roundcube/db
      # The users: one per signed-in identity (mailhub_sso writes, the mirror applies).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/users:/var/mailhub/users
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/config:/var/roundcube/config:ro
      # Settings → Mail accounts writes the mirrored accounts and reads their status
      # (a folder per user in each).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/accounts:/var/mailhub/accounts
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/state:/var/mailhub/mirror:ro
      # Settings → AI assistant writes the MCP server's settings and reads its calls.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mcp/settings:/var/mailhub/mcp-settings
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mcp/log:/var/mailhub/mcp-log:ro
    # Apache + PHP + Roundcube answering: a request without AppShield's identity is
    # refused (403), never shown a login form. First start copies the app and runs
    # composer, hence the long start period.
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)\" = 403 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mailhub-imap
      - mailhub-dav
    networks:
      - mailhub-internal

  mailhub-imap:
    image: dovecot/dovecot:2.4.5
    container_name: mailhub-imap
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    environment:
      # Logins (seed/dovecot/auth.conf): the webmail, the mirror and the MCP server
      # as any user with this master password, from private addresses only; phones
      # and desktop clients with each user's device password (.mailhub-passwd).
      MAILHUB_MASTER_PASSWORD: "${MAILHUB_MASTER_PASSWORD}"
      MAILHUB_TLS_CERT: /tls/cert.pem
      MAILHUB_TLS_KEY: /tls/key.pem
      TZ: Etc/UTC
    ports:
      # IMAPS for phones and desktop clients (Thunderbird, iOS Mail, K-9).
      # Not HTTP, so the proxy cannot carry it.
      - "993:31993"
    expose:
      - 31143
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mail:/srv/vmail
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/dovecot/mailhub.conf:/etc/dovecot/conf.d/zz-mailhub.conf:ro
      # In place of the image's single-password login.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/dovecot/auth.conf:/etc/dovecot/conf.d/auth.conf:ro
      # Records each IMAP action for mailhub-mirror's replay (push_notification lua).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/dovecot/mailhub-replay.lua:/etc/dovecot/mailhub-replay.lua:ro
      # IMAPS certificate, written by Maison (x-compose-app `certificates`) for the
      # best host of the mailhub route that reaches this box directly; its name is
      # APP_TLS_HOST. Self-signed until the box has one.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/tls:/tls:ro
    # Dovecot's IMAP greeting on the internal port (no grep in the image: case).
    healthcheck:
      test: ["CMD-SHELL", "r=$$(printf 'a LOGOUT\\r\\n' | nc -w 3 127.0.0.1 31143); case \"$$r\" in '* OK'*) exit 0;; esac; exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - mailhub-internal

  # Every provider mailbox as a local copy (mbsync, pull only: nothing in that
  # direction writes to the provider), the IMAP actions done on it replayed at the
  # provider as the same commands, and the Merged/ views kept up to date.
  # One mailbox per user (admin + the registry the webmail keeps), each mirrored from
  # its own accounts; it also renders the users' device logins for Dovecot and
  # creates their calendar & contacts accounts in Baïkal.
  # Root to read the webmail's private account files; mbsync runs as vmail (1000).
  mailhub-mirror:
    image: ghcr.io/worph/mailhub-mirror:0.8.0
    container_name: mailhub-mirror
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    user: "0:0"
    environment:
      # Folders are subscribed over IMAP as each user (master login); the owner's
      # password becomes its device login in Dovecot's passwd-file.
      MAILHUB_MASTER_PASSWORD: "${MAILHUB_MASTER_PASSWORD}"
      MAILHUB_PASSWORD: "${MAILHUB_PASSWORD}"
      MAILHUB_SYNC_INTERVAL: "${MAILHUB_SYNC_INTERVAL:-120}"
      # New mail in an account's INBOX is pulled at once (IMAP IDLE at the provider)
      # and notified to the devices turned on in Settings → Notifications (Web Push,
      # encrypted for each device). The subject is the push contact the browser
      # vendors' push services ask for: the app's address.
      MAILHUB_IDLE: "${MAILHUB_IDLE:-1}"
      MAILHUB_PUSH_SUBJECT: "${ROUTE_MAILHUB_URL:-https://mailhub-${APP_DOMAIN}}"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mail:/srv/vmail
      # Read-write only to move a 0.4 install's account files under admin/ once.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/accounts:/accounts
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/state:/state
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/users:/users:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/data:/baikal
    # The main loop is alive (it touches .alive every few seconds; a provider
    # failing is per-account status in Settings → Mail accounts).
    healthcheck:
      test: ["CMD-SHELL", "find /state/.alive -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - mailhub-imap
    networks:
      - mailhub-internal

  # One SMTP login for mail apps (submit.py in the mirror's image): a phone or
  # desktop client sends as every address the user connected, with the same device
  # login as IMAPS, and each message goes out through that address's own provider
  # (its SMTP and app password, from the account file), as the webmail does.
  # Synchronous: nothing is queued or stored, the provider's answer is the app's.
  # Logins are checked against the mirror's copy of the device logins, never through
  # Dovecot (whose master login is accepted from this private network).
  # Root to read the webmail's private account files; every mount read-only.
  mailhub-submit:
    image: ghcr.io/worph/mailhub-mirror:0.8.0
    container_name: mailhub-submit
    restart: unless-stopped
    cpu_shares: 20
    logging: *logging
    user: "0:0"
    entrypoint: ["/sbin/tini", "--", "python3", "-u", "/usr/local/bin/submit.py"]
    environment:
      APP_TLS_HOST: "${APP_TLS_HOST:-}"
      MAILHUB_SUBMIT_DAILY_RCPT: "${MAILHUB_SUBMIT_DAILY_RCPT:-500}"
    ports:
      # SMTP submission for phones and desktop clients: 465 TLS, 587 STARTTLS.
      # Outbound it only talks to the providers' submission ports, never port 25.
      - "465:31465"
      - "587:31587"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/accounts:/accounts:ro
      # The device logins (the mirror's copy of Dovecot's passwd-file).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mirror/state/.submit:/submit:ro
      # The IMAPS certificate (see mailhub-imap); restarted by Maison on renewal.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/tls:/tls:ro
    # The STARTTLS port's greeting.
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',31587),5); sys.exit(not s.recv(64).startswith(b'220'))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - mailhub-mirror
    networks:
      - mailhub-internal

  # Calendar & contacts (CalDAV/CardDAV). Routed WITHOUT AppShield: phone and
  # desktop DAV clients only speak Basic auth, so the mailbox login is the gate.
  # The nginx config serves /dav.php only — no admin console, no welcome page.
  mailhub-dav:
    image: ckulka/baikal:0.10.1-nginx
    container_name: mailhub-dav
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    expose:
      - 80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/config:/var/www/baikal/config
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/data:/var/www/baikal/Specific
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/baikal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx + PHP + Baïkal: /dav.php without credentials must ask for them (401).
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/dav.php)\" = 401 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - pcs
      - mailhub-internal

  # MCP server: mail, calendar and contacts for AI assistants. Turned on and off,
  # with write access and tool by tool, in the webmail (Settings → AI assistant);
  # MAILHUB_MCP_WRITE is write access until set there. Even with it, it only saves
  # drafts, never sends.
  # App-private network only — Beacon reaches it through mailhub-beacon.
  mailhub-mcp:
    image: ghcr.io/worph/mailhub-mcp:1.0.1
    container_name: mailhub-mcp
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    expose:
      - 8080
    environment:
      # The owner's mailbox (per-user MCP needs a caller identity; Beacon has none):
      # IMAP through the master login, CalDAV/CardDAV with the owner's password.
      MAILHUB_USER: admin
      MAILHUB_PASSWORD: "${MAILHUB_PASSWORD}"
      MAILHUB_MASTER_PASSWORD: "${MAILHUB_MASTER_PASSWORD}"
      MAILHUB_MCP_WRITE: "${MAILHUB_MCP_WRITE:-false}"
      MAILHUB_ROUNDCUBE_DB: /roundcube/sqlite.db
      MAILHUB_MCP_SETTINGS: /settings
      MAILHUB_MCP_LOG_DIR: /log
    volumes:
      # Identities (name + address) only; SMTP passwords stay in Roundcube.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/roundcube/db:/roundcube:ro
      # The webmail's settings for it (read on every request), and where it writes
      # its tool list and call history (30 days, results never recorded).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mcp/settings:/settings:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/mcp/log:/log
    # The MCP endpoint answers HTTP (a bare GET gets 406/405, still a live server).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r, urllib.error as e, sys\ntry: r.urlopen('http://127.0.0.1:8080/mcp', timeout=5)\nexcept e.HTTPError as x: sys.exit(x.code >= 500)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192M
    depends_on:
      - mailhub-imap
      - mailhub-dav
    networks:
      - mailhub-internal

  # Announces the MCP server to Beacon (UDP discovery on the shared network) and
  # proxies /mcp to it. Tools appear in Beacon as mailhub__<tool>.
  mailhub-beacon:
    image: ghcr.io/worph/beaconify:1.0.3
    container_name: mailhub-beacon
    hostname: mailhub-beacon
    restart: unless-stopped
    cpu_shares: 20
    logging: *logging
    expose:
      - 9099
    environment:
      BEACONIFY_NAME: mailhub
      BEACONIFY_DESCRIPTION: "MailHub — the unified mailbox (search, read, drafts), calendar and contacts"
      BEACONIFY_UPSTREAM_URL: http://mailhub-mcp:8080/mcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9099/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - mailhub-mcp
    networks:
      - pcs
      - mailhub-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  mailhub-internal:
    driver: bridge

x-compose-app:
  schema_version: 2
  version: "0.8.0"
  # The first route is the web UI (webmail, behind SSO). The second is the
  # CalDAV/CardDAV endpoint for phones. IMAPS is a published port, not a route.
  routes:
    - { service: mailhub-proxy, name: mailhub, upstream-port: 80 }
    - { service: mailhub-dav, name: mailhubdav, upstream-port: 80 }
  id: mailhub
  title:
    en_us: MailHub
  tagline:
    en_us: All your mail accounts in one inbox, with calendar and contacts.
    fr_fr: Tous vos comptes mail dans une seule boîte, avec agenda et contacts.
  description:
    en_us: &description_en |
      MailHub gathers the mail accounts you already have — Gmail, your domain's mailbox,
      any IMAP provider — into one inbox on your server, and answers from the right address.

      **What it does**
      • Keeps a copy of every mailbox on your server, all folders, over IMAP only: read,
        move and delete as usual, and the same is done at the provider, which stays the
        reference (nothing else is ever changed there)
      • Combined views over every account: All inboxes, Unread, Flagged, Archive — fast,
        with full-text search
      • Archive next to Delete, as on Gmail: the message goes into the Archive folder of
        its own account, at the provider too
      • Webmail (Roundcube) on any device, opened by your server's sign-in — no second
        login; every account on the server gets a mailbox of its own
      • Each address sends through its own provider's SMTP, so SPF and DMARC stay valid
      • Notifications for new mail on your phone and computer, also with MailHub closed;
        install it as an app from the browser
      • Thunderbird and phone mail apps with one account: IMAPS, and one SMTP login that
        sends every address through its own provider
      • Calendar and contacts built in: invitations get Accept / Maybe / Decline and land
        in your calendar, and both sync to your phone (CalDAV / CardDAV)
      • AI access (MCP) through Beacon: search and read mail, calendar, contacts —
        read-only by default; drafts only, never sends

      MailHub does not receive mail for a domain by itself (no MX): it works with the
      providers you keep using. For a light single-mailbox webmail, see **SnappyMail**;
      for a live web client without a local copy, **Cypht**.
    fr_fr: &description_fr |
      MailHub rassemble les comptes mail que vous avez déjà — Gmail, la boîte de votre
      domaine, tout fournisseur IMAP — dans une seule boîte sur votre serveur, et répond
      depuis la bonne adresse.

      **Ce qu'il fait**
      • Garde une copie de chaque boîte sur votre serveur, tous les dossiers, uniquement en
        IMAP : lisez, déplacez et supprimez comme d'habitude, la même chose est faite chez
        le fournisseur, qui reste la référence (rien d'autre n'y est jamais modifié)
      • Vues combinées sur tous les comptes : Toutes les boîtes, Non lus, Suivis, Archive —
        rapides, avec recherche plein texte
      • Archiver à côté de Supprimer, comme sur Gmail : le mail va dans le dossier Archive
        de son propre compte, chez le fournisseur aussi
      • Webmail (Roundcube) sur tous vos appareils, ouvert par la connexion du serveur —
        pas de seconde connexion ; chaque compte du serveur a sa propre boîte
      • Chaque adresse envoie par le SMTP de son fournisseur : SPF et DMARC restent valides
      • Notifications des nouveaux mails sur le téléphone et l'ordinateur, même MailHub
        fermé ; installable comme une appli depuis le navigateur
      • Thunderbird et les applis mail du téléphone avec un seul compte : IMAPS, et un seul
        identifiant SMTP qui envoie chaque adresse par son propre fournisseur
      • Agenda et contacts intégrés : les invitations ont Accepter / Peut-être / Refuser
        et arrivent dans l'agenda, et tout se synchronise sur le téléphone (CalDAV / CardDAV)
      • Accès IA (MCP) via Beacon : chercher et lire les mails, agenda, contacts —
        lecture seule par défaut ; brouillons seulement, jamais d'envoi

      MailHub ne reçoit pas de mail pour un domaine (pas de MX) : il travaille avec les
      fournisseurs que vous gardez. Pour un webmail léger d'une boîte à la fois, voir
      **SnappyMail** ; pour un webmail en direct sans copie locale, **Cypht**.
  developer: Yundera
  category: Email
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  accounts:
    - provider: Email (IMAP)
  architectures:
    - amd64
  # IMAPS (993) and SMTP submission (465, 587) are published on the host's public address.
  requires: [public-ip]
  secrets:
    MAILHUB_PASSWORD: password:24       # the owner's (admin) device login: IMAPS, CalDAV/CardDAV
    # Signs the identity AppShield hands the webmail (X-AppShield-Assertion).
    MAILHUB_ASSERTION_SECRET: hex:32
    # Dovecot's master login, for the webmail, the mirror and the MCP server only.
    MAILHUB_MASTER_PASSWORD: alnum:32
    # Baïkal's config (seed/baikal/baikal.yaml.tmpl). Its admin console is not served,
    # so the admin hash is a random value no password matches.
    MAILHUB_DAV_ADMIN_HASH: hex:32      # sha256-sized
    MAILHUB_DAV_ENCRYPTION_KEY: hex:16  # as Baïkal's installer makes; nothing reads it
    MAILHUB_DES_KEY: alnum:24           # Roundcube's key for stored SMTP passwords
  folders:
    - path: /DATA/AppData/$AppID/mail
      user: "1000"                      # dovecot image's vmail
      group: "1000"
      mode: "0700"
    - path: /DATA/AppData/$AppID/roundcube/db
      user: "33"                        # www-data
      group: "33"
    # The webmail (www-data, 33) writes the account files, which hold the
    # providers' app passwords, hence 0700; mailhub-mirror reads them as root.
    - path: /DATA/AppData/$AppID/mirror/accounts
      user: "33"
      group: "33"
      mode: "0700"
      recursive: true
    # One file per user (signed-in identity), written by the webmail (0600: each
    # holds a device password, encrypted, and its hashes); the mirror applies them.
    - path: /DATA/AppData/$AppID/users
      user: "33"
      group: "33"
      mode: "0700"
    # The mirror's generated config and the per-account status the page shows.
    - path: /DATA/AppData/$AppID/mirror/state
    # The device logins for mailhub-submit (written by the mirror, root, 0600).
    - path: /DATA/AppData/$AppID/mirror/state/.submit
      mode: "0700"
    # Each written by one side: the MCP settings by the webmail (www-data, 33), the
    # MCP tool list and call history by the MCP server (its image's user, 1000).
    - path: /DATA/AppData/$AppID/mcp/settings
      user: "33"
      group: "33"
    - path: /DATA/AppData/$AppID/mcp/log
      user: "1000"
      group: "1000"
    - path: /DATA/AppData/$AppID/baikal/config
      user: "101"                       # the Baïkal image's nginx (its entrypoint chowns to it)
      group: "101"
    - path: /DATA/AppData/$AppID/baikal/data
      user: "101"
      group: "101"
    - path: /DATA/AppData/$AppID/baikal/data/db
      user: "101"
      group: "101"
  # Backups: Maison snapshots the whole app folder (stopping the app for the short
  # second pass, so the SQLite DBs and Maildir are consistent). Nothing here is a
  # regenerable cache, so nothing is excluded: mail/, baikal/data/, roundcube/db/, users/,
  # .env (the secrets, including the key Roundcube encrypts SMTP passwords with).
  # mail/<user>/live/ is the providers' mail, copied: a restore without it simply copies
  # it again (mbsync keeps its state inside each folder, so the two travel together).
  # App-managed config, re-rendered on every up so an update reaches existing
  # installs (seed/ alone is create-if-absent). Edit the store copy, not these.
  # The IMAPS certificate (see mailhub-imap). Maison picks the host, keeps it while
  # it works (phones are configured with it), and restarts Dovecot and the SMTP
  # submission on renewal.
  certificates:
    - route: mailhub
      path: /DATA/AppData/$AppID/tls
      user: "1000"                      # dovecot's vmail
      group: "1000"
      restart: [mailhub-imap, mailhub-submit]
  files:
    - path: /DATA/AppData/$AppID/roundcube/config/mailhub.inc.php
      from: roundcube/config/mailhub.inc.php
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/dovecot/mailhub.conf
      from: dovecot/mailhub.conf
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/dovecot/mailhub-replay.lua
      from: dovecot/mailhub-replay.lua
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/dovecot/auth.conf
      from: dovecot/auth.conf
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/baikal/nginx.conf
      from: baikal/nginx.conf
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/baikal/config/baikal.yaml
      from: baikal/baikal.yaml.tmpl
      ensure: always
      user: "101"                       # the Baïkal image's nginx
      group: "101"
      mode: "0640"
  steps:
    # Baïkal's DB (the owner's `admin` account with one calendar and one address
    # book) is created on the first up; every later up re-syncs the account's
    # password with the owner's, so a changed MAILHUB_PASSWORD reaches CalDAV/CardDAV. The
    # other users' accounts are created by mailhub-mirror. Its config is baikal.yaml
    # under `files`.
    - name: baikal-init
      at: setup
      run: always
      images: [ckulka/baikal:0.10.1-nginx]
      script: |
        # Bare -e NAME: the value never appears on a command line.
        export BAIKAL_USER_PASSWORD="$MAILHUB_PASSWORD"
        docker run --rm --network none --entrypoint php \
          -e BAIKAL_USER=admin -e BAIKAL_USER_PASSWORD \
          -v "$APP_DIR/.scripts/baikal-init.php:/init/init.php:ro" \
          -v "$APP_DIR/baikal/data:/var/www/baikal/Specific" \
          ckulka/baikal:0.10.1-nginx /init/init.php
    # Safety net for a Maison older than 1.1.92, which ignores `certificates` and
    # would leave tls/ empty: Dovecot would not start, and the webmail with it. A
    # self-signed pair keeps everything but trusted IMAPS working. On 1.1.92+ the
    # certificate is already written before steps run, so this does nothing.
    # dovecot/mailhub.conf is re-rendered on every up (files, ensure: always) but
    # bind-mounted, so an update that changes it does not recreate the container:
    # reload it so the running server applies it (open connections stay up).
    - name: dovecot-reload
      at: started
      run: always
      script: |
        compose exec mailhub-imap doveadm reload
    - name: tls-fallback
      at: setup
      run: always
      images: [ghcr.io/worph/mailhub-roundcube:0.5.1]
      script: |
        docker run --rm --network none --entrypoint sh -v "$APP_DIR/tls:/tls" \
          ghcr.io/worph/mailhub-roundcube:0.5.1 -c '
            [ -s /tls/cert.pem ] && [ -s /tls/key.pem ] && exit 0
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 365 \
              -subj "/CN=mailhub (self-signed)" -keyout /tls/key.pem -out /tls/cert.pem 2>/dev/null
            chown 1000:1000 /tls/cert.pem /tls/key.pem
            chmod 600 /tls/key.pem && chmod 644 /tls/cert.pem'
  tips:
    en_us: &tips_en |
      **Signing in**
      Open the app and sign in with your server account: that is the only login.
      Each account that signs in gets a mailbox of its own.

      **Phone and desktop clients (optional)**
      MailHub is a webmail first. To also read your mail in a mail app, or sync the
      calendar and contacts, each account finds its own login in the webmail,
      Settings → *Phones & computers*.

      | | |
      | --- | --- |
      | IMAP server | `${APP_TLS_HOST}`, port 993, SSL/TLS |
      | IMAP user and password | in the webmail, Settings → *Phones & computers* |
      | Email address, if the app asks for one | `<IMAP user>@${APP_TLS_HOST}` (e.g. `admin@${APP_TLS_HOST}`) |
      | Calendar & contacts (CalDAV / CardDAV) | `${ROUTE_MAILHUBDAV_URL:-https://mailhubdav-${APP_DOMAIN}}/dav.php`, same login |
      | SMTP server | `${APP_TLS_HOST}`, port 465, SSL/TLS (or 587, STARTTLS), same login |

      That address is not a real one: it only fills the form. With one of your own
      addresses, Thunderbird and other apps look up your provider's servers and set
      them instead of MailHub's. Choose the manual setup if offered.

      Then add each of your mail accounts' addresses as an identity of this one
      account (Thunderbird: *Manage Identities*): each address sends through its own
      provider, with the password saved in *Mail accounts*. Keep the app's default
      Sent folder.

      If the IMAP and SMTP servers above are empty, the server has no trusted certificate for
      it yet: wait a few minutes, then reopen these tips.

      Android: DAVx⁵ → *Login with URL and user name*. iPhone: Settings → Calendar →
      Accounts → Other → *Add CalDAV Account* (and CardDAV under Contacts), server
      `${ROUTE_MAILHUBDAV_HOST:-mailhubdav-${APP_DOMAIN}}`.

      **Adding your mail accounts**
      Webmail → Settings → *Mail accounts*: pick the provider (Gmail, Namecheap
      Private Email, or another one), enter the address and an app password. MailHub
      tests the login and sets up the address so your replies leave through that
      provider. Its folders appear under *Live › <address>* within a minute; a big
      mailbox takes a while to copy the first time (the page shows the progress).
      The webmail's *Inbox*, *Junk* and *Trash* combine every account (*Merged ›
      Unread* and *Flagged* too), except the ones set to *Keep out of Merged* (an
      address that gets mostly spam, say): those are read in their own Live folders.

      What you do in the Live folders (read, flag, move, delete) is done the same way
      at the provider, over IMAP; nothing else is ever changed there. Moving a message
      out of Live into one of your own folders removes it from the provider: it is then
      kept on this server only. Removing an account deletes only this server's copy.

      **Notifications and the app**
      In the browser, *Install app* (Android, computer) or Share → *Add to Home Screen*
      (iPhone, iPad) puts MailHub on the home screen as an app. Then Webmail → Settings →
      *Notifications* → *Turn on notifications here*, on each device; *Send test
      notification* checks it works. On iPhone and iPad, notifications only work in the
      app added to the Home Screen.

      **Calendar and contacts** are built in — nothing to set up. To keep them on
      another CalDAV/CardDAV server (Nextcloud…), Webmail → Settings → *Calendar &
      contacts*.

      **AI assistants (MCP)**
      With the **Beacon** app installed, MailHub's tools appear there on their own
      (`mailhub__mail_search`, `mailhub__calendar_events`, …). They are read-only.
      Webmail → Settings → *AI assistant* turns them off, tool by tool or all at
      once, lets the assistant file mail, save drafts and add events or contacts
      (*Allow changes*), and shows every call it made. It never sends mail: drafts
      wait in *Drafts* for you to send from the webmail.
    fr_fr: &tips_fr |
      **Connexion**
      Ouvrez l'app et connectez-vous avec votre compte serveur : c'est la seule
      connexion. Chaque compte qui se connecte a sa propre boîte.

      **Téléphone et clients mail (facultatif)**
      MailHub est d'abord un webmail. Pour lire aussi vos mails dans une appli mail,
      ou synchroniser l'agenda et les contacts, chaque compte trouve son identifiant
      dans le webmail, Paramètres → *Téléphones et ordinateurs*.

      | | |
      | --- | --- |
      | Serveur IMAP | `${APP_TLS_HOST}`, port 993, SSL/TLS |
      | Utilisateur et mot de passe IMAP | dans le webmail, Paramètres → *Téléphones et ordinateurs* |
      | Adresse mail, si l'appli en demande une | `<utilisateur IMAP>@${APP_TLS_HOST}` (ex. `admin@${APP_TLS_HOST}`) |
      | Agenda et contacts (CalDAV / CardDAV) | `${ROUTE_MAILHUBDAV_URL:-https://mailhubdav-${APP_DOMAIN}}/dav.php`, même identifiant |
      | Serveur SMTP | `${APP_TLS_HOST}`, port 465, SSL/TLS (ou 587, STARTTLS), même identifiant |

      Cette adresse n'existe pas : elle ne sert qu'à remplir le formulaire. Avec une de
      vos propres adresses, Thunderbird et d'autres applis cherchent les serveurs de
      votre fournisseur et les mettent à la place de ceux de MailHub. Choisissez la
      configuration manuelle si elle est proposée.

      Ajoutez ensuite l'adresse de chacun de vos comptes mail comme identité de ce seul
      compte (Thunderbird : *Gérer les identités*) : chaque adresse envoie par son propre
      fournisseur, avec le mot de passe enregistré dans *Comptes mail*. Gardez le dossier
      Envoyés par défaut de l'appli.

      Si les serveurs IMAP et SMTP ci-dessus sont vides, le serveur n'a pas encore de certificat
      reconnu pour lui : attendez quelques minutes, puis rouvrez ces conseils.

      Android : DAVx⁵ → *Connexion avec URL et nom d'utilisateur*. iPhone : Réglages →
      Calendrier → Comptes → Autre → *Ajouter un compte CalDAV* (et CardDAV dans
      Contacts), serveur `${ROUTE_MAILHUBDAV_HOST:-mailhubdav-${APP_DOMAIN}}`.

      **Ajouter vos comptes mail**
      Webmail → Paramètres → *Comptes mail* : choisissez le fournisseur (Gmail,
      Namecheap Private Email ou un autre), saisissez l'adresse et un mot de passe
      d'application. MailHub teste la connexion et configure l'adresse pour que vos
      réponses partent via ce fournisseur. Ses dossiers apparaissent sous
      *Live › <adresse>* dans la minute ; une grosse boîte met un moment à être copiée la
      première fois (la page affiche l'avancement). La *Boîte de réception*, le dossier
      *Spam* et la *Corbeille* du webmail combinent tous les comptes (*Merged › Unread* et
      *Flagged* aussi), sauf ceux réglés sur *Exclure de Merged* (une adresse qui reçoit
      surtout du spam, par exemple) : ceux-là se lisent dans leurs propres dossiers Live.

      Ce que vous faites dans les dossiers Live (lire, marquer, déplacer, supprimer) est
      fait de la même façon chez le fournisseur, en IMAP ; rien d'autre n'y est jamais
      modifié. Déplacer un mail hors de Live vers un de vos dossiers le retire du
      fournisseur : il n'est alors gardé que sur ce serveur. Retirer un compte supprime
      seulement la copie de ce serveur.

      **Notifications et l'appli**
      Dans le navigateur, *Installer l'application* (Android, ordinateur) ou Partager →
      *Sur l'écran d'accueil* (iPhone, iPad) met MailHub sur l'écran d'accueil comme une
      appli. Puis Webmail → Paramètres → *Notifications* → *Activer les notifications
      ici*, sur chaque appareil ; *Envoyer une notification de test* vérifie que ça
      marche. Sur iPhone et iPad, les notifications ne fonctionnent que dans l'appli
      ajoutée à l'écran d'accueil.

      **L'agenda et les contacts** sont intégrés — rien à configurer. Pour les garder
      sur un autre serveur CalDAV/CardDAV (Nextcloud…), Webmail → Paramètres →
      *Agenda et contacts*.

      **Assistants IA (MCP)**
      Avec l'app **Beacon** installée, les outils de MailHub y apparaissent tout seuls
      (`mailhub__mail_search`, `mailhub__calendar_events`, …), en lecture seule.
      Webmail → Réglages → *Assistant IA* les désactive, outil par outil ou tous à la
      fois, permet de classer les mails, enregistrer des brouillons et ajouter des
      événements ou contacts (*Autoriser les modifications*), et montre chaque appel.
      Rien n'est jamais envoyé : les brouillons attendent dans *Brouillons* que vous
      les envoyiez depuis le webmail.

