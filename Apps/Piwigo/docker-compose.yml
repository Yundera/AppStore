      **登录:** Piwigo 已自动安装。打开应用，使用 Maison 显示的密码以 `admin` 登录（也可在磁贴菜单的 **Credentials** 中查看）。之后可在 Piwigo 的个人资料中修改密码，Maison 显示的只是初始密码。

      **默认私密:** 未登录的访客只能看到登录页面，自助注册已关闭，新相册默认为私密。要与他人分享，请在 **Administration > Users** 中为其创建账户，并在相册的 **Permissions** 选项卡中授权。

      **公开相册:** 在相册的 **Permissions** 选项卡中设为 *public*，然后安装 **LocalFiles Editor** 插件（**Administration > Plugins**），在本地配置中把 `guest_access` 改为 `true`。

      **移动应用:** 官方 Piwigo Android/iOS 应用可直接连接此服务器：填写应用地址和你的 Piwigo 账户即可。

      **照片存放位置:** `/DATA/AppData/piwigo/gallery/upload`
    fr_fr: |
      **Connexion:** Piwigo est installe pour vous. Ouvrez l'application et connectez-vous en `admin` avec le mot de passe affiche par Maison (aussi dans le menu de la tuile, sous **Credentials**). Vous pouvez le changer ensuite depuis votre profil Piwigo ; celui affiche par Maison n'est que le mot de passe initial.

      **Prive par defaut:** les visiteurs non connectes ne voient que la page de connexion, l'inscription libre est desactivee et les nouveaux albums sont prives. Pour partager, creez un compte sous **Administration > Users** et donnez-lui des albums dans l'onglet **Permissions** de l'album.

      **Rendre des albums publics:** passez l'album en *public* dans son onglet **Permissions**, puis installez le plugin **LocalFiles Editor** (**Administration > Plugins**) et mettez `guest_access` a `true` dans la configuration locale.

      **Applications mobiles:** les applications Piwigo officielles pour Android et iOS fonctionnent avec ce serveur : utilisez l'adresse de l'application et votre compte Piwigo.

      **Vos photos** sont stockees dans `/DATA/AppData/piwigo/gallery/upload`.
    es_es: |
      **Inicio de sesion:** Piwigo se instala automaticamente. Abre la app e inicia sesion como `admin` con la contrasena que muestra Maison (tambien en el menu del icono, en **Credentials**). Puedes cambiarla despues desde tu perfil en Piwigo; la que muestra Maison es solo la contrasena inicial.

      **Privado por defecto:** los visitantes sin sesion solo ven la pagina de inicio de sesion, el registro libre esta desactivado y los albumes nuevos son privados. Para compartir, crea una cuenta en **Administration > Users** y concede albumes en la pestana **Permissions** del album.

      **Hacer albumes publicos:** pon el album en *public* en su pestana **Permissions**, instala el plugin **LocalFiles Editor** (**Administration > Plugins**) y cambia `guest_access` a `true` en la configuracion local.

      **Apps moviles:** las apps oficiales de Piwigo para Android e iOS funcionan con este servidor: usa la direccion de la app y tu cuenta de Piwigo.

      **Tus fotos** se guardan en `/DATA/AppData/piwigo/gallery/upload`.
  # One secret per purpose: the login password is never a database password.
  secrets:
    PIWIGO_ADMIN_PASSWORD: password:24
    PIWIGO_DB_PASSWORD: alnum:32
    PIWIGO_DB_ROOT_PASSWORD: alnum:32
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${PIWIGO_ADMIN_PASSWORD}
      note:
        en_us: The initial Piwigo administrator password. If you change it in Piwigo, this one stops working.
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  folders:
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/gallery
      user: $PUID
      group: $PGID
    # Not /DATA/AppData/$AppID/db: piwigo-db starts as root and its image hands that
    # directory to its own user; chowning it to $PUID here would leave the running
    # database unable to write there.
  # Resized copies and thumbnails: Piwigo rebuilds any missing one on demand.
  backup:
    exclude:
      - config/www/_data/i/
  steps:
    # Piwigo's first visit is an install wizard asking for the database and an
    # admin account. This step fills it in, so the first page the user sees is
    # the login. It posts the wizard's own form (install.php) from inside the
    # piwigo container (its image ships curl), so the values reach curl through
    # `-e` and never appear on a command line.
    #
    # Guarded on the data: Piwigo is installed once its config table exists in the
    # database. install.php writes local/config/database.inc.php *before* it
    # creates the tables, so that file alone does not prove an install finished:
    # if it is there without the tables, an earlier run died half-way, and the
    # leftover file is removed so the wizard can run again.
    #
    # A `started` step runs as soon as the containers have started; piwigo itself
    # only starts once piwigo-db is healthy (depends_on), but nginx/php-fpm need a
    # few more seconds, so the wait is a bounded loop.
    #
    # Self-registration is a database setting in Piwigo (allow_user_registration,
    # on in a fresh install) that local config cannot override, so it is turned
    # off here, once, right after the install; an admin who turns it back on later
    # keeps that choice.
    - name: install
      at: started
      run: always
      script: |
        cfg="$APP_DIR/config/www/local/config/database.inc.php"
        installed() {
          compose exec -T -e PIWIGO_DB_PASSWORD piwigo-db sh -c \
            'MYSQL_PWD="$PIWIGO_DB_PASSWORD" mariadb -upiwigo piwigo -N -e "SELECT 1 FROM piwigo_config LIMIT 1"' >/dev/null 2>&1
        }
        [ -e "$cfg" ] && installed && exit 0
        rm -f "$cfg"
        ready=
        for i in $(seq 100); do
          if compose exec piwigo curl -fs -o /dev/null http://localhost/install.php >/dev/null 2>&1; then
            ready=1
            break
          fi
          sleep 3
        done
        [ -n "$ready" ] || { echo "piwigo did not answer on http://localhost/install.php" >&2; exit 1; }
        compose exec -e PIWIGO_DB_PASSWORD -e PIWIGO_ADMIN_PASSWORD -e APP_EMAIL -e APP_DOMAIN piwigo sh -c '
          curl -fsS -o /dev/null http://localhost/install.php \
            --data-urlencode dbhost=piwigo-db \
            --data-urlencode dbuser=piwigo \
            --data-urlencode "dbpasswd=$PIWIGO_DB_PASSWORD" \
            --data-urlencode dbname=piwigo \
            --data-urlencode prefix=piwigo_ \
            --data-urlencode admin_name=admin \
            --data-urlencode "admin_pass1=$PIWIGO_ADMIN_PASSWORD" \
            --data-urlencode "admin_pass2=$PIWIGO_ADMIN_PASSWORD" \
            --data-urlencode "admin_mail=${APP_EMAIL:-admin@$APP_DOMAIN}" \
            --data-urlencode install=1'
        [ -e "$cfg" ] && installed || { echo "install.php did not complete" >&2; exit 1; }
        compose exec -e PIWIGO_DB_PASSWORD piwigo-db sh -c \
          'MYSQL_PWD="$PIWIGO_DB_PASSWORD" mariadb -upiwigo piwigo -e "UPDATE piwigo_config SET value=\"false\" WHERE param=\"allow_user_registration\""'
