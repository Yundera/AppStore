  # No `folders:`. Its only candidate, /DATA/AppData/spliit/pgdata, belongs to
  # spliit-db, which starts as root and whose image hands that directory to its
  # own user; chowning it to $PUID would leave the running database unable to
  # write there.
  secrets:
    # Seeded: an installed app's database was initialised with the former shared password.
    SPLIIT_DB_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
