  thumbnail: thumbnail.png
  tips:
    before_install:
      en_us: |
        Sign-in

        FileBrowser (root) is protected by your server's single sign-on (SSO) - the
        same account you use for the dashboard. It reuses that account instead of a
        password or login form of its own: open the app and you are already in, as
        its administrator.

        What this app can reach

        It mounts the server's whole filesystem read-write and runs as root. The tree
        you land on is the machine's own `/`: `/DATA` with your documents, downloads
        and media, `/DATA/AppData` with the databases, configuration and secrets of
        every other app installed here, and the system itself - `/etc`, `/var`,
        `/home`, `/root`, `/boot`. Nothing on this server is out of reach, and file
        permissions do not limit what it can write.

        That is the point of this app, and it is also how it breaks things. Editing
        or deleting the wrong file under `/etc`, `/var` or `/boot` can leave the
        machine unable to boot; files it creates are owned by root, which other apps
        may then be unable to write to; and there is no undo. Install it if you
        administer this server yourself. For documents, downloads and media, the
        standard FileBrowser app is the one to use - it stays inside `/DATA` and runs
        as your server user.

        Share links

        A link you create from the Share menu stays reachable without signing in to
        the server - the code in the link is what grants access, plus the optional
        password you can set on it. Here that link can point at any file on the
        machine, system files included, so check what you are sharing before you send
        it.
      ko_kr: |
        로그인

        FileBrowser (root)는 서버의 통합 로그인(SSO)으로 보호됩니다. 대시보드에서 사용하는
        것과 같은 계정이며, 별도의 비밀번호나 자체 로그인 화면 대신 그 계정을 그대로
        사용합니다. 앱을 열면 이미 관리자로 로그인된 상태입니다.

        이 앱이 접근할 수 있는 범위

        서버의 파일 시스템 전체를 읽기/쓰기로 마운트하며 root 권한으로 실행됩니다.
        처음 보이는 트리는 기기의 `/` 자체입니다. 문서, 다운로드, 미디어가 있는 `/DATA`,
        설치된 다른 모든 앱의 데이터베이스·설정·비밀 정보가 있는 `/DATA/AppData`,
        그리고 `/etc`, `/var`, `/home`, `/root`, `/boot` 같은 시스템 디렉터리까지
        포함됩니다. 이 서버에서 접근하지 못하는 곳은 없으며, 파일 권한도 쓰기를
        제한하지 않습니다.

        그것이 이 앱의 목적이자, 문제가 생기는 방식이기도 합니다. `/etc`, `/var`,
        `/boot`의 잘못된 파일을 수정하거나 삭제하면 기기가 부팅되지 않을 수 있고,
        이 앱이 만든 파일은 root 소유이므로 다른 앱이 쓰지 못할 수 있으며, 되돌릴 방법도
        없습니다. 직접 관리하는 서버에만 설치하세요. 문서·다운로드·미디어에는
        `/DATA` 안에서 서버 사용자 권한으로 동작하는 표준 FileBrowser 앱이 적합합니다.

        공유 링크

        공유 메뉴에서 만든 링크는 서버에 로그인하지 않아도 접근할 수 있습니다. 링크에
        포함된 코드가 접근 권한을 부여하며, 원한다면 비밀번호를 추가로 설정할 수 있습니다.
        이 앱에서는 시스템 파일을 포함해 기기의 어떤 파일도 링크 대상이 될 수 있으므로,
        보내기 전에 무엇을 공유하는지 반드시 확인하세요.
      zh_cn: |
        登录方式

        FileBrowser（root）由服务器的统一登录（SSO）保护，与你登录控制面板所用的是同一个
        账户。它直接沿用该账户，而不是单独的密码或自己的登录页面：打开应用即已以管理员
        身份登录。

        此应用可以访问的范围

        它以读写方式挂载服务器的整个文件系统，并以 root 身份运行。你看到的目录树就是机器
        本身的 `/`：包含文档、下载和媒体的 `/DATA`，保存着已安装的其他所有应用的数据库、
        配置和密钥的 `/DATA/AppData`，以及 `/etc`、`/var`、`/home`、`/root`、`/boot`
        等系统目录。这台服务器上没有它够不到的地方，文件权限也不会限制它的写入。

        这正是本应用的用途，也是它可能造成损坏的原因。修改或删除 `/etc`、`/var`、`/boot`
        下的错误文件可能导致机器无法启动；它创建的文件归 root 所有，其他应用可能因此无法
        写入；而且没有撤销功能。请仅在你自行管理的服务器上安装。若只需处理文档、下载和
        媒体，请使用标准的 FileBrowser 应用——它只在 `/DATA` 内操作，并以你的服务器用户
        身份运行。

        分享链接

        你在「分享」菜单中创建的链接无需登录服务器即可访问——链接中的代码就是访问凭证，
        你还可以为其另外设置密码。在本应用中，该链接可以指向机器上的任意文件，包括系统
        文件，因此发送前请确认你分享的究竟是什么。
      fr_fr: |
        Connexion

        FileBrowser (root) est protégé par l'authentification unique (SSO) de votre
        serveur — le même compte que pour le tableau de bord. L'application réutilise ce
        compte plutôt qu'un mot de passe ou un formulaire de connexion qui lui seraient
        propres : vous l'ouvrez et vous y êtes déjà, en tant qu'administrateur.

        Ce à quoi cette application a accès

        Elle monte l'intégralité du système de fichiers du serveur en lecture-écriture et
        s'exécute en tant que root. L'arborescence affichée est le `/` de la machine :
        `/DATA` avec vos documents, téléchargements et médias, `/DATA/AppData` avec les
        bases de données, configurations et secrets de toutes les autres applications
        installées, et le système lui-même — `/etc`, `/var`, `/home`, `/root`, `/boot`.
        Rien n'est hors de portée sur ce serveur, et les permissions de fichiers ne
        limitent pas ce qu'elle peut écrire.

        C'est l'objet même de cette application, et c'est aussi ainsi qu'elle casse les
        choses. Modifier ou supprimer le mauvais fichier dans `/etc`, `/var` ou `/boot`
        peut rendre la machine non amorçable ; les fichiers qu'elle crée appartiennent à
        root, et d'autres applications peuvent alors ne plus pouvoir y écrire ; et il n'y
        a pas d'annulation. Ne l'installez que si vous administrez vous-même ce serveur.
        Pour les documents, téléchargements et médias, utilisez l'application FileBrowser
        standard : elle reste dans `/DATA` et s'exécute sous votre utilisateur serveur.

        Liens de partage

        Un lien créé depuis le menu Partager reste accessible sans se connecter au
        serveur : c'est le code contenu dans le lien qui donne l'accès, plus le mot de
        passe facultatif que vous pouvez y ajouter. Ici, ce lien peut pointer vers
        n'importe quel fichier de la machine, y compris les fichiers système : vérifiez
        ce que vous partagez avant de l'envoyer.
      es_es: |
        Inicio de sesión

        FileBrowser (root) está protegido por el inicio de sesión único (SSO) de tu
        servidor, la misma cuenta que usas para el panel. La aplicación reutiliza esa
        cuenta en lugar de una contraseña o un formulario de acceso propios: abres la
        aplicación y ya estás dentro, como administrador.

        A qué puede acceder esta aplicación

        Monta todo el sistema de archivos del servidor en modo lectura-escritura y se
        ejecuta como root. El árbol que ves es la propia `/` de la máquina: `/DATA` con
        tus documentos, descargas y medios, `/DATA/AppData` con las bases de datos, la
        configuración y los secretos de todas las demás aplicaciones instaladas, y el
        sistema en sí — `/etc`, `/var`, `/home`, `/root`, `/boot`. Nada queda fuera de su
        alcance en este servidor, y los permisos de archivo no limitan lo que puede
        escribir.

        Ese es el propósito de esta aplicación, y también la forma en que puede romper
        cosas. Editar o borrar el archivo equivocado en `/etc`, `/var` o `/boot` puede
        dejar la máquina sin arrancar; los archivos que crea pertenecen a root, y otras
        aplicaciones pueden quedarse sin poder escribir en ellos; y no hay deshacer.
        Instálala solo si administras tú mismo este servidor. Para documentos, descargas
        y medios, usa la aplicación FileBrowser estándar: se queda dentro de `/DATA` y se
        ejecuta con tu usuario del servidor.

        Enlaces para compartir

        Un enlace creado desde el menú Compartir sigue siendo accesible sin iniciar
        sesión en el servidor: el código del enlace es lo que concede el acceso, más la
        contraseña opcional que puedes añadirle. Aquí ese enlace puede apuntar a
        cualquier archivo de la máquina, incluidos los del sistema, así que comprueba qué
        estás compartiendo antes de enviarlo.
  title:
    en_us: FileBrowser (root)
  index: /
  webui_port: 80

x-compose-app:
  schema_version: 2
  # Seeding the database needs filebrowser's own binary, so it stays a container —
  # but the container is declared, not shelled out to. The guard replaces the
  # `if [ ! -f ]` the hook opened with: `config init` refuses to overwrite an
  # existing database and used to abort the whole hook when it did.
  init:
    - name: init-db
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: config init --database /db/database.db
      when: absent:/DATA/AppData/$AppID/db/database.db
    - name: add-admin
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: ["users", "add", "admin", "$APP_DEFAULT_PASSWORD", "--perm.admin", "--database", "/db/database.db"]
      when: once
    # Hands authentication to the AppShield gate. `noauth` resolves every request to
    # user ID 1 — the `admin` seeded just above — so the app opens straight into the
    # UI with full rights and no second password, and never 302s to its own /login
    # (which the gate reserves and would answer with its own page).
    #
    # It has to be `config set`: the CLI's --noauth flag only applies to first-run
    # quick setup and is not persistent, and the setting lives in the bolt database,
    # not in an env var.
    #
    # `once`, not `always`, on purpose. The step name is new, so an existing install
    # has no `.init/set-noauth` marker and picks this up on its next install-from-store;
    # afterwards it is skipped, which is what keeps it off the restart path — bolt takes
    # an exclusive lock, and a pre_up step that fails against a still-running container
    # is fatal to the whole converge.
    - name: set-noauth
      image: filebrowser/filebrowser:v2.63.23
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/$AppID/db:/db
      command: ["config", "set", "--auth.method=noauth", "--database", "/db/database.db"]
      when: once
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  #
  # NOTE for whoever re-runs it: the backend's second bind mount is the host root
  # (`source: /`). It must NEVER appear here — a generated `- path: /` entry would
  # have Maison chown the whole filesystem to $PUID:$PGID before every start and
  # destroy the machine. Only the db directory belongs in this block.
  folders:
    - path: /DATA/AppData/$AppID/db
      user: $PUID
      group: $PGID
  webui-host: filebrowserroot-${domain}
