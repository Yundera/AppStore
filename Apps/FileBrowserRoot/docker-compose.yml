name: filebrowserroot
services:
  # AppShield SSO gate — the only publicly reachable service. FileBrowser has no
  # OIDC of its own and never will (upstream archived the project on 2026-09-01
  # with the OIDC request, filebrowser/filebrowser#1328, closed unimplemented), so
  # the gate is what puts this app behind SSO.
  filebrowserroot:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: filebrowserroot
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: filebrowserroot
    restart: unless-stopped
    environment:
      BACKEND_HOST: "filebrowserroot-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # FileBrowser's share links are anonymous by design — the hash in the URL is
      # the credential, and the share can carry its own password on top. Behind an
      # unqualified gate every one of them would 302 to the SSO login and the
      # feature would be silently dead, so its three prefixes are exempted:
      #   share/       the share landing page (SPA route)
      #   api/public/  the endpoints that page calls (/api/public/share, /api/public/dl)
      #   static/      the JS/CSS that page loads
      # Prefix-matched, comma-separated, no leading slash. Nothing here reaches the
      # authenticated API: /api/resources, /api/users and /api/settings stay gated.
      ALLOWED_PATHS: "share/,api/public/,static/"
      # This is a file manager: uploads are the point. 0 = unlimited, which is the
      # image default today — pinned so a future default cannot cap uploads silently.
      CLIENT_MAX_BODY_SIZE: "0"
    expose:
      - 80
    labels:
      caddy_0: filebrowserroot-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: filebrowserroot-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: filebrowserroot-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - filebrowserroot-backend
    networks:
      # On `pcs` because Caddy and auth-registrar must reach it, and on the app's
      # own network because that is where its backend lives.
      - pcs
      - filebrowserroot-internal
    cpu_shares: 80
    deploy:
      resources:
        limits:
          memory: 128M

  filebrowserroot-backend:
    container_name: filebrowserroot-backend
    # root, deliberately: this app exists to reach files the server user cannot —
    # root-owned app data, system configuration, another container's volume. Running
    # as $PUID:$PGID would give exactly the standard FileBrowser app, which is the
    # one to install if that is what you want. Two consequences, both documented in
    # rationale.md: everything this app creates is owned by root, and a mistake made
    # in it is a mistake made as root. (The image itself declares USER=1000, so this
    # line is what actually makes the difference — without it the container would run
    # as uid 1000 and most of the tree above would be unreadable.)
    user: 0:0
    environment:
      TZ: $TZ
      FB_DATABASE: /db/database.db
    image: filebrowser/filebrowser:v2.63.23
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/$AppID/db/
        target: /db/
      # The host's entire filesystem, read-write, as the browsing root. `/` is the
      # Docker host's root — not this container's — so /etc, /var, /home, /root and
      # every mount under them (including /DATA) are all reachable from one tree.
      # This is the app: the point of the (root) variant is that nothing is out of
      # scope. Bind mounts are recursive, so /proc, /sys and /dev show up too;
      # browsing them is harmless, searching from `/` walks them and is slow.
      - type: bind
        source: /
        target: /srv/
    expose:
      - 80
    # No Caddy labels and NOT on `pcs`: with its own auth turned off (see the
    # set-noauth init step) this container is unauthenticated, so the gate must be
    # the only path to it. `filebrowserroot-internal` is what enforces that — on `pcs`
    # any other app on the server could reach it directly.
    networks:
      - filebrowserroot-internal
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 256M
    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: Timezone used for the file timestamps shown in the interface.
        - container: FB_DATABASE
          description:
            en_us: Path to the FileBrowser database inside the container. Stored on the /db volume.
      volumes:
        - container: /db/
          description:
            en_us: FileBrowser's own database - permissions, shares and settings. Kept across uninstall and reinstall.
        - container: /srv/
          description:
            en_us: The server's entire filesystem - /DATA and every system directory alongside it (/etc, /var, /home, /root). This is everything FileBrowser can browse, edit, delete and share, as root, so anyone who passes the server login can reach all of it.

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  filebrowserroot-internal:
    name: filebrowserroot-internal

x-casaos:
  architectures:
    - amd64
    - arm64
  main: filebrowserroot
  category: Cloud
  tags: ["files", "developer"]
  description:
    en_us: |
      FileBrowser (root) - the whole server, in one file manager

      This is the administrator's variant of FileBrowser. It opens on the server's own root directory and runs as root, so every file on the machine is in scope: /DATA alongside /etc, /var, /home, /root and every other app's data. You can read, edit, rename, move, delete, upload and download all of it from the browser, on desktop or mobile.

      That is what it is for. Repair a configuration file an app will no longer start without, recover something out of another app's data directory, inspect a log, drop a file where only root can write - the jobs that need a shell, done in a file explorer instead.

      It is the same FileBrowser interface, with the same editor, previews, drag-and-drop uploads and share links; only the scope and the privileges are different. For everyday files - documents, downloads, media - install the standard FileBrowser app, which stays inside /DATA and runs as your server user.

      This app can break the server. Deleting or editing the wrong file under /etc, /var or /boot as root can leave the machine unbootable, and there is no undo and no confirmation beyond the usual one. Install it if you administer this server yourself, and treat it as a root shell with a nicer interface - because that is what it is.
    zh_cn: |
      FileBrowser（root）- 用一个文件管理器管理整台服务器

      这是 FileBrowser 的管理员版本。它以服务器的根目录为起点，并以 root 身份运行，因此机器上的每一个文件都在可操作范围内：不仅是 /DATA，还包括 /etc、/var、/home、/root 以及其他所有应用的数据。你可以在浏览器中（电脑或手机）读取、编辑、重命名、移动、删除、上传和下载这些文件。

      它正是为此而生：修复某个应用无法启动所依赖的配置文件、从另一个应用的数据目录中找回文件、查看日志、把文件放到只有 root 才能写入的位置——这些原本需要命令行的工作，现在可以在文件管理器中完成。

      界面与 FileBrowser 完全相同：同样的编辑器、预览、拖拽上传和分享链接；不同的只是可访问范围和权限。日常文件（文档、下载、媒体）请安装标准的 FileBrowser 应用，它只在 /DATA 内操作，并以你的服务器用户身份运行。

      本应用可能损坏服务器。以 root 身份误删或误改 /etc、/var、/boot 下的文件，可能导致系统无法启动，并且除常规确认外没有撤销机制。请仅在你自行管理的服务器上安装，并把它当作一个界面更友好的 root 终端来对待——它本质上就是如此。
    fr_fr: |
      FileBrowser (root) - tout le serveur, dans un seul gestionnaire de fichiers

      Voici la variante « administrateur » de FileBrowser. Elle s'ouvre sur la racine du serveur et s'exécute en tant que root : tous les fichiers de la machine sont donc accessibles, /DATA comme /etc, /var, /home, /root et les données de toutes les autres applications. Vous pouvez les lire, les modifier, les renommer, les déplacer, les supprimer, les téléverser et les télécharger depuis le navigateur, sur ordinateur comme sur mobile.

      C'est précisément son usage : réparer un fichier de configuration sans lequel une application ne démarre plus, récupérer quelque chose dans le répertoire de données d'une autre application, consulter un journal, déposer un fichier là où seul root peut écrire — des tâches de ligne de commande, faites dans un explorateur de fichiers.

      C'est la même interface FileBrowser, avec le même éditeur, les mêmes aperçus, le même téléversement par glisser-déposer et les mêmes liens de partage ; seuls la portée et les privilèges changent. Pour les fichiers du quotidien — documents, téléchargements, médias — installez l'application FileBrowser standard, qui reste dans /DATA et s'exécute sous votre utilisateur serveur.

      Cette application peut casser le serveur. Supprimer ou modifier le mauvais fichier dans /etc, /var ou /boot en tant que root peut rendre la machine non amorçable, sans annulation possible et sans autre confirmation que l'habituelle. Ne l'installez que si vous administrez vous-même ce serveur, et considérez-la comme un shell root doté d'une belle interface — car c'est ce qu'elle est.
    ko_kr: |
      FileBrowser (root) - 서버 전체를 하나의 파일 관리자로

      FileBrowser의 관리자용 버전입니다. 서버의 루트 디렉터리에서 시작하며 root 권한으로 실행되므로, /DATA는 물론 /etc, /var, /home, /root와 다른 모든 앱의 데이터까지 이 기기의 모든 파일을 다룰 수 있습니다. 데스크탑이든 모바일이든 브라우저에서 읽기, 편집, 이름 변경, 이동, 삭제, 업로드, 다운로드가 가능합니다.

      바로 그것이 이 앱의 목적입니다. 앱이 시작되지 않는 원인인 설정 파일 수정, 다른 앱의 데이터 디렉터리에서 파일 복구, 로그 확인, root만 쓸 수 있는 위치에 파일 배치 등 원래 셸이 필요했던 작업을 파일 탐색기에서 처리합니다.

      인터페이스는 FileBrowser와 동일합니다. 편집기, 미리보기, 드래그 앤 드롭 업로드, 공유 링크까지 모두 같고 접근 범위와 권한만 다릅니다. 문서, 다운로드, 미디어 같은 일상적인 파일에는 /DATA 안에서 서버 사용자 권한으로 동작하는 표준 FileBrowser 앱을 설치하세요.

      이 앱은 서버를 망가뜨릴 수 있습니다. root 권한으로 /etc, /var, /boot의 잘못된 파일을 삭제하거나 수정하면 기기가 부팅되지 않을 수 있으며, 일반적인 확인 절차 외에 되돌릴 방법이 없습니다. 직접 관리하는 서버에만 설치하고, 보기 좋은 인터페이스를 갖춘 root 셸이라고 생각하고 다루세요. 실제로 그렇습니다.
    ar_sa: متصفح الملفات (root) - متصفح ملفات عبر الويب يعمل بصلاحيات الجذر على نظام ملفات الخادم بأكمله.
    de_de: Datei Browser (root) - Webbasierter Datei Browser, der als root auf dem gesamten Dateisystem des Servers läuft.
    es_es: File Browser (root) - Navegador de archivos web que se ejecuta como root sobre todo el sistema de archivos del servidor.
    hu_hu: File Browser (root) - Webes fájlböngésző, amely rootként fut a szerver teljes fájlrendszerén.
    it_it: File Browser (root) - Browser di file via web che gira come root sull’intero filesystem del server.
    ru_ru: File Browser (root) - веб-браузер файлов, работающий от имени root по всей файловой системе сервера.
    pl_pl: File Browser (root) - przeglądarka plików w przeglądarce działająca jako root na całym systemie plików serwera.
    pt_br: File Browser (root) - Navegador de arquivos web que roda como root em todo o sistema de arquivos do servidor.
    sv_se: File Browser (root) - Webbaserad filbläddrare som körs som root på hela serverns filsystem.
    uk_ua: File Browser (root) - веб-браузер файлів, що працює від імені root на всій файловій системі сервера.
  developer: File Browser
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  tagline:
    en_us: The whole server in a file manager - browse and edit every file on the machine, as root.
    zh_cn: 用文件管理器管理整台服务器 - 以 root 身份浏览和编辑机器上的每一个文件。
    ar_sa: الخادم بأكمله في مدير ملفات - تصفح وحرّر كل ملف على الجهاز بصلاحيات الجذر.
    de_de: Der ganze Server in einem Dateimanager - jede Datei der Maschine als root ansehen und bearbeiten.
    es_es: Todo el servidor en un gestor de archivos - explora y edita cada archivo de la máquina como root.
    fr_fr: Tout le serveur dans un gestionnaire de fichiers - parcourez et modifiez chaque fichier de la machine, en root.
    hu_hu: A teljes szerver egy fájlkezelőben - böngéssze és szerkessze a gép minden fájlját rootként.
    it_it: L’intero server in un file manager - sfoglia e modifica ogni file della macchina, come root.
