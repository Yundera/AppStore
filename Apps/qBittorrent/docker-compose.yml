name: qbittorrent

services:
  qbittorrent:
    user: $PUID:$PGID
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    restart: unless-stopped
    expose:
      - 80
    labels:
      caddy_0: qbittorrent-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: qbittorrent-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: qbittorrent-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      - pcs
    # Uncomment the ports section if you want to expose the service on specific ports
    #ports:
    #  - 6881:6881
    #  - 6881:6881/udp
    environment:
      TZ: $TZ
      WEBUI_PORT: 80
      TORRENTING_PORT: 6881
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/qbittorrent/config/:/config
      - ${DATA_ROOT:-/DATA}/Downloads/:/downloads
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  main: qbittorrent
  webui_port: 80
  tips:
    before_install:
      en_us: |
        Login : `admin`
        Password : `$APP_DEFAULT_PASSWORD`
        The download directory is `/DATA/Downloads`
        $APP_DEFAULT_PASSWORD
  architectures:
    - amd64
    - arm64
  author: Yundera Team
  category: Downloader
  tags: ["files", "personal"]
  developer: qBittorrent Project
  description:
    en_us: qBittorrent is a cross-platform free and open-source BitTorrent client with a clean, simple interface and powerful features including sequential downloading, bandwidth scheduling, and RSS feed support.
    fr_fr: qBittorrent est un client BitTorrent multiplateforme gratuit et open-source avec une interface propre et simple et des fonctionnalités puissantes incluant le téléchargement séquentiel, la planification de bande passante et le support des flux RSS.
    es_es: qBittorrent es un cliente BitTorrent multiplataforma gratuito y de código abierto con una interfaz limpia y simple y características poderosas incluyendo descarga secuencial, programación de ancho de banda y soporte de feeds RSS.
    zh_cn: qBittorrent是一个跨平台的免费开源BitTorrent客户端，具有简洁的界面和强大的功能，包括顺序下载、带宽调度和RSS源支持。
    ko_kr: qBittorrent는 깔끔하고 간단한 인터페이스와 순차 다운로드, 대역폭 스케줄링, RSS 피드 지원을 포함한 강력한 기능을 가진 크로스 플랫폼 무료 오픈소스 BitTorrent 클라이언트입니다.
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  index: /
  tagline:
    en_us: Powerful BitTorrent client with advanced features for managing your downloads efficiently and securely.
    fr_fr: Client BitTorrent puissant avec des fonctionnalités avancées pour gérer vos téléchargements efficacement et en sécurité.
    es_es: Potente cliente BitTorrent con características avanzadas para gestionar tus descargas de manera eficiente y segura.
    zh_cn: 功能强大的BitTorrent客户端，具有高级功能，可高效安全地管理您的下载。
    ko_kr: 다운로드를 효율적이고 안전하게 관리할 수 있는 고급 기능을 갖춘 강력한 BitTorrent 클라이언트입니다.
  title:
    en_us: qBittorrent
  store_app_id: qbittorrent
  is_uncontrolled: false

x-compose-app:
  schema_version: 2
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/qbittorrent/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/qbittorrent/config/qBittorrent
      user: $PUID
      group: $PGID
    - path: /DATA/Downloads
      user: $PUID
      group: $PGID
  # Seeding the config needs the seeder image, so it stays a container — declared,
  # not shelled out to. The directory it writes into is declared under folders
  # above, which is what the hook's `mkdir -p` was doing.
  init:
    - name: seed-config
      image: ghcr.io/worph/qbittorrent-config:1.0.2
      # Writes qBittorrent.conf as $PUID:$PGID, matching the user: the service
      # runs as — a root-owned conf/lock file is what stopped qBittorrent from
      # ever opening its WebUI.
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/qbittorrent/config/qBittorrent:/output
      environment:
        QB_USERNAME: admin
        QB_PASSWORD: ${APP_DEFAULT_PASSWORD}
      # Keyed on the config file itself, not on `once`: the `once` marker lives
      # with the compose, which is removed by an uninstall-keep-data, so a
      # reinstall would re-run the seeder and reset the WebUI password and every
      # preference the user had changed.
      when: absent:/DATA/AppData/qbittorrent/config/qBittorrent/qBittorrent.conf
    # The seeder image writes `WebUI\CSRFProtection=false` unconditionally and
    # offers no switch for it. qBittorrent's Origin/Referer check compares host
    # and port only (scheme is explicitly not compared) and honours
    # X-Forwarded-Host, so it is satisfied by the Caddy routes as shipped — the
    # flag is not a reverse-proxy workaround, and off it leaves a cross-site POST
    # to /api/v2/app/setPreferences (which can set autorun_program) with nothing
    # but the browser's SameSite default in front of it. Turn it back on once,
    # then leave the user's preferences alone.
    - name: enable-csrf-protection
      image: busybox:1.37.0
      user: $PUID:$PGID
      volumes:
        - /DATA/AppData/qbittorrent/config/qBittorrent:/output
      command: ["sh", "-c", "sed -i 's/CSRFProtection=false/CSRFProtection=true/' /output/qBittorrent.conf; touch /output/.csrf-protection-enabled"]
      when: absent:/DATA/AppData/qbittorrent/config/qBittorrent/.csrf-protection-enabled
  webui-host: qbittorrent-${domain}
