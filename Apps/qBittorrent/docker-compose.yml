    - arm64
  tips:
    en_us: "\U0001F510 **Protected by your server account (single sign-on).** qBittorrent sits\nbehind the SSO gate, so your existing server login is the only password you\nneed — open the tile and you are already signed in. The WebUI's own login is\nbypassed for clients on the server's internal network, which is the only\nplace it can be reached from.\n\n\U0001F4C2 Downloads land in `/DATA/Downloads`; settings live in\n`/DATA/AppData/qbittorrent/`.\n\n\U0001F517 **Wire it into the media stack.** Add it as a *Download Client* in\n**Radarr**, **Sonarr** or **Lidarr** with host `qbittorrent-backend` and\nport `80` — that is the app's own container, reached directly on the\nserver's internal network. The name `qbittorrent` is the SSO gate and will\nnot answer the API. Leave the username and password blank, or use\n`admin` and the password shown in the tile menu → Credentials; either works.\n\n\U0001F4E1 **Incoming peer connections are off by default.** qBittorrent dials out\nto peers on its own, so downloads work as installed. To also accept\nincoming peers — usually faster, and what seeding needs — uncomment the\n`ports:` block in the compose file. That publishes port `6881` (TCP and\nUDP) to the internet, reachable without authentication.\n"
  # The WebUI login seeded into qBittorrent.conf (see seed-config below). Seeded
  # from the box-wide password it replaces: the conf is only written once, so an
  # installed app's WebUI already holds the old value, and showing that is what
  # keeps the displayed credential true. A fresh install gets its own.
  secrets:
    QBITTORRENT_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: WebUI / download-client login
      username: admin
      password: ${QBITTORRENT_ADMIN_PASSWORD}
      note:
        en_us: Not needed in the browser (single sign-on). For Radarr, Sonarr or Lidarr, leave it blank or use this.
      # A hook, not env: the password is a PBKDF2 hash in qBittorrent.conf, which
      # seed-config writes only while the file is absent, and qBittorrent keeps
      # its preferences in memory and rewrites the file itself. The hook goes
      # through the WebUI API in the running backend: sign in over loopback with
      # the old password (the subnet whitelist does not cover 127.0.0.1), set the
      # new one, then sign in with it to prove it took.
      change:
        apply: script
        script: |
          compose exec -e OLD_QBITTORRENT_ADMIN_PASSWORD -e QBITTORRENT_ADMIN_PASSWORD \
            qbittorrent-backend sh -c '
            [ -n "$QBITTORRENT_ADMIN_PASSWORD" ] || exit 1
            jar=$(mktemp) || exit 1
            trap "rm -f $jar" EXIT
            api=http://127.0.0.1:80/api/v2
            login() {
              curl -fsS -c "$jar" --data-urlencode username=admin \
                --data-urlencode "password=$1" "$api/auth/login" | grep -qx "Ok."
            }
            login "$OLD_QBITTORRENT_ADMIN_PASSWORD" &&
            curl -fsS -b "$jar" -o /dev/null "$api/app/setPreferences" \
              --data-urlencode "json={\"web_ui_password\":\"$QBITTORRENT_ADMIN_PASSWORD\"}" &&
            login "$QBITTORRENT_ADMIN_PASSWORD"'
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/qbittorrent/config
      user: $PUID
      group: $PGID
      # Reclaim a tree an earlier root-running install left behind: the backend
      # now drops to $PUID:$PGID and dies on an unwritable /config otherwise.
      recursive: true
    - path: /DATA/AppData/qbittorrent/config/qBittorrent
      user: $PUID
      group: $PGID
    - path: /DATA/Downloads
      user: $PUID
      group: $PGID
  # Seeding the config needs the seeder image, so it runs as a one-shot container.
  # The directory it writes into is declared under folders above.
  steps:
    # Writes qBittorrent.conf as $PUID:$PGID, matching the user: the service runs
    # as — a root-owned conf/lock file is what stopped qBittorrent from ever opening
    # its WebUI.
    #
    # Guarded on the config file itself, not on `run: once`: the `once` marker lives
    # with the compose, which is removed by an uninstall-keep-data, so a reinstall
    # would re-run the seeder and reset the WebUI password and every preference the
    # user had changed.
    - name: seed-config
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/config/qBittorrent/qBittorrent.conf" ] && exit 0
        docker run --rm --user "$PUID:$PGID" -v "$APP_DIR/config/qBittorrent:/output" \
          -e QB_USERNAME=admin -e QB_PASSWORD="$QBITTORRENT_ADMIN_PASSWORD" \
          ghcr.io/worph/qbittorrent-config:1.0.2
    # The seeder image writes `WebUI\CSRFProtection=false` unconditionally and
    # offers no switch for it. Off, it leaves a cross-site POST to
    # /api/v2/app/setPreferences (which can set autorun_program, i.e. arbitrary
    # command execution on the host container) with nothing but the browser's
    # SameSite default in front of it, so it is turned back on here — once, then
    # the user's preferences are left alone.
    #
    # It is still worth turning on with the SSO gate in front, because the gate is
    # a session cookie: a cross-site write that arrives with that cookie attached
    # reaches the backend, and qBittorrent's own Origin check is what rejects it.
    #
    # What the check costs. qBittorrent compares host and port only (scheme is
    # explicitly not compared) and honours X-Forwarded-Host, so every same-origin
    # request the WebUI itself makes is satisfied by the routes as shipped.
    # What it also rejects is the *cross-site navigation* that lands on the app —
    # the dashboard tile, and the redirect back from the SSO round trip, both of
    # which carry a foreign Referer. The check runs before authentication, so
    # bypassing the WebUI login below does not exempt it. That single entry
    # request — and only it — is unpicked by the app's own router in front of the
    # gate; cross-site mutating requests still carry their Origin
    # and are still rejected here.
    - name: enable-csrf-protection
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/config/qBittorrent/.csrf-protection-enabled" ] && exit 0
        docker run --rm --user "$PUID:$PGID" -v "$APP_DIR/config/qBittorrent:/output" \
          busybox:1.37.0 sh -c "sed -i 's/CSRFProtection=false/CSRFProtection=true/' /output/qBittorrent.conf; touch /output/.csrf-protection-enabled"
    # Bypass the WebUI's own login for clients on the Docker private ranges — which
    # is the only place the backend can be reached from, since it is not
    # routed and publishes no HTTP port. The SSO gate becomes the single gate, so
    # the tile opens straight into the UI instead of asking for a second password
    # after the server login. `WebUI\Username`/`Password_PBKDF2` are left seeded, so
    # a user who sets AuthSubnetWhitelistEnabled back to false has a known password
    # to log in with, and the *arr download-client integrations keep working whether
    # they send credentials or not.
    #
    # awk, not `sed a`, because the keys contain a literal backslash that the two
    # sed implementations treat differently in append text. Existing keys are
    # dropped first so the step is idempotent, and the insert is anchored on the
    # [Preferences] header rather than appended, because once qBittorrent has run
    # it rewrites the file with [Preferences] in the middle of several sections.
    - name: bypass-webui-login
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/config/qBittorrent/.sso-login-bypass" ] && exit 0
        docker run --rm -i --user "$PUID:$PGID" -v "$APP_DIR/config/qBittorrent:/output" \
          busybox:1.37.0 sh -s <<'SH'
        set -e
        awk '
          /^WebUI\\AuthSubnetWhitelist/ { next }
          { print }
          /^\[Preferences\]/ {
            print "WebUI\\AuthSubnetWhitelistEnabled=true"
            print "WebUI\\AuthSubnetWhitelist=172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16"
          }
        ' /output/qBittorrent.conf > /output/qBittorrent.conf.new
        mv /output/qBittorrent.conf.new /output/qBittorrent.conf
        touch /output/.sso-login-bypass
        SH
