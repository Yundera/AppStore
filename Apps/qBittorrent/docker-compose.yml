name: qbittorrent

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── AppShield SSO gate ─────────────────────────────────────────────
  # The only publicly reachable service: it is the routed service, and the
  # qBittorrent WebUI behind it has none. AppShield (ghcr.io/yundera/appshield)
  # runs in OIDC mode — the presence of OIDC_REGISTRAR_URL makes it self-register
  # with the PCS auth-registrar on first login and send every request through the
  # built-in Authelia SSO before proxying to the backend.
  qbittorrent:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: qbittorrent
    # OIDC identity: AppShield builds its OIDC redirect URIs from os.hostname(),
    # and the auth-registrar attests this app's name via the container's PTR
    # record — both container_name and hostname must equal the app name, or Docker
    # names the container after its random ID, AppShield derives
    # `<container-id>-${APP_DOMAIN}`, and Dex rejects the authorize call with
    # 400 'Unregistered redirect_uri' so no page ever renders.
    hostname: qbittorrent
    restart: unless-stopped
    expose:
      - 80
    environment:
      # The app's own router, not the WebUI: it fixes the tile's first request
      # before qBittorrent sees it (see qbittorrent-router below).
      BACKEND_HOST: "qbittorrent-router"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # Presence of OIDC_REGISTRAR_URL enables OIDC (Authelia SSO) mode.
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # "Add torrent file" POSTs the .torrent through the gate. A big multi-file
      # torrent is a few MB, and nginx's own default would cap the body at 1m and
      # answer 413, so the limit is raised here rather than left to the image.
      CLIENT_MAX_BODY_SIZE: "64m"
      # No ALLOWED_PATHS: nothing in this app is meant to be reachable without a
      # session. The WebUI has no share links and no public API.
    depends_on:
      - qbittorrent-router
    networks:
      - pcs
      - qbittorrent-net
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

  # ── qBittorrent WebUI + engine (protected) ─────────────────────────
  # Not routed: the WebUI is reachable from the internet only through the
  # gate above. It stays on `pcs` (rather than an app-private network) because
  # sibling apps talk to it directly — Radarr/Sonarr/Lidarr add it as a download
  # client at `qbittorrent-backend:80`. That path is container-to-container and
  # never leaves the host. The bare name `qbittorrent` belongs to the SSO gate and
  # will not serve the API; do NOT give it back to this service, because Docker
  # registers both the service key and the container_name in its embedded DNS, so
  # two containers claiming `qbittorrent` round-robin between them.
  qbittorrent-backend:
    user: $PUID:$PGID
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent-backend
    restart: unless-stopped
    expose:
      - 80
    networks:
      - pcs
      - qbittorrent-net
    # BitTorrent peer + DHT traffic on 6881 (matching TORRENTING_PORT below). Not
    # HTTP, so neither the router nor the gate can carry it — reaching it means
    # publishing it to the host. Shipped commented out because the client is usable
    # without it: qBittorrent still dials out to peers, so downloads work.
    # Uncomment to also accept incoming peers, which is faster and is what seeding
    # needs; that makes 6881 reachable from the internet with no authentication in
    # front of it. Called out in tips.before_install so the user knows what this
    # buys before installing.
    #ports:
    #  - 6881:6881
    #  - 6881:6881/udp
    environment:
      TZ: $TZ
      WEBUI_PORT: 80
      TORRENTING_PORT: 6881
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/qbittorrent/config/:/config
      - ${DATA_ROOT:-/DATA}/Downloads/:/downloads
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ── The app's own router, between the gate and the WebUI ───────────
  # The dashboard tile links here from another host, so the browser sends
  # `Referer: https://<dashboard>/` on that first navigation — and after the SSO
  # round trip it sends the auth origin's. Either way it is a foreign host.
  # qBittorrent's cross-site check (WebApplication::processRequest →
  # isCrossSiteRequest) answers 401 "Unauthorized" — not the WebUI — whenever
  # CSRF protection is on and the Referer/Origin host differs from the served
  # host. The check runs *before* authentication and is not skipped for
  # whitelisted clients, so it bites even with the WebUI's own login bypassed
  # (see the subnet whitelist in the bypass-webui-login step below). Chrome replays
  # the referrer on reload, so the tile would be a dead end until the URL is retyped.
  #
  # Fix: drop Referer and Origin for exactly the request the tile issues — GET,
  # path "/", Sec-Fetch-Mode: navigate — and for nothing else. A cross-site GET
  # of "/" changes nothing and the attacker cannot read the response, so nothing
  # is given up here; every mutating request is an XHR to /api/v2/* with
  # Sec-Fetch-Mode: cors, keeps its Origin, and stays covered by qBittorrent's own
  # check. Stripping the two headers globally would instead be equivalent to
  # turning CSRF protection back off. The gate passes these headers through
  # unchanged, so this sees exactly what the browser sent. See rationale.md.
  # On the app's own network only: the gate is the one way in.
  qbittorrent-router:
    image: nginx:1.31.8-alpine
    container_name: qbittorrent-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: qbittorrent-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - qbittorrent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  qbittorrent-net:
    name: qbittorrent-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  qbittorrent-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      # The tile's navigation: GET of "/" with Sec-Fetch-Mode: navigate.
      map "$$request_method $$uri $$http_sec_fetch_mode" $$tilenav { "GET / navigate" 1; default 0; }
      # An empty value makes nginx drop the header.
      map $$tilenav $$fwd_referer { 1 ""; default $$http_referer; }
      map $$tilenav $$fwd_origin  { 1 ""; default $$http_origin; }

      server {
        listen 80;
        absolute_redirect off;

        # The gate caps uploads (CLIENT_MAX_BODY_SIZE); nothing to add here.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_http_version 1.1;
        # The gate already set these from the real client; pass them on as they are.
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$http_x_real_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_x_forwarded_host;
        proxy_set_header Referer $$fwd_referer;
        proxy_set_header Origin $$fwd_origin;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$webui qbittorrent-backend:80;

        location = /_router/health { access_log off; return 204; }
        location / { proxy_pass http://$$webui; }
      }

x-casaos:
  main: qbittorrent
  webui_port: 80
  tips:
    before_install:
      en_us: |
        🔐 **Protected by your server account (single sign-on).** qBittorrent sits
        behind the SSO gate, so your existing server login is the only password you
        need — open the tile and you are already signed in. The WebUI's own login is
        bypassed for clients on the server's internal network, which is the only
        place it can be reached from.

        📂 Downloads land in `/DATA/Downloads`; settings live in
        `/DATA/AppData/qbittorrent/`.

        🔗 **Wire it into the media stack.** Add it as a *Download Client* in
        **Radarr**, **Sonarr** or **Lidarr** with host `qbittorrent-backend` and
        port `80` — that is the app's own container, reached directly on the
        server's internal network. The name `qbittorrent` is the SSO gate and will
        not answer the API. Leave the username and password blank, or use
        `admin` and the password shown in the tile menu → Credentials; either works.

        📡 **Incoming peer connections are off by default.** qBittorrent dials out
        to peers on its own, so downloads work as installed. To also accept
        incoming peers — usually faster, and what seeding needs — uncomment the
        `ports:` block in the compose file. That publishes port `6881` (TCP and
        UDP) to the internet, reachable without authentication.
  architectures:
    - amd64
    - arm64
  category: Downloader
  tags: ["files", "personal"]
  developer: qBittorrent Project
  description:
    en_us: qBittorrent is a cross-platform free and open-source BitTorrent client with a clean, simple interface and powerful features including sequential downloading, bandwidth scheduling, and RSS feed support. The web interface is fronted by the built-in single sign-on, so it opens with your server account and no second password.
    fr_fr: qBittorrent est un client BitTorrent multiplateforme gratuit et open-source avec une interface propre et simple et des fonctionnalités puissantes incluant le téléchargement séquentiel, la planification de bande passante et le support des flux RSS. L'interface web est protégée par l'authentification unique intégrée, et s'ouvre avec votre compte serveur, sans second mot de passe.
    es_es: qBittorrent es un cliente BitTorrent multiplataforma gratuito y de código abierto con una interfaz limpia y simple y características poderosas incluyendo descarga secuencial, programación de ancho de banda y soporte de feeds RSS. La interfaz web está protegida por el inicio de sesión único integrado, así que se abre con tu cuenta del servidor y sin una segunda contraseña.
    zh_cn: qBittorrent是一个跨平台的免费开源BitTorrent客户端，具有简洁的界面和强大的功能，包括顺序下载、带宽调度和RSS源支持。网页界面由内置的单点登录保护，使用您的服务器账号即可打开，无需第二个密码。
    ko_kr: qBittorrent는 깔끔하고 간단한 인터페이스와 순차 다운로드, 대역폭 스케줄링, RSS 피드 지원을 포함한 강력한 기능을 가진 크로스 플랫폼 무료 오픈소스 BitTorrent 클라이언트입니다. 웹 인터페이스는 내장 싱글 사인온으로 보호되어 서버 계정으로 바로 열리며 두 번째 비밀번호가 필요하지 않습니다.
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  index: /
  tagline:
    en_us: Powerful BitTorrent client with advanced features for managing your downloads efficiently and securely.
    fr_fr: Client BitTorrent puissant avec des fonctionnalités avancées pour gérer vos téléchargements efficacement et en sécurité.
    es_es: Potente cliente BitTorrent con características avanzadas para gestionar tus descargas de manera eficiente y segura.
    zh_cn: 功能强大的BitTorrent客户端，具有高级功能，可高效安全地管理您的下载。
    ko_kr: 다운로드를 효율적이고 안전하게 관리할 수 있는 고급 기능을 갖춘 강력한 BitTorrent 클라이언트입니다.
  title:
    en_us: qBittorrent
  store_app_id: qbittorrent
  is_uncontrolled: false

x-compose-app:
  schema_version: 2
  version: "5.3.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: qbittorrent, name: qbittorrent, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: qbittorrent
  title:
    en_us: qBittorrent
  tagline:
    en_us: Powerful BitTorrent client with advanced features for managing your downloads efficiently and securely.
    fr_fr: Client BitTorrent puissant avec des fonctionnalités avancées pour gérer vos téléchargements efficacement et en sécurité.
