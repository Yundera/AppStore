name: samba
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  samba:
    container_name: samba
    image: dockurr/samba:4.23.10
    network_mode: bridge
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    user: 0:0  # Run as root for full permissions

    # Needed for FUSE support
    cap_add:
       - SYS_ADMIN
    devices:
       - /dev/fuse

    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NAME: "DATA"
      USER: "admin"
      PASS: ${SAMBA_ADMIN_PASSWORD}
      UID: $PUID
      GID: $PGID
      RW: "true"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}
        target: /storage
        bind:
          # Needed for FUSE support
          propagation: rslave
    # No ports: on purpose. SMB is not HTTP, so the router cannot carry it and the share
    # is reachable only through a port the owner publishes in the app's override
    # (Settings > Override > Ports), on the address they choose: a VPN address
    # (10.9.0.1, Tailscale 100.x), a LAN address, or 0.0.0.0. See the tips.
    deploy:
      resources:
        limits:
          memory: 256M

x-casaos:

  # Headless app: SMB/CIFS on 445, no web UI of its own, so there is deliberately no
  # scheme/hostname/port_map/index and the tile gets no open action. These keys used
  # to send the tile to doc/index.html rendered through raw.githack.com on a
  # hardcoded branch, so it served whatever that branch happened to contain instead
  # of the doc that ships with this ref. There is no branch-free form of that URL;
  # the connection details a user needs are in tips.before_install below, and
  # doc/index.html still ships in the repo for reference.

  architectures:
    - amd64
    - arm64
    - arm
  category: Cloud
  tags: ["files", "personal", "business"]
  description:
    en_us: |
      SMB File Server - Universal Network File Sharing
      
      SMB (Server Message Block) is the industry-standard network file sharing protocol used by Windows, macOS, and Linux systems. This lightweight SMB server provides seamless file access across all your devices with native operating system integration.
      
      Network File Sharing Features:
      • Native SMB/CIFS protocol support for universal compatibility
      • Direct integration with Windows File Explorer, macOS Finder, and Linux file managers
      • No additional software required - uses built-in OS networking
      • Fast local network file transfers with optimal performance
      • Automatic network discovery on Windows networks
      • Secure authentication with username/password protection
      
      Cross-Platform Access:
      • Windows: Access via File Explorer network locations
      • macOS: Mount as network volume in Finder
      • Linux: Connect through file managers or command line
      • Mobile: Compatible with SMB client apps on iOS and Android
      • Media Players: Direct streaming to smart TVs and media devices
      
      Perfect for home networks, small offices, or anywhere you need reliable file sharing without cloud dependencies. Built on proven Samba technology with minimal resource usage and maximum compatibility.
    zh_cn: |
      SMB 文件服务器 - 通用网络文件共享
      
      SMB（服务器消息块）是 Windows、macOS 和 Linux 系统使用的行业标准网络文件共享协议。这个轻量级 SMB 服务器通过原生操作系统集成，为您的所有设备提供无缝文件访问。
      
      网络文件共享功能：
      • 原生 SMB/CIFS 协议支持，具有通用兼容性
      • 与 Windows 文件资源管理器、macOS Finder 和 Linux 文件管理器直接集成
      • 无需额外软件 - 使用内置 OS 网络功能
      • 快速本地网络文件传输，性能最优
      • Windows 网络自动发现
      • 用户名/密码安全认证
      
      跨平台访问：
      • Windows：通过文件资源管理器网络位置访问
      • macOS：在 Finder 中挂载为网络卷
      • Linux：通过文件管理器或命令行连接
      • 移动设备：兼容 iOS 和 Android 上的 SMB 客户端应用
      • 媒体播放器：直接流式传输到智能电视和媒体设备
      
      非常适合家庭网络、小型办公室或任何需要可靠文件共享而无需云依赖的地方。基于成熟的 Samba 技术构建，资源使用最少，兼容性最大。
  developer: Dockur
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  tagline:
    en_us: Universal Samba file server - native network file sharing for all devices
    zh_cn: 通用 Samba 文件服务器 - 所有设备的原生网络文件共享
  tips:
    before_install:
      en_us: |
        **Samba is installed without a network port, on purpose.** Nothing can reach the
        share until you choose the address it listens on.

        **1. Publish the port.** Open the app's settings → Override → Ports and add one line,
        `<address>:445:445`:

        | You connect from | Port line | Then open |
        | --- | --- | --- |
        | WireGuard Easy - Host | `10.9.0.1:445:445` | `\\10.9.0.1\DATA` |
        | Tailscale | `<tailscale ip>:445:445` (`tailscale ip -4` gives it) | `\\<tailscale ip>\DATA` |
        | Your home network (PCS at home) | `<LAN ip of the PCS>:445:445` | `\\<LAN ip>\DATA` |
        | Anywhere | `0.0.0.0:445:445` | `\\<public ip>\DATA` |

        A VPN or LAN address is recommended. `0.0.0.0` opens SMB to the whole internet with
        only the password in front of it, and many internet providers block port 445 anyway.

        **2. Log in** as `admin` on the share `DATA`. The password is in the tile menu →
        Credentials, and can be changed in the settings' Security tab.

        • Windows: File Explorer → `\\<address>\DATA`
        • macOS: Finder → Go → Connect to Server → `smb://<address>/DATA`
        • Linux: Files → Other Locations → `smb://<address>/DATA`

        **Folders hang or never list over WireGuard:** set `MTU = 1280` in the client's tunnel configuration.

  title:
    en_us: Samba

