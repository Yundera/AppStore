  # The SMB login. Seeded from the box-wide password it replaces, so an installed
  # app keeps the password every client that mapped the share has saved; a fresh
  # install gets its own.
  secrets:
    SAMBA_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: SMB share (DATA)
      username: admin
      password: ${SAMBA_ADMIN_PASSWORD}
      # The image re-applies PASS to the Samba user on every start (CLEAR=Y is its
      # default), so a new value in .env plus a recreate is the whole change.
      change:
        apply: env
        policy:
          min_length: 8
          max_length: 64
