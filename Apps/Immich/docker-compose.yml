  secrets:
    # Seeded: an installed app keeps the shared password its cluster was initialised
    # with (so the re-assert below is a no-op there); a fresh install gets its own.
    IMMICH_DB_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
  steps:
    # Postgres reads POSTGRES_PASSWORD only at initdb time, so an install whose pgdata was
    # created by an earlier revision of this app keeps the password it was initialised with
    # while the immich service now presents $IMMICH_DB_PASSWORD -- the server would fail to
    # authenticate after the update. Re-assert the role password over the postgres unix socket
    # (the image's pg_hba grants `local all all trust`, so no existing password is needed).
    # Idempotent, and a no-op on a fresh install where initdb already set this value.
    # A failing `started` step is logged and swallowed, so a slow or absent database cannot
    # block the app; `run: always` retries it on the next up.
    # The password is handed to psql as a variable and interpolated with :'pw', which
    # quotes it as a SQL string literal, so a quote in the value cannot break the
    # statement. The SQL goes in over stdin rather than -c on purpose: psql only
    # interpolates :'var' through its normal parser, never in a -c command string.
    # "$IMMICH_DB_PASSWORD" is an environment variable of the step (the app's .env), not
    # text substituted into this script, so the shell never re-splits or re-expands it.
    - name: reassert-db-password
      at: started
      run: always
      script: |
        for i in $(seq 60); do
          compose exec database pg_isready -U postgres -d immich >/dev/null 2>&1 && break
          sleep 2
        done
        printf "ALTER USER postgres PASSWORD :'pw';\n" |
          compose exec database psql -U postgres -d immich -v ON_ERROR_STOP=1 -v pw="$IMMICH_DB_PASSWORD"
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/immich/upload
      user: $PUID
      group: $PGID
    - path: /DATA/Gallery
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/immich/model-cache
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/immich/pgdata
      user: $PUID
      group: $PGID
  backup:
    # Regenerable data: restored empty, rebuilt by the app. Declared in folders above.
    exclude:
      - model-cache/
