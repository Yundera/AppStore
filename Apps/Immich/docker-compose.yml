name: immich

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.0.3
    container_name: immich
    user: $PUID:$PGID
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/immich/upload/:/data/
      # Read-only access to the gallery directory used to import media files from the host directly (Immich external library)
      - ${DATA_ROOT:-/DATA}/Gallery/:/import/:ro
    environment:
      DB_DATABASE_NAME: immich
      DB_PASSWORD: $IMMICH_DB_PASSWORD
      DB_USERNAME: postgres
      IMMICH_PORT: 80
      PGID: $PGID
      PUID: $PUID
      TZ: Etc/UTC
    expose:
      - 80
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich
      - pcs

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3
    container_name: immich_machine_learning
    cpu_shares: 20
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '0.5'
    user: 0:0  # no users volume mount so can run as root
    environment:
      TZ: Etc/UTC
      PGID: 0
      PUID: 0
    restart: unless-stopped
    healthcheck:
      disable: false
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/immich/model-cache/:/cache/
    networks:
      - immich

  redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    container_name: immich-redis
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    user: 0:0 # no volume mount so can run as root
    healthcheck:
      test: redis-cli ping || exit 1
    environment:
      TZ: Etc/UTC
    restart: unless-stopped
    networks:
      - immich

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
    user: $PUID:$PGID
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: $IMMICH_DB_PASSWORD
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
      TZ: UTC
      PGID: $PGID
      PUID: $PUID
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/immich/pgdata/:/var/lib/postgresql/data/
    healthcheck:
      # Inline command substitution ($$(...)) instead of a named $$Chksum var: CasaOS re-serializes the compose and
      # collapses $$Chksum to $Chksum, which Docker then interpolates to an empty string (false "unhealthy"). $$(...) has
      # no bare $VAR, so it survives that collapse. See rationale.md.
      test: pg_isready --dbname='immich' --username='postgres' || exit 1; [ "$$(psql --dbname='immich' --username='postgres' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    restart: unless-stopped
    networks:
      - immich

networks:
  immich:
    name: immich
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  main: immich
  webui_port: 80
  index: /

  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  thumbnail: thumbnail.png

  architectures:
    - amd64
    - arm64
  store_app_id: immich
  category: Gallery
  tags: ["photos", "personal", "family"]
  author: Cp0204
  developer: alextran1502
  description:
    en_us: |
      Immich gives you a modern, self-hosted photo and video gallery, without the limits or tracking of traditional cloud services.

      Automatically back up your photos and videos from your phone. Organize them by date, location, or face. Browse everything from a sleek web app, stream in 4K to your smart TV, and share albums privately with family and friends : no account or app needed.

      **New in v2.x:** Optical Character Recognition (OCR) lets you search for text within your photos, supporting English, Chinese, Japanese, Korean, Russian, Greek, Thai, and Latin-script languages.

      Unlike other platforms, Immich runs on your own private server. That means:

      * **Unlimited storage** - You can upgrade the storage anytime at market price on your server interface
      * **No data mining**
      * **Lightning-fast access on your local network**
      * **Multi-user support**, so everyone in your home has their own space

      Perfect for photographers, families, or anyone who wants to take back control of their memories. Immich works beautifully on your Personal Cloud Server, so your media stays **yours : forever**.
    fr_fr: |
      Immich vous offre une galerie moderne de photos et vidéos auto-hébergée, sans les limites ou le suivi des services cloud traditionnels.

      Sauvegardez automatiquement vos photos et vidéos depuis votre téléphone. Organisez-les par date, lieu ou visage. Parcourez tout depuis une application web élégante, diffusez en 4K sur votre smart TV, et partagez des albums en privé avec votre famille et vos amis : aucun compte ou application nécessaire.

      Contrairement aux autres plateformes, Immich fonctionne sur votre propre serveur privé. Cela signifie :

      * **Stockage illimité** - Vous pouvez mettre à niveau le stockage à tout moment au prix du marché sur l'interface de votre serveur
      * **Aucune exploitation de données**
      * **Accès ultra-rapide sur votre réseau local**
      * **Support multi-utilisateur**, pour que chacun dans votre foyer ait son propre espace

      Parfait pour les photographes, les familles, ou quiconque veut reprendre le contrôle de ses souvenirs. Immich fonctionne parfaitement sur votre serveur cloud personnel, ainsi vos médias restent **les vôtres : pour toujours**.
  tagline:
    en_us: Your Private Photo Library, Fully Under Your Control
    fr_fr: Votre bibliothèque photo privée, entièrement sous votre contrôle
  title:
    en_us: Immich
  tips:
    before_install:
      en_us: |
        **Setup Information:**

        🔐 **First Setup**:
        1. Wait 5 minutes for Immich to fully start
        2. Open the app and create your admin account
        3. For large uploads, use one of its direct addresses (below)

        **Addresses:** `${APP_URLS:-https://immich-${APP_DOMAIN},https://immich-${APP_PUBLIC_IP_DASH}.nip.io,https://immich-${APP_PUBLIC_IP_DASH}.sslip.io}`

        Behind a gateway, the first address may cap uploads (100 MB per file on a Yundera server); the others reach the server directly, with no limit.

        📱 **Mobile App**: Download the Immich app and connect using one of the direct addresses above for unlimited photo/video backup.

        🔍 **OCR (Text Search)**: Immich v2.x includes OCR to search text in your photos. To enable OCR for existing photos, go to Administration > Job Settings and run the OCR job.

        📁 **Import Existing Photos**: To import photos already on your PCS:
        1. Place files in `/DATA/Gallery/` using the Files app
        2. In Immich, go to **Administration → External Libraries**
        3. Create a library, add import path: `/import`
        4. Click **Scan Library**

      fr_fr: |
        **Informations de configuration :**

        🔐 **Première configuration** :
        1. Attendez 5 minutes le démarrage complet d'Immich
        2. Ouvrez l'app et créez votre compte admin
        3. Pour les gros uploads, utilisez une de ses adresses directes (ci-dessous)

        **Adresses :** `${APP_URLS:-https://immich-${APP_DOMAIN},https://immich-${APP_PUBLIC_IP_DASH}.nip.io,https://immich-${APP_PUBLIC_IP_DASH}.sslip.io}`

        Derrière une passerelle, la première adresse peut limiter les uploads (100 Mo par fichier sur un serveur Yundera) ; les autres joignent le serveur directement, sans limite.

        📱 **Application mobile** : Téléchargez l'app Immich et connectez-vous avec une des adresses directes ci-dessus pour une sauvegarde illimitée de vos photos/vidéos.

        🔍 **OCR (Recherche de texte)** : Immich v2.x inclut l'OCR pour rechercher du texte dans vos photos. Pour activer l'OCR sur les photos existantes, allez dans Administration > Job Settings et lancez le job OCR.

        📁 **Importer des photos existantes** : Pour importer des photos déjà sur votre PCS :
        1. Placez les fichiers dans `/DATA/Gallery/` via l'app Files
        2. Dans Immich, allez dans **Administration → External Libraries**
        3. Créez une bibliothèque, ajoutez le chemin : `/import`
        4. Cliquez sur **Scan Library**

x-compose-app:
  schema_version: 2
  version: "3.0.3"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: immich, name: immich, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
