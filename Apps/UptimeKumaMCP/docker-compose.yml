  developer: David Fuchs
  category: Developer
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  # What the user must bring (GUIDELINES › What the user brings). The Uptime
  # Kuma account is on another app of this box, so it is an input, not an
  # `accounts` entry.
  audience: technical
  inputs:
    - env: UPTIME_KUMA_USERNAME
      label: { en_us: "Uptime Kuma username", fr_fr: "Identifiant Uptime Kuma" }
      description: { en_us: "The account the assistant acts as. It gets that account's full rights, deletions included." }
      required: true
    - env: UPTIME_KUMA_PASSWORD
      label: { en_us: "Uptime Kuma password", fr_fr: "Mot de passe Uptime Kuma" }
      secret: true
      required: true
    - env: UPTIME_KUMA_URL
      label: { en_us: "Uptime Kuma address (optional)", fr_fr: "Adresse d'Uptime Kuma (facultatif)" }
      description: { en_us: "Leave blank for the Uptime Kuma app on this server (http://uptimekuma:80). Otherwise the full URL of an Uptime Kuma 2 this server can reach." }
  architectures:
    - amd64
  tips:
    en_us: *tips_en
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/uptimekumamcp/oauth
      user: $PUID
      group: $PGID
