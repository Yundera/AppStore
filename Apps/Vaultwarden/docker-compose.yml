name: vaultwarden

services:
  # AppShield gates ONLY the admin panel. Caddy splits the single public hostname by
  # path: /admin (plus AppShield's own /nhl-auth endpoints) goes through the SSO
  # sidecar, everything else -- the web vault and the whole Bitwarden client protocol --
  # is proxied straight to Vaultwarden, exactly as before. That is what lets the admin
  # token be dropped without adding a second login in front of the vault.
  # See rationale.md.
  vaultwarden:
    image: ghcr.io/yundera/appshield:3.0.2
    container_name: vaultwarden
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC
    # registration fails.
    hostname: vaultwarden
    restart: unless-stopped
    expose:
      - 80
    environment:
      BACKEND_HOST: "vaultwarden-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      # No ALLOWED_PATHS: this sidecar only ever sees /admin and /nhl-auth, because Caddy
      # never routes anything else to it. Uncomment to restrict the admin panel to members
      # of the `admins` group instead of every PCS account that can sign in:
      # OIDC_REQUIRED_GROUPS: "admins"
    labels:
      # Two handle branches per site, ordered: the @sso branch takes /admin and the
      # sidecar's own auth endpoints, the bare fallback takes everything else. The
      # fallback names the backend container directly -- `{{upstreams 80}}` would resolve
      # to this service (the sidecar), which is the branch we are trying to avoid.
      caddy_0: vaultwarden-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.@sso.path: "/admin /admin/* /nhl-auth/*"
      caddy_0.0_handle: "@sso"
      caddy_0.0_handle.reverse_proxy: "{{upstreams 80}}"
      caddy_0.1_handle: ""
      caddy_0.1_handle.reverse_proxy: "vaultwarden-backend:80"
      caddy_1: vaultwarden-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.@sso.path: "/admin /admin/* /nhl-auth/*"
      caddy_1.0_handle: "@sso"
      caddy_1.0_handle.reverse_proxy: "{{upstreams 80}}"
      caddy_1.1_handle: ""
      caddy_1.1_handle.reverse_proxy: "vaultwarden-backend:80"
      caddy_2: vaultwarden-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.@sso.path: "/admin /admin/* /nhl-auth/*"
      caddy_2.0_handle: "@sso"
      caddy_2.0_handle.reverse_proxy: "{{upstreams 80}}"
      caddy_2.1_handle: ""
      caddy_2.1_handle.reverse_proxy: "vaultwarden-backend:80"
    depends_on:
      - vaultwarden-backend
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    networks:
      - pcs

  vaultwarden-backend:
    image: vaultwarden/server:1.37.0
    container_name: vaultwarden-backend
    user: $PUID:$PGID
    deploy:
      resources:
        limits:
          memory: 1024M
    cpu_shares: 70
    # /alive is a plain liveness route, checked from inside the container so the result
    # does not depend on the gateway or the sidecar.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - 80
    # No caddy labels of its own: Caddy reaches it through the fallback branch above, so
    # the routing decision lives in exactly one place. It stays on `pcs` because it has to
    # resolve the PCS mail gateway (SMTP_HOST: smtp) -- which also means a peer container
    # on `pcs` can reach /admin directly. Upstream is explicit that disabling the token
    # needs "extra steps to secure it. This includes externally and locally"; see
    # rationale.md for why that is not a regression against the shipped token.
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ROCKET_PORT: 80
      ROCKET_ADDRESS: 0.0.0.0
      SIGNUPS_ALLOWED: "true"
      # No ADMIN_TOKEN. Upstream: "If you have another method you would like to use for
      # authentication to the /admin page then you can set the DISABLE_ADMIN_TOKEN
      # variable to true." AppShield is that method, wired to the PCS SSO by the Caddy
      # path split above.
      DISABLE_ADMIN_TOKEN: "true"
      DOMAIN: https://vaultwarden-$APP_DOMAIN
      APP_NET: pcs
      SMTP_HOST: smtp
      SMTP_PORT: 587
      SMTP_SECURITY: off
      SMTP_USERNAME: casaos
      SMTP_PASSWORD: $APP_DEFAULT_PASSWORD
      SMTP_FROM: vaultwarden@$APP_DOMAIN
      SMTP_FROM_NAME: Vaultwarden
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/vaultwarden/data/:/data/
    restart: unless-stopped
    networks:
      - pcs

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

