name: docusaurus

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docusaurus:
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: docusaurus
    hostname: docusaurus
    restart: unless-stopped
    expose:
      - "80"
    environment:
      BACKEND_HOST: "docusaurus-backend"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io}"
    depends_on:
      - docusaurus-backend
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      # On `pcs` because the router must reach it, and on the app's own
      # network because that is where its backend lives.
      - pcs
      - docusaurus-internal

  docusaurus-backend:
    image: nginx:1.27-alpine
    container_name: docusaurus-backend
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/build/:/usr/share/nginx/html/:ro
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      # App-private: reached only by this app's own services, so it
      # has no business on the shared network.
      - docusaurus-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between this app's own services.
  docusaurus-internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: docusaurus
  store_app_id: docusaurus
  webui_port: 80
  index: /
  scheme: https
  category: Utilities
  developer: Meta (Facebook)
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  title:
    en_us: Docusaurus
  tagline:
    en_us: Build beautiful documentation websites
  description:
    en_us: |
      Docusaurus is a static site generator by Meta. Build documentation
      websites with Markdown, versioning, i18n, and search built in.
      Perfect for project docs, knowledge bases, and blogs.
  tips:
    before_install:
      en_us: |
        A new Docusaurus site is generated and built on first install, then
        served read-only by Nginx behind the app's SSO gate.

        Your content lives on the server at /DATA/AppData/docusaurus/src/
        (Markdown pages under docs/); the published HTML lives at
        /DATA/AppData/docusaurus/build/.

        Editing the Markdown is not enough on its own — the site has to be
        rebuilt before changes appear, and restarting this app does not rebuild
        it: the build runs once, at first install. Install the **Docusaurus MCP**
        app from this store to edit pages and trigger a rebuild; it works on the
        same two directories.

x-compose-app:
  schema_version: 2
  version: "3.10.1"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: docusaurus, name: docusaurus, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: docusaurus
  title:
    en_us: Docusaurus
  tagline:
    en_us: Build beautiful documentation websites
  description:
    en_us: |
      Docusaurus is a static site generator by Meta. Build documentation
      websites with Markdown, versioning, i18n, and search built in.
      Perfect for project docs, knowledge bases, and blogs.
  developer: Meta (Facebook)
  category: Utilities
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      A new Docusaurus site is generated and built on first install, then
      served read-only by Nginx behind the app's SSO gate.

      Your content lives on the server at /DATA/AppData/docusaurus/src/
      (Markdown pages under docs/); the published HTML lives at
      /DATA/AppData/docusaurus/build/.

      Editing the Markdown is not enough on its own — the site has to be
      rebuilt before changes appear, and restarting this app does not rebuild
      it: the build runs once, at first install. Install the **Docusaurus MCP**
      app from this store to edit pages and trigger a rebuild; it works on the
      same two directories.
  # Generating the site needs Docusaurus's own build tooling, so it runs in a node
  # container. Guarded on the `.initialized` marker the build leaves behind.
  steps:
    - name: docusaurus-init
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/src/.initialized" ] && exit 0
        docker run --rm -i --entrypoint sh --user 0:0 \
          -v "$APP_DIR/src:/output" -v "$APP_DIR/build:/build-output" \
          node:20-alpine3.20 -s <<'SH'
        set -e
        cd /tmp
        echo "Initializing Docusaurus project..."
        npx create-docusaurus@3.10.1 site classic --javascript
        cd site
        npm run build
        cp -r ./* /output/
        cp -r /output/build/* /build-output/
        touch /output/.initialized
        echo "Done."
        SH
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/src
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/build
      user: $PUID
      group: $PGID
