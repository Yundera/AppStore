name: docusaurus

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Public documentation site: Nginx serves the static build directly.
  # No AppShield gate on purpose — readers must not need an account (see rationale.md).
  docusaurus:
    image: nginx:1.31.9-alpine
    container_name: docusaurus
    hostname: docusaurus
    restart: unless-stopped
    user: "0:0"
    expose:
      - "80"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/build/:/usr/share/nginx/html/:ro
    configs:
      - source: docusaurus-nginx-v2
        target: /etc/nginx/conf.d/default.conf
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - pcs

# Replaces the image's default.conf: its server block sets its own error_page, which
# hides any http-level one, so the themed 404 needs a server block of our own.
# absolute_redirect off: nginx's own "add the trailing slash" redirect would otherwise
# name the internal host it was reached on (docusaurus-<ip>.nip.io) instead of the
# address the visitor actually used.
# gzip and Cache-Control: the stock image sends neither, so every page shipped
# ~550KB uncompressed and hashed assets were revalidated on each visit.
# Named -v2 because compose kept the old file in the running container when only
# the content of the first version changed.
configs:
  docusaurus-nginx-v2:
    content: |
      absolute_redirect off;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
      map $$uri $$docusaurus_cache {
        ~^/assets/  "public, max-age=31536000, immutable";
        default     "no-cache";
      }
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $$docusaurus_cache;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        error_page 404 /404.html;
      }

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: docusaurus
  store_app_id: docusaurus
  webui_port: 80
  index: /
  scheme: https
  category: Utilities
  developer: Meta (Facebook)
  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  title:
    en_us: Docusaurus
  tagline:
    en_us: Build beautiful documentation websites
  description:
    en_us: |
      Docusaurus is a static site generator by Meta. Build documentation
      websites with Markdown, versioning, i18n, and search built in.
      Perfect for project docs, knowledge bases, and blogs.
  tips:
    before_install:
      en_us: |
        A new Docusaurus site is generated and built on first install, then
        served read-only by Nginx as a public site: anyone with the link can
        read it, no login required.

        Your content lives on the server at /DATA/AppData/docusaurus/src/
        (Markdown pages under docs/); the published HTML lives at
        /DATA/AppData/docusaurus/build/.

        Editing the Markdown is not enough on its own — the site has to be
        rebuilt before changes appear. To rebuild, stop the app and start it
        again: the site is rebuilt automatically on every start (it takes a
        few minutes; the old version stays online until the build finishes).
        The **Docusaurus MCP** app from this store lets an AI assistant edit
        the pages; it works on the same two directories.

x-compose-app:
  schema_version: 2
  version: "3.10.1"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: docusaurus, name: docusaurus, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: docusaurus
  title:
    en_us: Docusaurus
  tagline:
    en_us: Build beautiful documentation websites
  description:
    en_us: |
      Docusaurus is a static site generator by Meta. Build documentation
      websites with Markdown, versioning, i18n, and search built in.
      Perfect for project docs, knowledge bases, and blogs.
  developer: Meta (Facebook)
  category: Utilities
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      A new Docusaurus site is generated and built on first install, then
      served read-only by Nginx as a public site: anyone with the link can
      read it, no login required.

      Your content lives on the server at /DATA/AppData/docusaurus/src/
      (Markdown pages under docs/); the published HTML lives at
      /DATA/AppData/docusaurus/build/.

      Editing the Markdown is not enough on its own — the site has to be
      rebuilt before changes appear. To rebuild, stop the app and start it
      again: the site is rebuilt automatically on every start (it takes a
      few minutes; the old version stays online until the build finishes).
      The **Docusaurus MCP** app from this store lets an AI assistant edit
      the pages; it works on the same two directories.
  # Generating the site needs Docusaurus's own build tooling, so it runs in a node
  # container. Guarded on the `.initialized` marker the build leaves behind.
  # Runs as $PUID:$PGID so the generated project stays editable by the user and the
  # Docusaurus MCP app; npm gets a writable HOME in /tmp since $PUID has none there.
  steps:
    - name: docusaurus-init
      at: setup
      run: always
      script: |
        [ -e "$APP_DIR/src/.initialized" ] && exit 0
        docker run --rm -i --entrypoint sh --user "$PUID:$PGID" -e HOME=/tmp \
          -v "$APP_DIR/src:/output" -v "$APP_DIR/build:/build-output" \
          node:20.19.2-alpine3.20 -s <<'SH'
        set -e
        cd /tmp
        echo "Initializing Docusaurus project..."
        npx create-docusaurus@3.10.1 site classic --javascript
        cd site
        npm run build
        cp -r ./* /output/
        cp -r /output/build/* /build-output/
        touch /output/.initialized
        echo "Done."
        SH
        echo "DOCUSAURUS_FRESH=1" >> "$MAISON_OUTPUT"
    # Rebuilds the site on every start, so stopping and starting the app publishes
    # edited Markdown without a terminal; the old build stays online until the new
    # one is copied over. A step rather than a one-shot service: Maison's tile counts
    # an exited container as "partly running". Skipped right after docusaurus-init,
    # which has just built. The 2G cap covers a multi-locale build.
    # Maison backups drop every `cache/` dir, which breaks node_modules after a
    # restore (webpack/lib/cache), so a failed build reinstalls with `npm ci` once.
    # root: installs made by the old root-run init left node_modules root-owned,
    # and `npm ci` must be able to replace them.
    - name: docusaurus-rebuild
      at: started
      run: always
      timeout: 15m
      images: [node:20.19.2-alpine3.20]
      script: |
        [ -n "${DOCUSAURUS_FRESH:-}" ] && exit 0
        [ -e "$APP_DIR/src/.initialized" ] || { echo "Project not generated yet, skipping."; exit 0; }
        docker run --rm -i --entrypoint sh --user 0:0 --memory 2g --cpu-shares 50 \
          -e HOME=/tmp -e NODE_OPTIONS=--max-old-space-size=1536 -w /output \
          -v "$APP_DIR/src:/output" -v "$APP_DIR/build:/build-output" \
          node:20.19.2-alpine3.20 -s <<'SH'
        set -e
        echo "Building Docusaurus site..."
        npm run build || { echo "Build failed, reinstalling dependencies..."; npm ci && npm run build; }
        cp -r build/* /build-output/
        echo "Build complete."
        SH
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/src
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/build
      user: $PUID
      group: $PGID
