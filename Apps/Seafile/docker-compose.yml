name: seafile

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:11.8-noble
    user: 0:0
    container_name: seafile-mysql
    restart: unless-stopped
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
      - TZ=$TZ
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/seafile/mysql/:/var/lib/mysql
    networks:
      - seafile-net
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    user: 0:0
    container_name: seafile-redis
    restart: unless-stopped
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "${SEAFILE_REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD}
    networks:
      - seafile-net
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${SEAFILE_REDIS_PASSWORD}", "ping"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 5

  seafile:
    image: seafileltd/seafile-mc:13.0.28
    container_name: seafile
    restart: unless-stopped
    user: 0:0
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 2G
    expose:
      - 80
      - 8080
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/seafile/shared/:/shared
    environment:
      - INIT_SEAFILE_ADMIN_EMAIL=admin@$APP_DOMAIN
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}

      - SEAFILE_SERVER_HOSTNAME=${APP_HOST:-seafile-${APP_DOMAIN}}
      - SEAFILE_SERVER_PROTOCOL=https

      - SITE_ROOT=/
      - NON_ROOT=false
      # One secret repeated 4x: installs that predate it ran with the shared password
      # repeated 4x, so this keeps their key byte-identical (seeded, see x-compose-app).
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}
      - SEAFILE_LOG_TO_STDOUT=true
      - MD_FILE_COUNT_LIMIT=100000
      - TIME_ZONE=UTC # seafile is very sensitive to timezone

      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db

      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD}

      - ENABLE_SEADOC=true
      - SEADOC_SERVER_URL=${APP_URL:-https://seafile-${APP_DOMAIN}}/sdoc-server

      - ENABLE_NOTIFICATION_SERVER=true
      - INNER_NOTIFICATION_SERVER_URL=http://seafile-notification-server:8083
      - NOTIFICATION_SERVER_URL=${APP_URL:-https://seafile-${APP_DOMAIN}}/notification

      - ENABLE_SEAFILE_AI=false
      - SEAFILE_AI_SERVER_URL=http://seafile-ai:8888
      # Repeated 4x for the same reason as JWT_PRIVATE_KEY above.
      - SEAFILE_AI_SECRET_KEY=${SEAFILE_AI_SECRET_KEY}${SEAFILE_AI_SECRET_KEY}${SEAFILE_AI_SECRET_KEY}${SEAFILE_AI_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seafile-net
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -L -o /dev/null -w '%{http_code}' http://localhost/ | grep -q '^200$' || exit 1"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 5

  seafile-notification-server:
    image: seafileltd/notification-server:13.0.21
    container_name: seafile-notification-server
    restart: unless-stopped
    user: 0:0
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - 8083
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/seafile/shared/seafile/logs/:/shared/seafile/logs
    environment:
      - SEAFILE_SERVER_HOSTNAME=${APP_HOST:-seafile-${APP_DOMAIN}}
      - SEAFILE_SERVER_PROTOCOL=https
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=seafile
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_DB_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - TIME_ZONE=UTC # seafile is very sensitive to timezone
      # One secret repeated 4x: installs that predate it ran with the shared password
      # repeated 4x, so this keeps their key byte-identical (seeded, see x-compose-app).
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}
      - SEAFILE_LOG_TO_STDOUT=true
      - NOTIFICATION_SERVER_LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seafile-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8083'"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 5

  seafile-seadoc:
    image: seafileltd/sdoc-server:2.0.10
    container_name: seafile-seadoc
    hostname: seafile-seadoc
    restart: unless-stopped
    user: 0:0
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    expose:
      - 80
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/seafile/seadoc-data/:/shared
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=seafile
      - DB_PASSWORD=${SEAFILE_DB_PASSWORD}
      - DB_NAME=seahub_db
      - TIME_ZONE=UTC
      # One secret repeated 4x: installs that predate it ran with the shared password
      # repeated 4x, so this keeps their key byte-identical (seeded, see x-compose-app).
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}${SEAFILE_JWT_KEY}
      - NON_ROOT=false
      - SEAHUB_SERVICE_URL=${APP_URL:-https://seafile-${APP_DOMAIN}}
      - SEAFILE_SERVER_HOSTNAME=${APP_HOST:-seafile-${APP_DOMAIN}}
      - SEAFILE_SERVER_PROTOCOL=https
    depends_on:
      db:
        condition: service_healthy
      seafile:
        condition: service_healthy
    networks:
      - seafile-net

  # The app's own router: one entry port, and the path dispatch that used to be a
  # Caddy handle_path tree lives here instead. The platform only ever routes a
  # host to this container's port 80.
  seafile-router:
    image: nginx:1.31.8-alpine
    container_name: seafile-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: seafile-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - seafile-net
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  seafile-net:
    name: seafile-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  seafile-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      # Upstreams are variables so nginx starts before they exist and re-resolves
      # them through Docker's DNS when a container is recreated with a new IP.
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      # The proxy in front terminated TLS: keep its scheme, not ours (http).
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }

      server {
        listen 80;
        absolute_redirect off;

        # Seafile uploads and downloads whole files through here: no size cap, no
        # buffering to disk, and long transfers must not time out.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$remote_addr;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$seafile seafile:80;
        set $$notification seafile-notification-server:8083;
        set $$seadoc seafile-seadoc:80;

        location = /_router/health { access_log off; return 204; }

        location /notification/ {
          rewrite ^/notification/(.*)$$ /$$1 break;
          proxy_pass http://$$notification;
        }
        # SeaDoc's websocket keeps its /socket.io prefix.
        location /socket.io/ {
          proxy_pass http://$$seadoc;
        }
        location /sdoc-server/ {
          rewrite ^/sdoc-server/(.*)$$ /$$1 break;
          proxy_pass http://$$seadoc;
        }
        location / {
          proxy_pass http://$$seafile;
        }
      }

x-casaos:
  store_app_id: seafile
  webui_port: 80
  main: seafile-router

  icon: icon.png
  thumbnail: thumbnail.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
    - screenshot-4.png
  architectures:
    - amd64
    - arm64
  category: Cloud
  tags: ["files", "personal", "business"]
  description:
    en_us: Seafile is a file hosting and collaboration platform with privacy protection and teamwork features. It allows you to create private clouds for file sharing and collaboration, supporting automatic sync across devices, version control, and secure file encryption. Perfect for teams and individuals who need reliable cloud storage with advanced sharing capabilities.
    es_es: Seafile es una plataforma de alojamiento y colaboración de archivos con protección de privacidad y características de trabajo en equipo. Te permite crear nubes privadas para compartir archivos y colaborar, con sincronización automática entre dispositivos, control de versiones y cifrado seguro de archivos.
    fr_fr: Seafile est une plateforme d'hébergement et de collaboration de fichiers avec protection de la confidentialité et fonctionnalités de travail d'équipe. Elle vous permet de créer des nuages privés pour le partage et la collaboration de fichiers, prenant en charge la synchronisation automatique entre appareils, le contrôle de version et le chiffrement sécurisé des fichiers.
    ko_kr: Seafile은 개인정보 보호와 팀워크 기능을 갖춘 파일 호스팅 및 협업 플랫폼입니다. 파일 공유와 협업을 위한 프라이빗 클라우드를 생성할 수 있으며, 기기 간 자동 동기화, 버전 제어, 보안 파일 암호화를 지원합니다.
    zh_cn: Seafile 是一个文件托管和协作平台，具有隐私保护和团队协作功能。它允许您创建私有云进行文件共享和协作，支持设备间自动同步、版本控制和安全文件加密。
  developer: Seafile Ltd.
  tagline:
    en_us: Professional file sync and collaboration platform
    es_es: Plataforma profesional de sincronización y colaboración de archivos
    fr_fr: Plateforme professionnelle de synchronisation et collaboration de fichiers
    ko_kr: 전문 파일 동기화 및 협업 플랫폼
    zh_cn: 专业文件同步和协作平台
  tips:
    before_install:
      en_us: |
        **Default Admin Account**

        Log in as `admin@$APP_DOMAIN`; the password is shown when you open the app (tile menu → Credentials).

        **Features:**
        - File sync across devices with desktop and mobile apps
        - Team libraries with granular permissions
        - Version control and file history
        - Online document editing with Seadoc
        - Secure file sharing with password protection
        - WebDAV support for third-party app integration

        **Post-Installation:**
        - Access via your domain to set up additional users
        - Download desktop/mobile apps for automatic sync
        - Configure team libraries for collaborative work
        - Set up two-factor authentication for enhanced security
        - Install **Seafile Virtual Folder** to mount your libraries at `/DATA/Seafile`,
          where the file manager, the SMB share and every other app can reach them
  title:
    en_us: Seafile

x-compose-app:
  schema_version: 2
  version: "13.0.28"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: seafile-router, name: seafile, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: seafile
  title:
    en_us: Seafile
  tagline:
    en_us: Professional file sync and collaboration platform
    es_es: Plataforma profesional de sincronización y colaboración de archivos
    fr_fr: Plateforme professionnelle de synchronisation et collaboration de fichiers
    ko_kr: 전문 파일 동기화 및 협업 플랫폼
    zh_cn: 专业文件同步和协作平台
  description:
    en_us: Seafile is a file hosting and collaboration platform with privacy protection and teamwork features. It allows you to create private clouds for file sharing and collaboration, supporting automatic sync across devices, version control, and secure file encryption. Perfect for teams and individuals who need reliable cloud storage with advanced sharing capabilities.
    es_es: Seafile es una plataforma de alojamiento y colaboración de archivos con protección de privacidad y características de trabajo en equipo. Te permite crear nubes privadas para compartir archivos y colaborar, con sincronización automática entre dispositivos, control de versiones y cifrado seguro de archivos.
    fr_fr: Seafile est une plateforme d'hébergement et de collaboration de fichiers avec protection de la confidentialité et fonctionnalités de travail d'équipe. Elle vous permet de créer des nuages privés pour le partage et la collaboration de fichiers, prenant en charge la synchronisation automatique entre appareils, le contrôle de version et le chiffrement sécurisé des fichiers.
    ko_kr: Seafile은 개인정보 보호와 팀워크 기능을 갖춘 파일 호스팅 및 협업 플랫폼입니다. 파일 공유와 협업을 위한 프라이빗 클라우드를 생성할 수 있으며, 기기 간 자동 동기화, 버전 제어, 보안 파일 암호화를 지원합니다.
    zh_cn: Seafile 是一个文件托管和协作平台，具有隐私保护和团队协作功能。它允许您创建私有云进行文件共享和协作，支持设备间自动同步、版本控制和安全文件加密。
  developer: Seafile Ltd.
  category: Cloud
  icon: icon.png
  thumbnail: thumbnail.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
    - screenshot-4.png
  architectures:
    - amd64
    - arm64
  # Sum of the service limits (~4.1G).
  resources:
    recommended: { memory: 4G }
  tips:
    en_us: |
      **Default Admin Account**

      Log in as `admin@$APP_DOMAIN`; the password is shown when you open the app (tile menu → Credentials).

      **Features:**
      - File sync across devices with desktop and mobile apps
      - Team libraries with granular permissions
      - Version control and file history
      - Online document editing with Seadoc
      - Secure file sharing with password protection
      - WebDAV support for third-party app integration

      **Post-Installation:**
      - Access via your domain to set up additional users
      - Download desktop/mobile apps for automatic sync
      - Configure team libraries for collaborative work
      - Set up two-factor authentication for enhanced security
      - Install **Seafile Virtual Folder** to mount your libraries at `/DATA/Seafile`,
        where the file manager, the SMB share and every other app can reach them
  # One secret per purpose. Every one is seeded from the box-wide password it
  # replaces: an installed app keeps the values its MariaDB, its seafile DB user,
  # its admin account and its signed tokens were initialised with; a fresh install
  # gets its own. The Seafile Virtual Folder app (SeafileDrive) reads
  # SEAFILE_ADMIN_PASSWORD from this app's .env to log in over WebDAV — keep the name.
  secrets:
    SEAFILE_DB_ROOT_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
    SEAFILE_DB_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
    SEAFILE_REDIS_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
    SEAFILE_JWT_KEY: ${APP_DEFAULT_PASSWORD}|alnum:32
    SEAFILE_AI_SECRET_KEY: ${APP_DEFAULT_PASSWORD}|alnum:32
    SEAFILE_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
        es_es: Administrador
        fr_fr: Administrateur
        ko_kr: 관리자
        zh_cn: 管理员
      username: admin@${APP_DOMAIN}
      password: ${SEAFILE_ADMIN_PASSWORD}
      note:
        en_us: Changing it signs out the desktop and mobile clients and the Seafile Virtual Folder app; restart that app afterwards so it picks the new password up.
      # Seafile keeps the password in ccnet's own user table; INIT_SEAFILE_ADMIN_PASSWORD
      # only seeds the first boot. reset-admin.sh is interactive, so this goes through
      # seahub's own model, whose save() writes it back to ccnet. set_password also
      # revokes the user's API and sync tokens — hence the note above.
      change:
        apply: script
        script: |
          compose exec -e E="admin@$APP_DOMAIN" -e SEAFILE_ADMIN_PASSWORD seafile \
            bash -c 'cd /opt/seafile/seafile-server-latest && ./seahub.sh python-env python3 seahub/manage.py shell -c "import os; from seahub.base.accounts import User; u = User.objects.get(email=os.environ[\"E\"]); u.set_password(os.environ[\"SEAFILE_ADMIN_PASSWORD\"]); u.save()"'
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Mostly generated by scripts/gen-folders.py from the trailing-slash bind
  # mounts in `volumes:` above — re-run it rather than hand-editing the
  # generated entries. `/DATA/AppData/seafile` and `.../shared/seafile/conf`
  # are hand-added: they are not bind sources but must exist owned by
  # $PUID:$PGID before the stack starts.
  folders:
    - path: /DATA/AppData/seafile
      user: $PUID
      group: $PGID
    # Not /DATA/AppData/seafile/mysql: db starts as root and its image hands that directory to
    # its own user; chowning it to $PUID here would leave the running
    # database unable to write there.
    - path: /DATA/AppData/seafile/shared
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/seafile/shared/seafile/logs
      user: $PUID
      group: $PGID
    # Seafile writes its generated config here; declared so it exists owned by
    # $PUID:$PGID rather than being created root:root by a step.
    - path: /DATA/AppData/seafile/shared/seafile/conf
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/seafile/seadoc-data
      user: $PUID
      group: $PGID
  backup:
    # Regenerable data: restored empty, rebuilt by the app. Declared in folders above.
    exclude:
      - shared/seafile/logs/
  # It waits up to 25 minutes for Seafile to write its OWN config, then patches it.
  # Waiting on another program's runtime behaviour and editing what it produced is
  # genuinely imperative — it is not a declaration wearing a script costume.
  # The edits run INSIDE the seafile container (`compose exec … bash -s`), on its own
  # /shared mount, so the files keep the owner Seafile gave them. Seafile is restarted
  # only when an edit actually changed something.
  steps:
    - name: patch-seahub-settings
      at: started
      run: once
      script: |
        echo "Waiting for Seafile to finish initialization (up to 25 minutes)..."
        ready=
        for i in $(seq 1 150); do
          if compose exec seafile grep -q SECRET_KEY /shared/seafile/conf/seahub_settings.py 2>/dev/null; then
            echo "Seafile initialization detected after $((i * 10)) seconds"
            ready=1
            break
          fi
          sleep 10
        done
        if [ -z "$ready" ]; then
          echo "Seafile did not write seahub_settings.py within 25 minutes; WebDAV, SMTP and proxy settings were not applied" >&2
          exit 1
        fi
        out=$(compose exec -e APP_DOMAIN="$APP_DOMAIN" -e APP_URL seafile bash -s <<'SCRIPT'
        set -e
        CONF=/shared/seafile/conf
        S=$CONF/seahub_settings.py
        # Ensure WebDAV is enabled (in case Seafile overwrote our pre-created config)
        if [ -f $CONF/seafdav.conf ] && grep -q "enabled = false" $CONF/seafdav.conf; then
          sed -i 's/enabled = false/enabled = true/' $CONF/seafdav.conf
          echo "WebDAV re-enabled"; echo CHANGED
        fi
        # Ensure SMTP config is present (in case Seafile overwrote our pre-created config)
        if ! grep -q "EMAIL_HOST" $S; then
          cat >> $S <<EOF

        # SMTP configuration (the server's built-in SMTP service; it needs no authentication)
        EMAIL_USE_TLS = False
        EMAIL_HOST = 'smtp'
        EMAIL_HOST_USER = ''
        EMAIL_HOST_PASSWORD = ''
        EMAIL_PORT = 587
        DEFAULT_FROM_EMAIL = 'seafile@$APP_DOMAIN'
        SERVER_EMAIL = 'seafile@$APP_DOMAIN'
        EOF
          echo "SMTP configuration added"; echo CHANGED
        fi
        # Ensure reverse-proxy HTTPS settings are present (mandatory behind a TLS-terminating router)
        if ! grep -q "SECURE_PROXY_SSL_HEADER" $S; then
          cat >> $S <<EOF

        # Reverse proxy HTTPS settings (the router terminates TLS, forwards X-Forwarded-Proto)
        USE_X_FORWARDED_HOST = True
        SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
        SERVICE_URL = '${APP_URL:-https://seafile-${APP_DOMAIN}}'
        FILE_SERVER_ROOT = '${APP_URL:-https://seafile-${APP_DOMAIN}}/seafhttp'
        EOF
          echo "Reverse-proxy HTTPS configuration added"; echo CHANGED
        fi
        SCRIPT
        ) || { echo "$out"; echo "Seafile config patch failed" >&2; exit 1; }
        echo "$out" | grep -v '^CHANGED$' || true
        case "$out" in
          *CHANGED*) echo "Restarting Seafile to apply configuration..."; compose restart seafile ;;
          *) echo "Seafile configuration already complete; no restart needed" ;;
        esac
        # NOTE: an earlier revision ran reset-admin.sh here as a "fallback in case
        # INIT_SEAFILE_ADMIN_* failed on first boot". Don't re-add that. Two Touchstone
        # runs (2026-08-29, 2026-08-31) caught it creating a SECOND admin every single
        # time -- a random <hex>@auth.local row with contact_email set to admin@$APP_DOMAIN
        # -- even though INIT_SEAFILE_ADMIN_EMAIL/PASSWORD had already created the real
        # admin@$APP_DOMAIN account 31s earlier in both captures. Seafile's web login
        # resolves by contact_email and lands on that auth.local row, but
        # POST /api2/auth-token/ (desktop/mobile/WebDAV, and the Seafile Virtual Folder
        # app, whose rclone remote logs in as admin@$APP_DOMAIN) does a literal
        # username match and gets the OTHER, empty account -- so the one
        # documented credential pair resolved to two different accounts, and a THIRD
        # accreted on reinstall since the step had no existence guard at all. Seafile's
        # own INIT_SEAFILE_ADMIN_EMAIL/INIT_SEAFILE_ADMIN_PASSWORD (set above, on the
        # `seafile` service) is upstream's documented bootstrap for exactly this admin
        # account, only fires while the ccnet/seahub DB is still empty (so it is already
        # idempotent across reinstalls/upgrades), and is the identity Tips and the
        # Seafile Virtual Folder app already assume. If that mechanism is ever
        # confirmed to fail on some install, the fix is a guard that checks whether admin@$APP_DOMAIN already
        # authenticates before calling reset-admin.sh -- not an unconditional call.
        echo "Post-install complete"
