  secrets:
    # Signs sessions and share links (general.secret_key, exactly 16 alphanumerics).
    # Only written into the seeded config.json, never rotated.
    FILESTASH_SECRET_KEY: alnum:16
    FILESTASH_ADMIN_PASSWORD: password:24
    # Emptied and regenerated by Maison whenever the password above is changed.
    FILESTASH_ADMIN_HASH: bcrypt:${FILESTASH_ADMIN_PASSWORD}
  credentials:
    - label:
        en_us: My Server and admin console
        fr_fr: My Server et console d'administration
        zh_cn: My Server 与管理控制台
      password: ${FILESTASH_ADMIN_PASSWORD}
      note:
        en_us: Pick "My Server" on the login page and type /DATA in Path - an empty Path is refused. The admin console is at /admin.
        fr_fr: Choisissez « My Server » sur la page de connexion et saisissez /DATA dans Path - un Path vide est refusé. La console d'administration est sur /admin.
        zh_cn: 在登录页面选择「My Server」，并在 Path 中填写 /DATA——留空会被拒绝。管理控制台位于 /admin。
      # ADMIN_PASSWORD is read on every start and takes precedence over a password
      # saved from the admin console, so re-rendering admin.bcrypt plus a recreate
      # (forced by the filestash.admin-password-rev label) is the whole change.
      change:
        apply: env
        policy:
          min_length: 12
          max_length: 64
  folders:
    - path: /DATA/AppData/$AppID/state
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/state/config
      user: $PUID
      group: $PGID
  files:
    - path: /DATA/AppData/$AppID/state/admin.bcrypt
      from: state/admin.bcrypt.tmpl
      ensure: always
      mode: "0600"
