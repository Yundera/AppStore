name: changedetection
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  changedetection:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: changedetection
    # OIDC identity: the auth-registrar attests this app's name via the container's PTR
    # record, so the hostname must equal the app name.
    hostname: changedetection
    restart: unless-stopped
    environment:
      BACKEND_HOST: "changedetection-app"
      BACKEND_PORT: "5000"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none (plain
      # CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      # Empty elsewhere, where the gate falls back to REDIRECT_HOST_SUFFIXES.
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      changedetection-app:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On `pcs` to reach the platform's auth-registrar, and on the app's own
      # network because that is where the router and the backend live.
      - pcs
      - changedetection-internal

  changedetection-app:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.4
    container_name: changedetection-app
    restart: unless-stopped
    # The image's entrypoint has no root-only setup: it runs straight as the box user.
    user: "$PUID:$PGID"
    environment:
      # The app's public address, used for the links in notifications. USE_X_SETTINGS
      # stays off: the gate sends X-Forwarded-Port: 80, which ProxyFix would append to
      # the host (`https://<host>:80`) and fail every form's CSRF referrer check.
      BASE_URL: "${APP_URL:-https://changedetection-${APP_DOMAIN}}"
      TZ: $TZ
    expose:
      - 5000
    volumes:
      # Everything changedetection.io keeps: url-watches.json (watches, settings,
      # notification targets), the secret key and every snapshot of every watch.
      - ${DATA_ROOT:-/DATA}/AppData/changedetection/datastore:/datastore
    deploy:
      resources:
        limits:
          memory: 1G
    cpu_shares: 50
    logging: *logging
    networks:
      # App-private only: reached by the gate and, for the manifest alone, the router.
      - changedetection-internal

  # The app's own router: the only routed service. It sends exactly one path,
  # /site.webmanifest, straight to changedetection.io and everything else to the
  # AppShield gate. See rationale.md.
  changedetection-router:
    image: nginx:1.31.9-alpine
    container_name: changedetection-router
    restart: unless-stopped
    depends_on:
      - changedetection
      - changedetection-app
    expose:
      - 80
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    configs:
      - source: changedetection-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - changedetection-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between the router, the gate and changedetection.io.
  changedetection-internal:
    driver: bridge

configs:
  changedetection-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$client_ip;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate changedetection:80;
        set $$app changedetection-app:5000;

        location = /_router/health { access_log off; return 204; }

        # The PWA manifest, and nothing else, bypasses the gate. nginx matches
        # the normalised path exactly (dot segments and %-escapes resolved), and
        # the URI sent on is fixed, so no other path can ride this location.
        location = /site.webmanifest {
          proxy_pass http://$$app/site.webmanifest;
        }

        # Every other path, including the gate's own /AppShield/ (and legacy
        # /nhl-auth/) endpoints and the live-update websocket: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: changedetection-router
  webui_port: 80
  category: Utilities
  tags: ["monitoring", "notifications", "productivity"]
  developer: dgtlmoon
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  index: /
  store_app_id: changedetection
  title:
    en_us: ChangeDetection
  tagline:
    en_us: Get notified when a web page changes
  description:
    en_us: |
      changedetection.io watches web pages for you and tells you when they change - a price drop, a restock, a new job posting, an updated policy or a new release.

      **Key features:**
      • Watch any page, or only part of it with CSS, XPath or JSONPath filters
      • Side-by-side and inline diffs of every change, with full history
      • Restock and price tracking for product pages
      • Notifications to email, Discord, Slack, Telegram, ntfy, Matrix, webhooks and 90+ more
      • Per-watch check intervals, tags and trigger or ignore text
      • Import a list of URLs, export and back up your watches

      Every watch and every snapshot is stored on your server, under the app's own folder. Pages are fetched with a plain HTTP request; pages that need a real browser to render are not covered by this listing.
  tips:
    before_install:
      en_us: |
        **Sign-in:** ChangeDetection is protected by your server's single sign-on. It has no
        login of its own, so leave its own password setting off.
        -----------------------------
        **First visit:** paste a URL into **Web page URL** at the top and press **Watch**.
        Two example watches are already there to show how it works. The first check runs
        at once; **Preview** shows what was fetched and **History** each change as it comes.
        Set up where notifications go under **Settings > Notifications**.
        -----------------------------
        Every request goes through the single sign-on gate, so the REST API, RSS feeds and
        the MCP endpoint cannot be reached by outside clients. Use it from the browser.
x-compose-app:
  schema_version: 2
  version: "0.70.4"
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead: this password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  # How the app is reached; the box's routing setting decides the rest.
  routes:
    - { service: changedetection-router, name: changedetection, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: changedetection
  title:
    en_us: ChangeDetection
  tagline:
    en_us: Get notified when a web page changes
  description:
    en_us: |
      changedetection.io watches web pages for you and tells you when they change - a price drop, a restock, a new job posting, an updated policy or a new release.

      **Key features:**
      • Watch any page, or only part of it with CSS, XPath or JSONPath filters
      • Side-by-side and inline diffs of every change, with full history
      • Restock and price tracking for product pages
      • Notifications to email, Discord, Slack, Telegram, ntfy, Matrix, webhooks and 90+ more
      • Per-watch check intervals, tags and trigger or ignore text
      • Import a list of URLs, export and back up your watches

      Every watch and every snapshot is stored on your server, under the app's own folder. Pages are fetched with a plain HTTP request; pages that need a real browser to render are not covered by this listing.
  developer: dgtlmoon
  category: Utilities
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: |
      **Sign-in:** ChangeDetection is protected by your server's single sign-on. It has no
      login of its own, so leave its own password setting off.
      -----------------------------
      **First visit:** paste a URL into **Web page URL** at the top and press **Watch**.
      Two example watches are already there to show how it works. The first check runs
      at once; **Preview** shows what was fetched and **History** each change as it comes.
      Set up where notifications go under **Settings > Notifications**.
      -----------------------------
      Every request goes through the single sign-on gate, so the REST API, RSS feeds and
      the MCP endpoint cannot be reached by outside clients. Use it from the browser.
  # changedetection.io runs as $PUID:$PGID and writes its whole state here.
  folders:
    - path: /DATA/AppData/$AppID/datastore
      user: $PUID
      group: $PGID
      mode: "0700"
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
