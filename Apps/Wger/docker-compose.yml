      Ändere es über die App-Einstellungen in Maison (Tab „Sicherheit“), damit der Zugangsdaten-Dialog stimmt.

      **Der erste Start dauert einige Minuten**, während die App ihre Datenbank und
      ihre Dateien vorbereitet. Spätere Starts dauern etwa eine Minute.

      **Die Übungsdatenbank ist ab der ersten Anmeldung da** -- rund 900 Übungen. Die
      Bilder dazu werden in den folgenden Minuten im Hintergrund geladen; anfangs leere
      Kacheln füllen sich also von selbst.

      **So geht's:**
      1. Mit den Daten oben anmelden
      2. Trainingspläne → Plan anlegen, Übungen mit Sätzen und Wiederholungen ergänzen
      3. Am Trainingstag den Plan öffnen und jeden Satz direkt eintragen
      4. Körpergewicht → heutiges Gewicht eintragen; die Kurve entsteht von selbst
      5. Ernährung → Plan anlegen und Mahlzeiten erfassen oder Barcode scannen

      **Auf dem Handy:** die wger-App installieren, „eigener Server" wählen und die
      Adresse dieser App eintragen.

      **Neue Konten:** Die Registrierung ist geschlossen, über die Adresse kann sich
      also niemand ein Konto anlegen. Zum Hinzufügen einer Person die Benutzerliste im
      Administrationsmenü verwenden.

      **Zwei schwere Hintergrundjobs sind aus:** der Massenimport der
      Lebensmitteldatenbank und der Download der Übungsvideos, beide mehrere hundert
      Megabyte groß. Der Barcode-Scanner holt Produkte trotzdem einzeln beim Scannen.
    es_es: |
      **Tu cuenta**
      El usuario y la contraseña se muestran al abrir la aplicación (menú del icono → Credenciales).

      Para cambiarla, usa los ajustes de la app en Maison (pestaña Seguridad), así el diálogo de credenciales sigue siendo correcto.

      **El primer arranque tarda unos minutos** mientras la aplicación prepara su base
      de datos y sus archivos. Los arranques posteriores tardan alrededor de un minuto.

      **La base de ejercicios está disponible desde el primer inicio de sesión** -- unos
      900 ejercicios. Sus imágenes se descargan en segundo plano en los minutos
      siguientes, así que las miniaturas vacías se completan solas.

      **Cómo usarlo:**
      1. Inicia sesión con los datos de arriba
      2. Rutinas → crea una rutina y añade ejercicios con series y repeticiones
      3. El día de entreno, abre la rutina y registra cada serie sobre la marcha
      4. Peso corporal → añade el peso de hoy; la gráfica se construye sola
      5. Nutrición → crea un plan y registra comidas, o escanea un código de barras

      **En el móvil:** instala la app de wger, elige «servidor personalizado» e
      introduce la dirección de esta aplicación.

      **Cuentas nuevas:** el registro está cerrado, así que nadie puede crearse una
      cuenta desde esta dirección. Para añadir a alguien, usa la lista de usuarios del
      menú de administración.

      **Dos tareas pesadas están desactivadas:** la importación masiva de la base de
      alimentos y la descarga de vídeos de ejercicios, ambas de cientos de megabytes. El
      escáner de códigos de barras sigue trayendo cada producto al escanearlo.
    zh_cn: |
      **你的账号**
      打开应用时会显示用户名和密码（磁贴菜单 → 凭据）。

      如需修改，请在 Maison 的应用设置（安全选项卡）中进行，以便凭据对话框保持正确。

      **首次启动需要几分钟**，应用会准备数据库和静态文件。之后的启动大约一分钟。

      **动作库首次登录时即可使用** —— 约 900 个动作。配图会在随后的几分钟内于后台
      下载，一开始空白的图块会自动补齐。

      **使用方法：**
      1. 用上面的信息登录
      2. 训练计划 → 新建计划，添加动作并设定组数与次数
      3. 训练当天打开计划，边练边记录每一组
      4. 体重 → 记录今天的体重，曲线会自动生成
      5. 营养 → 创建饮食计划记录三餐，或扫描商品条码

      **在手机上：** 安装 wger 手机应用，选择"自定义服务器"并填入本应用的地址。

      **新账号：** 注册已关闭，别人无法通过这个地址在你的服务器上注册。要添加成员，
      请使用管理菜单中的用户列表。

      **两项耗资源的后台任务默认关闭：** 食物数据库批量导入和动作视频下载，两者都有
      数百兆甚至更多。条码扫描仍会在扫描时逐个获取商品信息。
  # Directories Maison creates and chowns to $PUID:$PGID before any image is
  # pulled and before any container starts. The app image runs as its own `wger`
  # user (uid 1000), which is what $PUID is on a PCS -- without this, compose
  # would create static/ and media/ root-owned and collectstatic would fail on
  # the first boot.
  folders:
    - path: /DATA/AppData/$AppID/config-powersync
      user: $PUID
      group: $PGID
    # Not /DATA/AppData/$AppID/pgdata: wger-db starts as root and its image hands that directory to
    # its own user; chowning it to $PUID here would leave the running
    # database unable to write there.
    - path: /DATA/AppData/$AppID/redis
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/static
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/media
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/beat
      user: $PUID
      group: $PGID
  secrets:
    # Django's session and CSRF signing key. Generated once, so sessions survive
    # a restart -- the app generates a throwaway key when this is empty.
    WGER_SECRET_KEY: alnum:50
    # Kept alphanumeric on purpose: it is substituted into a postgres:// URL,
    # where a generator emitting `@`, `/` or `:` would produce a URL that parses
    # into the wrong host.
    WGER_DB_PASSWORD: alnum:32
    # PowerSync's own database role, kept separate from the app's: it owns only
    # the sync-bucket schema and reads the tables through a replication slot.
    # Alphanumeric for the same reason as the one above -- it is substituted
    # into a postgres:// URL.
    WGER_PS_STORAGE_PASSWORD: alnum:32
    # The admin login, set by the rotate-admin-password step below. Seeded:
    # an installed app's admin was rotated to the former shared password, which it
    # keeps; a fresh install gets its own.
    WGER_ADMIN_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Administrator
      username: admin
      password: ${WGER_ADMIN_PASSWORD}
      # A hook, not env: the password lives hashed in wger's user table, and
      # rotate-admin-password below only ever moves it off the upstream default,
      # once. The hook sets it through Django in the running app container, the
      # same set_password call that step makes.
      change:
        apply: script
        script: |
          compose exec -e WGER_ADMIN_PASSWORD wger-web python3 - <<'PY'
          import os

          import django

          django.setup()

          from django.contrib.auth.models import User

          new = os.environ['WGER_ADMIN_PASSWORD']
          assert new, 'empty password'
          admin = User.objects.get(username='admin')
          admin.set_password(new)
          admin.save(update_fields=['password'])
          PY
  files:
    # These two are declared rather than left to the seed tree, which is
    # create-if-absent: an app update that changes the sync rules has to reach
    # an install that already has the old files on disk. Nothing in them is
    # meant to be hand-edited, and the sync rules in particular must match the
    # server image's `powersync` publication -- a stale copy is a client that
    # silently syncs the wrong table set.
    - path: /DATA/AppData/$AppID/config-powersync/powersync.yaml
      from: config-powersync/powersync.yaml
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/config-powersync/sync_rules.yaml
      from: config-powersync/sync_rules.yaml
      ensure: always
      mode: "0644"
  steps:
    # wger signs the JWTs its phone app authenticates with using an RS256
    # keypair, supplied as two base64-wrapped JWKs. No `secrets:` generator
    # produces an RSA key, and the two halves have to come from the *same*
    # keypair, so they are generated together by the app's own management
    # command and handed to the app's .env through $MAISON_ENV.
    #
    # $MAISON_ENV never overwrites a key the .env already has, so a reinstall
    # over existing data keeps its keypair -- regenerating it would invalidate
    # every phone still logged in.
    #
    # `--network none` because the command only generates a key; PS_DATABASE_URI
    # is passed because the app's settings module refuses to import without a
    # database URL, and this throwaway value is never connected to.
    - name: jwt-keys
      at: setup
      run: once
      script: |
        docker run --rm --network none \
          -e PS_DATABASE_URI=postgres://wger:wger@127.0.0.1:5432/wger \
          docker.io/wger/server:2.7.0 \
          python3 manage.py generate-jwt-keys --kid wger \
          | grep -E '^JWT_(PRIVATE|PUBLIC)_KEY=' >> "$MAISON_ENV"

    # PowerSync keeps its sync buckets in a schema of the wger database, owned
    # by a role of its own. wger ships the command that creates both; it reads
    # PS_STORAGE_PG_URI, creates or updates the role and schema to match, and
    # no-ops when that variable is unset or the database is not postgres.
    #
    # `always`, not `once`: it costs one short container per up, and the two
    # states it repairs -- a database restored without the role, or a role whose
    # password no longer matches the generated secret -- would otherwise leave
    # PowerSync unable to start with nothing left to re-run. The retry loop
    # covers the gap between `up` returning and postgres accepting connections.
    - name: setup-powersync-storage
      at: started
      run: always
      script: |
        docker run --rm -i --entrypoint python3 --network wger-internal --user "$PUID:$PGID" \
          -e PS_DATABASE_URI="postgres://wger:$WGER_DB_PASSWORD@wger-db:5432/wger" \
          -e PS_STORAGE_PG_URI="postgres://powersync_storage:$WGER_PS_STORAGE_PASSWORD@wger-db:5432/wger" \
          -e SECRET_KEY="$WGER_SECRET_KEY" \
          -e DJANGO_DEBUG=False \
          docker.io/wger/server:2.7.0 - <<'PY'
        import sys
        import time

        import django

        django.setup()

        from django.core.management import call_command
        from django.db import connections

        last = None
        for _ in range(30):
            try:
                call_command('setup-powersync-storage')
                sys.exit(0)
            except Exception as exc:
                # Almost always postgres not accepting connections yet.
                last = exc
                connections.close_all()
                time.sleep(5)

        sys.exit('wger: could not set up the PowerSync storage role: {}'.format(last))
        PY

    # Three jobs the app needs done once, at the start, rather than whenever its
    # weekly schedule happens to fire: refresh the exercise database from
    # WGER_INSTANCE, download the pictures for it, and warm the exercise API
    # cache. All three already exist as celery tasks and are already scheduled,
    # but `add_periodic_task` picks a random day-of-week and time when beat
    # starts (wger/exercises/tasks.py), so on a fresh install they could be up to
    # a week away -- and until the cache warm-up has run, the exercise browser's
    # first `GET /api/v2/exerciseinfo/` leaves the page on skeleton placeholders
    # for a long time. This queues all three so that is a matter of minutes; the
    # weekly schedule then keeps them current.
    #
    # Queuing rather than running: `.delay()` returns as soon as redis has the
    # message, so the install is not held open by a download, and the worker --
    # concurrency 1, so these run in the order queued -- picks them up once it is
    # up, which is after the web container is healthy and therefore after the
    # migrations. Measured on a fresh install: the metadata sync took ~3.5
    # minutes and the images ~2 more (about 900 exercises, ~210 MB), with the app
    # answering throughout.
    #
    # The image download carries an explicit time limit as a guard, not because
    # it normally needs one: upstream's fetches set no HTTP timeout of their own,
    # and a hand-run `download-exercise-images` was seen wedged on a single
    # request for over ten minutes with no progress. Unbounded, one such request
    # would hold the only worker process indefinitely and every later job with
    # it.
    - name: seed-exercise-database
      at: started
      run: once
      script: |
        docker run --rm -i --entrypoint python3 --network wger-internal --user "$PUID:$PGID" \
          -e PS_DATABASE_URI="postgres://wger:$WGER_DB_PASSWORD@wger-db:5432/wger" \
          -e SECRET_KEY="$WGER_SECRET_KEY" \
          -e DJANGO_DEBUG=False \
          -e USE_CELERY=True \
          -e CELERY_BROKER=redis://wger-cache:6379/2 \
          -e CELERY_BACKEND=redis://wger-cache:6379/2 \
          docker.io/wger/server:2.7.0 - <<'PY'
        import django

        django.setup()

        from wger.exercises.tasks import (
            cache_api_exercises_task,
            sync_exercises_task,
            sync_images_task,
        )

        sync_exercises_task.delay()
        print('wger: queued the exercise database sync')

        sync_images_task.apply_async(soft_time_limit=3600, time_limit=3900)
        print('wger: queued the exercise image download')

        # Queued last so it caches the exercises the two syncs just wrote.
        cache_api_exercises_task.delay()
        print('wger: queued the exercise API cache warm-up')
        PY

    # wger seeds its first admin from a fixture during `wger bootstrap`, with the
    # username `admin` and the published upstream password `adminadmin`
    # (wger/tasks.py, create_or_reset_admin). There is no environment variable
    # that changes it, so the rotation happens here, once the app is up and the
    # user exists.
    #
    # It rotates only when the password is still the upstream default, so a
    # re-run over an install whose owner has already changed it does nothing --
    # and django-axes, which locks an account out after 10 failures, never sees a
    # wrong password from this step because it checks the hash directly rather
    # than logging in.
    #
    # A run that never finds the user exits non-zero. A failing `started` step is
    # logged and swallowed rather than taking a healthy stack down, and the `once`
    # marker stays unwritten, so the next start tries again.
    - name: rotate-admin-password
      at: started
      run: once
      script: |
        docker run --rm -i --entrypoint python3 --network wger-internal --user "$PUID:$PGID" \
          -e PS_DATABASE_URI="postgres://wger:$WGER_DB_PASSWORD@wger-db:5432/wger" \
          -e SECRET_KEY="$WGER_SECRET_KEY" \
          -e DJANGO_DEBUG=False \
          -e DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache \
          -e DJANGO_CACHE_LOCATION=redis://wger-cache:6379/1 \
          -e DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient \
          -e WGER_ADMIN_PASSWORD \
          -e WGER_ADMIN_EMAIL="$APP_EMAIL" \
          -e WGER_SEED_PASSWORD=adminadmin \
          docker.io/wger/server:2.7.0 - <<'PY'
        import os
        import sys
        import time

        import django

        django.setup()

        from django.contrib.auth.models import User
        from django.db import connections

        seed = os.environ['WGER_SEED_PASSWORD']
        new = os.environ['WGER_ADMIN_PASSWORD']
        email = os.environ['WGER_ADMIN_EMAIL']

        if not new:
            sys.exit('wger: no generated password to set, leaving the admin alone')

        # The first boot runs migrations, collectstatic and the exercise sync
        # before the fixture user is there to find, which is appreciably longer
        # than the container takes to appear.
        admin = None
        for _ in range(150):
            try:
                admin = User.objects.filter(username='admin').first()
            except Exception:
                connections.close_all()
                admin = None
            if admin is not None:
                break
            time.sleep(4)

        if admin is None:
            sys.exit('wger: the admin user did not appear within 10 minutes')

        if not admin.check_password(seed):
            print('wger: the admin password is not the shipped default, leaving it alone')
            sys.exit(0)

        admin.set_password(new)
        if not admin.email and email:
            admin.email = email
        admin.save(update_fields=['password', 'email'])
        print('wger: rotated the default admin password to the generated one')
        PY
