name: wger

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The public face of the app. Django with DEBUG=False serves neither /static/
  # nor /media/, and wger ships no whitenoise, so a front-end that can serve
  # files is required for the app to render at all -- upstream says the same.
  # It is therefore also the app's router (`in-app-router`): the routed service
  # and `x-casaos.main`, sending /ps/ to PowerSync and the rest to gunicorn. Its
  # config ships inline below (`configs: wger-router`).
  wger-router:
    image: nginx:1.31.8-alpine
    container_name: wger-router
    # nginx's master process writes /var/run/nginx.pid and /var/cache/nginx,
    # neither of which is writable by an unprivileged uid in this image; the
    # workers drop to `nginx` on their own. Both wger mounts below are read-only
    # and nothing outside /DATA/AppData/wger is reachable. See rationale.md.
    user: "0:0"
    restart: unless-stopped
    expose:
      - 80
    environment:
      TZ: $TZ
    configs:
      - source: wger-router
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/static/:/wger/static:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/media/:/wger/media:ro
    depends_on:
      wger-web:
        condition: service_started
    healthcheck:
      # Deliberately proxied through to the app rather than answered by nginx:
      # the tile's health follows this service, and nginx being up while
      # gunicorn is still migrating is not the app being up. The first boot
      # loads fixtures, migrates and runs collectstatic over ~11k files, which
      # took about four minutes on a small server -- hence the long start_period.
      # Later starts take about a minute.
      # 127.0.0.1 and not `localhost`: busybox wget resolves localhost to ::1
      # first, and `listen 80` binds IPv4 only, so the check would fail forever
      # and the app's tile would never go green.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1/api/v2/version/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      - pcs
      - wger-internal
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  # The application itself: Django under gunicorn.
  wger-web:
    image: docker.io/wger/server:2.7.0
    container_name: wger-web
    restart: unless-stopped
    environment:
      TZ: $TZ
      TIME_ZONE: $TZ

      # Deployment identity. SITE_URL is what the app writes into absolute links
      # (emails, the API's image URLs); MEDIA_URL/STATIC_URL stay relative so the
      # ip.<zone> and sslip.io routes serve their own assets rather than the
      # gateway's.
      SITE_URL: ${APP_URL:-https://wger-${APP_DOMAIN}}
      # What /api/v2/powersync-token hands the phone app: SITE_URL + this path.
      # It is also the app's own default; set here so a change upstream cannot
      # silently point every phone at a path nginx does not route.
      POWERSYNC_URL_PATH: ps
      CSRF_TRUSTED_ORIGINS: ${APP_URLS:-https://wger-${APP_DOMAIN},https://wger-${APP_PUBLIC_IP_DASH}.sslip.io}
      # Set because the app really is behind a TLS-terminating proxy; without
      # them Django builds http:// links and rejects its own POST forms.
      X_FORWARDED_PROTO_HEADER_SET: "True"
      USE_X_FORWARDED_HOST: "True"

      # Generated once by x-compose-app.secrets. Left unset the app generates a
      # fresh key on every start and logs everyone out on every restart.
      SECRET_KEY: ${WGER_SECRET_KEY}
      # Written into the app's .env on install by the jwt-keys step below --
      # an RSA keypair no `secrets:` generator can produce.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}

      # Database. wger reads a whole URL from PS_DATABASE_URI, or nothing at
      # all: DJANGO_DB_ENGINE has no default and the app refuses to start
      # without one of the two.
      PS_DATABASE_URI: postgres://wger:${WGER_DB_PASSWORD}@wger-db:5432/wger
      DJANGO_PERFORM_MIGRATIONS: "True"

      # Cache and queue.
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://wger-cache:6379/1
      DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
      DJANGO_CACHE_TIMEOUT: "1296000"
      USE_CELERY: "True"
      CELERY_BROKER: redis://wger-cache:6379/2
      CELERY_BACKEND: redis://wger-cache:6379/2

      # Accounts. Registration is off so the app is not an open sign-up form on
      # a public URL; the admin adds people from the app's own user management.
      # Guest users would let an unauthenticated visitor get a working session,
      # which is the same hole by another route -- and the app's default is on.
      ALLOW_REGISTRATION: "False"
      ALLOW_GUEST_USERS: "False"
      USE_RECAPTCHA: "False"
      AXES_ENABLED: "True"
      AXES_FAILURE_LIMIT: "10"
      AXES_COOLOFF_TIME: "30"
      AXES_HANDLER: axes.handlers.cache.AxesCacheHandler
      AXES_LOCKOUT_PARAMETERS: ip_address
      AXES_IPWARE_PROXY_COUNT: "1"
      AXES_IPWARE_META_PRECEDENCE_ORDER: HTTP_X_FORWARDED_FOR,REMOTE_ADDR
      NUMBER_OF_PROXIES: "1"

      # Content. The exercise database is what makes the app usable on day one,
      # and it lives on wger.de, not in the image.
      #
      # SYNC_EXERCISES_ON_STARTUP is off even so. It is the app's own way of
      # fetching that database, but it runs inside this container's entrypoint,
      # ahead of gunicorn, on *every* start -- measured at ~5 minutes of downtime
      # per restart against wger.de, and it is not a first-boot cost: the sync
      # re-walks every exercise each time. The same work is queued onto celery
      # once, at install, by the seed-exercise-database step below, which leaves
      # the app answering while it runs. From then on the weekly celery job keeps
      # it current.
      #
      # The two bulk jobs are deliberately off: the ingredient dump is a
      # multi-hundred-megabyte import and the exercise videos are larger still,
      # neither of which belongs in a default install of a personal server. The
      # barcode scanner still works -- DOWNLOAD_INGREDIENTS_FROM fetches a
      # product on demand when it is scanned. Both are listed in the tips.
      WGER_INSTANCE: https://wger.de
      SYNC_EXERCISES_ON_STARTUP: "False"
      SYNC_EXERCISES_CELERY: "True"
      SYNC_EXERCISE_IMAGES_CELERY: "True"
      SYNC_EXERCISE_VIDEOS_CELERY: "False"
      SYNC_INGREDIENTS_CELERY: "False"
      DOWNLOAD_INGREDIENTS_FROM: WGER
      CACHE_API_EXERCISES_CELERY: "True"
      ALLOW_UPLOAD_VIDEOS: "True"
      MIN_ACCOUNT_AGE_TO_TRUST: "21"

      DJANGO_DEBUG: "False"
      LOG_LEVEL_PYTHON: WARNING
      WGER_USE_GUNICORN: "True"
      WGER_PORT: "8000"
      DJANGO_COLLECTSTATIC_ON_STARTUP: "True"
      EXPOSE_PROMETHEUS_METRICS: "False"
      FROM_EMAIL: wger <${APP_EMAIL}>
      # Two workers rather than upstream's three: this runs beside a database, a
      # cache and two celery processes on a single small server.
      GUNICORN_CMD_ARGS: "--workers 2 --threads 2 --worker-class gthread --timeout 240"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/static/:/home/wger/static
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/media/:/home/wger/media
    expose:
      - 8000
    # Let gunicorn finish in-flight requests instead of cutting uploads short.
    stop_grace_period: 60s
    depends_on:
      wger-db:
        condition: service_healthy
      wger-cache:
        condition: service_healthy
    healthcheck:
      # python3 rather than the wget upstream uses: it is the one interpreter
      # this image is guaranteed to have.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/version/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      # App-private only. Everything from outside arrives through the nginx
      # service above.
      - wger-internal
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G

  wger-db:
    image: postgres:16.15-alpine
    container_name: wger-db
    # The postgres entrypoint starts as root to chown PGDATA and drops to the
    # postgres user itself; the mount is under AppData and nowhere else.
    user: "0:0"
    restart: unless-stopped
    shm_size: 128mb
    environment:
      TZ: $TZ
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${WGER_DB_PASSWORD}
    # wal_level=logical is what PowerSync's replication slot needs; the image's
    # default `replica` cannot feed one, and the setting only takes effect on a
    # restart, so it belongs here rather than in a runtime ALTER SYSTEM.
    #
    # max_slot_wal_keep_size caps what an idle slot may pin. A stopped or broken
    # PowerSync would otherwise hold WAL indefinitely and fill /DATA -- a way to
    # lose a server that upstream's compose leaves open. Past the cap postgres
    # invalidates the slot instead, which costs PowerSync a fresh snapshot and
    # the phone a resync. That is a wait, not data loss: every row still lives
    # in the tables this is replicating from.
    #
    # Once the slot exists this line is load-bearing for *startup*, not just for
    # sync: postgres refuses to boot at all against a pgdata holding a logical
    # slot when wal_level is lower -- "FATAL: logical replication slot ...
    # exists, but wal_level < logical", then "aborting startup". So dropping the
    # flag, or rolling this app back to a revision from before PowerSync, takes
    # the whole app down rather than degrading it, and every service waiting on
    # the db healthcheck sits in Created. The fix is to put the flag back; the
    # slot then resumes where it left off. Dropping the slot instead costs a
    # fresh snapshot and needs wal_level=logical to start postgres anyway.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=1GB
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/pgdata/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wger -d wger"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      # App-private only. A service called `db` on the shared network would
      # answer every other app's `db` lookups, and theirs ours.
      - wger-internal
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  wger-cache:
    image: redis:8.10.2-alpine
    container_name: wger-cache
    restart: unless-stopped
    # The image's entrypoint would drop to its own `redis` user (uid 999), but
    # the /data bind below is created by `folders:` as $PUID:$PGID. Redis would
    # then fail every background save with "Failed opening the temp RDB file
    # ... Permission denied", and because stop-writes-on-bgsave-error defaults
    # to yes it starts refusing writes: celery loses its broker with "MISCONF
    # Redis is configured to save RDB snapshots, but is currently not able to
    # persist on disk" and the worker healthcheck fails. Nothing here needs
    # root, so run as the same uid that owns the directory.
    user: "$PUID:$PGID"
    environment:
      TZ: $TZ
    # `volatile-lru` and not `allkeys-*`: db 1 holds the Django cache, whose
    # keys expire, but db 2 is the celery broker, whose queued tasks do not --
    # evicting those would silently drop the background syncs.
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - "900"
      - "1"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/redis/:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - wger-internal
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

  # The phone app's offline sync. Not an optional extra: the Flutter client has
  # been offline-first since 2.0.3 and has no REST fallback, so an install
  # without this service lets the app log in and then leaves it on "Sync Service
  # Unreachable" with nothing syncing. The web UI does not use it at all.
  #
  # It reads the wger database through the `powersync` publication that wger's
  # own core migration 0027 declares, and keeps its sync buckets in a schema of
  # that same database under a separate role, created by the
  # setup-powersync-storage step below. Its config is two files in
  # config-powersync/, re-rendered on every up so an app update ships new sync
  # rules rather than leaving stale ones in place.
  wger-powersync:
    image: docker.io/journeyapps/powersync-service:1.27.2
    container_name: wger-powersync
    restart: unless-stopped
    # API server and replication worker in one process. Upstream splits them
    # only for horizontal scaling, which one person's training log does not
    # need, and two containers would double the idle memory.
    command: ["start", "-r", "unified"]
    environment:
      TZ: $TZ
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_PORT: "8080"
      PS_DATABASE_URI: postgres://wger:${WGER_DB_PASSWORD}@wger-db:5432/wger
      # Never left to the app's default. wger ships a *literal* fallback for
      # this -- user powersync_storage, password powersync_password -- and a
      # deployment that inherits it has a published database credential.
      PS_STORAGE_PG_URI: postgres://powersync_storage:${WGER_PS_STORAGE_PASSWORD}@wger-db:5432/wger
      # The public half of the RSA keypair the jwt-keys step generated. The
      # app asks wger for a token and PowerSync verifies it against this.
      PS_JWKS_URL: http://wger-web:8000/api/v2/powersync-keys
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/config-powersync/:/config:ro
    expose:
      - 8080
    depends_on:
      wger-db:
        condition: service_healthy
    healthcheck:
      # node and nothing else: this image carries no wget, no curl and no shell
      # utilities worth relying on. Node 18+ has fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/probes/liveness').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      # On a first install the storage role does not exist until the
      # setup-powersync-storage step has run, and that waits on the app's own first boot, so this
      # container restarts a few times before it settles. Restarting is the
      # intended behaviour there, not a failure to report on the tile.
      start_period: 600s
    networks:
      # App-private only. The phone reaches it through nginx's /ps/ route, which
      # is the same host and certificate as the app itself.
      - wger-internal
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          # Measured at ~115 MB with the whole exercise database replicated and
          # one user synced. The headroom is for the ingredient tables, which
          # this store leaves out of the default install but the tips explain
          # how to turn on -- that import is what makes this dataset large.
          memory: 512M

  # Runs the exercise/ingredient syncs and the API cache warm-up off the request
  # path. Shares the media mount because the image downloads land there.
  wger-worker:
    image: docker.io/wger/server:2.7.0
    container_name: wger-worker
    restart: unless-stopped
    command: /start-worker
    environment:
      TZ: $TZ
      TIME_ZONE: $TZ
      SITE_URL: ${APP_URL:-https://wger-${APP_DOMAIN}}
      SECRET_KEY: ${WGER_SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      PS_DATABASE_URI: postgres://wger:${WGER_DB_PASSWORD}@wger-db:5432/wger
      # The web container owns the schema; a worker racing it during an upgrade
      # is how two processes end up applying the same migration.
      DJANGO_PERFORM_MIGRATIONS: "False"
      DJANGO_COLLECTSTATIC_ON_STARTUP: "False"
      SYNC_EXERCISES_ON_STARTUP: "False"
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://wger-cache:6379/1
      DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
      USE_CELERY: "True"
      CELERY_BROKER: redis://wger-cache:6379/2
      CELERY_BACKEND: redis://wger-cache:6379/2
      # One worker process: these are slow network-bound sync jobs on a shared
      # box, not a throughput problem.
      CELERY_WORKER_CONCURRENCY: "1"
      WGER_INSTANCE: https://wger.de
      DOWNLOAD_INGREDIENTS_FROM: WGER
      DJANGO_DEBUG: "False"
      LOG_LEVEL_PYTHON: WARNING
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/media/:/home/wger/media
    depends_on:
      wger-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
    networks:
      - wger-internal
    cpu_shares: 20
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  # Schedules the jobs the worker runs.
  wger-beat:
    image: docker.io/wger/server:2.7.0
    container_name: wger-beat
    restart: unless-stopped
    command: /start-beat
    environment:
      TZ: $TZ
      TIME_ZONE: $TZ
      SITE_URL: ${APP_URL:-https://wger-${APP_DOMAIN}}
      SECRET_KEY: ${WGER_SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      PS_DATABASE_URI: postgres://wger:${WGER_DB_PASSWORD}@wger-db:5432/wger
      DJANGO_PERFORM_MIGRATIONS: "False"
      DJANGO_COLLECTSTATIC_ON_STARTUP: "False"
      SYNC_EXERCISES_ON_STARTUP: "False"
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://wger-cache:6379/1
      DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
      USE_CELERY: "True"
      CELERY_BROKER: redis://wger-cache:6379/2
      CELERY_BACKEND: redis://wger-cache:6379/2
      SYNC_EXERCISES_CELERY: "True"
      SYNC_EXERCISE_IMAGES_CELERY: "True"
      SYNC_EXERCISE_VIDEOS_CELERY: "False"
      SYNC_INGREDIENTS_CELERY: "False"
      CACHE_API_EXERCISES_CELERY: "True"
      DJANGO_DEBUG: "False"
      LOG_LEVEL_PYTHON: WARNING
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/beat/:/home/wger/beat
    depends_on:
      wger-worker:
        condition: service_started
    networks:
      - wger-internal
    cpu_shares: 20
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # App-private link between nginx, the app, its database, its cache and the two
  # celery processes. Named explicitly so the steps below can join it.
  wger-internal:
    name: wger-internal

configs:
  wger-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      # wger's static and media files are written by the app container into two shared
      # bind mounts and served from here; everything else is proxied to gunicorn.
      # Django with DEBUG=False serves neither, and wger ships no whitenoise, so this
      # front-end is required, not an optimisation.
      #
      # Adapted from wger-project/docker config/nginx.conf. One change: both back
      # ends are reached through a runtime-resolved variable rather than an `upstream`
      # block. nginx resolves an upstream name once, at startup, and exits if it fails
      # -- which is what happens whenever this container is started before the ones it
      # proxies to, e.g. after a host reboot, where the daemon's restart order does
      # not follow compose's `depends_on`.

      # Docker's embedded DNS. `valid=10s` re-resolves, so a recreated app container
      # is picked up without restarting this one.
      resolver 127.0.0.11 valid=10s ipv6=off;

      # Use the value the edge proxy sent when there is one, fall back to our own
      # scheme for a direct connection.
      map $$http_x_forwarded_proto $$final_forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
      }

      # Only send `Connection: upgrade` on a request that actually asked for it;
      # sending it unconditionally breaks keepalive on every ordinary request.
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      # Strips the /ps/ prefix before a request reaches PowerSync. Upstream does this
      # with `proxy_pass http://powersync/`, but a proxy_pass whose target is a
      # variable -- which is what keeps the startup-time upstream lookup out of this
      # file, see above -- performs no prefix substitution of its own. Working from
      # $$request_uri rather than a location capture keeps the query string and the
      # original percent-encoding.
      map $$request_uri $$ps_request_uri {
          "~^/ps(?<ps_rest>/.*)"  $$ps_rest;
          default                 /;
      }

      server {
          listen 80;

          access_log /dev/stdout combined;

          # Relative Location headers: the scheme and host are the edge proxy's, not ours.
          absolute_redirect off;

          # Videos and exercise images are uploaded through the app. No cap here and
          # no buffering to disk: the size limit is the app's, as it is behind Caddy.
          client_max_body_size 0;
          proxy_request_buffering off;

          location / {
              # Resolved per request, not at startup -- see the note above. With a
              # variable in proxy_pass nginx no longer appends the original URI by
              # itself, hence the explicit $$request_uri.
              set $$wger_backend "http://wger-web:8000";
              proxy_pass $$wger_backend$$request_uri;

              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$final_forwarded_proto;
              proxy_set_header X-Forwarded-Host $$http_host;

              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;

              proxy_redirect off;
              proxy_http_version 1.1;

              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }

          # PowerSync: the phone app's offline sync. Not optional -- the Flutter
          # client has been offline-first since 2.0.3 and has no REST fallback, so
          # without this the app logs in and then reports "Sync Service Unreachable".
          # The web UI never touches it. Order in this file does not matter: nginx
          # picks the longest matching prefix location, so this wins over `location /`
          # for anything under /ps/.
          location /ps/ {
              set $$powersync_backend "http://wger-powersync:8080";
              proxy_pass $$powersync_backend$$ps_request_uri;

              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$final_forwarded_proto;
              proxy_set_header X-Forwarded-Host $$http_host;

              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;

              # A sync stream is a single long-lived response. Buffered, nginx would
              # hold it and hand the client nothing until the connection closed.
              proxy_buffering off;
              proxy_read_timeout 1d;
              proxy_send_timeout 1d;

              # nginx consumes the upstream's X-Accel-Buffering header, so re-send it
              # for the gateway in front of us, which would otherwise buffer too.
              add_header X-Accel-Buffering no always;
          }

          location /static/ {
              alias /wger/static/;

              # collectstatic writes hashed filenames, so these are immutable.
              add_header Cache-Control "public, max-age=31536000, immutable" always;
              add_header Vary "Accept-Encoding" always;
          }

          location /media/ {
              alias /wger/media/;
          }
      }

x-casaos:
  architectures:
    - amd64
    - arm64
  main: wger-router
  store_app_id: wger
  webui_port: 80
  index: /
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  category: Utilities
  tags: ["health", "fitness", "personal"]
  developer: wger Project
  title:
    en_us: wger
  tagline:
    en_us: Track your workouts, body weight and nutrition
    fr_fr: Suivez vos entraînements, votre poids et votre alimentation
    de_de: Trainingspläne, Körpergewicht und Ernährung im Blick
    es_es: Registra tus entrenamientos, tu peso y tu alimentación
    zh_cn: 记录你的训练、体重和饮食
  description:
    en_us: |
      **Your training log, on your own server**

      wger is a workout and nutrition tracker. Build a routine, log every set you
      actually lift, and watch the numbers move over weeks and months instead of
      guessing whether you are making progress.

      **What you can do:**
      • Build workout routines from a database of hundreds of exercises, with pictures
      • Log each session set by set, and see your history per exercise
      • Track body weight and measurements (arms, chest, waist) as charts over time
      • Plan meals and count calories, protein, carbs and fat
      • Scan a product barcode to add what you ate
      • Use the wger phone app against this server, so the log is on you at the gym

      **Think of it like:** the training notebook people carry between machines, except
      it draws the graphs for you and you can search five years of it.

      **Perfect if you:** lift, run or cycle regularly and want to see long-term
      progress, or want your health data somewhere you control.
    fr_fr: |
      **Votre carnet d'entraînement, sur votre propre serveur**

      wger suit vos entraînements et votre alimentation. Créez un programme, notez chaque
      série réellement effectuée, et regardez les chiffres évoluer au fil des semaines au
      lieu de deviner si vous progressez.

      **Ce que vous pouvez faire :**
      • Créer des programmes à partir d'une base de centaines d'exercices illustrés
      • Enregistrer chaque séance série par série et consulter l'historique par exercice
      • Suivre poids et mensurations (bras, poitrine, taille) sous forme de courbes
      • Planifier vos repas et compter calories, protéines, glucides et lipides
      • Scanner le code-barres d'un produit pour l'ajouter à votre journal
      • Utiliser l'application mobile wger avec ce serveur, pour l'avoir sur vous à la salle

      **Pensez-y comme :** le carnet d'entraînement qu'on trimballe entre les machines,
      sauf qu'il trace les courbes et qu'on peut y chercher cinq ans en arrière.

      **Parfait si vous :** vous entraînez régulièrement et voulez voir votre progression
      sur le long terme, ou voulez garder vos données de santé chez vous.
    de_de: |
      **Dein Trainingstagebuch auf deinem eigenen Server**

      wger protokolliert Training und Ernährung. Leg einen Trainingsplan an, trag jeden
      Satz ein, den du wirklich gemacht hast, und sieh über Wochen und Monate, wie sich
      die Zahlen entwickeln, statt zu raten, ob es vorangeht.

      **Was du machen kannst:**
      • Trainingspläne aus einer Datenbank mit hunderten bebilderten Übungen bauen
      • Jede Einheit satzweise protokollieren und den Verlauf pro Übung ansehen
      • Körpergewicht und Maße (Arme, Brust, Taille) als Kurven verfolgen
      • Mahlzeiten planen und Kalorien, Eiweiß, Kohlenhydrate und Fett zählen
      • Produkte per Barcode scannen und ins Ernährungstagebuch übernehmen
      • Die wger-App mit diesem Server nutzen, damit alles im Gym dabei ist

      **Stell es dir vor wie:** das Trainingsheft, das man zwischen den Geräten mitnimmt --
      nur dass es die Kurven selbst zeichnet und fünf Jahre durchsuchbar bleiben.

      **Ideal wenn du:** regelmäßig trainierst und langfristige Fortschritte sehen willst
      oder deine Gesundheitsdaten selbst verwalten möchtest.
    es_es: |
      **Tu cuaderno de entrenamiento, en tu propio servidor**

      wger registra tus entrenamientos y tu alimentación. Crea una rutina, anota cada serie
      que realmente levantas y observa cómo cambian los números durante semanas y meses en
      lugar de adivinar si estás progresando.

      **Lo que puedes hacer:**
      • Crear rutinas desde una base de cientos de ejercicios con imágenes
      • Registrar cada sesión serie a serie y ver el historial de cada ejercicio
      • Seguir peso corporal y medidas (brazos, pecho, cintura) en gráficas
      • Planificar comidas y contar calorías, proteínas, carbohidratos y grasas
      • Escanear el código de barras de un producto para añadir lo que comiste
      • Usar la app móvil de wger contra este servidor y llevarlo al gimnasio

      **Piénsalo como:** la libreta de entrenamiento que se lleva entre máquinas, solo que
      dibuja las gráficas por ti y puedes buscar en cinco años de registros.

      **Perfecto si:** entrenas con regularidad y quieres ver tu progreso a largo plazo, o
      quieres tus datos de salud bajo tu control.
    zh_cn: |
      **属于你自己的训练日志**

      wger 是训练与营养记录工具。制定训练计划，记录你真正完成的每一组，用数周数月的数据
      看清进展，而不是凭感觉猜测。

      **你可以做什么：**
      • 从数百个带图示的动作库中编排训练计划
      • 逐组记录每次训练，按动作查看历史记录
      • 以曲线追踪体重与围度（手臂、胸围、腰围）
      • 规划饮食，统计热量、蛋白质、碳水和脂肪
      • 扫描商品条码，快速记录吃了什么
      • 用 wger 手机应用连接此服务器，训练时随身可查

      **可以这样想：** 健身房里随身携带的训练笔记本，只是它会自动画出曲线，还能检索五年
      前的记录。

      **非常适合：** 长期规律训练、想看到长期进步，或希望自己掌控健康数据的人。
  tips:
    before_install:
      en_us: |
        **Your account**
        The username and password are shown when you open the app (tile menu → Credentials).

        To change it, use the app's settings in Maison (Security tab), so the Credentials dialog stays correct.

        **The first start takes a few minutes** while the app sets up its database and
        prepares its files. Later starts take about a minute.

        **The exercise database is there from the first login** -- around 900 exercises.
        Their pictures download in the background over the next few minutes, so tiles
        that look blank at first fill in on their own.

        **How to use:**
        1. Log in with the details above
        2. Routines → add a routine, then add exercises and set your target sets and reps
        3. On training day, open the routine and log each set as you go
        4. Body weight → add today's weight; the chart builds itself over time
        5. Nutrition → create a plan and log meals, or scan a product barcode

        **On your phone:** install the wger app from your app store, choose "custom
        server" and enter this app's address. Everything you log there shows up here.

        **New accounts:** sign-up is closed, so the address cannot be used by strangers
        to make accounts on your server. To add someone -- a partner, a training buddy --
        use User list in the admin menu.

        **Two heavy background jobs are off by default:** the bulk food-database import
        and the exercise video downloads, both of which run to hundreds of megabytes or
        more. The barcode scanner still fetches products one at a time as you scan them.
      fr_fr: |
        **Votre compte**
        L'identifiant et le mot de passe s'affichent à l'ouverture de l'application (menu de la tuile → Identifiants).

        Pour le changer, passez par les réglages de l'application dans Maison (onglet Sécurité), afin que la fenêtre Identifiants reste juste.

        **Le premier démarrage prend quelques minutes**, le temps que l'application
        prépare sa base et ses fichiers. Les démarrages suivants prennent environ une
        minute.

        **La base d'exercices est disponible dès la première connexion** -- environ 900
        exercices. Leurs images se téléchargent en arrière-plan dans les minutes qui
        suivent, les vignettes vides se remplissent donc toutes seules.

        **Comment l'utiliser :**
        1. Connectez-vous avec les identifiants ci-dessus
        2. Programmes → créez un programme, ajoutez des exercices, séries et répétitions
        3. Le jour J, ouvrez le programme et notez chaque série au fur et à mesure
        4. Poids → saisissez le poids du jour ; la courbe se construit toute seule
        5. Nutrition → créez un plan et notez vos repas, ou scannez un code-barres

        **Sur votre téléphone :** installez l'application wger, choisissez « serveur
        personnalisé » et saisissez l'adresse de cette application.

        **Nouveaux comptes :** les inscriptions sont fermées, l'adresse ne peut donc pas
        servir à créer des comptes chez vous. Pour ajouter quelqu'un, passez par la liste
        des utilisateurs dans le menu d'administration.

        **Deux tâches de fond lourdes sont désactivées :** l'import en masse de la base
        alimentaire et le téléchargement des vidéos d'exercices, qui pèsent plusieurs
        centaines de mégaoctets. Le scanner de code-barres récupère quand même chaque
        produit à la volée.
      de_de: |
        **Dein Konto**
        Benutzername und Passwort werden beim Öffnen der App angezeigt (Kachelmenü → Zugangsdaten).

        Ändere es über die App-Einstellungen in Maison (Tab „Sicherheit“), damit der Zugangsdaten-Dialog stimmt.

        **Der erste Start dauert einige Minuten**, während die App ihre Datenbank und
        ihre Dateien vorbereitet. Spätere Starts dauern etwa eine Minute.

        **Die Übungsdatenbank ist ab der ersten Anmeldung da** -- rund 900 Übungen. Die
        Bilder dazu werden in den folgenden Minuten im Hintergrund geladen; anfangs leere
        Kacheln füllen sich also von selbst.

        **So geht's:**
        1. Mit den Daten oben anmelden
        2. Trainingspläne → Plan anlegen, Übungen mit Sätzen und Wiederholungen ergänzen
        3. Am Trainingstag den Plan öffnen und jeden Satz direkt eintragen
        4. Körpergewicht → heutiges Gewicht eintragen; die Kurve entsteht von selbst
        5. Ernährung → Plan anlegen und Mahlzeiten erfassen oder Barcode scannen

        **Auf dem Handy:** die wger-App installieren, „eigener Server" wählen und die
        Adresse dieser App eintragen.

        **Neue Konten:** Die Registrierung ist geschlossen, über die Adresse kann sich
        also niemand ein Konto anlegen. Zum Hinzufügen einer Person die Benutzerliste im
        Administrationsmenü verwenden.

        **Zwei schwere Hintergrundjobs sind aus:** der Massenimport der
        Lebensmitteldatenbank und der Download der Übungsvideos, beide mehrere hundert
        Megabyte groß. Der Barcode-Scanner holt Produkte trotzdem einzeln beim Scannen.
      es_es: |
        **Tu cuenta**
        El usuario y la contraseña se muestran al abrir la aplicación (menú del icono → Credenciales).

        Para cambiarla, usa los ajustes de la app en Maison (pestaña Seguridad), así el diálogo de credenciales sigue siendo correcto.

        **El primer arranque tarda unos minutos** mientras la aplicación prepara su base
        de datos y sus archivos. Los arranques posteriores tardan alrededor de un minuto.

        **La base de ejercicios está disponible desde el primer inicio de sesión** -- unos
        900 ejercicios. Sus imágenes se descargan en segundo plano en los minutos
        siguientes, así que las miniaturas vacías se completan solas.

        **Cómo usarlo:**
        1. Inicia sesión con los datos de arriba
        2. Rutinas → crea una rutina y añade ejercicios con series y repeticiones
        3. El día de entreno, abre la rutina y registra cada serie sobre la marcha
        4. Peso corporal → añade el peso de hoy; la gráfica se construye sola
        5. Nutrición → crea un plan y registra comidas, o escanea un código de barras

        **En el móvil:** instala la app de wger, elige «servidor personalizado» e
        introduce la dirección de esta aplicación.

        **Cuentas nuevas:** el registro está cerrado, así que nadie puede crearse una
        cuenta desde esta dirección. Para añadir a alguien, usa la lista de usuarios del
        menú de administración.

        **Dos tareas pesadas están desactivadas:** la importación masiva de la base de
        alimentos y la descarga de vídeos de ejercicios, ambas de cientos de megabytes. El
        escáner de códigos de barras sigue trayendo cada producto al escanearlo.
      zh_cn: |
        **你的账号**
        打开应用时会显示用户名和密码（磁贴菜单 → 凭据）。

        如需修改，请在 Maison 的应用设置（安全选项卡）中进行，以便凭据对话框保持正确。

        **首次启动需要几分钟**，应用会准备数据库和静态文件。之后的启动大约一分钟。

        **动作库首次登录时即可使用** —— 约 900 个动作。配图会在随后的几分钟内于后台
        下载，一开始空白的图块会自动补齐。

        **使用方法：**
        1. 用上面的信息登录
        2. 训练计划 → 新建计划，添加动作并设定组数与次数
        3. 训练当天打开计划，边练边记录每一组
        4. 体重 → 记录今天的体重，曲线会自动生成
        5. 营养 → 创建饮食计划记录三餐，或扫描商品条码

        **在手机上：** 安装 wger 手机应用，选择"自定义服务器"并填入本应用的地址。

        **新账号：** 注册已关闭，别人无法通过这个地址在你的服务器上注册。要添加成员，
        请使用管理菜单中的用户列表。

        **两项耗资源的后台任务默认关闭：** 食物数据库批量导入和动作视频下载，两者都有
        数百兆甚至更多。条码扫描仍会在扫描时逐个获取商品信息。

