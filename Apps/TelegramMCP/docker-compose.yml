name: telegrammcp
# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Main MCP server — reachable at telegrammcp-backend:9634 on the pcs network.
  # Serves the web UI (/), the MCP endpoint (/mcp) and the Telegram webhook
  # callback (/webhook), and answers Beacon's UDP discovery on port 9099.
  telegrammcp-backend:
    image: ghcr.io/worph/telegram-mcp:1.1.23
    container_name: telegrammcp-backend
    hostname: telegrammcp-backend
    user: $PUID:$PGID
    restart: unless-stopped
    expose:
      - 9634
      - 9099
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - PORT=9634
      - DISCOVERY_PORT=9099
      # Advertised public base URL. The bot registers its Telegram webhook at
      # ${PUBLIC_URL}/webhook and hands this out as the public MCP URL.
      - PUBLIC_URL=${APP_URL:-https://telegrammcp-${APP_DOMAIN}}
    volumes:
      # config.json (bot token + MCP target) is created here on first start
      # — CONFIG_PATH=/app/data/config.json is baked into the image.
      - type: bind
        source: ${DATA_ROOT:-/DATA}/AppData/telegrammcp/
        target: /app/data
    networks:
      - pcs
    # 80 — user-facing API backend + Web UI (CONTRIBUTING "CPU Share Allocation").
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

  # AppShield provides perimeter authentication: the SSO (OIDC) gate for the
  # Web UI, and the OAuth 2.1 broker for /mcp (machine clients). Only /webhook never
  # reaches it — the router below sends it straight to the backend, because Telegram's
  # servers cannot perform any of those flows and carry their own per-registration
  # secret token instead; see rationale.md.
  telegrammcp-proxy:
    # 2.0.7+ is required for the generic OAUTH_RESOURCE / OAUTH_SCOPE names and a
    # configurable protected path; 2.0.9+ advertises offline_access and sends
    # prompt=consent, without which no refresh token is issued and every client has
    # to be re-authorized by hand once the 1h access token expires.
    image: ghcr.io/yundera/appshield:3.2.0
    container_name: telegrammcp
    # OIDC identity: the AppShield auth-service builds its OIDC redirect URIs from
    # os.hostname(), and the auth-registrar independently attests this app's name via the
    # container's PTR record, rejecting any redirect URI that doesn't match. Must equal the
    # app name, or Docker defaults the hostname to the random container ID and OIDC registration fails.
    hostname: telegrammcp
    restart: unless-stopped
    # 80 — reverse proxy in front of a user-facing app (CONTRIBUTING
    # "CPU Share Allocation").
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    expose:
      - 80
    user: "0:0"   # numeric: scratch image has no passwd; /data/oauth is chowned $PUID
    environment:
      # No ALLOWED_PATHS: this sidecar never sees /webhook, because the router sends
      # it straight to the backend.
      BACKEND_HOST: telegrammcp-backend
      BACKEND_PORT: "9634"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # Machine/API auth for the MCP endpoint. AppShield runs an OAuth/OIDC
      # authorization server fronting Dex and gates exactly the path named by the
      # resource URL (/mcp) on Bearer tokens; everything else stays behind the
      # SSO gate. Replaces ALLOWED_PATHS: "mcp", which exempted /mcp from the
      # gate and — with AUTH_HASH inert under Maison — left it uncredentialed, so an
      # anonymous caller could drive send_message / send_photo / get_chat_history.
      OAUTH_RESOURCE: "${APP_URL:-https://telegrammcp-${APP_DOMAIN}}/mcp"
      OAUTH_SCOPE: "mcp"
      OAUTH_DATA_DIR: "/data/oauth"
    volumes:
      # Persist DCR/manual clients, signing keys and grants across redeploys.
      - ${DATA_ROOT:-/DATA}/AppData/telegrammcp/oauth/:/data/oauth
    depends_on:
      - telegrammcp-backend
    networks:
      - pcs

  # The app's own router: the only routed service. /webhook goes straight to the
  # backend; everything else — the Web UI, /mcp and the gate's own /nhl-auth/ and
  # OAuth endpoints — through the gate. Telegram's servers POST bot updates to
  # /webhook as a plain HTTP client: they cannot follow an SSO redirect and cannot
  # acquire an OAuth token. The path is not uncredentialed — the bot registers the
  # webhook with a random per-registration `secret_token` and grammY rejects any POST
  # whose X-Telegram-Bot-Api-Secret-Token header does not match. In polling mode (the
  # default) it answers 404.
  telegrammcp-router:
    image: nginx:1.31.8-alpine
    container_name: telegrammcp-router
    restart: unless-stopped
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - 80
    configs:
      - source: telegrammcp-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  telegrammcp-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;

        # /mcp is streamable HTTP: responses can be long-lived event streams.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate telegrammcp:80;
        set $$bot telegrammcp-backend:9634;

        location = /_router/health { access_log off; return 204; }

        # Telegram's update callbacks, checked by the bot's own secret token.
        location = /webhook { proxy_pass http://$$bot; }
        location /webhook/  { proxy_pass http://$$bot; }

        # The Web UI, /mcp and the gate's own endpoints: through AppShield.
        location / { proxy_pass http://$$gate; }
      }

x-casaos:
  architectures:
    - amd64
  # The app's own router, not the backend: it is the container the route
  # points at and the one users actually reach. The tile's health follows main, so
  # pointing it at the backend tracked a container nobody reaches from outside.
  main: telegrammcp-router
  webui_port: 80
  hostname: ${APP_HOST:-telegrammcp-${APP_DOMAIN}}
  scheme: https
  port_map: "443"
  index: /
  category: Chat
  tags: ["developer", "ai"]
  description:
    en_us: |
      **Telegram control for AI assistants via MCP**

      Telegram MCP is a bidirectional bridge between [Telegram](https://telegram.org) and the Model Context Protocol (MCP). It is both an MCP **server** — exposing `send_message` and `send_photo` tools so LLMs can message you on Telegram — and an MCP **client** — forwarding the messages your bot receives to a target MCP server for AI processing.

      Wraps the [`worph/telegram-mcp`](https://github.com/worph/telegram-mcp) server (built on grammY) with a streamable-HTTP transport so any MCP-compatible client can connect (Claude Desktop, Claude Code, Cursor, VS Code, etc.), plus a Web UI for entering the bot token and Beacon auto-discovery.

      **What you can do:**
      - Let an AI assistant send you Telegram messages and photos (alerts, summaries, results)
      - Route incoming Telegram messages to an LLM and reply automatically
      - Approve actions from Telegram with an inline-keyboard permission flow
      - Run the bot in polling or webhook mode — configured from the built-in Web UI

      **Think of it like:** A two-way remote between your Telegram chat and any AI assistant.

      **Perfect if you:** Want Claude / Cursor / any MCP client to reach you on Telegram, or to drive an LLM from a Telegram bot — and pair it with other MCP apps (Beacon, n8n, Chronos) for end-to-end AI workflows.
    fr_fr: |
      **Controle de Telegram pour les assistants IA via MCP**

      Telegram MCP est un pont bidirectionnel entre [Telegram](https://telegram.org) et le Model Context Protocol (MCP). Il est a la fois un **serveur** MCP — exposant les outils `send_message` et `send_photo` pour que les LLMs puissent vous ecrire sur Telegram — et un **client** MCP — transferant les messages recus par votre bot vers un serveur MCP cible pour traitement par IA.

      Enveloppe le serveur [`worph/telegram-mcp`](https://github.com/worph/telegram-mcp) (base sur grammY) avec un transport streamable-HTTP pour que tout client compatible MCP puisse se connecter (Claude Desktop, Claude Code, Cursor, VS Code, etc.), plus une interface Web pour saisir le token du bot et la decouverte automatique via Beacon.

      **Ce que vous pouvez faire:**
      - Laisser un assistant IA vous envoyer des messages et photos Telegram (alertes, resumes, resultats)
      - Router les messages Telegram entrants vers un LLM et repondre automatiquement
      - Approuver des actions depuis Telegram via un clavier en ligne (permission flow)
      - Executer le bot en mode polling ou webhook — configure depuis l'interface Web integree

      **Parfait si vous:** Voulez que Claude / Cursor / tout client MCP vous joigne sur Telegram, ou piloter un LLM depuis un bot Telegram — et le combiner avec d'autres apps MCP (Beacon, n8n, Chronos) pour des workflows IA de bout en bout.
  developer: Worph
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  tagline:
    en_us: Bidirectional Telegram-MCP bridge for AI assistants
    fr_fr: Pont Telegram-MCP bidirectionnel pour les assistants IA
  thumbnail: thumbnail.png
  title:
    en_us: Telegram MCP
  chips:
    - key: mcp
      name:
        en_us: MCP
  tips:
    before_install:
      en_us: |
        **Getting Started**

        Telegram MCP needs a Telegram bot token. You set it in the app's Web UI after install.

        **Prerequisites:**
        1. In Telegram, open [@BotFather](https://t.me/BotFather), send `/newbot`, follow the prompts, and copy the **bot token** it gives you
        2. (Optional) An MCP-compatible LLM server to forward incoming messages to — only needed if you want the bot to auto-reply

        **Setup (2 steps):**
        1. Open this app's Web UI (you'll sign in with your server account — the same single sign-on you use for the rest of the server)
        2. Paste your **bot token**, pick **polling** or **webhook** mode, and click **Save**. In webhook mode the bot registers `${APP_URL:-https://telegrammcp-${APP_DOMAIN}}/webhook` with Telegram automatically.

        **MCP Integration (for AI/LLMs):**

        **Option 1: Public URL (OAuth)**

        The `/mcp` endpoint is protected by OAuth 2.1. Point your client at the
        URL below — clients that support OAuth discovery (claude.ai, Claude
        Desktop) register themselves and open a browser for you to approve with
        your server account (single sign-on).
        ```json
        {
          "mcpServers": {
            "telegram": {
              "type": "http",
              "url": "${APP_URL:-https://telegrammcp-${APP_DOMAIN}}/mcp"
            }
          }
        }
        ```

        **Option 2: Local Docker connection (no auth required)**

        For AI assistants running on the same server, connect directly via the Docker network:
        ```json
        {
          "mcpServers": {
            "telegram": {
              "type": "http",
              "url": "http://telegrammcp-backend:9634/mcp"
            }
          }
        }
        ```
        *Note: Requires the AI assistant to be on the `pcs` Docker network.*

        For clients that need a pre-created client_id/client_secret (n8n, custom
        scripts), create it with a `POST` of its registration (JSON with `client_name` and `redirect_uris`) to **${APP_URL:-https://telegrammcp-${APP_DOMAIN}}/AppShield/oauth/clients**, sent from a browser signed in to this app; **${APP_URL:-https://telegrammcp-${APP_DOMAIN}}/AppShield/oauth** lists the clients that exist and revokes them.

        **Option 3: Via Beacon (aggregated)**

        If you have **Beacon** installed, Telegram MCP auto-registers there via its built-in UDP discovery and its tools show up under the `telegram__*` namespace — no extra config.

        **Available MCP Tools:**
        | Tool | Description |
        |------|-------------|
        | `send_message` | Send a text message to the configured Telegram chat |
        | `send_photo` | Send a photo (by URL or file) to the chat |
        | `echo` | Echo back input — handy for connectivity tests |
        | `mcp_info` | Report the server's MCP connection info |

        **Security:**
        - The bot token is stored only in `/DATA/AppData/telegrammcp/config.json` on this server and is never logged or returned via the API
        - The Web UI is protected by the server's single sign-on — the session you already have covers it
        - `/mcp` is gated separately on OAuth 2.1 Bearer tokens, so nothing on the
          public URL is reachable without a credential. Only the in-network address
          `http://telegrammcp-backend:9634/mcp` (Option 2) is unauthenticated, and it
          is not published outside the `pcs` Docker network
        - `/webhook` is exempt from the login flow because Telegram's servers cannot
          perform it, but it is not open: the bot registers its webhook with a random
          per-registration secret token and rejects any update that does not present it

x-compose-app:
  schema_version: 2
  version: "1.1.23"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI; each name is the host the app
  # reads back as APP_* (the first) or ROUTE_<NAME>_* (the others).
  routes:
    - { service: telegrammcp-router, name: telegrammcp, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
