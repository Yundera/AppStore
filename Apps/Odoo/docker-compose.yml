name: odoo

services:
  postgres:
    image: postgres:18.3
    user: "0:0"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata/
      PUID: "0"
      PGID: "0"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/postgres-data/:/var/lib/postgresql/data/
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - odoo-internal

  odoo:
    image: odoo:19.0
    container_name: odoo
    user: "0:0"
    command: odoo --http-port=80 --data-dir=/var/lib/odoo --proxy-mode
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 80
    labels:
      caddy_0: odoo-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: odoo-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: odoo-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    networks:
      - odoo-internal
      - pcs
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
      PUID: "0"
      PGID: "0"
      TZ: $TZ
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/odoo-data/:/var/lib/odoo/
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/config/:/etc/odoo/
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/addons/:/mnt/extra-addons/
    cpu_shares: 70
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

networks:
  odoo-internal:
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

