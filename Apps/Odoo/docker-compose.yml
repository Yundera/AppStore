  index: /
  scheme: https

x-compose-app:
  schema_version: 2
  version: "19.0"
  # Seeded: an installed Odoo keeps the box-wide password its database and
  # odoo.conf admin_passwd were set up with; a fresh install gets its own.
  secrets:
    ODOO_DB_PASSWORD: ${APP_DEFAULT_PASSWORD}|alnum:32
    ODOO_MASTER_PASSWORD: ${APP_DEFAULT_PASSWORD}|password:24
  credentials:
    - label:
        en_us: Master password (database manager)
        ko_kr: 마스터 비밀번호 (데이터베이스 관리자)
        zh_cn: 主密码（数据库管理器）
        es_es: Contraseña maestra (gestor de bases de datos)
        fr_fr: Mot de passe principal (gestionnaire de bases de données)
      password: ${ODOO_MASTER_PASSWORD}
      note:
        en_us: Asked when you create the database on first access, and by /web/database/manager. Your login is the admin account you create there.
        fr_fr: Demandé à la création de la base au premier accès, et par /web/database/manager. Votre connexion est le compte administrateur que vous y créez.
  hooks:
    # A repair for installs made BEFORE admin_passwd was written into odoo.conf.
    # The config itself comes from seed/config/odoo.conf.tmpl, which is
    # create-if-absent and so never touches a file an existing install already
    # has — including a broken one.
    #
    # It matters because the config bind mount masks the image's own /etc/odoo:
    # with no admin_passwd, Odoo falls back to the literal 'admin' and
    # /web/database/manager (which needs no session) lets anyone dump, restore or
    # drop the user's database. Appending a key to a file the app also writes is
    # the one shape the declarative sections deliberately do not express.
    #
    # pre_up, not pre_install: it needs ODOO_MASTER_PASSWORD, and secrets are
    # only generated into .env by the up sequence, after pre_install has run. By
    # pre_up the seed step has also run, so a fresh install already has a
    # complete odoo.conf and this is a no-op; it never creates the file. The
    # grep guard makes it idempotent, and the `if` keeps the exit status 0.
    pre_up: |
      if [ -f /DATA/AppData/odoo/config/odoo.conf ] &&
         ! grep -q '^[[:space:]]*admin_passwd[[:space:]]*=' /DATA/AppData/odoo/config/odoo.conf; then
        printf 'admin_passwd = %s\n' "$ODOO_MASTER_PASSWORD" >> /DATA/AppData/odoo/config/odoo.conf
      fi
  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # Generated by scripts/gen-folders.py from the trailing-slash bind mounts
  # in `volumes:` above — re-run it instead of editing this block by hand.
  folders:
    - path: /DATA/AppData/$AppID/postgres-data
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/odoo-data
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/addons
      user: $PUID
      group: $PGID
  webui-host: odoo-${domain}
