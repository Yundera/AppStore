  # Directories Maison creates and chowns to $PUID:$PGID before every `up`.
  # The container drops to $PUID:$PGID, so each of these must be user-owned or
  # SABnzbd cannot write its config, its incomplete jobs, or the finished
  # downloads it moves into the shared folder.
  folders:
    - path: /DATA/AppData/$AppID/config
      user: $PUID
      group: $PGID
      # Reclaim a tree an earlier root-running install left behind: the backend
      # now drops to $PUID:$PGID and dies on an unwritable /config otherwise.
      recursive: true
    - path: /DATA/AppData/$AppID/incomplete
      user: $PUID
      group: $PGID
    - path: /DATA/Downloads
      user: $PUID
      group: $PGID
  steps:
    # SABnzbd refuses any request whose Host header is not an IP, `localhost` or
    # a name in `host_whitelist` — a DNS-rebinding guard (interface.py
    # check_hostname, akin to CVE-2019-5702). The check is skipped entirely when
    # SABnzbd's own login is enabled, but it is not: the SSO gate is the single
    # login, so the whitelist is what has to be right, and it has to name every
    # hostname the app is published on.
    #
    # seed/config/sabnzbd.ini.tmpl writes the whitelist on first install, but the
    # seed is create-if-absent and SABnzbd rewrites the file from then on. So if
    # the deployment's domain ever changes, the seeded names go stale and every
    # request answers `403 Access denied - Hostname verification failed`. This
    # step re-adds the current names on every up.
    #
    # Add-only, one host at a time: an entry the user added by hand (a custom
    # domain, another reverse proxy) survives, and a name that is already there is
    # left alone rather than duplicated.
    #
    # Each check greps the `host_whitelist` line, not the whole file. configobj
    # keeps this file's comments verbatim across every rewrite SABnzbd makes, and
    # the seed's comment block names `sabnzbd-backend` — so a whole-file grep
    # matches its own documentation, skips the sed, and silently leaves the
    # sibling-app entry out. Found that way on a real PCS: after a simulated
    # domain change the three route hosts came back and `sabnzbd-backend` did not,
    # which shows up only as Radarr/Sonarr getting 403 from a UI that works.
    #
    # A setup step runs *before* the seed is written, so on a first install the
    # file does not exist yet and this does nothing; the seed then writes the same
    # names one step later. It runs in a container as $PUID:$PGID because `sed -i`
    # replaces the file, and from the Maison shell the new file would belong to
    # Maison's user instead of the app's.
    - name: refresh-host-whitelist
      at: setup
      run: always
      script: |
        [ -f "$APP_DIR/config/sabnzbd.ini" ] || exit 0
        docker run --rm -i --user "$PUID:$PGID" -v "$APP_DIR/config:/config" \
          -e APP_HOSTS -e APP_DOMAIN -e APP_PUBLIC_IP_DASH busybox:1.37.0 sh -s <<'SH'
        set -e
        ini=/config/sabnzbd.ini
        hosts="${APP_HOSTS:-sabnzbd-$APP_DOMAIN,sabnzbd-$APP_PUBLIC_IP_DASH.nip.io,sabnzbd-$APP_PUBLIC_IP_DASH.sslip.io}"
        for host in $(printf '%s' "$hosts" | tr ',' ' ') sabnzbd-backend; do
          grep "^host_whitelist" "$ini" | grep -qF "$host" ||
            sed -i "s|^host_whitelist = |host_whitelist = $host, |" "$ini"
        done
        SH
