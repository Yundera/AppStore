name: linkwarden

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The login gate. Linkwarden's own sign-up page stays open to anyone who can
  # reach it (NEXT_PUBLIC_DISABLE_REGISTRATION would also refuse the very first
  # account), so the whole app sits behind the platform SSO.
  linkwarden-proxy:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    container_name: linkwarden
    # The AppShield auth-service builds its OIDC redirect URIs from os.hostname(),
    # and the auth-registrar attests this app's name via the container's PTR record.
    hostname: linkwarden
    restart: unless-stopped
    environment:
      BACKEND_HOST: "linkwarden-app"
      BACKEND_PORT: "3000"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate protects the app with PASSWORD.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
    expose:
      - 80
    depends_on:
      linkwarden-app:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80
    logging: *logging
    networks:
      # On the shared network for the platform router, and on the app's own
      # network to reach the backend.
      - pcs
      - linkwarden-internal

  linkwarden-db:
    image: postgres:16.15-alpine
    container_name: linkwarden-db
    restart: unless-stopped
    user: "0:0"
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${LINKWARDEN_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/linkwarden/pgdata/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden -d linkwarden"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    cpu_shares: 50
    logging: *logging
    networks:
      # App-private only: reached solely by linkwarden-app.
      - linkwarden-internal

  linkwarden-app:
    image: ghcr.io/linkwarden/linkwarden:v2.17.0
    container_name: linkwarden-app
    restart: unless-stopped
    # The image runs as root and writes only its own app folder.
    user: "0:0"
    depends_on:
      linkwarden-db:
        condition: service_healthy
    expose:
      - 3000
    volumes:
      # Archived screenshots, PDFs and readable views.
      - ${DATA_ROOT:-/DATA}/AppData/linkwarden/data/:/data/data
    environment:
      DATABASE_URL: postgresql://linkwarden:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_URL: ${APP_URL:-https://linkwarden-${APP_DOMAIN}}/api/v1/auth
      NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
    deploy:
      resources:
        limits:
          # Next.js, the archiving worker and its headless Chromium.
          memory: 1536M
    cpu_shares: 50
    logging: *logging
    networks:
      # App-private only: reached solely by linkwarden-proxy.
      - linkwarden-internal

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  linkwarden-internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: linkwarden-proxy
  webui_port: 80
  category: Documents
  tags: ["productivity", "bookmarks", "read-later"]
  developer: Linkwarden
  store_app_id: linkwarden
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
  index: /
  title:
    en_us: Linkwarden
  tagline:
    en_us: Collaborative bookmark manager that archives every page you save
  description:
    en_us: |
      **Self-hosted, collaborative bookmark manager**

      Linkwarden collects, organises and preserves the links you care about. Every link you
      save is archived automatically as a screenshot, a PDF and a clean readable view, so the
      page stays available even after the original disappears.

      **Key features:**
      - Automatic page preservation: screenshot, PDF and readable view
      - Collections, sub-collections and tags to organise links
      - Share collections and collaborate with other users
      - Full-text search, pinned links and a dashboard
      - Import and export bookmarks (HTML, Linkwarden JSON)
      - RSS subscriptions and a public API

      **Sign-in:** the app is protected by your server account (single sign-on). On first
      open, register your Linkwarden account; it is the account your bookmarks belong to.
  tips:
    before_install:
      en_us: |
        **Sign-in:** Linkwarden is protected by your server account (single sign-on).
        On a server without single sign-on, use the app password Maison shows on first
        open (also in the tile menu under **Credentials**).

        **First run:** once past the sign-in, click **Sign Up** and create your Linkwarden
        account (username and password). The first account is the administrator. Then sign
        in with it and start saving links.

        **Note:** the browser extension and mobile apps talk to Linkwarden directly and
        cannot pass the single sign-on gate; use the web app.

x-compose-app:
  schema_version: 2
  version: "2.17.0"
  # How the app is reached, stated without a domain or a proxy: the box's routing
  # setting decides. The first route is the web UI.
  routes:
    - { service: linkwarden-proxy, name: linkwarden, upstream-port: 80 }
  # The store card and the tile. Maison reads x-compose-app only: x-casaos is
  # kept for CasaOS and for Maison builds that predate this, and must match.
  id: linkwarden
  title:
    en_us: Linkwarden
  tagline:
    en_us: Collaborative bookmark manager that archives every page you save
  description:
    en_us: |
      **Self-hosted, collaborative bookmark manager**

      Linkwarden collects, organises and preserves the links you care about. Every link you
      save is archived automatically as a screenshot, a PDF and a clean readable view, so the
      page stays available even after the original disappears.

      **Key features:**
      - Automatic page preservation: screenshot, PDF and readable view
      - Collections, sub-collections and tags to organise links
      - Share collections and collaborate with other users
      - Full-text search, pinned links and a dashboard
      - Import and export bookmarks (HTML, Linkwarden JSON)
      - RSS subscriptions and a public API

      **Sign-in:** the app is protected by your server account (single sign-on). On first
      open, register your Linkwarden account; it is the account your bookmarks belong to.
  developer: Linkwarden
  category: Documents
  icon: icon.png
  screenshots:
    - screenshot-1.png
    - screenshot-2.png
  architectures:
    - amd64
    - arm64
  # Sum of the service limits (~2.2G) plus room for the OS and other apps.
  resources:
    recommended: { memory: 4G }
  tips:
    en_us: |
      **Sign-in:** Linkwarden is protected by your server account (single sign-on).
      On a server without single sign-on, use the app password Maison shows on first
      open (also in the tile menu under **Credentials**).

      **First run:** once past the sign-in, click **Sign Up** and create your Linkwarden
      account (username and password). The first account is the administrator. Then sign
      in with it and start saving links.

      **Note:** the browser extension and mobile apps talk to Linkwarden directly and
      cannot pass the single sign-on gate; use the web app.
  credentials:
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to the gate in front of Linkwarden. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      # Behind SSO nobody needs it on the first click: tile menu only. Without SSO, Maison shows it anyway.
      prompt: false
      # The gate reads PASSWORD on every start, so .env plus a recreate is the change.
      change:
        apply: env
  secrets:
    # The AppShield gate's fallback password (see its PASSWORD).
    APPSHIELD_PASSWORD: password:24
    # The Postgres role password.
    LINKWARDEN_DB_PASSWORD: alnum:32
    # NextAuth signs sessions with it; generated once and kept in .env.
    LINKWARDEN_NEXTAUTH_SECRET: hex:32
  # No `folders:`: every service runs as root. linkwarden-db's image hands pgdata
  # to its own user, and chowning it to $PUID would leave the database unable to
  # write there.
