name: celestoryvoltask

# Bounded container logs (requirement `log-limits`): json-file never rotates on its own.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── The app's own router: the only routed service ─────────────────
  # It sends exactly two paths, the PWA manifests of the Hub and of the
  # Celestory editor, straight to the service that serves them, and every
  # other path to the AppShield gate. Browsers fetch a <link rel="manifest">
  # without cookies, so behind the gate it was redirected to the SSO and
  # blocked by CORS (a console error on every first load).
  celestoryvoltask-router:
    image: nginx:1.31.10-alpine
    container_name: celestoryvoltask-router
    restart: unless-stopped
    depends_on:
      - celestoryvoltask
    expose:
      - 80
    configs:
      - source: celestoryvoltask-router
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pcs
      - celestoryvoltask-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  # ── AppShield SSO gate ─────────────────────────────────────────────
  # Every request but the two manifests passes the platform SSO before it
  # reaches the suite. This is the login the listing relies on: the bundled
  # Celestory auth service accepts self-registration and issues tokens without
  # checking a licence seat, so its own login alone would let anyone who can
  # reach it sign up.
  celestoryvoltask:
    image: ghcr.io/nsl-sh/appshield:4.2.0
    # = the compose name; AppShield derives its OIDC redirect URIs from the
    # hostname and the auth-registrar attests the app by its PTR record.
    container_name: celestoryvoltask
    hostname: celestoryvoltask
    restart: unless-stopped
    expose:
      - 80
    environment:
      # The path dispatcher below, not a single backend.
      BACKEND_HOST: "celestoryvoltask-paths"
      BACKEND_PORT: "80"
      LISTEN_PORT: "80"
      # SSO comes from the platform (Maison's system env). Where there is none
      # (plain CasaOS) all four are empty and the gate uses PASSWORD instead.
      OIDC_REGISTRAR_URL: "${OIDC_REGISTRAR_URL:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      # Break-glass login while SSO is unavailable; the only login without SSO.
      PASSWORD: "${APPSHIELD_PASSWORD:-}"
      # Every address the app is served at, primary first (Maison sets it).
      PUBLIC_URL: "${APP_URLS:-}"
      REDIRECT_HOST_SUFFIXES: "${APP_HOST_SUFFIXES:-${APP_DOMAIN}}"
      # Story assets and Voltask files are uploaded through the gate.
      CLIENT_MAX_BODY_SIZE: "512m"
      # No ALLOWED_PATHS: nothing is meant to be reachable without a session.
    depends_on:
      - celestoryvoltask-paths
    networks:
      # On the shared network to reach the platform's auth-registrar, and on
      # the app's own network, where the router and the dispatcher live.
      - pcs
      - celestoryvoltask-net
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Path dispatch, behind the gate ────────────────────────────────
  # One address, four services: the job the vendor's gateway image does on a
  # bare host. It is done here instead because the gateway's nginx config
  # sets X-Forwarded-Proto from its own (plain http) scheme, appends :80 to
  # the Host it sends Voltask, and keeps nginx's 1m upload cap. The gateway
  # still serves its portal page at `/`. On the app's own network only: the
  # gate is the one way in.
  celestoryvoltask-paths:
    image: nginx:1.31.10-alpine
    container_name: celestoryvoltask-paths
    restart: unless-stopped
    expose:
      - 80
    configs:
      - source: celestoryvoltask-paths
        target: /etc/nginx/conf.d/default.conf
    networks:
      - celestoryvoltask-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_router/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  # The suite's portal page (links to Celestory, Voltask and the Hub).
  gateway:
    image: celestory/gateway:1.1.2
    container_name: celestoryvoltask-gateway
    restart: unless-stopped
    expose:
      - 80
    environment:
      # Read by the image's own nginx template; only `/` is routed to it.
      SERVER_NAME: localhost
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 80
      VOLTASK_HOST: voltask
      VOLTASK_PORT: 1401
      HUB_HOST: hub
      HUB_PORT: 1402
    depends_on:
      frontend:
        condition: service_healthy
      voltask:
        condition: service_healthy
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  # Celestory editor (static SPA + its own nginx proxying /celestory/api and
  # /celestory/auth to the services below).
  frontend:
    image: celestory/frontend:1.1.4
    container_name: celestoryvoltask-frontend
    restart: unless-stopped
    environment:
      CLOUD_API_URL: http://api
      ACCOUNT_API_URL: http://auth
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 80
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64M

  # Hub: licence manager (redeem the licence, assign seats).
  hub:
    image: celestory/hub:1.1.0
    container_name: celestoryvoltask-hub
    restart: unless-stopped
    environment:
      PORT: 1402
      # SvelteKit (adapter-node) takes its origin from the forwarded headers,
      # so the form CSRF check holds on every address the app is served at.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      AUTH_ORIGIN: http://auth
      AUTH_AUDIENCE: self_hosted
      AUTH_JWKS_URI: http://auth/.well-known/jwks.json
      AUTH_AUTHORITY_SECRET: "${CELESTORY_AUTHORITY_SECRET}"
      DB_VOLTASK_URL: "postgres://celestory_admin:${CELESTORY_DB_PASSWORD}@db/voltask"
      DB_HUB_URL: "postgres://celestory_admin:${CELESTORY_DB_PASSWORD}@db/hub"
      ADMIN_USERNAME: admin@celestory.io
      ADMIN_PASSWORD: "${CELESTORY_HUB_ADMIN_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1402/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: celestory/api:1.1.3
    container_name: celestoryvoltask-api
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/celestoryvoltask/projectFiles:/app/projectFiles
    environment:
      PORT: 80
      SELF_HOSTED: "true"
      STORAGE_SOLUTION: filesystem
      AUTH_DOMAIN: http://auth
      AUTH_JWKS_URI: http://auth/.well-known/jwks.json
      AUTH_AUDIENCE: self_hosted
      DB_URL: "postgres://celestory_admin:${CELESTORY_DB_PASSWORD}@db/celestory"
      GENERATOR_URL: http://generator
      ORIGIN: "${APP_URL:-https://celestoryvoltask-${APP_DOMAIN}}/celestory/api"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 768M

  generator:
    image: celestory/generator:1.1.2
    container_name: celestoryvoltask-generator
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/celestoryvoltask/projectFiles:/usr/src/app/projectFiles
    environment:
      PORT: 80
      PROJECT_FILES_PATH: /usr/src/app/projectFiles
      STORAGE_SOLUTION: filesystem
      PROJECT_FILES_PREFIX: /celestory/api/filesystem/
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  # Accounts and OAuth for the suite. Its JWT signing keys are generated by
  # the image's own scripts/generate-keys.js (which keeps existing keys) and
  # copied to the app folder, so a recreate, reinstall or restore keeps
  # every session valid instead of signing everyone out.
  auth:
    image: celestory/auth:1.1.1
    container_name: celestoryvoltask-auth
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/celestoryvoltask/auth-keys:/keys
    command:
      - sh
      - -c
      - |
        set -e
        for f in jwtRS256.key.priv.pem jwtRS256.key.pub.pem jwks.json; do
          if [ -e "/keys/$$f" ]; then cp "/keys/$$f" dist/certs/; fi
        done
        node scripts/generate-keys.js ./dist/certs
        cp dist/certs/jwtRS256.key.priv.pem dist/certs/jwtRS256.key.pub.pem dist/certs/jwks.json /keys/
        exec ./run.sh
    environment:
      PORT: 80
      DB_HOST: db
      DB_DATABASE: auth
      DB_USERNAME: celestory_admin
      DB_PASSWORD: "${CELESTORY_DB_PASSWORD}"
      API_AUTHORITY_SECRET: "${CELESTORY_AUTHORITY_SECRET}"
      API_OAUTH_ISSUER: celestory_auth
      SELF_HOSTED_REDIRECT_URI: "${APP_URL:-https://celestoryvoltask-${APP_DOMAIN}}/celestory/callback"
      # Keys are handled by the command above.
      GENERATE_KEYS: "false"
      API_ACCESS_TOKEN_TTL: 604800
      API_REFRESH_TOKEN_TTL: 1209600
      USE_SELF_HOSTED_CLIENT: "true"
      # With no mail provider configured the image still requires a
      # confirmation e-mail it can never send, so the Voltask administrator it
      # creates could never sign in. Sign-up itself is behind the SSO gate.
      AUTO_CONFIRM_USERS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384M

  # Voltask automation engine (served at /voltask).
  voltask:
    image: celestory/voltask:1.0.8
    container_name: celestoryvoltask-voltask
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/celestoryvoltask/uploads:/app/uploads
    environment:
      PORT: 1401
      DATABASE_URL: "postgresql://celestory_admin:${CELESTORY_DB_PASSWORD}@db:5432/voltask?schema=voltask"
      ORCHESTRATOR_URL: http://orchestrator:3003
      VOLTASK_URL: http://voltask:1401
      WEBHOOK_URL: "${APP_URL:-https://celestoryvoltask-${APP_DOMAIN}}/voltask"
      CELESTORY_AUTH_URL: http://auth
      LICENSE_API_URL: http://hub:1402/hub
      PLUGINS_BUN_URL: http://plugins-bun:8001
      PLUGINS_DENO_URL: http://plugins-deno:8002
      PREMISE: on-premise
      # The Voltask login, created on first start when it does not exist yet.
      PREMISE_USER_EMAIL: admin@voltask.tech
      PREMISE_USER_PASSWORD: "${VOLTASK_ADMIN_PASSWORD}"
      STORAGE_DIR: /app/uploads
    depends_on:
      hub:
        condition: service_healthy
      plugins-bun:
        condition: service_healthy
      plugins-deno:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1401/voltask')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestoryvoltask-net
    cpu_shares: 50
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 768M

  # Voltask plugin runtimes: stateless sandboxes the engine calls.
  plugins-bun:
    image: celestory/voltask-plugins-bun:1.0.8
    container_name: celestoryvoltask-plugins-bun
    restart: unless-stopped
    environment:
      PORT: 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/imap"]
      retries: 3
      timeout: 60s
      interval: 10s
      start_period: 10s
    networks:
      - celestoryvoltask-net
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384M

  plugins-deno:
    image: celestory/voltask-plugins-deno:1.0.8
    container_name: celestoryvoltask-plugins-deno
    restart: unless-stopped
    environment:
      PORT: 8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/deno"]
      retries: 3
      timeout: 60s
      interval: 10s
      start_period: 10s
    networks:
      - celestoryvoltask-net
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 384M

  # Voltask workflow orchestrator (state in the `orchestrator` database).
  orchestrator:
    image: celestory/voltask-orchestrator:1.0.8
    container_name: celestoryvoltask-orchestrator
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: "postgresql://celestory_admin:${CELESTORY_DB_PASSWORD}@db:5432/orchestrator?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/statements"]
      retries: 3
      timeout: 60s
      interval: 10s
      start_period: 10s
    networks:
      - celestoryvoltask-net
    cpu_shares: 30
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

  # PostgreSQL 16 with the vendor's init script that creates the auth,
  # celestory, hub, voltask and orchestrator databases on first start.
  db:
    image: celestory/postgres:1.0.0
    container_name: celestoryvoltask-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: celestory_admin
      POSTGRES_PASSWORD: "${CELESTORY_DB_PASSWORD}"
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/celestoryvoltask/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celestory_admin"]
      interval: 10s
      timeout: 60s
      retries: 3
    networks:
      - celestoryvoltask-net
    cpu_shares: 70
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  celestoryvoltask-net:
    name: celestoryvoltask-net
  pcs:
    name: ${APP_NET:-pcs}
    external: true

configs:
  celestoryvoltask-router:
    # `$$` is compose's escape for nginx's own `$`.
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
      map $$http_x_forwarded_proto $$fwd_proto { default $$http_x_forwarded_proto; "" $$scheme; }
      # The client address is the LAST X-Forwarded-For entry: the one the proxy in
      # front appended, which a client cannot forge.
      map $$http_x_forwarded_for $$client_ip { "~([^,\s]+)\s*$$" $$1; default $$remote_addr; }

      server {
        listen 80;
        absolute_redirect off;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$client_ip;
        proxy_set_header X-Forwarded-For $$client_ip;
        proxy_set_header X-Forwarded-Proto $$fwd_proto;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        set $$gate celestoryvoltask:80;
        set $$frontend frontend:80;
        set $$hub hub:1402;

        location = /_router/health { access_log off; return 204; }

        # The two PWA manifests, and nothing else, bypass the gate. nginx matches
        # the normalised path exactly (dot segments and %-escapes resolved), and
        # the URI sent on is fixed, so no other path can ride these locations.
        location = /hub/manifest.json {
          limit_except GET { deny all; }
          proxy_pass http://$$hub/hub/manifest.json;
        }
        location = /celestory/manifest.json {
          limit_except GET { deny all; }
          proxy_pass http://$$frontend/celestory/manifest.json;
        }

        # Every other path, including the gate's own /AppShield/ (and legacy
        # /nhl-auth/) endpoints: through the SSO gate.
        location / { proxy_pass http://$$gate; }
      }

  celestoryvoltask-paths:
    content: |
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }

      server {
        listen 80;
        absolute_redirect off;

        # The gate caps uploads (CLIENT_MAX_BODY_SIZE); nothing to add here.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        # The router and the gate already set these from the real client; pass
        # them on as they are.
        proxy_set_header Host $$http_host;
        proxy_set_header X-Real-IP $$http_x_real_ip;
        proxy_set_header X-Forwarded-For $$http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $$http_x_forwarded_host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;

        # Variables, so nginx starts before the upstreams exist.
        set $$portal gateway:80;
        set $$frontend frontend:80;
        set $$hub hub:1402;
        set $$voltask voltask:1401;

        location = /_router/health { access_log off; return 204; }

        # The editor is built for /celestory/ but its image ships the service
        # worker and the code-editor workers at the web root only, so under
        # /celestory/ its SPA fallback answers them with index.html (a MIME
        # error on every load, and editor workers that never start). Serve
        # them from where the image has them.
        location ~ ^/celestory/(service-worker\.js|[a-z]+\.worker\.js)$$ {
          proxy_pass http://$$frontend/$$1;
        }
        # The Hub's login page asks for /api/auth/me without its /hub base;
        # left to the portal, that answers HTML and the page throws a JSON
        # error. Send that one path to the Hub, where it exists.
        location = /api/auth/me { proxy_pass http://$$hub/hub/api/auth/me$$is_args$$args; }
        location /celestory { proxy_pass http://$$frontend; }
        location /hub { proxy_pass http://$$hub; }
        location /voltask { proxy_pass http://$$voltask; }
        location / { proxy_pass http://$$portal; }
      }

x-casaos:
  main: celestoryvoltask-router
  webui_port: 80
  architectures:
    - amd64
    - arm64
  store_app_id: celestoryvoltask
  category: Developer
  tags: ["no-code", "storytelling", "automation", "paid"]
  developer: Celestory
  title:
    en_us: Celestory & Voltask
  tagline:
    en_us: No-code interactive storytelling and automation, self-hosted.
  description:
    en_us: &description >-
      Celestory is an all-in-one no-code platform for building interactive
      stories, games and training experiences, and Voltask is its automation
      engine for workflows, webhooks and integrations. This listing runs the
      whole self-hosted suite (editor, Voltask, and the Hub licence manager)
      behind your server account (single sign-on). A paid Celestory licence is
      required; there is no free tier. Buy one at https://celestory.io/pricing
      and redeem it in the Hub after installing.
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
  index: /
  tips:
    before_install:
      en_us: &tips |
        💳 **A paid Celestory licence is required**; there is no free tier.
        Buy one at [celestory.io/pricing](https://celestory.io/pricing).

        🔐 The whole suite sits behind your server account (single sign-on).
        On a server without single sign-on, use the app password from the tile
        menu under **Credentials**.

        **First steps** (the tile opens the suite's portal):

        1. Open **Hub** (`/hub`) and sign in with the *Hub administrator*
           login from the tile menu → **Credentials**.
        2. Redeem your licence key in the Hub, then assign seats to the
           e-mail addresses of the people who will use Celestory.
        3. Open **Celestory** (`/celestory`) and sign in with a seated e-mail.
           Celestory refuses any e-mail without a licence seat ("does not
           have a valid license"), so nothing works there before step 2.
        4. Open **Voltask** (`/voltask`) with the *Voltask administrator*
           login from **Credentials**.

        🔗 Voltask webhooks are behind the sign-in too, so outside services
        cannot call them directly.

        🌐 Open the suite from its tile: Celestory's sign-in redirect is
        registered for that address only.

        📂 Data lives in `/DATA/AppData/celestoryvoltask/` (database, project
        files, Voltask uploads).

x-compose-app:
  schema_version: 2
  version: "1.1.2"
  id: celestoryvoltask
  routes:
    - { service: celestoryvoltask-router, name: celestoryvoltask, upstream-port: 80 }
  title:
    en_us: Celestory & Voltask
  tagline:
    en_us: No-code interactive storytelling and automation, self-hosted.
  description:
    en_us: *description
  developer: Celestory
  category: Developer
  icon: icon.png
  screenshots:
    - screenshot-1.png
  architectures:
    - amd64
    - arm64
  tips:
    en_us: *tips
  resources:
    recommended: { cpu: 2, memory: 6G }
  # What the user must bring (GUIDELINES › What the user brings). The licence
  # key is redeemed in the Hub's own UI, so there is no install-time input.
  cost: paid
  accounts:
    - provider: celestory.io
      url: https://celestory.io/pricing
  secrets:
    APPSHIELD_PASSWORD: password:24
    CELESTORY_DB_PASSWORD: alnum:32
    # Shared by auth and the Hub to authorise licence operations.
    CELESTORY_AUTHORITY_SECRET: alnum:48
    CELESTORY_HUB_ADMIN_PASSWORD: password:24
    VOLTASK_ADMIN_PASSWORD: password:24
  credentials:
    - label:
        en_us: Hub administrator
      username: admin@celestory.io
      password: ${CELESTORY_HUB_ADMIN_PASSWORD}
      note:
        en_us: Signs in to the Hub at /hub, where you redeem the licence and assign seats.
      # The Hub compares against ADMIN_PASSWORD on every sign-in.
      change:
        apply: env
    - label:
        en_us: Voltask administrator
      username: admin@voltask.tech
      password: ${VOLTASK_ADMIN_PASSWORD}
      note:
        en_us: Signs in to Voltask at /voltask. Created on first start; change it in Voltask afterwards.
    - label:
        en_us: App password
      username: admin
      password: ${APPSHIELD_PASSWORD}
      note:
        en_us: Signs in to this app. On a server with single sign-on, use that instead. This password then works only while single sign-on is unavailable.
      prompt: false
      change:
        apply: env

